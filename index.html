  if (!s || s.rangeCount === 0 || s.getRangeAt(0).collapsed) return null;
  const tdOf = (node) => {
    const e = node && (node.nodeType === 1 ? node : node.parentElement);
    const td = e && e.closest ? e.closest('.blk-table td[data-r]') : null;
    return td && pagesEl.contains(td) ? td : null;
  };
  const a = tdOf(s.anchorNode);
  const b = tdOf(s.focusNode);
  if (!a || !b) return null;
  const id = a.closest('.blk[data-id]').dataset.id;
  if (b.closest('.blk[data-id]').dataset.id !== id) return null;   // 다른 표면 네모가 없다
  // 장을 넘은 표는 조각이 여러 개다 — 같은 id 의 칸을 전부 모은다
  const all = Array.from(pagesEl.querySelectorAll('.blk-table[data-id="' + id + '"] td[data-r]'));
  const box = (td) => {                       // 머리글은 몸통 0행 «위»라 -1 로 둔다
    const r = td.dataset.r === 'h' ? -1 : Number(td.dataset.r);
    const c = Number(td.dataset.c);
    return [r, r + (td.rowSpan || 1) - 1, c, c + (td.colSpan || 1) - 1];
  };
  const A = box(a);
  const B = box(b);
  let r1 = Math.min(A[0], B[0]), r2 = Math.max(A[1], B[1]);
  let c1 = Math.min(A[2], B[2]), c2 = Math.max(A[3], B[3]);
  let grew = true;
  while (grew) {
    grew = false;
    for (const td of all) {
      const [x1, x2, y1, y2] = box(td);
      if (x1 > r2 || x2 < r1 || y1 > c2 || y2 < c1) continue;      // 안 겹친다
      if (x1 < r1) { r1 = x1; grew = true; }
      if (x2 > r2) { r2 = x2; grew = true; }
      if (y1 < c1) { c1 = y1; grew = true; }
      if (y2 > c2) { c2 = y2; grew = true; }
    }
  }
  const cells = all.filter(td => {
    const [x1, x2, y1, y2] = box(td);
    return x1 >= r1 && x2 <= r2 && y1 >= c1 && y2 <= c2;
  });
  return cells.length > 1 ? cells : null;     // 한 칸 «안» 선택은 글자 단위 그대로
}

function rangesIn(pagesEl) {
  const s = window.getSelection();
  if (!s || s.rangeCount === 0) return [];
  const r = s.getRangeAt(0);
  if (r.collapsed) return [];
  const rect = cellRectIn(pagesEl);
  if (rect) {                                 // 표 «안»의 네모 선택 — 그 칸들만, 통째로
    return rect.map(el => ({ el, from: 0, to: textLen(el), whole: 1 })).filter(x => x.to > x.from);
  }
  const hit = editableEls(pagesEl).filter(el => r.intersectsNode(el));
  // ⭐ 표 칸이 다른 칸·문단과 «함께» 걸리면 그 칸은 통째로 고른 것으로 본다(워드와 같다).
  //    반쪽만 문 칸이 남으면 화면(칸이 통째로 파랗다)과 실제 지워지는 범위가 어긋난다.
  //    한 칸 «안»에서만 끈 것은 그대로 글자 단위다.
  const wholeCells = hit.length > 1;
  return hit
    .map(el => {
      if (wholeCells && el.matches('td[data-r]')) return { el, from: 0, to: textLen(el), whole: 1 };
      return {
        el,
        from: el.contains(r.startContainer) ? offsetIn(el, r.startContainer, r.startOffset) : 0,
        to: el.contains(r.endContainer) ? offsetIn(el, r.endContainer, r.endOffset) : textLen(el),
      };
    })
    .filter(x => x.to > x.from);
}

// 지금 선택이 «칸 통째»로 무는 표 칸들 — 화면을 칠하는 쪽이 쓴다.
// rangesIn 과 달리 빈 칸(글자 0)도 준다: 비어 있어도 «골라졌다»는 보여야 한다.
function wholeCellsIn(pagesEl) {
  const rect = cellRectIn(pagesEl);
  if (rect) return rect;                      // 표 «안»의 네모 선택
  const s = window.getSelection();
  if (!s || s.rangeCount === 0) return [];
  const r = s.getRangeAt(0);
  if (r.collapsed) return [];
  const hit = editableEls(pagesEl).filter(el => r.intersectsNode(el));
  if (hit.length < 2) return [];
  return hit.filter(el => el.matches('td[data-r]'));   // 표 «밖»과 섞인 선택
}

// rangesIn 의 화면 요소를 모델 좌표 [{id, item|null, from, to}] 로 바꾼다.
// 도구모음(걸침 서식)과 편집기(걸침 지우기)가 같은 좌표를 쓴다.
function targetsIn(pagesEl) {
  return rangesIn(pagesEl).map(p => {
    const td = p.el.matches('td[data-r]') ? p.el : null;
    if (td) {
      const blk = td.closest('.blk[data-id]');
      const r = td.dataset.r === 'h' ? 'h' : Number(td.dataset.r);
      return { id: blk.dataset.id, item: null, cell: [r, Number(td.dataset.c)], from: p.from, to: p.to };
    }
    // 그림 캡션 — 블록 안의 저만의 글 칸이라 cap:1 로 표시한다(toolbar·editor 가 본다)
    const cap = p.el.matches('.blk-image .cap') ? p.el : null;
    if (cap) {
      const blk2 = cap.closest('.blk[data-id]');
      return { id: blk2.dataset.id, item: null, cap: 1, from: p.from, to: p.to };
    }
    const li = p.el.matches('.lst li[data-i]') ? p.el : null;
    const blk = li ? li.closest('.blk[data-id]') : p.el;
    return { id: blk.dataset.id, item: li ? Number(li.dataset.i) : null, from: p.from, to: p.to };
  });
}

// 선택이 목록 항목(li) 안이면 그 li 를 준다. 목록은 항목마다 편집 칸이 따로라,
// 글자 번호를 블록이 아니라 "그 항목 안"에서 세야 어긋나지 않는다.
function activeItemEl(blkEl) {
  const s = window.getSelection();
  const n = s && s.anchorNode;
  if (!n || !blkEl) return null;
  const e = n.nodeType === 1 ? n : n.parentElement;
  if (!e || !e.closest) return null;
  const li = e.closest('.lst li[data-i]');
  return li && blkEl.contains(li) ? li : null;
}

// 선택이 표 칸(td) 안이면 그 td 를 준다. 칸마다 편집 칸이 따로라
// 글자 번호를 "그 칸 안"에서 세야 어긋나지 않는다(목록 항목과 같은 이유).
function activeCellEl(blkEl) {
  const s = window.getSelection();
  const n = s && s.anchorNode;
  if (!n || !blkEl) return null;
  const e = n.nodeType === 1 ? n : n.parentElement;
  if (!e || !e.closest) return null;
  const td = e.closest('td[data-r]');
  return td && blkEl.contains(td) ? td : null;
}

// 선택이 그림 캡션 안이면 그 .cap 을 준다. 캡션은 저만의 편집 칸이라(중첩 편집 호스트)
// 글자 번호를 «캡션 안»에서 세야 어긋나지 않는다(표 칸·목록 항목과 같은 이유).
function activeCapEl(blkEl) {
  const s = window.getSelection();
  const n = s && s.anchorNode;
  if (!n || !blkEl) return null;
  const e = n.nodeType === 1 ? n : n.parentElement;
  if (!e || !e.closest) return null;
  const cap = e.closest('.blk-image .cap');
  return cap && blkEl.contains(cap) ? cap : null;
}

/* editor.js */
// 편집을 다스린다 (D16 — 한 장의 입력판).
// 선택·커서·한글 조합·터치는 브라우저가 한다. 우리는 «구조를 바꾸는 동작»만
// beforeinput 에서 가로채 모델에 반영한다: 엔터(가르기) · 블록 경계 지우기(병합) ·
// 걸침 선택 편집 · 걸침 붙여넣기 · 실행취소. 칸 «안»의 타자·지우기·붙여넣기는
// 브라우저가 하고, input 뒤 flush 가 그 칸을 모델로 되읽는다(붙여넣기 서식도 그때 걸러진다).
// ⛔ 한글 조합 중에는 모델·화면을 건드리지 않는다(§12-12). 걸침 위 조합은 조합이
//    끼어들기 «전»(compositionstart)에 수술(deleteCrossInPlace)로 지운다.









function attachEditor({ pagesEl, getDoc, setDoc, redraw }) {
  let composing = false;
  let pending = null;   // { id, runs } 또는 목록 항목이면 { id, itemIndex, runs }
  let idle = null;
  function cancelIdle() { clearTimeout(idle); idle = null; }

  function flush(redrawAfter) {
    if (!pending) return;
    let p = pending;
    pending = null;
    const doc = getDoc();
    // 되읽은 토막에 밖에서 온 그림(src$)이 있으면 보관함에 담는다(중복이면 기존 번호)
    const got = Array.isArray(p.runs) ? adoptImages(p.runs, doc.assets) : null;
    if (got) p = Object.assign({}, p, { runs: got.runs });
    const assets = got && got.changed ? got.assets : doc.assets;
    let patch;
    if (p.cell) {
      const b = doc.blocks.find(x => x.id === p.id);
      if (!b || b.type !== 'table') return;
      if (p.cell[0] === 'h') {
        const head = [b.head[0].slice()];
        head[0][p.cell[1]] = Object.assign({}, head[0][p.cell[1]], { runs: p.runs });
        patch = { head };
      } else {
        const rows = b.rows.slice();
        const row = rows[p.cell[0]].slice();
        row[p.cell[1]] = Object.assign({}, row[p.cell[1]], { runs: p.runs });
        rows[p.cell[0]] = row;
        patch = { rows };
      }
    } else if (p.cap) {
      patch = { caption: p.runs };
    } else if (p.itemIndex === undefined) {
      patch = { runs: p.runs };
    } else {
      const b = doc.blocks.find(x => x.id === p.id);
      if (!b || !Array.isArray(b.items)) return;
      const items = b.items.slice();
      items[p.itemIndex] = p.runs;
      patch = { items };
    }
    setDoc(Object.assign({}, doc, { assets, blocks: replaceBlock(doc.blocks, p.id, patch) }));
    if (redrawAfter) redraw({ caretId: p.id, caretEnd: true });
  }

  // input 의 target 은 입력판 전체다 — 반영할 칸은 커서 위치로 찾는다
  function capture() {
    const blk = activeBlockEl(pagesEl);
    if (!blk) return;
    const cap = activeCapEl(blk);
    if (cap) { pending = { id: blk.dataset.id, cap: 1, runs: domToRuns(cap) }; return; }
    const td = activeCellEl(blk);
    if (td) {
      pending = { id: blk.dataset.id,
        cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)],
        runs: domToRuns(td) };
      return;
    }
    const li = activeItemEl(blk);
    if (li) pending = { id: blk.dataset.id, itemIndex: Number(li.dataset.i), runs: domToRuns(li) };
    else pending = { id: blk.dataset.id, runs: domToRuns(blk) };
  }

  pagesEl.addEventListener('input', () => {
    capture();
    if (!composing) flush(false);   // 모델만 갱신, 다시 그리지 않는다(커서가 튄다)
    // 다시 그리기(쪽 나눔 갱신)는 "다 치고 잠깐 멈췄을 때" 만 한다
    clearTimeout(idle);
    idle = setTimeout(() => { if (!composing) redraw({ keepCaret: true }); }, 350);
  });

  pagesEl.addEventListener('compositionstart', () => {
    // 걸침 선택 위에서 조합이 시작되면, 조합 글자가 끼기 전에 지금 지운다.
    // 입력판이 하나라 초점(#pages)은 그대로다 — 조합이 안전하게 이어진다.
    deleteCrossInPlace();
    composing = true;
  });
  pagesEl.addEventListener('compositionend', () => {
    composing = false;
    flush(false);   // 조합 중 미뤄 둔 마지막 글자를 모델로 — 이벤트 순서에 맡기지 않는다
  });

  // ── 걸침 선택(여러 칸) 좌표: 글자를 문 칸들 + 경계만 문 칸 + 사이에 낀 섹션 줄 ──
  function crossTargets() {
    const s = window.getSelection();
    if (!s.rangeCount || s.getRangeAt(0).collapsed) return [];
    const r = s.getRangeAt(0);
    const targets = targetsIn(pagesEl);
    const edge = (node, offset, atStart) => {
      const e = node.nodeType === 1 ? node : node.parentElement;
      const host = e && e.closest
        ? e.closest('.blk[data-id]:not(.blk-section):not(.blk-list), .blk-list .lst li[data-i]')
        : null;
      if (!host) return;
      const li = host.matches('.lst li[data-i]') ? host : null;
      const blk = li ? li.closest('.blk[data-id]') : host;
      const item = li ? Number(li.dataset.i) : null;
      if (targets.some(t => t.id === blk.dataset.id && t.item === item)) return;
      const pos = offsetIn(host, node, offset);
      const t = { id: blk.dataset.id, item, from: pos, to: pos };
      if (atStart) targets.unshift(t);
      else targets.push(t);
    };
    edge(r.startContainer, r.startOffset, true);
    edge(r.endContainer, r.endOffset, false);
    if (targets.length < 2) return targets;
    targets.splice(1, 0, ...coveredSections(r));
    return targets;
  }

  // 섹션 줄·그림 블록 — 글 칸이 아닌 «통짜 섬»은 걸침 선택에 물리면 통째로 없어진다
  function coveredSections(r) {
    return Array.from(pagesEl.querySelectorAll('.blk-section[data-id], .blk-image[data-id]'))
      .filter(el => r.intersectsNode(el) && !el.contains(r.startContainer) && !el.contains(r.endContainer))
      .map(el => ({ id: el.dataset.id, item: null, from: 0, to: 0 }));
  }

  function deleteTargets(targets, opt) {
    const doc = getDoc();
    const r = deleteAcross(doc.blocks, targets, opt);
    if (!r) return null;
    setDoc(Object.assign({}, doc, { blocks: r.blocks }));
    return r;
  }

  // 걸침 선택을 화면 전체를 다시 그리지 않고 지운다(조합 직전용 — §12-12).
  // 첫 칸의 «속»만 합쳐진 토막으로 갈아 끼우고, 없어진 블록·항목 DOM 을 떼고,
  // 커서를 이음매에 둔다. 쪽 나눔은 다음 다시 그리기가 바로잡는다.
  function deleteCrossInPlace() {
    const targets = crossTargets();
    if (targets.length < 2) return;
    if (targets.some(x => x.cell)) {
      // 표가 낀 걸침 위 조합 — 모델만 고치고, 화면은 문 칸들의 «속»만 갈아 끼운다.
      // 표 조각 DOM 수술은 위험해서 다시 그리기는 조합이 끝난 뒤 flush 경로에 맡긴다(§12-12).
      const doc = getDoc();
      const r = deleteMixed(doc.blocks, targets);
      if (!r) return;
      setDoc(Object.assign({}, doc, { blocks: r.blocks }));
      const alive = new Set(r.blocks.map(b => b.id));
      const cellSel = (t) => '.blk[data-id="' + t.id + '"] td[data-r="' + t.cell[0]
        + '"][data-c="' + t.cell[1] + '"]';
      const refill2 = (el, runs) => {
        el.textContent = '';
        for (const n of runsToNodes(runs || [])) el.appendChild(n);
      };
      for (const t of targets) {
        const host = t.cell ? pagesEl.querySelector(cellSel(t))
                            : pagesEl.querySelector('.blk[data-id="' + t.id + '"]');
        if (!host) continue;
        if (!alive.has(t.id)) { host.remove(); continue; }
        const b = r.blocks.find(x => x.id === t.id);
        if (t.cell) refill2(host, t.cell[0] === 'h' ? b.head[0][t.cell[1]].runs : b.rows[t.cell[0]][t.cell[1]].runs);
        else if (t.item === null || t.item === undefined) { if (b.runs) refill2(host, b.runs); }
      }
      cancelIdle();
      const caretHost = r.caret.cell ? pagesEl.querySelector(cellSel(r.caret))
                                     : pagesEl.querySelector('.blk[data-id="' + r.caret.id + '"]');
      if (caretHost) caretTo(caretHost, r.caret.pos);
      return;
    }
    const first = targets[0];
    const last = targets[targets.length - 1];
    const firstItem = first.item === null || first.item === undefined ? null : first.item;
    const hostEl = (t) => (t.item === null || t.item === undefined)
      ? pagesEl.querySelector('.blk[data-id="' + t.id + '"]')
      : pagesEl.querySelector('.blk[data-id="' + t.id + '"] .lst li[data-i="' + t.item + '"]');
    const firstHost = hostEl(first);
    if (!firstHost) return;
    const lastHost = hostEl(last);
    const r = deleteTargets(targets);
    if (!r) return;
    const doc = getDoc();
    const refill = (el, runs) => {
      el.textContent = '';
      for (const n of runsToNodes(runs || [])) el.appendChild(n);
    };
    const firstB = doc.blocks.find(b => b.id === first.id);
    refill(firstHost, firstItem === null ? firstB.runs : firstB.items[firstItem]);
    if (r.split && lastHost && lastHost !== firstHost) {
      // 갈라 두기 — 끝 칸을 지우지 않고 꼬리로 갈아 끼운다
      const lastB = doc.blocks.find(b => b.id === r.caretTail.id);
      refill(lastHost, r.caretTail.item === null ? lastB.runs : lastB.items[r.caretTail.item]);
    }
    const alive = new Set(doc.blocks.map(b => b.id));
    for (let i = 1; i < targets.length; i++) {
      const t = targets[i];
      if (r.split && i === targets.length - 1) continue;   // 끝 칸은 남는다
      if (!alive.has(t.id)) {
        const el = pagesEl.querySelector('.blk[data-id="' + t.id + '"]');
        if (el) el.remove();
      } else if (t.item !== null && t.item !== undefined) {
        const li = pagesEl.querySelector('.blk[data-id="' + t.id + '"] .lst li[data-i="' + t.item + '"]');
        if (li) li.remove();
      }
    }
    // 남은 목록 항목 번호를 모델과 다시 맞춘다 (안 맞으면 다음 타자가 엉뚱한 항목에 붙는다)
    for (const id of new Set(targets.map(t => t.id))) {
      if (!alive.has(id)) continue;
      pagesEl.querySelectorAll('.blk[data-id="' + id + '"] .lst li')
        .forEach((li, i) => { li.dataset.i = String(i); });
    }
    cancelIdle();
    caretTo(firstHost, r.caret.pos);
  }

  // ── 구조 지킴이 ──
  pagesEl.addEventListener('beforeinput', (e) => {
    const t = e.inputType;
    if (t === 'historyUndo' || t === 'historyRedo') { e.preventDefault(); return; } // Ctrl+Z 는 main.js
    if (t === 'insertFromDrop') { e.preventDefault(); return; }  // 글 끌어놓기는 아직 — 구조가 깨진다
    if (composing || t === 'insertCompositionText') return;      // 조합은 compositionstart 가 처리했다

    const targets = crossTargets();
    if (targets.length > 1) {
      if (targets.some(x => x.cell)) {
        // 표가 낀 걸침 — 표 구조는 남고 칸 속만 비운다(계획 R5·R6). Enter 도 가르지 않는다.
        e.preventDefault();
        const doc = getDoc();
        const r = deleteMixed(doc.blocks, targets);
        if (!r) return;
        setDoc(Object.assign({}, doc, { blocks: r.blocks }));
        let text = '';
        if (t === 'insertText' && e.data) text = e.data;
        if (t === 'insertFromPaste' && e.dataTransfer) text = e.dataTransfer.getData('text/plain') || '';
        const c = text ? insertLinesAt(r.caret, text)
                       : Object.assign({}, r.caret, { pos: r.caret.pos });
        cancelIdle();
        redraw({ caret: c });
        return;
      }
      // 여러 칸에 걸친 편집 — 브라우저가 블록을 제멋대로 병합하기 전에 우리가 지운다.
      // 워드 규칙(실측 2026-08-30): 엔터는 항상 가르고, 지우기·타자는 deleteAcross 의
      // 자동 규칙(양쪽 다 글자를 물었으면 가르고, 경계만 물렸으면 합친다)을 따른다.
      e.preventDefault();
      const r = deleteTargets(targets, t === 'insertParagraph' ? { break: true } : null);
      if (!r) return;
      if (t === 'insertParagraph') {
        cancelIdle();
        redraw({ caret: r.caretTail });
        return;
      }
      let text = '';
      if (t === 'insertText' && e.data) text = e.data;
      if (t === 'insertFromPaste' && e.dataTransfer) text = e.dataTransfer.getData('text/plain') || '';
      const c2 = text ? insertLinesAt(r.caret, text)
                      : { id: r.caret.id, item: r.caret.item, pos: r.caret.pos };
      cancelIdle();
      redraw({ caret: c2 });
      return;
    }

    // 섹션 줄이 낀 선택 지우기 (글 칸 없이 섹션만 문 경우 — 통짜 섬이라 직접 지운다)
    const s = window.getSelection();
    const collapsed = !s.rangeCount || s.getRangeAt(0).collapsed;
    if (!collapsed && (t === 'deleteContentBackward' || t === 'deleteContentForward'
        || t === 'insertText' || t === 'insertParagraph')) {
      const secs = coveredSections(s.getRangeAt(0));
      if (secs.length && targets.length === 0) {
        e.preventDefault();
        let doc = getDoc();
        let blocks = doc.blocks;
        for (const sec of secs) blocks = removeBlock(blocks, sec.id);
        setDoc(Object.assign({}, doc, { blocks }));
        cancelIdle();
        redraw({});
        return;
      }
    }

    if (t === 'insertParagraph') {
      e.preventDefault();
      const blk2 = activeBlockEl(pagesEl);
      const cap2 = blk2 && activeCapEl(blk2);
      if (cap2) { enterInCap(blk2, cap2); return; }   // 캡션 Enter = 캡션 안 줄바꿈
      const td = blk2 && activeCellEl(blk2);
      if (td) { enterInCell(blk2, td); return; }   // 칸 안 Enter = 줄바꿈(계획 R1)
      enterAt();
      return;
    }
    if (t === 'deleteContentBackward' && collapsed) { if (mergeAt(-1)) e.preventDefault(); return; }
    if (t === 'deleteContentForward' && collapsed) { if (mergeAt(1)) e.preventDefault(); return; }

    // 표를 붙여넣으면 «표»로 들어온다 (2026-08-30 SKY). 워드·엑셀에서 복사한 표도 같다.
    // ⚠ 표 칸 «안»에 표를 붙이는 것은 표 속의 표가 되어 버리니 하지 않는다(글자로 들어간다).
    if (t === 'insertFromPaste' && e.dataTransfer) {
      const html = e.dataTransfer.getData('text/html') || '';
      const blkT = activeBlockEl(pagesEl);
      const inCellT = blkT && activeCellEl(blkT);
      if (html.indexOf('<table') >= 0 && blkT && !inCellT && targets.length < 2) {
        const t2 = tableFromHtml(html);
        if (t2) {
          e.preventDefault();
          flush(false);
          const doc = getDoc();
          const got = adoptTable(t2, doc.assets);
          const made = got.block;
          setDoc(Object.assign({}, doc, { assets: got.assets,
            blocks: insertAfter(doc.blocks, blkT.dataset.id, made) }));
          cancelIdle();
          const first = made.head && made.head.length ? ['h', 0] : (made.rows.length ? [0, 0] : null);
          redraw(first ? { caret: { id: made.id, cell: first, pos: 0 } } : {});
          return;
        }
      }
    }

    // 여러 줄 붙여넣기 — 줄마다 문단이 되도록 우리가 넣는다(브라우저에 맡기면 한 문단에
    // 통째로 들어가 그 덩어리가 다음 장으로 밀린다). 표 칸 안은 줄바꿈이 정상이라 그대로.
    if (t === 'insertFromPaste' && e.dataTransfer) {
      const raw = e.dataTransfer.getData('text/plain') || '';
      if (raw.indexOf('\n') >= 0 || raw.indexOf('\r') >= 0) {
        const blk3 = activeBlockEl(pagesEl);
        const td3 = blk3 && activeCellEl(blk3);
        if (blk3 && !td3) {
          e.preventDefault();
          flush(false);
          const li3 = activeItemEl(blk3);
          const host3 = li3 || blk3;
          const rg3 = rangeIn(host3);
          if (!rg3) return;
          const c3 = insertLinesAt({ id: blk3.dataset.id, item: li3 ? Number(li3.dataset.i) : null,
                                     pos: rg3.from, end: rg3.to }, raw);
          cancelIdle();
          redraw({ caret: c3 });
          return;
        }
      }
    }
    // 그 밖(칸 안 타자·지우기·붙여넣기·Shift+Enter 줄바꿈)은 브라우저가 하고 flush 가 되읽는다
  });

  // 여러 줄 글을 넣는다 — 줄마다 문단(목록이면 항목)이 하나씩 된다. 워드와 같다.
  // ⛔ 한 문단에 통째로 넣으면 그 블록이 아주 길어지고, 장 나눔은 «블록을 쪼개지 않는»
  //    규칙이라 그 덩어리가 통째로 다음 장으로 밀린다 — 붙여넣은 글이 «사라진 것처럼»
  //    보인다(2026-08-30 SKY). 표 칸 안에서는 줄바꿈이 «칸 안 줄바꿈»이라 그대로 둔다.
  // caret.end 가 있으면 pos~end 구간을 덮어쓴다(칸 안에 고른 구간이 있을 때).
  // 반환: 넣고 난 뒤의 커서 좌표.
  function insertLinesAt(caret, text) {
    const lines = String(text).split(/\r\n|\r|\n/);
    const end = caret.end === undefined ? caret.pos : caret.end;
    if (lines.length < 2 || caret.cell) {
      insertAtCaret(caret, text);
      return { id: caret.id, item: caret.item, cell: caret.cell, pos: caret.pos + text.length };
    }
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === caret.id);
    if (!b) return caret;
    const isItem = caret.item !== null && caret.item !== undefined && Array.isArray(b.items);
    const src = isItem ? b.items[caret.item] : b.runs;
    if (!Array.isArray(src)) { insertAtCaret(caret, text); return caret; }
    const len = runsLength(src);
    const head = sliceRuns(src, 0, caret.pos);
    const tail = sliceRuns(src, Math.min(end, len), len);
    const lastLine = lines[lines.length - 1];
    const first = normalizeRuns(head.concat(runsFromText(lines[0])));
    const rest = lines.slice(1);

    if (isItem) {
      const items = b.items.slice();
      items[caret.item] = first;
      const made = rest.map((s, i) => (i === rest.length - 1
        ? normalizeRuns(runsFromText(s).concat(tail)) : runsFromText(s)));
      items.splice(caret.item + 1, 0, ...made);
      setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, b.id, { items }) }));
      return { id: b.id, item: caret.item + rest.length, pos: lastLine.length };
    }
    const fresh = rest.map((s, i) => createBlock('para', {
      runs: i === rest.length - 1 ? normalizeRuns(runsFromText(s).concat(tail)) : runsFromText(s),
    }));
    let blocks = replaceBlock(doc.blocks, b.id, { runs: first });
    const at = blocks.findIndex(x => x.id === b.id);
    blocks = blocks.slice(0, at + 1).concat(fresh, blocks.slice(at + 1));
    setDoc(Object.assign({}, doc, { blocks }));
    return { id: fresh[fresh.length - 1].id, item: null, pos: lastLine.length };
  }

  function insertAtCaret(caret, text) {
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === caret.id);
    if (!b) return;
    let patch;
    if (caret.cell) {
      if (b.type !== 'table') return;
      if (caret.cell[0] === 'h') {
        const head = [b.head[0].slice()];
        head[0][caret.cell[1]] = Object.assign({}, head[0][caret.cell[1]],
          { runs: insertText(head[0][caret.cell[1]].runs, caret.pos, text) });
        patch = { head };
      } else {
        const rows = b.rows.slice();
        const row = rows[caret.cell[0]].slice();
        row[caret.cell[1]] = Object.assign({}, row[caret.cell[1]],
          { runs: insertText(row[caret.cell[1]].runs, caret.pos, text) });
        rows[caret.cell[0]] = row;
        patch = { rows };
      }
    } else if (caret.item === null || caret.item === undefined) {
      patch = { runs: insertText(b.runs, caret.pos, text) };
    } else {
      const items = b.items.slice();
      items[caret.item] = insertText(items[caret.item], caret.pos, text);
      patch = { items };
    }
    setDoc(Object.assign({}, getDoc(), { blocks: replaceBlock(getDoc().blocks, b.id, patch) }));
  }

  // 엔터 — 커서 자리에서 가른다 (뒷부분이 새 문단/항목이 된다. 워드와 같다)
  function enterAt() {
    flush(false);
    const blk = activeBlockEl(pagesEl);
    if (!blk) return;
    const li = activeItemEl(blk);
    const host = li || blk;
    const r = rangeIn(host);
    if (!r) return;
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === blk.dataset.id);
    if (!b) return;

    if (li && Array.isArray(b.items)) {
      const i = Number(li.dataset.i);
      const item = b.items[i] || [];
      if (!runsLength(item)) {
        // 빈 항목에서 엔터 → 그 항목을 빼고 목록을 벗어나 문단이 된다
        const items = b.items.slice();
        items.splice(i, 1);
        const fresh = createBlock('para');
        let blocks;
        if (items.length) {
          blocks = insertAfter(replaceBlock(doc.blocks, b.id, { items }), b.id, fresh);
        } else {
          // ⛔ removeBlock 뒤에 insertAfter 를 쓰면 기준 id 가 이미 없어 오류가 난다
          blocks = doc.blocks.slice();
          blocks[blocks.findIndex(x => x.id === b.id)] = fresh;
        }
        setDoc(Object.assign({}, doc, { blocks }));
        cancelIdle();
        redraw({ caret: { id: fresh.id, item: null, pos: 0 } });
        return;
      }
      const items = b.items.slice();
      items[i] = sliceRuns(item, 0, r.from);
      items.splice(i + 1, 0, sliceRuns(item, r.to, runsLength(item)));
      setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, b.id, { items }) }));
      cancelIdle();
      redraw({ caret: { id: b.id, item: i + 1, pos: 0 } });
      return;
    }

    if (!Array.isArray(b.runs)) return;
    const before = sliceRuns(b.runs, 0, r.from);
    const after = sliceRuns(b.runs, r.to, runsLength(b.runs));
    const fresh = createBlock('para', { runs: after });
    const blocks = insertAfter(replaceBlock(doc.blocks, b.id, { runs: before }), b.id, fresh);
    setDoc(Object.assign({}, doc, { blocks }));
    cancelIdle();
    redraw({ caret: { id: fresh.id, item: null, pos: 0 } });
  }

  // 칸 안 Enter — 새 블록이 아니라 칸 «안» 줄바꿈이다(계획 R1). 워드도 화면상 같다.
  function enterInCell(blk, td) {
    flush(false);
    const r = rangeIn(td);
    if (!r) return;
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === blk.dataset.id);
    if (!b || b.type !== 'table') return;
    const cell = [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)];
    const src = cell[0] === 'h' ? b.head[0][cell[1]].runs : b.rows[cell[0]][cell[1]].runs;
    const len = runsLength(src || []);
    const runs = sliceRuns(src || [], 0, r.from).concat([{ t: '\n' }], sliceRuns(src || [], r.to, len));
    let patch;
    if (cell[0] === 'h') {
      const head = [b.head[0].slice()];
      head[0][cell[1]] = Object.assign({}, head[0][cell[1]], { runs });
      patch = { head };
    } else {
      const rows = b.rows.slice();
      const row = rows[cell[0]].slice();
      row[cell[1]] = Object.assign({}, row[cell[1]], { runs });
      rows[cell[0]] = row;
      patch = { rows };
    }
    setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, b.id, patch) }));
    cancelIdle();
    redraw({ caret: { id: b.id, cell, pos: r.from + 1 } });
  }

  // 캡션 안 Enter — 새 블록이 아니라 캡션 «안» 줄바꿈이다(표 칸과 같은 규칙)
  function enterInCap(blk, capEl) {
    flush(false);
    const r = rangeIn(capEl);
    if (!r) return;
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === blk.dataset.id);
    if (!b || b.type !== 'image') return;
    const src = b.caption || [];
    const len = runsLength(src);
    const runs = sliceRuns(src, 0, r.from).concat([{ t: '\n' }], sliceRuns(src, r.to, len));
    setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, b.id, { caption: runs }) }));
    cancelIdle();
    redraw({ caret: { id: b.id, cap: 1, pos: r.from + 1 } });
  }

  // Tab — 다음/이전 칸으로. 마지막 칸에서 Tab 은 행을 늘린다(계획 R2, 워드와 같다).
  function moveCell(blk, td, dir) {
    flush(false);
    const id = blk.dataset.id;
    const tds = Array.from(pagesEl.querySelectorAll(
      '.blk-table[data-id="' + id + '"] td[data-r]'));
    const i = tds.indexOf(td);
    const next = tds[i + dir];
    if (next) { caretTo(next, dir > 0 ? 0 : Number.MAX_SAFE_INTEGER); return; }
    if (dir < 0) return;
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === id);
    if (!b || b.type !== 'table') return;
    const t2 = addRow(b, b.rows.length);
    setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, id, { rows: t2.rows }) }));
    cancelIdle();
    redraw({ caret: { id, cell: [b.rows.length, 0], pos: 0 } });
  }

  pagesEl.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const blk = activeBlockEl(pagesEl);
    const td = blk && activeCellEl(blk);
    if (!td) return;                 // 표 밖 Tab 은 지금대로(브라우저)
    e.preventDefault();
    moveCell(blk, td, e.shiftKey ? -1 : 1);
  });

  // 블록 경계의 Backspace(-1)·Delete(+1) — 브라우저가 블록 DOM 을 제멋대로 합치기 전에
  // 우리가 병합한다. 이웃이 섹션 줄이면 섹션을 지운다. 처리했으면 true.
  function mergeAt(dir) {
    const s = window.getSelection();
    if (!s.rangeCount) return false;
    const blk = activeBlockEl(pagesEl);
    if (!blk) return false;
    const capH = activeCapEl(blk);
    if (capH) {
      // 캡션 경계 — 캡션 밖으로 새 나가는 병합은 없다(표 칸과 같은 규칙)
      const p = offsetIn(capH, s.anchorNode, s.anchorOffset);
      if (dir < 0 && p === 0) return true;
      if (dir > 0 && p >= textLen(capH)) return true;
      return false;                                      // 캡션 안 지우기 — 브라우저가 한다
    }
    const tdHost = activeCellEl(blk);
    if (tdHost) {
      // 칸 경계 지우기 — 칸 밖으로 새 나가는 병합은 하지 않는다(계획 R3, 워드와 같다).
      const p = offsetIn(tdHost, s.anchorNode, s.anchorOffset);
      if (dir < 0 && p === 0) return true;                 // 브라우저가 못 하게 막기만 한다
      if (dir > 0 && p >= textLen(tdHost)) return true;
      return false;                                        // 칸 안 지우기 — 브라우저가 한다
    }
    const li = activeItemEl(blk);
    const host = li || blk;
    const pos = offsetIn(host, s.anchorNode, s.anchorOffset);
    if (dir < 0 && pos !== 0) return false;              // 칸 안 지우기 — 브라우저가 한다
    if (dir > 0 && pos < textLen(host)) return false;
    flush(false);

    // 목록의 첫/끝 항목이 아니면 같은 목록의 이웃 항목과 병합 — 아래 공통 경로가 처리
    const edgeItem = li ? (dir < 0 ? Number(li.dataset.i) === 0 : !li.nextElementSibling) : true;
    if (edgeItem) {
      const doc = getDoc();
      const bi = doc.blocks.findIndex(x => x.id === blk.dataset.id);
      const nb = doc.blocks[bi + dir];
      if (!nb) return true;                              // 문서의 처음/끝 — 아무 일도 없다
      if (nb.type === 'section') {
        setDoc(Object.assign({}, doc, { blocks: removeBlock(doc.blocks, nb.id) }));
        cancelIdle();
        redraw({ caret: { id: blk.dataset.id, item: li ? Number(li.dataset.i) : null, pos } });
        return true;
      }
      if (nb.type === 'table') return true;                // 문단이 표로 빨려 들지 않는다(계획 R4)
    }
    const els = editableEls(pagesEl);
    const i = els.indexOf(host);
    const other = els[i + dir];
    if (!other) return true;
    if (other.matches && other.matches('td[data-r]')) return true;   // 경계 너머가 표 칸 — 병합 금지
    if (other.matches && other.matches('.cap')) return true;         // 경계 너머가 캡션 — 병합 금지
    const at = (el, end) => {
      const l = el.matches('.lst li[data-i]') ? el : null;
      const bk = l ? l.closest('.blk[data-id]') : el;
      const p = end ? textLen(el) : 0;
      return { id: bk.dataset.id, item: l ? Number(l.dataset.i) : null, from: p, to: p };
    };
    const pair = dir < 0 ? [at(other, true), at(host, false)] : [at(host, true), at(other, false)];
    const r = deleteTargets(pair);   // 경계만 문 대상 — 자동 규칙이 합친다
    if (!r) return false;
    cancelIdle();
    redraw({ caret: r.caret });
    return true;
  }

  // 칸을 끄는 동안에는 열 손잡이의 파란 강조를 끈다 (2026-08-30 SKY) —
  // 그때는 열 너비를 바꾸는 게 아니라 칸을 고르는 중이라, 손끝이 손잡이 위를 지날 때마다
  // 파래지면 «지금 열을 끌고 있나?» 하고 헷갈린다. 열 손잡이에서 «시작»한 끌기는 예외다.
  pagesEl.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('.colgrip')) return;
    pagesEl.classList.add('picking');
  });
  const endPick = () => pagesEl.classList.remove('picking');
  document.addEventListener('pointerup', endPick);
  document.addEventListener('pointercancel', endPick);

  // ── 열 너비 끌기 — 끄는 동안은 colgroup 만 미리보기로 바꾸고, 놓으면 모델에 적는다 ──
  let grip = null;   // { id, col, startX, startW, pairW, cols:[colgroup,…] }
  pagesEl.addEventListener('pointerdown', (e) => {
    const g = e.target.closest && e.target.closest('.colgrip');
    if (!g) return;
    e.preventDefault();
    const blkEl = g.closest('.blk-table[data-id]');
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === blkEl.dataset.id);
    if (!b) return;
    const col = Number(g.dataset.col);
    // 눈금(손잡이)은 왼쪽부터 이 경계까지의 폭에 놓여 있다 — 끌 때 같이 옮기려면 그 값이 필요하다
    const left0 = b.cols.slice(0, col).reduce((s, c) => s + (c.w || 0), 0);
    grip = { id: b.id, col, startX: e.clientX,
      startW: b.cols[col].w, pairW: b.cols[col].w + b.cols[col + 1].w, left0,
      cols: Array.from(pagesEl.querySelectorAll('.blk-table[data-id="' + b.id + '"] colgroup')),
      // 같은 경계의 눈금은 장마다 하나씩 있다(이어진 장의 보기 전용 눈금 포함) — 전부 같이 옮긴다
      grips: Array.from(pagesEl.querySelectorAll(
        '.blk-table[data-id="' + b.id + '"] .colgrip[data-col="' + col + '"]')) };
    g.classList.add('on');
    try { g.setPointerCapture(e.pointerId); } catch (err) { /* 합성 이벤트에는 없다 */ }
  });
  pagesEl.addEventListener('pointermove', (e) => {
    if (!grip) return;
    const w = Math.max(30, Math.min(grip.startW + (e.clientX - grip.startX), grip.pairW - 30));
    for (const cg of grip.cols) {                          // 모든 조각의 colgroup 을 같이
      cg.children[grip.col].style.width = w + 'px';
      cg.children[grip.col + 1].style.width = (grip.pairW - w) + 'px';
    }
    // ⭐ 눈금도 손끝을 따라간다 — 전에는 놓는 순간에야 제자리를 찾아 «선이 안 따라온다» 고 보였다
    for (const gg of grip.grips) gg.style.left = (grip.left0 + w - 3) + 'px';
  });
  // ⚠ 어느 경계를 끌었는지는 e.target 이 아니라 grip 에서 읽는다 — setPointerCapture 덕에
  //   손잡이 밖에서 놓아도 이벤트는 오지만, target 을 믿으면 꼬인다.
  pagesEl.addEventListener('pointerup', (e) => {
    if (!grip) return;
    const { id, col, startX, startW, pairW } = grip;
    grip = null;
    pagesEl.querySelectorAll('.colgrip.on').forEach(x => x.classList.remove('on'));
    const w = Math.max(30, Math.min(startW + (e.clientX - startX), pairW - 30));
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === id);
    if (!b || b.type !== 'table') return;
    const next = setColWidth(b, col, w);
    setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, id, { cols: next.cols }) }));
    cancelIdle();
    redraw({ keepCaret: true });
  });

  // ── 손가락으로 칸 고르기 (2026-08-30 SKY: "태블릿으로 손가락으로 드래그 칸이 골라지지 않아") ──
  // 터치에서는 그냥 끌면 브라우저가 «화면 넘기기»로 받아 글이 안 골라진다. 그래서 표 안에서만
  // 우리가 가로챈다. ⚠ 세로로 먼저 움직이면 화면 넘기기로 두고(표를 지나 아래로 읽어야 하니까),
  // 가로로 먼저 움직였을 때만 칸 고르기로 본다.
  let touchPick = null;   // { td, mode:'undecided'|'select'|'scroll', x0, y0 }
  // ⚠ 열 손잡이(.colgrip)가 칸 위를 7px 덮고 있다 — 그 자리를 짚으면 손잡이만 잡혀
  //   «칸이 없다» 고 나온다. 겹친 것을 다 훑어 «칸» 을 찾는다(실측 2026-08-30).
  const tdAt = (x, y) => {
    for (const el of document.elementsFromPoint(x, y)) {
      const td = el && el.closest ? el.closest('.blk-table td[data-r]') : null;
      if (td) return td;
    }
    return null;
  };
  pagesEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { touchPick = null; return; }
    const t = e.touches[0];
    const td = tdAt(t.clientX, t.clientY);
    touchPick = td ? { td, mode: 'undecided', x0: t.clientX, y0: t.clientY } : null;
  }, { passive: true });
  pagesEl.addEventListener('touchmove', (e) => {
    if (!touchPick || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - touchPick.x0;
    const dy = t.clientY - touchPick.y0;
    if (touchPick.mode === 'undecided') {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;      // 아직 어느 쪽인지 모른다
      touchPick.mode = Math.abs(dx) > Math.abs(dy) ? 'select' : 'scroll';
    }
    if (touchPick.mode !== 'select') return;
    const td = tdAt(t.clientX, t.clientY);
    const same = td && td.closest('.blk[data-id]') === touchPick.td.closest('.blk[data-id]');
    if (!same) return;                                      // 표 밖으로 나가면 그냥 둔다
    e.preventDefault();                                     // 화면이 밀리지 않게
    const a = nodeAt(touchPick.td, 0);
    const b = nodeAt(td, textLen(td));
    const s = window.getSelection();
    s.removeAllRanges();
    s.setBaseAndExtent(a.node, a.offset, b.node, b.offset);
  }, { passive: false });
  const endTouch = () => { touchPick = null; };
  pagesEl.addEventListener('touchend', endTouch, { passive: true });
  pagesEl.addEventListener('touchcancel', endTouch, { passive: true });

  // ── 칸이 골라진 것을 «보이게» 칠한다 (2026-08-30 SKY: "셀이 선택 되게 해줘") ──
  // 브라우저의 글자 선택 파란색만으로는 «칸이 골라졌다»가 안 보인다. 칸 통째로 무는
  // 선택이면 그 td 에 표시를 달고, CSS 가 칸 전체를 칠한다.
  function paintCells() {
    for (const td of pagesEl.querySelectorAll('td.cellsel')) td.classList.remove('cellsel');
    for (const t of pagesEl.querySelectorAll('.blk-table.cells-picking')) t.classList.remove('cells-picking');
    const cells = wholeCellsIn(pagesEl);
    for (const td of cells) {
      td.classList.add('cellsel');
      // 그 표에서는 브라우저의 «글자 파란색»을 끈다 — 네모 밖 칸이 파랗게 남으면 헷갈린다
      const t = td.closest('.blk-table');
      if (t) t.classList.add('cells-picking');
    }
  }
  document.addEventListener('selectionchange', paintCells);

  // 고른 구간의 «글»을 뽑는다 — 잘라내기가 클립보드에 담을 값이다.
  // 표 칸은 한 행을 탭으로 잇고 행마다 줄을 바꾼다(엑셀에 그대로 붙는 모양).
  // ⚠ 경계만 문 칸(from===to)은 글이 없으니 뺀다 — 넣으면 빈 줄이 생긴다.
  function targetsText(targets) {
    const doc = getDoc();
    const rows = new Map();     // '블록id/행' → 그 행의 칸 글 목록
    const lines = [];
    for (const t of targets) {
      if (t.to <= t.from) continue;
      const b = doc.blocks.find(x => x.id === t.id);
      if (!b) continue;
      let runs = null;
      if (t.cell) {
        const row = t.cell[0] === 'h' ? (b.head && b.head[0]) : (b.rows && b.rows[t.cell[0]]);
        runs = row && row[t.cell[1]] ? row[t.cell[1]].runs : null;
      } else if (t.item === null || t.item === undefined) runs = b.runs;
      else runs = b.items && b.items[t.item];
      if (!Array.isArray(runs)) continue;
      const s = runsText(sliceRuns(runs, t.from, t.to));
      if (t.cell) {
        const key = t.id + '/' + t.cell[0];
        if (!rows.has(key)) { rows.set(key, []); lines.push(rows.get(key)); }
        rows.get(key).push(s);
      } else lines.push(s);
    }
    return lines.map(l => (Array.isArray(l) ? l.join('\t') : l)).join('\n');
  }

  // 붙여넣기로 들어온 <table> 을 우리 표 블록으로 바꾼다 (2026-08-30 SKY).
  // 워드·엑셀·이 편집기가 담은 표를 다 받는다. 서식은 걸러내고 «글자와 격자»만 가져온다
  // — 붙여넣기는 원래 서식을 거르는 것이 이 프로그램의 방침이다.
  function tableFromHtml(html) {
    const doc0 = new DOMParser().parseFromString(html, 'text/html');
    const tbl = doc0.querySelector('table');
    if (!tbl) return null;
    const trs = Array.from(tbl.querySelectorAll('tr'));
    if (!trs.length) return null;
    // 격자를 직사각형으로 편다 — 병합(colspan/rowspan)은 덮인 자리를 cov 로 채운다
    const grid = [];
    const put = (r, c, cell) => {
      while (grid.length <= r) grid.push([]);
      grid[r][c] = cell;
    };
    trs.forEach((tr, r) => {
      let c = 0;
      for (const td of Array.from(tr.children)) {
        while (grid[r] && grid[r][c]) c += 1;
        const cs = Math.max(1, Number(td.getAttribute('colspan')) || 1);
        const rs = Math.max(1, Number(td.getAttribute('rowspan')) || 1);
        const txt = (td.innerText !== undefined ? td.innerText : td.textContent) || '';
        // 눈에 안 보이는 «붙는 공백»(nbsp)은 보통 공백으로 — 워드·엑셀이 그걸로 채워 보낸다
        const runs = runsFromText(txt.replace(/\u00a0/g, ' ').trim());
        // 칸 속 그림 — 글자와 격자만 받는 방침 그대로, 그림은 임시 표기로 얹어
        // 붙여넣는 쪽(adoptTable)이 보관함에 담는다. 원격 주소는 버린다(설계 5장).
        for (const im of Array.from(td.querySelectorAll('img'))) {
          const isrc = im.getAttribute('src') || '';
          if (isrc.indexOf('data:image/') !== 0) continue;
          runs.push({ t: OBJ, src$: isrc,
            w: Number(im.getAttribute('width')) || 0, h: Number(im.getAttribute('height')) || 0 });
        }
        const cell = { runs };
        if (cs > 1) cell.cs = cs;
        if (rs > 1) cell.rs = rs;
        put(r, c, cell);
        for (let i = 0; i < rs; i++) for (let j = 0; j < cs; j++) {
          if (i || j) put(r + i, c + j, { runs: [], cov: 1 });
        }
        c += cs;
      }
    });
    const ncols = grid.reduce((n, row) => Math.max(n, row.length), 0);
    if (!ncols) return null;
    for (const row of grid) for (let c = 0; c < ncols; c++) if (!row[c]) row[c] = { runs: [] };
    // ⭐ «복사한 그대로» 붙인다(2026-08-30 SKY) — <thead> 가 있을 때만 머리글이 된다.
    //    몸통 한 행만 복사했으면 머리글 없는 표가 되고, 빈 행을 억지로 만들지 않는다.
    //    머리글이 필요하면 도구모음 「머리글」 버튼으로 언제든 켠다.
    //    ⚠ 엑셀·워드가 담은 표에는 <thead> 가 없다 — 그때도 머리글 없이 들어온다.
    const hasHead = !!tbl.querySelector('thead tr');
    const head = hasHead ? [grid[0].slice(0, ncols)] : [];
    const rows = (hasHead ? grid.slice(1) : grid).map(r => r.slice(0, ncols));
    if (!head.length && !rows.length) return null;
    const made = createBlock('table', {
      cols: Array.from({ length: ncols }, () => ({ w: Math.floor(674 / ncols) })),
      head, rows,
    });
    // 열 너비 합을 텍스트 폭에 맞춘다 — 안 맞추면 표가 종이 밖으로 나간다
    const pg = getDoc().page;
    return Object.assign(made, normalizeWidths(made, pg.width - pg.margin.left - pg.margin.right));
  }

  // 붙여넣은 표의 그림(임시 표기)을 보관함에 담는다 — 칸마다 adoptImages
  function adoptTable(t2, assets0) {
    let assets = assets0;
    const fix = (row) => row.map((cell) => {
      if (!cell || !Array.isArray(cell.runs)) return cell;
      const got = adoptImages(cell.runs, assets);
      assets = got.assets;
      return Object.assign({}, cell, { runs: got.runs });
    });
    return { block: Object.assign({}, t2,
      { head: (t2.head || []).map(fix), rows: (t2.rows || []).map(fix) }), assets };
  }

  // 고른 표 칸들을 «표 모양»으로도 담는다 (2026-08-30 SKY: "표 자체도 복사 되게").
  // 글자만 담으면 워드·엑셀에 붙일 때 줄글이 된다 — text/html 로 <table> 을 같이 담으면
  // 워드·엑셀·이 편집기 모두 «표»로 받는다. 표 밖 대상이 섞이면 표로 안 담는다.
  function targetsTableHtml(targets) {
    const cells = targets.filter(t => t.cell);
    if (!cells.length || cells.length !== targets.filter(t => t.to > t.from || t.cell).length) return '';
    const id = cells[0].id;
    if (cells.some(t => t.id !== id)) return '';          // 표가 둘이면 표로 안 담는다
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === id);
    if (!b || b.type !== 'table') return '';
    // ⭐ 머리글 칸은 <thead> 로 담는다 — «복사한 그대로» 붙이려면 그 행이 머리글이었는지가
    //    함께 실려야 한다(2026-08-30 SKY). 몸통 한 행만 복사하면 머리글 없는 표가 된다.
    const headRow = [];
    const bodyRows = new Map();
    for (const t of cells) {
      if (t.cell[0] === 'h') headRow.push(t);
      else {
        const key = String(t.cell[0]);
        if (!bodyRows.has(key)) bodyRows.set(key, []);
        bodyRows.get(key).push(t);
      }
    }
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    // 칸 속 그림도 함께 담아야 «복사 → 붙여넣기» 왕복이 된다. 글자는 esc, 그림은 <img>.
    const runsHtml = (rs) => rs.map((r) => {
      if (r && r.img) {
        const a = getDoc().assets[r.img];
        if (!a) return '';
        return '<img src="' + a.data + '" width="' + (r.w || a.w) + '" height="' + (r.h || a.h) + '">';
      }
      return esc((r && r.t) || '');
    }).join('');
    const tr = (list, tag) => {
      list.sort((x, y) => x.cell[1] - y.cell[1]);
      return '<tr>' + list.map((t) => {
        const row = t.cell[0] === 'h' ? (b.head && b.head[0]) : (b.rows && b.rows[t.cell[0]]);
        const cell = row && row[t.cell[1]];
        const runs = cell ? cell.runs : null;
        const span = (cell && cell.cs > 1 ? ' colspan="' + cell.cs + '"' : '')
                   + (cell && cell.rs > 1 ? ' rowspan="' + cell.rs + '"' : '');
        return '<' + tag + span + '>' + runsHtml(sliceRuns(runs || [], t.from, t.to))
             + '</' + tag + '>';
      }).join('') + '</tr>';
    };
    const parts = [];
    if (headRow.length) parts.push('<thead>' + tr(headRow, 'th') + '</thead>');
    if (bodyRows.size) {
      parts.push('<tbody>' + Array.from(bodyRows.values()).map(l => tr(l, 'td')).join('') + '</tbody>');
    }
    return '<table border="1">' + parts.join('') + '</table>';
  }

  // 클립보드에 담는다 — 글자(text/plain)는 늘, 표면 표 모양(text/html)도 함께.
  function putClipboard(dt, targets) {
    if (!dt) return;
    dt.setData('text/plain', targetsText(targets));
    const html = targetsTableHtml(targets);
    if (html) dt.setData('text/html', html);
  }

  // 복사(Ctrl+C) — 지우지는 않고 담기만 한다. 표면 표 모양으로도 담는다.
  // ⚠ 표가 아닌 보통 글은 브라우저 기본 복사가 더 낫다(서식까지 그대로) — 건드리지 않는다.
  pagesEl.addEventListener('copy', (e) => {
    const targets = crossTargets();
    if (targets.length < 2) return;
    if (!targetsTableHtml(targets)) return;               // 표가 아니면 브라우저에 맡긴다
    e.preventDefault();
    putClipboard(e.clipboardData, targets);
  });

  // 잘라내기(Ctrl+X) — 고른 글을 클립보드에 담고, 걸침 지우기와 «똑같은 규칙»으로 지운다.
  // ⛔ 예전에는 반쪽 지움을 막으려고 아무 일도 안 하게 막아 뒀다(2026-08-30 풀었다).
  // 한 칸 «안»의 잘라내기는 그대로 브라우저가 하고 flush 가 되읽는다.
  pagesEl.addEventListener('cut', (e) => {
    const targets = crossTargets();
    if (targets.length < 2) return;
    e.preventDefault();
    putClipboard(e.clipboardData, targets);
    if (targets.some(x => x.cell)) {
      // 표가 끼면 구조는 남기고 칸 «속»만 비운다(계획 R5·R6)
      const doc = getDoc();
      const r = deleteMixed(doc.blocks, targets);
      if (!r) return;
      setDoc(Object.assign({}, doc, { blocks: r.blocks }));
      cancelIdle();
      redraw({ caret: r.caret });
      return;
    }
    const r = deleteTargets(targets);
    if (!r) return;
    cancelIdle();
    redraw({ caret: r.caret });
  });
}

/* history.js */
// 블록 배열과 «그 편집 순간의 선택»을 함께 쌓는다. 블록은 제자리에서 안 고치므로
// 안 바뀐 블록은 여러 상태가 같은 객체를 가리킨다 — 그래서 가볍다.
// 되돌릴 때는 방금 무른 편집의 선택을 준다 — 드래그해 굵게 → Ctrl+Z 하면
// 그 드래그가 다시 칠해져 이어서 다른 서식을 입힐 수 있다(워드와 같다).
function createHistory(limit = 200) {
  const past = [];     // [{ blocks, sel }]
  const future = [];
  return {
    push(blocks, sel) {
      if (past.length && past[past.length - 1].blocks === blocks) return;
      past.push({ blocks, sel: sel || null });
      while (past.length > limit) past.shift();
      future.length = 0;
    },
    undo() {
      if (past.length < 2) return null;
      const undone = past.pop();
      future.push(undone);
      return { blocks: past[past.length - 1].blocks, sel: undone.sel };
    },
    redo() {
      if (!future.length) return null;
      const next = future.pop();
      past.push(next);
      return { blocks: next.blocks, sel: next.sel };
    },
    // 그림 청소(sweepAssets)가 «기록이 아직 가리키는 그림»을 지키는 데 쓴다(설계 §2-3)
    blocksLists() { return past.concat(future).map(x => x.blocks); },
    canUndo() { return past.length >= 2; },
    canRedo() { return future.length > 0; },
    size() { return past.length; },
  };
}

/* toolbar.js */






// 고른 구간이 통째로 그 서식이면 끄고, 아니면 켠다 (워드와 같다)
function allMarked(runs, from, to, key) {
  const part = sliceRuns(runs, from, to);
  return part.length > 0 && part.every(r => !!r[key]);
}

// alignPicked(align) → boolean : «고른 그림이 있으면 그것을 정렬하고 참을 돌려주는» 함수.
// 그림 쪽(image.js)이 만들어 주고 main.js 가 넘긴다. 없으면 지금까지와 똑같이 돈다.
function attachToolbar({ barEl, pagesEl, getDoc, setDoc, redraw, alignPicked }) {
  const buttons = Array.from(barEl.querySelectorAll('.tb[data-mark]'));
  let lastSels = null;  // [{ id, item, from, to }, …] — 도구모음을 누르면 선택이 풀리므로 기억해 둔다

  // 지금 고른 범위(여러 블록에 걸쳤으면 전부)를, 없으면 직전에 고른 범위를 쓴다
  function targetRanges() {
    const parts = targetsIn(pagesEl);
    if (parts.length) return parts;
    return lastSels;
  }

  // 서식을 입힐 토막 목록 — 문단은 블록의 runs, 목록은 그 항목(items[i])
  function runsOf(b, at) {
    if (at.cell) {
      const row = at.cell[0] === 'h' ? (b.head && b.head[0]) : (b.rows && b.rows[at.cell[0]]);
      const cell = row && row[at.cell[1]];
      return cell && !cell.cov && Array.isArray(cell.runs) ? cell.runs : null;
    }
    if (at.cap) return Array.isArray(b.caption) ? b.caption : null;
    if (at.item === null || at.item === undefined) return Array.isArray(b.runs) ? b.runs : null;
    return Array.isArray(b.items) && Array.isArray(b.items[at.item]) ? b.items[at.item] : null;
  }
  function patchOf(b, at, runs) {
    if (at.cell) {
      if (at.cell[0] === 'h') {
        const head = [b.head[0].slice()];
        head[0][at.cell[1]] = Object.assign({}, head[0][at.cell[1]], { runs });
        return { head };
      }
      const rows = b.rows.slice();
      const row = rows[at.cell[0]].slice();
      row[at.cell[1]] = Object.assign({}, row[at.cell[1]], { runs });
      rows[at.cell[0]] = row;
      return { rows };
    }
    if (at.cap) return { caption: runs };
    if (at.item === null || at.item === undefined) return { runs };
    const items = b.items.slice();
    items[at.item] = runs;
    return { items };
  }

  // 대상들(걸침 선택이면 여러 개)에 서식 계산을 한 번의 문서 갱신으로 입힌다 —
  // 되돌리기(Ctrl+Z) 한 번에 통째로 돌아오게 하기 위해서다.
  function applyAll(targets, fn) {
    const doc = getDoc();
    let blocks = doc.blocks;
    let touched = false;
    for (const t of targets) {
      if (t.to <= t.from) continue;      // 커서만 있는 자리 — 입힐 글자가 없다
      const b = blocks.find(x => x.id === t.id);
      const src = b ? runsOf(b, t) : null;
      if (!src) continue;
      blocks = replaceBlock(blocks, t.id, patchOf(b, t, fn(src, t)));
      touched = true;
    }
    if (!touched) return;
    setDoc(Object.assign({}, doc, { blocks }));
    redraw({ sel: selOf(targets) });
  }

  // 다시 그린 뒤 선택을 되살릴 좌표 — 하나면 그대로, 걸침이면 양 끝만
  function selOf(targets) {
    if (targets.length === 1) return targets[0];
    const a = targets[0];
    const b = targets[targets.length - 1];
    // ⚠ cell 을 같이 실어야 표 칸 걸침 선택이 다시 그린 뒤에도 되살아난다(draw 의 hostOf 가 본다)
    return { multi: 1, a: { id: a.id, item: a.item, cell: a.cell, pos: a.from },
             b: { id: b.id, item: b.item, cell: b.cell, pos: b.to } };
  }

  function toggle(key) {
    const targets = targetRanges();
    if (!targets || !targets.length) return;
    const doc = getDoc();
    // 고른 곳 전부가 이미 그 서식이면 끄고, 아니면 켠다 (워드와 같다)
    const on = targets.every(t => {
      const b = doc.blocks.find(x => x.id === t.id);
      const src = b ? runsOf(b, t) : null;
      return src && allMarked(src, t.from, t.to, key);
    });
    applyAll(targets, (src, t) => applyMark(src, t.from, t.to, key, on ? null : 1));
  }

  // 커서가 어디 있는지에 따라 버튼이 눌린 모양으로 보인다
  function refresh() {
    const doc = getDoc();
    const parts = targetsIn(pagesEl);
    const targets = parts.length ? parts : null;
    const el = activeBlockEl(pagesEl);
    const b = el ? doc.blocks.find(x => x.id === el.dataset.id) : null;
    const srcOf = (t) => {
      const bb = doc.blocks.find(x => x.id === t.id);
      return bb ? runsOf(bb, t) : null;
    };
    // 선택 없이 커서만 있을 때의 «지금 자리» 좌표 — 길이 0 이라 서식은 안 먹고,
    // 칸/블록 단위 기능(정렬·세로 맞춤·목록)만 이 자리에 먹는다
    let caretAt = null;
    let caretHost = null;
    if (el) {
      const capB = activeCapEl(el);
      if (capB) {
        caretHost = capB;
        caretAt = { id: el.dataset.id, item: null, cap: 1 };
      } else {
        const td = activeCellEl(el);
        const li = td ? null : activeItemEl(el);
        caretHost = td || li || el;
        caretAt = td
          ? { id: el.dataset.id, item: null,
              cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] }
          : { id: el.dataset.id, item: li ? Number(li.dataset.i) : null };
      }
    }
    for (const btn of buttons) {
      const key = btn.dataset.mark;
      let on = false;
      if (targets) {
        on = targets.every(t => {
          const src = srcOf(t);
          return src && allMarked(src, t.from, t.to, key);
        });
      } else if (b && caretAt) {
        const src = runsOf(b, caretAt);
        const r = src ? rangeIn(caretHost) : null;
        if (src && r) on = !!markAt(src, r.from)[key];
      }
      btn.classList.toggle('on', on);
      btn.disabled = !b && !targets;
    }
    // ⛔ 직전 선택을 «그대로 두면» 안 된다 — 드래그로 몇 칸을 고른 뒤 다른 칸에 커서만
    //   놓고 버튼을 누르면 아까 그 칸들이 바뀐다(2026-08-30 SKY 지적: 주 제어기판을
    //   눌렀는데 다른 칸이 위쪽 맞춤이 됨). 커서만 남았으면 «그 커서 자리»로 갈아 끼운다.
    if (targets && targets.some(t => srcOf(t))) lastSels = targets;
    else if (caretAt && caretHost) {
      const p = rangeIn(caretHost);
      const pos = p ? p.from : 0;
      lastSels = [Object.assign({}, caretAt, { from: pos, to: pos })];
    } else lastSels = null;
  }

  // 값이 있는 서식(크기·색)은 켜고 끄는 게 아니라 값을 넣거나 뺀다
  function setValue(key, value) {
    const targets = targetRanges();
    if (!targets || !targets.length) return;
    applyAll(targets, (src, t) => applyMark(src, t.from, t.to, key, value === '' ? null : value));
  }

  // 정렬은 토막이 아니라 블록 전체에 붙는다 — 걸침 선택이면 걸친 블록 전부에
  function setAlign(align) {
    // ⛔ 그림을 «골라 놓은» 상태가 먼저다. 그림 블록은 편집 불가 통짜 섬이라 그 안에 커서가
    //    없어 아래의 «커서가 있는 블록» 길에 절대 안 걸린다 — 그래서 그림을 고르고 정렬을
    //    눌러도 아무 일도 안 났다(2026-08-31 실측). 그림 서식 창의 정렬도 이 단추를 대행한다.
    if (alignPicked && alignPicked(align)) return;
    const targets = targetRanges();
    const parts = targets && targets.length ? targets : null;
    const cellTs = (parts || []).filter(t => t.cell);
    if (cellTs.length || (activeBlockEl(pagesEl) && activeCellEl(activeBlockEl(pagesEl)))) {
      // 표 칸 정렬 — 블록이 아니라 «칸»에 붙는다
      const doc0 = getDoc();
      let list = cellTs;
      if (!list.length) {
        const el = activeBlockEl(pagesEl);
        const td = activeCellEl(el);
        list = [{ id: el.dataset.id,
          cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] }];
      }
      let blocks = doc0.blocks;
      for (const t of list) {
        const b = blocks.find(x => x.id === t.id);
        if (!b || b.type !== 'table') continue;
        const row0 = t.cell[0] === 'h' ? b.head[0] : b.rows[t.cell[0]];
        const cell = Object.assign({}, row0[t.cell[1]], { align });
        blocks = replaceBlock(blocks, t.id, (() => {
          if (t.cell[0] === 'h') {
            const head = [b.head[0].slice()]; head[0][t.cell[1]] = cell; return { head };
          }
          const rows = b.rows.slice(); const row = rows[t.cell[0]].slice();
          row[t.cell[1]] = cell; rows[t.cell[0]] = row; return { rows };
        })());
      }
      setDoc(Object.assign({}, doc0, { blocks }));
      if (parts) redraw({ sel: selOf(parts) });
      else redraw({ caret: { id: list[0].id, cell: list[0].cell, pos: 0 } });
      return;
    }
    const doc = getDoc();
    let ids = [];
    if (targets && targets.length) ids = Array.from(new Set(targets.map(t => t.id)));
    else {
      const el = activeBlockEl(pagesEl);
      if (el) ids = [el.dataset.id];
    }
    if (!ids.length) return;
    let blocks = doc.blocks;
    for (const id of ids) {
      if (blocks.some(x => x.id === id)) blocks = replaceBlock(blocks, id, { align });
    }
    setDoc(Object.assign({}, doc, { blocks }));
    if (targets && targets.length) redraw({ sel: selOf(targets) });
    else redraw({ caretId: ids[0], caretEnd: true });
  }

  const sizeEl = barEl.querySelector('#tb-size');
  if (sizeEl) {
    sizeEl.addEventListener('change', () => {
      const v = sizeEl.value;
      sizeEl.value = '';
      if (v) setValue('sz', Number(v));
    });
  }

  // A− / A+ — 크기 사다리를 한 칸씩 오르내린다. 크기가 안 정해진 글은 본문 12.5 로 본다
  const SIZES = [8, 8.5, 9, 9.5, 10, 10.5, 11, 11.5, 12, 12.5, 13, 14, 15, 16, 18, 20, 22, 24, 27, 30, 36];
  function stepSize(dir) {
    const targets = targetRanges();
    if (!targets || !targets.length) return;
    const doc = getDoc();
    const at = targets[0];   // 지금 크기는 맨 앞 대상에서 읽는다
    const b = doc.blocks.find(x => x.id === at.id);
    const src = b ? runsOf(b, at) : null;
    if (!src) return;
    const part = sliceRuns(src, at.from, at.to);
    const cur = (part.find(r => r.sz) || {}).sz || 12.5;
    let i = 0;
    for (let k = 1; k < SIZES.length; k++) {
      if (Math.abs(SIZES[k] - cur) < Math.abs(SIZES[i] - cur)) i = k;
    }
    const next = SIZES[Math.max(0, Math.min(SIZES.length - 1, i + dir))];
    if (next !== cur) setValue('sz', next);
  }
  for (const btn of barEl.querySelectorAll('.tb[data-szstep]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => stepSize(Number(btn.dataset.szstep)));
  }
  for (const btn of barEl.querySelectorAll('.tb-c[data-color]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => setValue('c', btn.dataset.color));
  }
  for (const btn of barEl.querySelectorAll('.tb[data-align]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => setAlign(btn.dataset.align));
  }

  // 문단 ↔ 목록 서로 바꾸기. 글자(토막)는 그대로 가져간다
  for (const btn of barEl.querySelectorAll('.tb[data-list]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => {
      const el = activeBlockEl(pagesEl);
      const id = el ? el.dataset.id : (lastSels && lastSels.length ? lastSels[0].id : null);
      if (!id) return;
      const doc = getDoc();
      const b = doc.blocks.find(x => x.id === id);
      if (!b) return;
      const ordered = btn.dataset.list === '1' ? 1 : 0;
      const blocks = doc.blocks.slice();
      const at = blocks.findIndex(x => x.id === id);
      if (b.type === 'list') {
        // ⛔ 항목이 여러 개여도 하나도 버리지 않는다 — 항목마다 문단이 된다
        const paras = (b.items.length ? b.items : [[]]).map(item => createBlock('para', { runs: item }));
        blocks.splice(at, 1, ...paras);
        setDoc(Object.assign({}, doc, { blocks }));
        redraw({ caretId: paras[0].id, caretEnd: true });
        return;
      }
      if (!Array.isArray(b.runs)) return;   // 섹션 줄은 목록으로 바꾸지 않는다
      const next = createBlock('list', { ordered, items: [b.runs] });
      blocks[at] = next;
      setDoc(Object.assign({}, doc, { blocks }));
      redraw({ caretId: next.id, caretEnd: true });
    });
  }

  for (const btn of buttons) {
    // ⛔ mousedown 에서 막지 않으면 버튼을 누르는 순간 글에서 선택이 풀린다
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => toggle(btn.dataset.mark));
  }

  // 표 칸의 «위/가운데/아래 맞춤» (2026-08-30 SKY — 엑셀에 있던 기능).
  // 가로 정렬(setAlign)과 달리 이건 표 칸에만 있다 — 문단은 높이가 글에 딱 맞아 뜻이 없다.
  function setVAlign(va) {
    const targets = targetRanges();
    const cellTs = (targets || []).filter(t => t.cell);
    let list = cellTs;
    if (!list.length) {
      const el = activeBlockEl(pagesEl);
      const td = el && activeCellEl(el);
      if (!td) return;                                    // 표 밖에서는 아무 일도 없다
      list = [{ id: el.dataset.id,
        cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] }];
    }
    const doc = getDoc();
    let blocks = doc.blocks;
    for (const t of list) {
      const b = blocks.find(x => x.id === t.id);
      if (!b || b.type !== 'table') continue;
      const row0 = t.cell[0] === 'h' ? b.head[0] : b.rows[t.cell[0]];
      const cell = Object.assign({}, row0[t.cell[1]], { va });
      blocks = replaceBlock(blocks, t.id, (() => {
        if (t.cell[0] === 'h') {
          const head = [b.head[0].slice()]; head[0][t.cell[1]] = cell; return { head };
        }
        const rows = b.rows.slice(); const row = rows[t.cell[0]].slice();
        row[t.cell[1]] = cell; rows[t.cell[0]] = row; return { rows };
      })());
    }
    setDoc(Object.assign({}, doc, { blocks }));
    if (cellTs.length) redraw({ sel: selOf(targets) });
    else redraw({ caret: { id: list[0].id, cell: list[0].cell, pos: 0 } });
  }
  for (const btn of barEl.querySelectorAll('.tb[data-valign]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => setVAlign(btn.dataset.valign));
  }

  // ── 표 동작 — 커서가 표 안일 때만. 실제 텍스트 폭은 문서 여백에서 계산한다 ──
  function textWidth(doc) {
    const p = doc.page;
    return p.width - p.margin.left - p.margin.right;
  }
  function tableCtx() {
    const el = activeBlockEl(pagesEl);
    if (!el || !el.classList.contains('blk-table')) return null;
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === el.dataset.id);
    if (!b || b.type !== 'table') return null;
    const td = activeCellEl(el);
    const cell = td ? [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] : null;
    return { doc, b, cell };
  }
  function commitTable(doc, b, next, caret) {
    setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, b.id,
      { cols: next.cols, head: next.head, rows: next.rows }) }));
    redraw({ caret });
  }
  for (const btn of barEl.querySelectorAll('.tb[data-table]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => {
      const kind = btn.dataset.table;
      if (kind === 'insert') {
        const doc = getDoc();
        const el = activeBlockEl(pagesEl);
        const t = normalizeWidths(createBlock('table', { ncols: 3, nrows: 3 }), textWidth(doc));
        const blocks = el ? insertAfter(doc.blocks, el.dataset.id, t) : doc.blocks.concat([t]);
        setDoc(Object.assign({}, doc, { blocks }));
        redraw({ caret: { id: t.id, cell: ['h', 0], pos: 0 } });
        return;
      }
      const ctx = tableCtx();
      if (!ctx) return;
      const { doc, b, cell } = ctx;
      const r = cell && cell[0] !== 'h' ? cell[0] : 0;
      const c = cell ? cell[1] : 0;
      if (kind === 'del') {
        // 확인창 없음(D15) — Ctrl+Z 한 번에 통째로 돌아온다
        setDoc(Object.assign({}, doc, { blocks: removeBlock(doc.blocks, b.id) }));
        redraw({});
      } else if (kind === 'row+') {
        commitTable(doc, b, addRow(b, r + 1), { id: b.id, cell: [r + 1, 0], pos: 0 });
      } else if (kind === 'row-') {
        const next = delRow(b, r);
        if (next === b) return;
        commitTable(doc, b, next, { id: b.id, cell: [Math.min(r, next.rows.length - 1), 0], pos: 0 });
      } else if (kind === 'col+') {
        commitTable(doc, b, addCol(b, c + 1, textWidth(doc)), { id: b.id, cell: [r, c + 1], pos: 0 });
      } else if (kind === 'col-') {
        const next = delCol(b, c, textWidth(doc));
        if (next === b) return;
        commitTable(doc, b, next, { id: b.id, cell: [r, Math.min(c, next.cols.length - 1)], pos: 0 });
      } else if (kind === 'merge') {
        const cells = (lastSels || []).concat(targetsIn(pagesEl))
          .filter(t => t.cell && t.id === b.id && t.cell[0] !== 'h');
        if (cells.length < 2) return;                     // 몸통 칸 2개 이상을 골라야 한다(R10)
        const rs = cells.map(t => t.cell[0]);
        const cs = cells.map(t => t.cell[1]);
        const next = mergeCells(b, Math.min(...rs), Math.min(...cs), Math.max(...rs), Math.max(...cs));
        commitTable(doc, b, next, { id: b.id, cell: [Math.min(...rs), Math.min(...cs)], pos: 0 });
      } else if (kind === 'split') {
        if (!cell || cell[0] === 'h') return;
        const [ar, ac] = anchorOf(b, cell[0], cell[1]);
        commitTable(doc, b, splitCell(b, cell[0], cell[1]), { id: b.id, cell: [ar, ac], pos: 0 });
      } else if (kind === 'head') {
        // 머리글 켜고 끄기 — 글은 사라지지 않고 자리만 옮긴다(2026-08-30 SKY)
        const next = toggleHead(b);
        if (next === b) return;                          // 세로 병합이 걸린 행은 못 올린다
        const 켜졌나 = next.head && next.head.length;
        commitTable(doc, b, next,
          { id: b.id, cell: 켜졌나 ? ['h', 0] : [0, 0], pos: 0 });
      } else if (kind === 'splitx') {
        if (!cell || cell[0] === 'h') return;                    // 머리글은 나누지 않는다(R16)
        const [ar, ac] = anchorOf(b, cell[0], cell[1]);
        commitTable(doc, b, splitCellAcross(b, cell[0], cell[1], textWidth(doc)),
                    { id: b.id, cell: [ar, ac], pos: 0 });
      } else if (kind === 'splity') {
        if (!cell || cell[0] === 'h') return;
        const [ar, ac] = anchorOf(b, cell[0], cell[1]);
        commitTable(doc, b, splitCellDown(b, cell[0], cell[1]),
                    { id: b.id, cell: [ar, ac], pos: 0 });
      }
    });
  }

  document.addEventListener('selectionchange', refresh);
  pagesEl.addEventListener('keyup', refresh);

  // ⛔ e.key 로만 보면 «한글 자판»에서 Ctrl+B 가 'ㅠ' 로 와서 굵게가 안 먹는다
  //    (되돌리기와 같은 뿌리 — 2026-08-30 실측). e.code(자판과 무관한 키 자리)를 같이 본다.
  const hit = (e, ch, code) => e.key === ch || e.key === ch.toUpperCase() || e.code === code;
  document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.shiftKey) return;
    const key = hit(e, 'b', 'KeyB') ? 'b' : hit(e, 'i', 'KeyI') ? 'i' : hit(e, 'u', 'KeyU') ? 'u' : null;
    if (!key) return;
    e.preventDefault();
    toggle(key);
  });

  refresh();
}

/* image.js */
// 그림 넣기·고르기·크기 조절 (설계_그림.md §4·§5). UI 전용 — 모델 규칙은 core 에 있다.
// ⛔ 최상위 이름 주의(빌드가 한 덩어리로 합친다): MAXPX·fileToAsset·attachImages 만 쓴다.








const MAXPX = 2000;   // 붙일 때 긴 변 한도 — A4 인쇄 200dpi 상당(설계 §2-2)

// 파일 → { data(dataURL), w, h }. 긴 변이 MAXPX 를 넘으면 줄여 담는다.
// 안 넘으면 원본 바이트를 그대로 담는다(재압축으로 화질을 깎지 않는다). bmp 는 png 로.
async function fileToAsset(file) {
  const bmp = await createImageBitmap(file);
  const w0 = bmp.width;
  const h0 = bmp.height;
  const long = Math.max(w0, h0);
  if (long <= MAXPX && /^image\/(png|jpeg|gif|webp)$/.test(file.type)) {
    bmp.close();
    const data = await new Promise((res, rej) => {
      const rd = new FileReader();
      rd.onload = () => res(rd.result);
      rd.onerror = () => rej(new Error('그림 파일을 읽지 못했다'));
      rd.readAsDataURL(file);
    });
    return { data, w: w0, h: h0 };
  }
  const k = Math.min(1, MAXPX / long);
  const w = Math.max(1, Math.round(w0 * k));
  const h = Math.max(1, Math.round(h0 * k));
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  bmp.close();
  const jpeg = file.type === 'image/jpeg';
  return { data: jpeg ? cv.toDataURL('image/jpeg', 0.9) : cv.toDataURL('image/png'), w, h };
}

function attachImages({ barEl, pagesEl, getDoc, setDoc, redraw }) {
  function textWidth(doc) {
    const p = doc.page;
    return p.width - p.margin.left - p.margin.right;
  }

  // 지금 커서 문맥을 좌표로 뜬다 — 파일을 읽는 사이 선택이 바뀌어도 붙는 곳이 안 바뀐다
  function caretCtx() {
    const blk = activeBlockEl(pagesEl);
    if (!blk) return null;
    const td = activeCellEl(blk);
    const li = td ? null : activeItemEl(blk);
    const host = td || li || blk;
    const rg = rangeIn(host);
    return {
      id: blk.dataset.id,
      cell: td ? [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] : null,
      item: li ? Number(li.dataset.i) : null,
      pos: rg ? rg.from : 0,
    };
  }

  function cellRunsOf(b, cell) {
    const row = cell[0] === 'h' ? (b.head && b.head[0]) : (b.rows && b.rows[cell[0]]);
    return row && row[cell[1]] ? row[cell[1]].runs || [] : null;
  }
  function cellPatch(b, cell, runs) {
    if (cell[0] === 'h') {
      const head = [b.head[0].slice()];
      head[0][cell[1]] = Object.assign({}, head[0][cell[1]], { runs });
      return { head };
    }
    const rows = b.rows.slice();
    const row = rows[cell[0]].slice();
    row[cell[1]] = Object.assign({}, row[cell[1]], { runs });
    rows[cell[0]] = row;
    return { rows };
  }

  // 자산 하나를 문맥에 맞게 넣는다. at 을 다음 그림이 이어 붙도록 고쳐 준다.
  // ⭐ 「알아서」 규칙 — 워드처럼 (2026-08-31 SKY 2차 지시):
  //    · 표 칸 안 → 칸 안 그림 (칸 폭에 맞춘다 — 부품 사진)
  //    · 그 밖    → 한 줄짜리 그림 블록 (+ 설명 자리)
  // ⛔ «글자 사이면 글자 높이로 줄인다» 규칙은 폐기했다(2026-08-31 SKY:
  //    "작은 심볼 같은건 기호나 특수문자 같은걸로 나중에 대체 … 일반 적인 워드 처럼 할 꺼야").
  //    문단 어디에 커서가 있든 제대로 된 크기로 들어가고, 작게 쓰려면 손잡이로 줄인다.
  // dispW = 표시 폭 힌트(px). 붙여넣기가 «잘라낸 그 크기»를 지키는 데 쓴다.
  // 없으면 원본 폭에서 시작한다.
  function insertOne(a, at, dispW) {
    const doc = getDoc();
    const got = addAsset(doc.assets, a.data, a.w, a.h);
    const b = at ? doc.blocks.find(x => x.id === at.id) : null;
    const asInline = !!(at && at.cell);
    if (asInline && b) {
      const src = at.cell ? cellRunsOf(b, at.cell)
        : (at.item !== null && at.item !== undefined ? b.items[at.item] : b.runs);
      if (!Array.isArray(src)) return;
      // 표 칸 — 칸 안폭에 맞춘다(부품 사진 용도, 설계 §4-2). 패딩 몫 18px.
      const cw = (b.cols[at.cell[1]] ? b.cols[at.cell[1]].w : 200) - 18;
      const w = Math.max(24, Math.min(dispW || a.w, cw));
      const h = Math.max(1, Math.round(w * a.h / Math.max(1, a.w)));
      const runs = insertRun(src, at.pos, imgRun(got.id, w, h));
      const patch = at.cell ? cellPatch(b, at.cell, runs)
        : (at.item !== null && at.item !== undefined
          ? (() => { const items = b.items.slice(); items[at.item] = runs; return { items }; })()
          : { runs });
      setDoc(Object.assign({}, doc, { assets: got.assets,
        blocks: replaceBlock(doc.blocks, b.id, patch) }));
      redraw({ caret: { id: b.id, item: at.item, cell: at.cell, pos: at.pos + 1 } });
      at.pos += 1;
      return;
    }
    // 독립 블록 — 빈 문단이면 그 자리를 차지, 아니면 바로 다음(설계 §5)
    const w = Math.min(dispW || a.w, textWidth(doc));
    const fresh = createBlock('image', { src: got.id, w });
    let blocks;
    if (b && b.type === 'para' && !runsLength(b.runs || [])) {
      blocks = doc.blocks.slice();
      blocks[blocks.findIndex(x => x.id === b.id)] = fresh;
    } else if (b) {
      blocks = insertAfter(doc.blocks, b.id, fresh);
    } else {
      blocks = doc.blocks.concat([fresh]);
    }
    setDoc(Object.assign({}, doc, { assets: got.assets, blocks }));
    redraw({});
    if (at) { at.id = fresh.id; at.cell = null; at.item = null; at.pos = 0; }
    // 붙인 그림을 고른 상태로 둔다 — 손잡이가 바로 보이고 빈 캡션이 펴진다
    const el = pagesEl.querySelector('.blk-image[data-id="' + fresh.id + '"] img.bimg');
    if (el) selectImg(el);
  }

  async function insertFiles(files) {
    const list = Array.from(files || []).filter(f => /^image\//.test(f.type || ''));
    if (!list.length) return;
    const at = caretCtx();
    for (const f of list) {
      let a;
      try { a = await fileToAsset(f); }
      catch (e) { console.warn('그림을 못 읽었다:', f.name, e.message); continue; }
      insertOne(a, at);
    }
  }

  // ── 도구모음 버튼 → 숨은 파일 입력 ──
  const fileEl = document.getElementById('imgfile');
  for (const btn of barEl.querySelectorAll('.tb[data-image]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());   // 선택이 안 풀리게
    btn.addEventListener('click', () => fileEl.click());
  }
  fileEl.addEventListener('change', () => {
    insertFiles(fileEl.files);
    fileEl.value = '';
  });

  // data: 주소를 파일처럼 만들어 넣는 길로 보낸다 — 크기 재기·줄여 담기·중복 제거를
  // 파일 붙이기와 «같은 경로»로 태우기 위해서다.
  async function insertDataUrls(items) {
    const at = caretCtx();
    for (const it of items) {
      try {
        const blob = await fetch(it.url).then(r => r.blob());
        const a = await fileToAsset(new File([blob], 'paste', { type: blob.type || 'image/png' }));
        insertOne(a, at, it.w);
      } catch (err) { console.warn('붙여넣은 그림을 못 읽었다:', err.message); }
    }
  }

  // 붙여넣은 HTML 을 토막으로 바꾼다. 블록이 여럿이면 사이에 줄바꿈을 넣는다 —
  // 안 넣으면 두 문단이 소리 없이 한 줄로 붙는다.
  function runsFromHtml(html) {
    const d0 = new DOMParser().parseFromString(html, 'text/html');
    const BLOCKY = /^(DIV|P|LI|TR|H1|H2|H3|H4|H5|H6|SECTION|ARTICLE|BLOCKQUOTE)$/;
    const kids = Array.from(d0.body.childNodes)
      .filter(n => n.nodeType === 1 && BLOCKY.test(n.tagName));
    if (kids.length > 1) {
      const out = [];
      kids.forEach((n, i) => {
        if (i) out.push({ t: '\n' });
        for (const r of domToRuns(n)) out.push(r);
      });
      return out;
    }
    return domToRuns(d0.body);
  }

  // 토막들을 커서 자리에 넣는다. 줄바꿈이 있으면 줄마다 문단이 된다
  // (표 칸 안에서는 칸 안 줄바꿈이 정상이라 그대로 둔다 — 편집기의 여러 줄 붙여넣기와 같은 규칙).
  function insertRunsAt(list, at) {
    const doc = getDoc();
    const b = at ? doc.blocks.find(x => x.id === at.id) : null;
    if (!b) return false;
    const got = adoptImages(list, doc.assets);
    const runs = got.runs.filter(r => r && r.t);
    if (!runs.length) return false;
    const inItem = at.item !== null && at.item !== undefined;
    const src = at.cell ? cellRunsOf(b, at.cell) : (inItem ? b.items[at.item] : b.runs);
    if (!Array.isArray(src)) return false;
    const len = runsLength(src);
    const pos = Math.max(0, Math.min(at.pos, len));
    const head = sliceRuns(src, 0, pos);
    const tail = sliceRuns(src, pos, len);
    const assets = got.assets;

    const lines = [[]];
    for (const r of runs) {
      if (r.img || r.t.indexOf('\n') < 0) { lines[lines.length - 1].push(r); continue; }
      const parts = r.t.split('\n');
      parts.forEach((t, i) => {
        if (i) lines.push([]);
        if (t) lines[lines.length - 1].push(Object.assign({}, r, { t }));
      });
    }

    const itemPatch = (rs) => { const items = b.items.slice(); items[at.item] = rs; return { items }; };
    if (at.cell || lines.length === 1) {
      const merged = normalizeRuns(head.concat(runs, tail));
      const patch = at.cell ? cellPatch(b, at.cell, merged) : (inItem ? itemPatch(merged) : { runs: merged });
      setDoc(Object.assign({}, doc, { assets, blocks: replaceBlock(doc.blocks, b.id, patch) }));
      redraw({ caret: { id: b.id, item: at.item, cell: at.cell, pos: pos + runsLength(runs) } });
      return true;
    }
    // 여러 줄 — 첫 줄은 이 문단에, 나머지는 새 문단으로(편집기의 여러 줄 붙여넣기와 같다)
    const first = normalizeRuns(head.concat(lines[0]));
    const rest = lines.slice(1);
    const fresh = rest.map((ln, i) => createBlock('para', {
      runs: normalizeRuns(i === rest.length - 1 ? ln.concat(tail) : ln) }));
    let blocks = replaceBlock(doc.blocks, b.id, inItem ? itemPatch(first) : { runs: first });
    const idx = blocks.findIndex(x => x.id === b.id);
    blocks = blocks.slice(0, idx + 1).concat(fresh, blocks.slice(idx + 1));
    setDoc(Object.assign({}, doc, { assets, blocks }));
    redraw({ caret: { id: fresh[fresh.length - 1].id, item: null,
                      pos: runsLength(lines[lines.length - 1]) } });
    return true;
  }

  // ── 붙여넣기 ──
  // ⛔ 그림 붙여넣기를 브라우저 기본에 맡기면 그림이 조용히 사라진다.
  //    크롬은 붙여넣은 <img> 를 «어느 블록에도 속하지 않는 자리»(.page-body 바로 아래)에
  //    넣는다(2026-08-31 실측). 우리 코드는 «그 문단»을 되읽으므로 그림을 못 보고,
  //    다음 다시 그리기가 그 <img> 를 통째로 쓸어 버린다 —
  //    잘라내기 뒤 붙여넣기가 «아무 일도 안 일어남»으로 보이던 진짜 원인이다.
  //    그래서 그림이 든 클립보드는 우리가 직접 받는다.
  // 붙여넣을 내용을 «우리가» 넣는다 — 이벤트 없이도 부를 수 있게 몸을 함수로 뽑았다
  // (우클릭 메뉴의 「붙여넣기」가 이것을 쓴다. 합성 paste 이벤트는 만들지 않는다 —
  //  브라우저 기본 글 넣기가 합성 이벤트로는 안 일어난다).
  // 돌려주는 값 = «우리가 처리했다». false 면 부른 쪽이 브라우저 기본에 맡긴다.
  // ⚠ textOnly:true 로 부르면 «글만»도 우리가 넣는다 — 메뉴에는 맡길 기본 동작이 없어서다.
  function pasteData({ html, text, files, textOnly } = {}) {
    const h = html || '';
    if (h.indexOf('<table') >= 0) return false;        // 표 붙여넣기는 편집기가 맡는다
    const fs = (files || []).filter(f => /^image\//.test((f && f.type) || ''));
    if (fs.length) { insertFiles(fs); return true; }
    const t = (text || '').trim();
    // ⛔ 글과 그림이 «섞인» 붙여넣기도 우리가 받아야 한다. 브라우저에 맡기면 크롬이
    //    그림과 «그 뒤의 모든 것»을 문단 밖으로 밀어내고 커서까지 밖에 놓는다 —
    //    우리 코드는 «커서가 있는 문단»을 읽으므로 읽을 문단을 못 찾고, 다음 다시 그리기가
    //    밖에 나와 있던 것을 통째로 쓸어 버린다. 글까지 함께 사라진다(2026-08-31 실측).
    if (t && h.indexOf('data:image') >= 0) {
      const list = runsFromHtml(h);
      if (list.some(r => r && (r.img || r.src$))) { insertRunsAt(list, caretCtx()); return true; }
    }
    if (t) {
      if (!textOnly) return false;                     // 글만이면 브라우저 기본이 더 낫다
      const list = h ? runsFromHtml(h) : [];
      return insertRunsAt(list.length ? list : [{ t: text }], caretCtx());
    }
    // 태그를 통째로 집어 src 와 width 를 함께 읽는다 — 속성 차례는 앱마다 다르다
    const items = [];
    const re = /<img\b[^>]*>/gi;
    let m = re.exec(h);
    while (m) {
      const tag = m[0];
      const src = /src=["'](data:image\/[^"']+)["']/i.exec(tag);
      if (src) {
        const wm = /width=["']?(\d+)/i.exec(tag);
        items.push({ url: src[1], w: wm ? Number(wm[1]) : 0 });
      }
      m = re.exec(h);
    }
    if (!items.length) return false;
    insertDataUrls(items);
    return true;
  }

  pagesEl.addEventListener('paste', (e) => {
    const dt = e.clipboardData;
    if (!dt) return;
    const handled = pasteData({ html: dt.getData('text/html') || '',
                                text: dt.getData('text/plain') || '',
                                files: dt.files ? Array.from(dt.files) : [] });
    if (handled) e.preventDefault();
  });

  // ── 끌어다 놓기 ──
  // ⛔ 문서 «안»에서 끈 그림과 바깥에서 끌어온 파일을 반드시 구분한다.
  //    크롬은 문서 안에서 끈 그림도 dataTransfer.files 에 «파일»로 넣어 준다
  //    (2026-08-31 실측: drop(files=1)). 구분을 안 하면 그림을 옮기려 끌었을 뿐인데
  //    «새 파일을 가져온 것»으로 보고 원본 크기 복제본이 하나 더 생긴다.
  let moving = null;   // 문서 안에서 끌고 있는 그림 { at, w, h, img }

  // 놓은 자리를 찾는다 — 표 칸이 먼저다.
  // ⚠ elementFromPoint(단수)는 겹쳐 놓은 것(열 손잡이 등)에 걸려 엉뚱한 것을 준다.
  //   복수로 훑는다(2B 에서 겪은 함정과 같다).
  function dropSpot(x, y) {
    for (const el of document.elementsFromPoint(x, y)) {
      if (!el || !el.closest) continue;
      const td = el.closest('#pages td[data-r]');
      if (td) return { td, blk: td.closest('.blk[data-id]') };
      const blk = el.closest('#pages .blk[data-id]');
      if (blk) return { td: null, blk };
    }
    return null;
  }

  // 끌어 온 그림을 놓은 자리로 «옮긴다». 지우기와 넣기를 한 번의 문서 갱신으로 해야
  // Ctrl+Z 한 번에 통째로 되돌아온다.
  function moveTo(mv, x, y) {
    const spot = dropSpot(x, y);
    if (!spot || !spot.blk) return;
    const doc = getDoc();
    const a = doc.assets[mv.img];
    if (!a) return;
    const at = mv.at;
    const 같은자리 = spot.blk.dataset.id === at.b.id
      && (!spot.td) === (!at.cell)
      && (!spot.td || (String(at.cell && at.cell[0]) === spot.td.dataset.r
                       && String(at.cell && at.cell[1]) === spot.td.dataset.c));
    if (같은자리) return;                       // 제자리에 놓았다 — 아무 일도 안 한다

    // ① 원래 자리에서 뺀다
    let blocks;
    if (at.kind === 'block') {
      if (doc.blocks.length <= 1) return;      // 옮길 데가 없다
      blocks = removeBlock(doc.blocks, at.b.id);
    } else {
      const src = runsAtTarget(at);
      if (!Array.isArray(src)) return;
      const runs = normalizeRuns(
        sliceRuns(src, 0, at.pos).concat(sliceRuns(src, at.pos + 1, runsLength(src))));
      blocks = replaceBlock(doc.blocks, at.b.id, patchAtTarget(at, runs));
    }

    // ② 놓은 자리에 넣는다
    const destId = spot.blk.dataset.id;
    const dest = blocks.find(x => x.id === destId);
    if (!dest) return;                          // 옮기다 그 블록이 없어졌다(제자리 이동)
    let caret = null;
    if (spot.td) {
      // 표 칸으로 — 칸 안폭에 맞춰 칸 글 끝에 붙인다
      if (dest.type !== 'table') return;
      const cell = [spot.td.dataset.r === 'h' ? 'h' : Number(spot.td.dataset.r),
                    Number(spot.td.dataset.c)];
      const cur = cellRunsOf(dest, cell);
      if (!Array.isArray(cur)) return;
      const cw = (dest.cols[cell[1]] ? dest.cols[cell[1]].w : 200) - 18;
      const w = Math.max(24, Math.min(mv.w || a.w, cw));
      const h = Math.max(1, Math.round(w * a.h / Math.max(1, a.w)));
      const runs = insertRun(cur, runsLength(cur), imgRun(mv.img, w, h));
      blocks = replaceBlock(blocks, destId, cellPatch(dest, cell, runs));
      caret = { id: destId, cell, pos: runsLength(cur) + 1 };
    } else {
      // 보통 블록 다음에 — 한 줄짜리 그림으로. 끌기 전 크기를 그대로 지킨다.
      const w = Math.min(mv.w || a.w, textWidth(doc));
      const fresh = createBlock('image', { src: mv.img, w });
      blocks = insertAfter(blocks, destId, fresh);
      caret = null;
      mv.freshId = fresh.id;
    }
    setDoc(Object.assign({}, doc, { blocks }));
    redraw(caret ? { caret } : {});
    if (mv.freshId) {
      const el = pagesEl.querySelector('.blk-image[data-id="' + mv.freshId + '"] img.bimg');
      if (el) selectImg(el);
    }
  }

  pagesEl.addEventListener('dragstart', (e) => {
    moving = null;
    const t = e.target;
    if (!(t && t.matches && t.matches('img.ri, img.bimg'))) return;
    const at = targetOf(t);
    if (!at) return;
    moving = { at, w: dispWOf(t), h: dispHOf(t), img: t.dataset.img };
    if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
  }, true);
  document.addEventListener('dragend', () => { moving = null; hideMark(); }, true);

  // 놓일 자리를 미리 보여 준다 (2026-08-31 SKY: "어느 문단 사이로 가는지 미리보기로")
  const mark = document.createElement('div');
  mark.id = 'imgdrop';
  mark.setAttribute('contenteditable', 'false');
  function hideMark() { if (mark.parentNode) mark.parentNode.removeChild(mark); }
  function showMark(x, y) {
    const spot = dropSpot(x, y);
    if (!spot || !spot.blk) { hideMark(); return; }
    const pr = pagesEl.getBoundingClientRect();
    const k = pr.width / pagesEl.offsetWidth;      // 태블릿에서 화면이 축소돼 있어도 맞게
    const r = (spot.td || spot.blk).getBoundingClientRect();
    if (spot.td) {                                  // 표 칸 — 그 칸을 테두리로 감싼다
      mark.className = 'cell';
      mark.style.left = ((r.left - pr.left) / k) + 'px';
      mark.style.top = ((r.top - pr.top) / k) + 'px';
      mark.style.width = (r.width / k) + 'px';
      mark.style.height = (r.height / k) + 'px';
