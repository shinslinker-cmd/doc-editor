    if (cell.vals) {
      let hit = false;
      const vals = {};
      for (const k of Object.keys(cell.vals)) {
        const v = 벗기기(cell.vals[k]);
        if (v !== cell.vals[k]) hit = true;
        vals[k] = v;
      }
      if (hit) next = Object.assign({}, next, { vals });
    }
    if (next === cell) { if (onSaved) onSaved('이 칸에는 걸린 부품 값이 없습니다'); return; }
    const nb = setCellAt(b, t.cell, next);
    setDoc(Object.assign({}, doc, {
      blocks: replaceBlock(doc.blocks, t.id, { head: nb.head, rows: nb.rows }),
    }));
    redraw();
    if (onSaved) onSaved('부품 값을 뗐습니다 — 글자는 그대로 두었습니다');
  }

  function open() {
    close();
    const t = 칸찾기();
    if (!t) { window.alert('표 칸에서 쓰는 창입니다 — 값을 넣을 칸을 먼저 누르세요'); return; }
    const list = getList() || { parts: [] };
    if (!list.parts.length) {
      window.alert('「안전관리 부품 목록」이 비어 있습니다.\n사이드바에서 부품을 먼저 적어 주세요.');
      return;
    }

    el = document.createElement('div');
    el.id = 'prefpick';
    el.setAttribute('contenteditable', 'false');

    const ttl = document.createElement('div');
    ttl.className = 'pp-ttl';
    ttl.append(document.createTextNode('부품 값 넣기'));
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'pp-x';
    x.title = '닫기';
    x.textContent = '✕';
    x.addEventListener('click', close);
    ttl.appendChild(x);
    el.appendChild(ttl);

    const note = document.createElement('div');
    note.className = 'pp-note';
    note.textContent = '고른 값이 이 칸에 들어가고, 앞으로 목록에서 그 값을 고치면 이 칸도 함께 바뀝니다.';
    el.appendChild(note);

    const body = document.createElement('div');
    body.className = 'pp-body';
    for (const p of list.parts) {
      const row = document.createElement('div');
      row.className = 'pp-row';
      const nm = document.createElement('div');
      nm.className = 'pp-nm';
      nm.textContent = p.name || '(이름 없음)';
      row.appendChild(nm);
      const btns = document.createElement('div');
      btns.className = 'pp-btns';
      for (const [key, label] of PART_FIELDS) {
        const b = document.createElement('button');
        b.type = 'button';
        const v = p[key] || '';
        b.textContent = label;
        // ⚠ 값이 비면 «넣을 것이 없다» — 눌러도 빈칸이 되므로 미리 막는다
        b.disabled = !v;
        b.title = v ? label + ' = 「' + v + '」 을 이 칸에 넣는다' : label + ' 값이 비어 있습니다';
        b.addEventListener('click', () => { 걸기(t, p, key); close(); });
        btns.appendChild(b);
      }
      row.appendChild(btns);
      body.appendChild(row);
    }
    el.appendChild(body);

    const foot = document.createElement('div');
    foot.className = 'pp-foot';
    const off = document.createElement('button');
    off.type = 'button';
    off.className = 'pp-off';
    off.textContent = '이 칸의 부품 값 떼기';
    off.title = '글자는 그대로 두고 «목록이 관리하는 값»에서만 뗀다';
    off.addEventListener('click', () => { 떼기(t); close(); });
    const ok = document.createElement('button');
    ok.type = 'button';
    ok.textContent = '닫기';
    ok.addEventListener('click', close);
    foot.append(off, ok);
    el.appendChild(foot);

    document.body.appendChild(el);
    방금열림();
  }

  // ⛔ 리본 단추를 누르는 «순간» 글에서 선택이 풀리면 대상 칸을 잃는다 — 다른 리본 단추와
  //    똑같이 mousedown 을 막아 선택을 붙들어 둔다. 이걸 빼면 «칸을 먼저 누르세요»만 뜬다.
  if (barEl) barEl.addEventListener('mousedown', (e) => {
    if (e.target.closest && e.target.closest('[data-parts]')) e.preventDefault();
  });
  if (barEl) barEl.addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('[data-parts]');
    if (!btn) return;
    if (btn.dataset.parts === 'cellref') open();
  });

  // ⛔ 창을 여는 그 클릭이 열고 나서도 계속 퍼져 나가 아래 «바깥 클릭»까지 온다 —
  //    그러면 열리자마자 닫혀 아무 일도 안 일어난 것처럼 보인다(판 창에서 겪은 그 함정).
  let 방금 = false;
  const 방금열림 = () => { 방금 = true; setTimeout(() => { 방금 = false; }, 0); };

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  document.addEventListener('click', (e) => {
    if (방금 || !el) return;
    const t = e.target;
    if (t && t.closest && t.closest('#prefpick, [data-parts]')) return;
    close();
  });

  return { open, close, isOpen: () => !!el, rect: () => (el ? [el.getBoundingClientRect()] : []) };
}

/* newline.js */
// 블록 «사이»에 새 줄(문단)을 넣는다 (2026-09-02 SKY).
//
// SKY 3: "01 인쇄회로기판 표 아래, … 문구 같은 걸 추가 하고 싶은데, 현재는 추가 할수가
//         없어 커서가 그 사이에 가질 않아."
// SKY 4: "저 03 인버터 부분이 다음 페이지로 넘어 갔으면 좋겠어서, 내가 수동으로 엔터로
//         줄바꿈해서 넘기고 싶은데 커서가 가질 않아."
//
// ⛔ 왜 안 됐나: 표·절 제목·그림은 «편집 못 하는 블록»이다. 문단이면 끝에서 Enter 를 치면
//    새 문단이 생기는데[실측], 표 다음에 바로 절 제목이 오면 그 사이에 커서를 둘 자리가
//    아예 없다. 블록과 블록 사이는 9px 뿐이고 거기를 눌러도 커서는 이웃 블록으로 간다.
//
// ⭐ 그래서 «커서를 두는» 길이 아니라 «넣으라고 시키는» 길을 만든다:
//    ⓐ 우클릭 메뉴 「⬆ 위에 새 줄」 · 「⬇ 아래에 새 줄」 — 모든 블록에서 쓸 수 있다
//    ⓑ 표 안에서 Ctrl+Enter — 표 바로 아래에 새 줄(워드와 같은 손버릇)
//
// ⚠ 새 줄은 «그 블록이 보이는 판»을 그대로 물려받는다 — 4000 에만 보이는 표 아래에 넣은
//   줄이 모든 판에 나오면 다른 판 서류가 틀어진다.
// ⛔ 최상위 이름은 attachNewline 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합친다.





function attachNewline({ pagesEl, barEl, getDoc, setDoc, redraw, onDone }) {
  // 지금 커서가 있는 블록 — 없으면 null
  function 대상() {
    const el = activeBlockEl(pagesEl);
    return el ? el.dataset.id : null;
  }

  function 넣기(어디) {
    const id = 대상();
    if (!id) {
      window.alert('새 줄을 넣을 자리를 먼저 누르세요 — 표·글·그림 아무 곳이나 누르면 됩니다.');
      return;
    }
    const doc = getDoc();
    const i = doc.blocks.findIndex(b => b.id === id);
    if (i < 0) return;
    const 기준 = doc.blocks[i];
    const 새 = createBlock('para');
    // ⚠ 보일 판을 물려받는다 — 안 물려받으면 4000 에만 있는 표 아래의 새 줄이
    //   다섯 판 모두에 나와 다른 판 서류가 틀어진다.
    if (기준.variants) 새.variants = 기준.variants.slice();
    const 앞id = 어디 === 'before'
      ? (i > 0 ? doc.blocks[i - 1].id : null)
      : id;
    let blocks;
    if (앞id === null) {
      blocks = [새].concat(doc.blocks);          // 맨 앞에 넣는다
    } else {
      blocks = insertAfter(doc.blocks, 앞id, 새);
    }
    setDoc(Object.assign({}, doc, { blocks }));
    redraw({ caretId: 새.id });
    if (onDone) {
      onDone(어디 === 'before' ? '위에 새 줄을 넣었습니다' : '아래에 새 줄을 넣었습니다');
    }
  }

  // ── 리본의 숨은 단추(우클릭 메뉴가 대신 누른다) ──────────────
  // ⛔ 누르는 «순간» 선택이 풀리면 대상 블록을 잃는다 — 다른 리본 단추와 똑같이 막는다.
  if (barEl) barEl.addEventListener('mousedown', (e) => {
    if (e.target.closest && e.target.closest('[data-newline]')) e.preventDefault();
  });
  if (barEl) barEl.addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('[data-newline]');
    if (!btn) return;
    넣기(btn.dataset.newline);
  });

  // ── 표 안에서 Ctrl+Enter → 표 바로 «아래»에 새 줄 ────────────
  // ⚠ 표 안의 그냥 Enter 는 종전대로 둔다(칸 안 줄바꿈·아래 칸 이동) — 손버릇을 안 바꾼다.
  // ⛔ e.key 로만 보면 한글 자판에서 놓칠 수 있어 e.code 도 함께 본다.
  pagesEl.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key !== 'Enter' && e.code !== 'Enter' && e.code !== 'NumpadEnter') return;
    const el = activeBlockEl(pagesEl);
    if (!el) return;
    e.preventDefault();
    넣기('after');
  }, true);

  return { 넣기 };
}

/* imgfmt.js */
// 그림 서식의 «계산 한 곳»(설계_서식과우클릭.md M3). DOM 을 모른다.
// 단위 규칙(S1): 저장·모델은 px, 입력·표시만 mm. 변환은 이 파일만 안다.
// ⛔ 최상위 이름 주의: 빌드가 모듈을 한 덩어리로 합친다 — 여기 이름은 이 파일만 쓴다.
const PX_PER_MM = 96 / 25.4;

function mmOf(px) { return Math.round((px / PX_PER_MM) * 10) / 10; }
function pxOf(mm) { return Math.max(1, Math.round(mm * PX_PER_MM)); }

// 표시 비율의 근원 — crop 이 있으면 crop, 없으면 저장 원본(M2·M3)
function ratioOf(obj, asset) {
  const c = obj && obj.crop;
  const w = c ? c.w : (asset ? asset.w : 1);
  const h = c ? c.h : (asset ? asset.h : 1);
  return h / Math.max(1, w);
}

function dispHeight(w, obj, asset) {
  return Math.max(1, Math.round(w * ratioOf(obj, asset)));
}

// 감싸개(.iclip) 안에 «원본 전체»를 넣고 자르기 창만 보이게 미는 배치.
// 표시폭 w 기준 배율 k = w / crop.w — 원본 img 크기와 음수 마진을 돌려준다.
function clipLayout(w, obj, asset) {
  const c = obj.crop;
  const k = w / Math.max(1, c.w);
  return {
    iw: Math.max(1, Math.round(asset.w * k)),
    ih: Math.max(1, Math.round(asset.h * k)),
    ml: -Math.round(c.x * k),
    mt: -Math.round(c.y * k),
  };
}

// 자르기 창을 원본 안으로 바로잡는다. 최소 8px — 0 이 되면 나누기가 깨진다.
function clampCrop(crop, asset) {
  const w = Math.max(8, Math.min(Math.round(crop.w), asset.w));
  const h = Math.max(8, Math.min(Math.round(crop.h), asset.h));
  const x = Math.max(0, Math.min(Math.round(crop.x), asset.w - w));
  const y = Math.max(0, Math.min(Math.round(crop.y), asset.h - h));
  return { x, y, w, h };
}

/* runs-dom.js */



// ⛔ 여기 적힌 태그·속성만 인정한다. 나머지는 껍데기를 버리고 글자만 가져온다.
//    웹에서 복사해 붙여넣은 이상한 서식이 문서에 들어오지 못하게 하는 문이다.
const WRAP = [['s', 'S'], ['u', 'U'], ['i', 'I'], ['b', 'B']];

// 그리기 전에 문서의 그림 보관함을 등록한다 — renderPages 와 editor 의 되그리기가 부른다.
// (인자로 다 나르면 호출부 6곳의 서명이 늘어난다 — UI 층 한정의 등록 방식을 쓴다)
let ASSETS = {};
function useAssets(a) { ASSETS = a || {}; }
function assetOf(id) { return ASSETS[id] || null; }

// 부품 꼬리표(기둥 3)의 «지금 상태» — 어느 참조가 깨졌는지와 무엇을 가리키는지.
// ⚠ 그림 보관함(ASSETS)과 같은 방식으로 등록한다 — 그리는 함수 6곳의 서명을 늘리지 않는다.
// ⛔ 이 값이 비어 있어도 글자는 그대로 그려진다. 부품 목록을 못 읽는 것이 서류를
//    못 보는 이유가 되면 안 된다.
let BROKEN = {};
let LABEL = {};
function useParts(broken, label) { BROKEN = broken || {}; LABEL = label || {}; }

// 그림 하나를 DOM 으로 — crop·rad 대응(설계_서식과우클릭.md §4-3).
// cls = 'ri'(토막) 또는 'bimg'(블록). obj = { w, crop?, rad? } (w = 표시 폭 px).
// ⭐ 크기를 박아 두어야 높이 재기가 그림 로딩을 안 기다린다(설계 §4-1) — 감싸개가 생겨도
//   감싸개에 폭·높이를 박으므로 그 원칙이 유지된다.
// ⚠ 되읽기(domToRuns)용 «진실»은 data-* 에 적는다: crop 이 있으면 img 의 width 속성은
//   «원본을 배율로 키운 크기»라서 표시 폭이 아니다. 그걸로 되읽으면 그림이 폭발한다.
function imgNode(assetId, a, obj, cls) {
  const w = obj.w || a.w;
  const h = dispHeight(w, obj, a);
  const img = document.createElement('img');
  img.className = cls;
  img.src = a.data;
  if (assetId) img.dataset.img = assetId;
  img.dataset.dw = String(w);
  img.dataset.dh = String(h);
  if (obj.rad) img.dataset.rad = String(obj.rad);
  if (!obj.crop) {
    img.width = w;
    img.height = h;
    if (obj.rad) img.style.borderRadius = obj.rad + 'px';
    return img;
  }
  img.dataset.crop = [obj.crop.x, obj.crop.y, obj.crop.w, obj.crop.h].join(',');
  const c = clipLayout(w, obj, a);
  img.width = c.iw;
  img.height = c.ih;
  img.style.marginLeft = c.ml + 'px';
  img.style.marginTop = c.mt + 'px';
  img.style.display = 'block';
  const box = document.createElement('span');
  box.className = 'iclip';
  box.setAttribute('contenteditable', 'false');
  box.style.width = w + 'px';
  box.style.height = h + 'px';
  if (obj.rad) box.style.borderRadius = obj.rad + 'px';
  box.appendChild(img);
  return box;
}

function runsToNodes(runs) {
  const out = [];
  for (const r of runs || []) {
    if (!r || !r.t) continue;
    if (r.img) {
      const a = ASSETS[r.img];
      if (!a) continue;                        // 미아는 안 그린다(읽기 복구가 이미 막지만 방어)
      out.push(imgNode(r.img, a, r, 'ri'));
      continue;
    }
    let node = document.createTextNode(r.t);
    for (const pair of WRAP) {
      if (r[pair[0]]) { const e = document.createElement(pair[1]); e.appendChild(node); node = e; }
    }
    if (r.sz || r.c || r.mono) {
      const sp = document.createElement('span');
      if (r.sz) sp.style.fontSize = r.sz + 'px';
      if (r.c) sp.style.color = r.c;
      if (r.mono) sp.className = 'mono';
      sp.appendChild(node);
      node = sp;
    }
    // 부품 목록에서 온 값(기둥 3) — 옅은 점선 밑줄. 화면에서만 보이고 인쇄에는 안 나온다.
    // ⛔ 꼬리표(ref)를 «DOM 에도» 적어야 한다. 글을 고칠 때 화면을 되읽어 토막을 다시
    //    만들기 때문에(domToRuns), 여기 없으면 그 칸에 글자 하나만 쳐도 꼬리표가
    //    통째로 사라진다 — 그런데 아무 오류도 안 난다.
    // ⚠ 글자 마디(텍스트 노드)를 더하지 않는다 — 감싸개만 늘어난다(P9: 커서 셈이 안 어긋난다).
    if (r.ref) {
      const rf = document.createElement('span');
      rf.className = BROKEN[r.ref] ? 'pref pref-x' : 'pref';
      rf.dataset.ref = r.ref;
      rf.title = LABEL[r.ref] || ('부품 값 · ' + r.ref);
      rf.appendChild(node);
      node = rf;
    }
    out.push(node);
  }
  return out;
}

function rgbToHex(v) {
  const m = /^rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(v || '');
  if (!m) return v || null;
  const h = (n) => Number(n).toString(16).padStart(2, '0');
  return '#' + h(m[1]) + h(m[2]) + h(m[3]);
}

function walk(node, mark, out) {
  for (const child of node.childNodes) {
    if (child.nodeType === 3) {
      if (child.nodeValue) out.push(Object.assign({ t: child.nodeValue }, mark));
      continue;
    }
    if (child.nodeType !== 1) continue;          // 주석 따위는 버린다
    const tag = child.tagName;
    if (tag === 'IMG') {
      // 살아 있는 DOM 의 우리 그림은 data-img 를 갖고 있다. 밖에서 붙여 들어온 그림은
      // src$ 로 임시 표기해 두면 flush 의 adoptImages 가 보관함에 담는다.
      // ⛔ 크기는 data-dw/dh 가 먼저다 — 자른 그림은 width 속성이 «원본 확대 크기»라
      //    그걸로 되읽으면 표시 폭이 배율만큼 뻥튀기된다(설계_서식과우클릭.md §4-3).
      const ds = child.dataset || {};
      const run = { t: OBJ,
                    w: Number(ds.dw) || Number(child.getAttribute('width')) || 0,
                    h: Number(ds.dh) || Number(child.getAttribute('height')) || 0 };
      if (ds.crop) {
        const p = ds.crop.split(',').map(Number);
        if (p.length === 4 && p.every(n => Number.isFinite(n))) {
          run.crop = { x: p[0], y: p[1], w: p[2], h: p[3] };
        }
      }
      if (ds.rad) {
        const rad = Number(ds.rad) || 0;
        if (rad > 0) run.rad = rad;
      }
      if (ds.img) run.img = ds.img;
      else run.src$ = child.getAttribute('src') || '';
      out.push(run);
      continue;
    }
    if (tag === 'BR') { out.push(Object.assign({ t: '\n' }, mark)); continue; }
    const next = Object.assign({}, mark);
    if (tag === 'B' || tag === 'STRONG') next.b = 1;
    else if (tag === 'I' || tag === 'EM') next.i = 1;
    else if (tag === 'U') next.u = 1;
    else if (tag === 'S' || tag === 'STRIKE' || tag === 'DEL') next.s = 1;
    else if (tag === 'SPAN') {
      const st = child.style;
      if (st && st.fontSize) next.sz = parseFloat(st.fontSize);
      if (st && st.color) next.c = rgbToHex(st.color);
      if (child.classList && child.classList.contains('mono')) next.mono = 1;
      // 부품 꼬리표를 되읽는다 — 이게 없으면 그 칸에 글자 하나만 쳐도 꼬리표가 사라진다
      if (child.dataset && child.dataset.ref) next.ref = child.dataset.ref;
    }
    walk(child, next, out);                      // 그 밖의 태그는 껍데기만 버리고 안으로 들어간다
  }
}

function domToRuns(el) {
  const out = [];
  if (el) walk(el, {}, out);
  return normalizeRuns(out);
}

/* autosave.js */
const DB = 'doc-editor';
const STORE = 'snapshots';
const KEEP = 20;

function openStore() {
  return new Promise((resolve, reject) => {
    const rq = indexedDB.open(DB, 1);
    rq.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 't' });
    };
    rq.onsuccess = (e) => resolve(e.target.result);
    rq.onerror = () => reject(new Error('자동 보관 저장소를 열지 못했다'));
  });
}

function tx(db, mode) { return db.transaction(STORE, mode).objectStore(STORE); }

async function saveSnapshot(text, label) {
  const db = await openStore();
  const t = Date.now();
  await new Promise((res, rej) => {
    const r = tx(db, 'readwrite').put({ t, label: label || '', size: text.length, text });
    r.onsuccess = res; r.onerror = () => rej(new Error('자동 보관에 실패했다'));
  });
  const all = await listSnapshots();
  const extra = all.slice(0, Math.max(0, all.length - KEEP));
  for (const s of extra) {
    await new Promise((res) => { tx(db, 'readwrite').delete(s.t).onsuccess = res; });
  }
}

async function listSnapshots() {
  const db = await openStore();
  return new Promise((res, rej) => {
    const r = tx(db, 'readonly').getAll();
    r.onsuccess = () => res(r.result
      .map(x => ({ t: x.t, label: x.label, size: x.size }))
      .sort((a, b) => a.t - b.t));
    r.onerror = () => rej(new Error('자동 보관 목록을 읽지 못했다'));
  });
}

async function readSnapshot(t) {
  const db = await openStore();
  return new Promise((res, rej) => {
    const r = tx(db, 'readonly').get(t);
    r.onsuccess = () => res(r.result ? r.result.text : null);
    r.onerror = () => rej(new Error('자동 보관본을 읽지 못했다'));
  });
}

/* print.js */
// ⛔ 확대 상태를 반드시 되돌린 뒤 인쇄한다 (옛 프로그램은 130%면 PDF 도 1.3배가 됐다).
// ⛔ 인쇄 대상은 지금 열려 있는 문서 하나뿐이다 (옛 프로그램은 안 고른 것이 딸려 나왔다).
// title 을 주면 인쇄 동안 문서 제목을 그걸로 바꾼다 — 크롬이 PDF 저장 파일 이름으로
// 제안한다(설계_판.md §5-2). 끝나면 반드시 되돌린다.
function printDoc(mainEl, title) {
  const saved = mainEl.style.transform;
  const savedTitle = document.title;
  mainEl.style.transform = 'none';
  if (title) document.title = title;
  // ⛔ timer 는 restore «앞»에 선언해야 한다. 크롬은 window.print() 가 멈춰 서 있는 «동안»
  //    afterprint 를 쏘므로 restore 가 아래 setTimeout 줄에 닿기 «전»에 먼저 돈다 —
  //    const 로 뒤에 두면 그때마다 「Cannot access 'timer' before initialization」이 난다(실측).
  let timer = 0;
  let 됐다 = false;
  // 두 번 불려도 해가 없다(afterprint 와 예비 시계가 겹칠 수 있다) — 첫 번만 일하고 물러난다.
  const restore = () => {
    if (됐다) return;
    됐다 = true;
    mainEl.style.transform = saved;
    document.title = savedTitle;
    window.removeEventListener('afterprint', restore);
    clearTimeout(timer);   // 예비 타이머도 거둔다 — 일괄 인쇄에서 지난 호출의 타이머가 뒤늦게 제목을 되덮으면 안 된다
  };
  window.addEventListener('afterprint', restore);
  window.print();
  // ⛔ 이미 되돌렸으면 예비 시계를 «걸지 않는다». 걸면 그게 곧 지난 호출의 시계가 되어
  //    3초 뒤 다음 판의 저장 창 이름을 되덮는다(실측으로 걸린 버그다).
  if (!됐다) timer = setTimeout(restore, 3000);   // afterprint 가 안 오는 브라우저 대비
}

/* paginate.js */
// ⛔ 이 함수는 blocks·heights 를 읽기만 한다. 절대 고치지 않는다.
// ⛔ 블록(행)을 버리거나 쪼개지 않는다. 한 장보다 큰 블록·행 묶음은 그 장에 혼자 둔다.
// 반환: 장마다 entry 목록. 보통 블록 { id } · 표 조각 { id, rowFrom, rowTo, cont }
//   (cont:1 = 이어진 조각 — 그리는 쪽이 머리글 행을 다시 그린다)
// heights[id]: 숫자(보통 블록) 또는 { head, rows:[px,…], groups:[[from,to],…] }(표)
function paginate(blocks, heights, opts) {
  const limit = opts && opts.contentHeight;
  if (!(typeof limit === 'number' && limit > 0)) {
    throw new Error('paginate: contentHeight 는 0보다 큰 숫자여야 한다 (받은 값: ' + limit + ')');
  }
  const gap = (opts && opts.gap) || 0;
  const pages = [];
  let cur = [];
  let used = 0;
  const flush = () => { pages.push(cur); cur = []; used = 0; };

  for (const b of blocks || []) {
    const h = heights && heights[b.id];

    if (h && typeof h === 'object' && Array.isArray(h.rows)) {
      // ── 표: 행 묶음(세로 병합 덩어리) 단위로 채운다 ──
      const head = Number(h.head) || 0;
      const rowsH = h.rows.map(Number);
      const groups = (Array.isArray(h.groups) && h.groups.length)
        ? h.groups : rowsH.map((_, i) => [i, i]);

      if (!rowsH.length) {                       // 머리글만 있는 표 — 조각 하나로 그대로
        if (cur.length > 0 && used + gap + head > limit) flush();
        const lead = cur.length === 0 ? 0 : gap;
        cur.push({ id: b.id, rowFrom: 0, rowTo: -1, cont: 0 });
        used += lead + head;
        continue;
      }

      let gi = 0;
      let from = 0;
      let firstChunk = true;
      while (gi < groups.length) {
        const lead = cur.length === 0 ? 0 : gap;
        const budget = limit - used - lead - head;
        let to = from - 1;
        let sum = 0;
        while (gi < groups.length) {
          const [a, z] = groups[gi];
          let gh = 0;
          for (let r = a; r <= z; r++) gh += rowsH[r] || 0;
          if (sum === 0 && gh > budget && cur.length > 0) break;   // 이 장엔 시작도 못 한다
          if (sum > 0 && sum + gh > budget) break;                 // 이 장은 여기까지
          sum += gh;
          to = z;
          gi += 1;
          if (sum > budget) break;   // 홀로 큰 묶음 — 이 장에 혼자 둔다(쪼개지 않는다)
        }
        if (to < from) { flush(); continue; }    // 빈손 — 새 장에서 다시
        cur.push({ id: b.id, rowFrom: from, rowTo: to, cont: firstChunk ? 0 : 1 });
        used += lead + head + sum;
        firstChunk = false;
        from = to + 1;
        if (gi < groups.length) flush();         // 아직 행이 남았다 — 다음 조각은 새 장
      }
      continue;
    }

    // ── 보통 블록: 1단계 규칙 그대로 ──
    const hh = Number(h) || 0;
    const need = cur.length === 0 ? hh : gap + hh;
    if (cur.length > 0 && used + need > limit) {
      flush();
      cur.push({ id: b.id });
      used = hh;
      continue;
    }
    cur.push({ id: b.id });
    used += need;
  }
  pages.push(cur);
  return pages;
}

/* measure.js */




// ⭐ 머리글 높이는 «고정»이다(설계_머리글바닥글.md). 글자 수에 따라 늘었다 줄었다 하면
//    쪽 나눔이 그때마다 달라져 예측할 수 없어진다 — 제목은 한 줄로 자른다(CSS).
//    ⛔ 이 숫자가 CSS 와 어긋나면 본문이 머리글 위로 올라타거나 아래가 잘린다.
//       그래서 main.js 가 이 값을 CSS 변수(--hdr-h)에 넣어 «한 곳»으로 만든다.
const HDR_H = 88;

// 이 문서에 머리글에 넣을 것이 하나라도 있나 — 없으면 머리글 띠를 아예 안 그린다.
// 그래야 보통 문서(공문·메모)는 지금까지와 «완전히 똑같이» 동작한다.
function hasHeader(doc) {
  const m = (doc && doc.meta) || {};
  return !!(m.category || m.title || m.subtitle || m.logo || m.doc || m.rev || m.date);
}

// ⚠ 바닥글은 본문 높이를 안 먹는다 — 종이 아래 여백(34px) 안에 얹는다. 쪽 번호가 있던
//    그 자리다. 그래서 바닥글이 생겨도 옛 문서의 쪽 나눔이 한 장도 안 바뀐다.
function contentHeightOf(page, doc) {
  const p = page || DEFAULT_PAGE;
  const m = p.margin || DEFAULT_PAGE.margin;
  return p.height - m.top - m.bottom - (hasHeader(doc) ? HDR_H : 0);
}

// 숨은 상자(#gauge)에 블록을 그려 실제 높이를 잰다. 화면에 보이는 것은 건드리지 않는다.
// view: 판 보기(설계_판.md §5-1) — 숨은 행은 tr 이 없으니 높이 0 으로 남는다.
//   tr.dataset.r(모델 행 번호)로 «모델 길이의 높이 배열»을 만들므로 paginate 의 조각
//   좌표(rowFrom/rowTo)가 판과 무관하게 늘 모델 번호다.
function measureAll(blocks, gaugeEl, makeEl, view) {
  gaugeEl.textContent = '';
  const els = [];
  for (const b of blocks) {
    const el = makeEl(b);
    gaugeEl.appendChild(el);
    els.push([b.id, el]);
  }
  const out = {};
  const byId = new Map(blocks.map(b => [b.id, b]));
  for (const [id, el] of els) {
    const b = byId.get(id);
    const cs = getComputedStyle(el);
    const mt = parseFloat(cs.marginTop || 0);
    const mb = parseFloat(cs.marginBottom || 0);
    if (b && b.type === 'table') {
      const thead = el.querySelector('thead');
      const rows = new Array((b.rows || []).length).fill(0);
      el.querySelectorAll('tbody tr').forEach((tr) => {
        rows[Number(tr.dataset.r)] = tr.getBoundingClientRect().height;
      });
      const groups = rowGroups(b).filter(([a]) => rowVisible(b, a, view || null));
      // 블록 위/아래 여백은 머리글/«보이는» 마지막 행에 얹는다 — 장 셈이 실제와 같아진다
      const last = groups.length ? groups[groups.length - 1][1] : -1;
      const head = (thead ? thead.getBoundingClientRect().height : 0) + mt;
      if (last >= 0) rows[last] += mb;
      out[id] = { head: last >= 0 ? head : head + mb, rows, groups };
      continue;
    }
    const r = el.getBoundingClientRect();
    out[id] = r.height + mt + mb;
  }
  gaugeEl.textContent = '';
  return out;
}

/* render.js */









// ⭐ 입력판은 #pages 하나다(D16 — 한 장의 입력판). 블록은 그냥 그림이고,
//    섹션 줄·쪽 번호처럼 글이 아닌 것만 편집 불가 섬(contenteditable=false)으로 막는다.
function blockEl(block, page, view) {
  const el = document.createElement('div');
  el.className = 'blk blk-' + block.type;
  el.dataset.id = block.id;
  if (block.type === 'table') return tableEl(block, null, view);
  if (block.type === 'image') return imageEl(block, page);
  if (block.type === 'section') {
    el.setAttribute('contenteditable', 'false');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = block.no || '';
    const t = document.createElement('span'); t.className = 't'; t.textContent = block.title || '';
    const r = document.createElement('span'); r.className = 'rule';
    el.append(n, t, r);
  } else if (block.type === 'list') {
    const box = document.createElement(block.ordered ? 'ol' : 'ul');
    box.className = 'lst';
    (block.items || [[]]).forEach((item, i) => {
      const li = document.createElement('li');
      li.dataset.i = String(i);
      // 표식(•·번호)은 li 에서 상속된다 — 항목 전체가 같은 서식이면 li 에 입혀 따라가게 한다
      const m = uniformMark(item);
      if (m.sz) li.style.fontSize = m.sz + 'px';
      if (m.c) li.style.color = m.c;
      if (m.b) li.style.fontWeight = '700';
      for (const n of runsToNodes(item)) li.appendChild(n);
      box.appendChild(li);
    });
    el.appendChild(box);
  } else {
    if (block.align) el.style.textAlign = block.align;
    for (const n of runsToNodes(block.runs || [])) el.appendChild(n);
  }
  return el;
}

// 그림 블록 — 몸통은 편집 불가 섬, 캡션만 안쪽 입력 칸이다(설계 §4-1).
// ⭐ 표시 크기는 모델(w)과 종이 크기에서 «계산으로» 정해진다 — 숨은 상자(gauge)와
//   실제 장이 같은 값을 쓰므로 장 나눔이 어긋날 수 없다. 그림 로딩도 안 기다린다.
function imageEl(block, page) {
  const el = document.createElement('div');
  el.className = 'blk blk-image';
  el.dataset.id = block.id;
  el.setAttribute('contenteditable', 'false');
  if (block.align) el.style.textAlign = block.align;
  const a = assetOf(block.src);
  if (a) {
    const pg = page || DEFAULT_PAGE;
    const maxW = pg.width - pg.margin.left - pg.margin.right;
    const maxH = (pg.height - pg.margin.top - pg.margin.bottom) - 60;  // 캡션·여백 몫(설계 §6)
    // ⭐ 비율의 근원은 crop 이 있으면 crop 이다(M3) — 자동 축소도 그 비율을 따라야
    //   화면과 장 나눔(숨은 상자)이 안 어긋난다.
    let w = Math.min(block.w || a.w, maxW);
    let h = dispHeight(w, block, a);
    if (h > maxH) { h = maxH; w = Math.max(1, Math.round(h / Math.max(0.0001, ratioOf(block, a)))); }
    el.appendChild(imgNode(block.src, a, { w, crop: block.crop, rad: block.rad }, 'bimg'));
  }
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.setAttribute('contenteditable', 'true');
  for (const n of runsToNodes(block.caption || [])) cap.appendChild(n);
  el.appendChild(cap);
  return el;
}

// view = null(전체보기) 또는 판 id(판 보기). 판 보기는 «투영»이다 — doc.blocks 를 읽어
// 걸러 그리기만 하고 원본은 한 글자도 안 고친다(설계_판.md P1).
function renderPages(doc, pagesEl, gaugeEl, view) {
  useAssets(doc.assets);
  // ⛔ 종이 여백은 «문서마다» 다를 수 있다(파일에 담겨 있다). CSS 에 숫자로 박아 두면
  //    옛 문서를 열었을 때 종이 여백과 «높이 재는 상자»의 폭이 어긋나 줄바꿈이 달라지고
  //    쪽 나눔이 통째로 틀어진다. 그래서 그릴 때마다 이 문서의 값을 CSS 변수에 넣는다.
  {
    const pg = doc.page || DEFAULT_PAGE;
    const m = pg.margin || DEFAULT_PAGE.margin;
    const rs = document.documentElement.style;
    rs.setProperty('--pg-pad', m.top + 'px ' + m.right + 'px ' + m.bottom + 'px ' + m.left + 'px');
    rs.setProperty('--pg-l', m.left + 'px');
    rs.setProperty('--pg-r', m.right + 'px');
    rs.setProperty('--text-w', (pg.width - m.left - m.right) + 'px');
  }
  const cur = view || null;
  const blocks = doc.blocks.filter(b => blockVisible(b, cur));     // 투영 — 원본 불변(P1)
  const heights = measureAll(blocks, gaugeEl, (b) => blockEl(b, doc.page, cur), cur);
  const pages = paginate(blocks, heights, { contentHeight: contentHeightOf(doc.page, doc) });
  const byId = new Map(blocks.map(b => [b.id, b]));

  pagesEl.textContent = '';
  pages.forEach((ids, i) => {
    const pg = document.createElement('div');
    pg.className = 'page';
    const body = document.createElement('div');
    body.className = 'page-body';
    for (const ent of ids) {
      const b = byId.get(ent.id);
      if (!b) continue;
      if (b.type === 'table') body.appendChild(tableEl(b, ent, cur));
      else body.appendChild(blockEl(b, doc.page, cur));
    }
    // 머리글은 «흐름»에 있어 본문 높이를 먹고(measure.js HDR_H), 바닥글은 종이 아래 여백에
    // 얹혀 본문 높이를 안 먹는다 — 쪽 번호가 있던 그 자리다.
    const hdr = headerEl(doc);
    if (hdr) pg.appendChild(hdr);
    pg.append(body, footerEl(doc, i + 1, pages.length, cur));
    pagesEl.appendChild(pg);
  });
  applyVariantMarks(doc, pagesEl, cur);
  return { pages };
}

// 머리글 — 설계서 §8 확정값. ⛔ 편집 칸이 아니다(contenteditable=false) — 종이 위 «그림»이다.
//    고치는 곳은 사이드바 「문서 정보」 창 하나뿐이다(설계_머리글바닥글.md §5).
// ⚠ 넣을 것이 하나도 없으면 아예 안 그린다 — 그래야 보통 문서(공문·메모)의 쪽 나눔이
//   지금까지와 한 장도 안 달라진다.
function headerEl(doc) {
  if (!hasHeader(doc)) return null;
  const m = doc.meta || {};
  const el = document.createElement('div');
  el.className = 'page-hdr';
  el.setAttribute('contenteditable', 'false');
  const L = document.createElement('div');
  L.className = 'ph-l';
  const put = (cls, text) => {
    if (!text) return;
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = text;
    L.appendChild(d);
  };
  put('ph-cat', m.category);
  put('ph-title', m.title);
  put('ph-sub', m.subtitle);
  const R = document.createElement('div');
  R.className = 'ph-r';
  if (m.logo) {
    const img = document.createElement('img');
    img.className = 'ph-logo';
    img.src = m.logo;
    img.alt = '';
    R.appendChild(img);
  }
  const id = document.createElement('div');
  id.className = 'ph-id';
  const line = (k, v) => {
    if (!v) return;
    const row = document.createElement('div');
    const key = document.createElement('span');
    key.textContent = k;
    const val = document.createElement('b');
    val.textContent = v;
    row.append(key, val);
    id.appendChild(row);
  };
  line('DOC', m.doc);
  line('REV', m.rev);
  line('DATE', m.date);
  if (id.childNodes.length) R.appendChild(id);
  el.append(L, R);
  return el;
}

// 바닥글 — 좌: 회사 · 우: 문서명(·판 이름) + 쪽 번호. 쪽 번호 자리를 그대로 물려받는다.
function footerEl(doc, n, total, cur) {
  const m = doc.meta || {};
  const el = document.createElement('div');
  el.className = 'page-ftr';
  el.setAttribute('contenteditable', 'false');
  const L = document.createElement('div');
  L.className = 'pf-l';
  // ⚠ 회사 이름을 안 적어 두었으면 §8 의 기본값을 쓴다
  L.textContent = m.company || 'SAMIL ELTEC CO., LTD.';
  const R = document.createElement('div');
  R.className = 'pf-r';
  // ⭐ 판 보기로 뽑은 종이에는 «어느 판인지»가 찍혀야 한다 — 다섯 벌을 종이로 늘어놓으면
  //    똑같이 생겨서 구분이 안 된다(이 도구의 존재 이유가 판이다).
  const parts = [];
  if (m.title) parts.push(m.title);
  const vn = cur ? variantName(doc, cur) : '';
  if (vn) parts.push(vn);
  if (parts.length) R.append(document.createTextNode(parts.join(' · ') + ' '));
  const b = document.createElement('b');
  b.textContent = n + ' / ' + total;
  R.appendChild(b);
  el.append(L, R);
  return el;
}

// 표 한 조각을 그린다. part = { rowFrom, rowTo, cont } · null 이면 전체(높이 재기용).
// ⭐ 이어진 장의 머리글(cont)은 «그림»이다(편집 불가) — 진짜 머리글 DOM 은 첫 조각 하나여야
//    타자가 어긋나지 않는다(계획 R11). 덮인 칸(cov)은 그리지 않는다.
function tableEl(block, part, view) {
  const el = document.createElement('div');
  el.className = 'blk blk-table';
  el.dataset.id = block.id;
  if (part && part.cont) el.dataset.cont = '1';
  const tbl = document.createElement('table');
  const cg = document.createElement('colgroup');
  for (const c of block.cols || []) {
    const col = document.createElement('col');
    col.style.width = (c.w || 0) + 'px';
    cg.appendChild(col);
  }
  tbl.appendChild(cg);
  // 칸 채움은 판을 거친다 — 이 판의 벌이 있으면 그 값, 없으면 공통값(설계_판.md P3)
  const fill = (td, cell) => {
    for (const n of runsToNodes(cellRuns(cell, view || null))) td.appendChild(n);
  };
  if (block.head && block.head.length) {
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');
    block.head[0].forEach((cell, c) => {
      if (cell.cov) return;                 // 임의 칸 나누기(R16)가 머리글에도 가로 병합을 만든다
      const td = document.createElement('td');
      if (cell.cs) td.colSpan = cell.cs;
      // 머리글도 몸통과 같은 규칙이다 — 표의 오른쪽 끝 칸에는 세로 안내선을 안 붙인다
      if (c + (cell.cs || 1) >= (block.cols || []).length) td.classList.add('edge');
      if (cell.align) td.style.textAlign = cell.align;
      if (cell.va) td.style.verticalAlign = cell.va;
      if (part && part.cont) td.setAttribute('contenteditable', 'false');
      else { td.dataset.r = 'h'; td.dataset.c = String(c); }
      fill(td, cell);
      tr.appendChild(td);
    });
    thead.appendChild(tr);
    tbl.appendChild(thead);
  }
  const tbody = document.createElement('tbody');
  const from = part ? part.rowFrom : 0;
  const to = part ? part.rowTo : (block.rows || []).length - 1;
  for (let r = from; r <= to; r++) {
    if (!rowVisible(block, r, view || null)) continue;     // 판 보기 — 숨은 행은 tr 자체가 없다
    const tr = document.createElement('tr');
    tr.dataset.r = String(r);                              // 모델 행 번호 — measure 가 읽는다
    (block.rows[r] || []).forEach((cell, c) => {
      if (cell.cov) return;
      const td = document.createElement('td');
      td.dataset.r = String(r);
      td.dataset.c = String(c);
      if (cell.cs) td.colSpan = cell.cs;
      if (cell.rs) td.rowSpan = cell.rs;
      // ⭐ «표의 오른쪽 끝»인 칸에는 세로 안내선을 안 붙인다(styles.css .blk-table:hover).
      //    CSS 의 :last-child 로는 못 가른다 — 세로 병합이 있으면 어떤 줄은 칸이 적어서
      //    그 줄의 마지막 칸이 오른쪽 끝이 아닌데도 선이 빠졌다(2026-09-01 SKY 지적 2·3).
      if (c + (cell.cs || 1) >= (block.cols || []).length) td.classList.add('edge');
      const align = cell.align || (block.cols[c] && block.cols[c].align) || null;
      if (align) td.style.textAlign = align;
      if (cell.va) td.style.verticalAlign = cell.va;      // 위/가운데/아래 맞춤(엑셀과 같다)
      if (cell.bg) td.style.background = cell.bg;
      fill(td, cell);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  el.appendChild(tbl);
  // 열 경계 표시 — 표에 마우스를 올리면 세로 눈금이 보인다(세로선이 없어 열이 안 보이던 것).
  // 첫 조각의 것만 «끌 수 있는 손잡이»고, 이어진 조각의 것은 보기 전용이다
  // (이어진 조각에서 끌면 헷갈린다 — R13). 둘 다 편집 불가 섬이라 타자에 안 잡힌다.
  {
    const fixed = !!(part && part.cont);
    let x = 0;
    (block.cols || []).forEach((c, i) => {
      if (i === block.cols.length - 1) return;            // 마지막 경계는 없다(합 고정 — R13)
      x += c.w || 0;
      const grip = document.createElement('div');
      grip.className = fixed ? 'colgrip colgrip-fixed' : 'colgrip';
      grip.setAttribute('contenteditable', 'false');
      grip.dataset.col = String(i);
      grip.style.left = (x - 3) + 'px';
      el.appendChild(grip);
    });
  }
  return el;
}

// 판 이름표 — 종이 «밖»에 세운다(2026-09-01 SKY: "아예 종이 바깥에 표시 되도록 하고
// 글씨 크기도 좀 키워줘. 판과 같은 색상으로 맞춰 주고").
// ⛔ 편집 칸(.blk) «안»에는 글자 노드를 만들지 않는다(P9) — 넣으면 글자 번호 셈이 어긋나
//    커서·지우기가 엉뚱한 곳을 문다. 그래서 종이의 «덮개 층»에 따로 그린다.
//    쪽 번호(.pgno)와 같은 자리다: .page 의 직접 자식 · contenteditable=false.
// ⭐ 판마다 «제 색»으로 쓴다 — 옛 방식(CSS ::after + attr)은 글자를 한 덩어리로만 칠할 수
//    있어서 「4000·5000·5000IR·6000」이 전부 4000 색으로 나왔다(다른 세 판은 색이 거짓말).
function addVariantTag(doc, blkEl, ids) {
  const page = blkEl.closest('.page');
  if (!page) return;
  let layer = page.querySelector(':scope > .vtags');
  if (!layer) {
    layer = document.createElement('div');
    layer.className = 'vtags';
    layer.setAttribute('contenteditable', 'false');
    page.appendChild(layer);
  }
  const tag = document.createElement('div');
  tag.className = 'vtag';
  // 덮개 층이 종이의 안쪽 상자에 딱 맞으므로(inset:0) 블록의 화면 위치 차이가 곧 자리다
  tag.style.top = Math.round(blkEl.getBoundingClientRect().top
    - page.getBoundingClientRect().top) + 'px';
  ids.forEach((id, i) => {
    if (i) {
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '·';
      tag.appendChild(sep);
    }
    const s = document.createElement('span');
    s.textContent = variantName(doc, id);
    s.style.color = variantColor(doc, id).fg;
    tag.appendChild(s);
  });
  layer.appendChild(tag);
}

// 판 표지(설계_판.md §4-2·§4-3) — 화면 전용. 편집 칸 안에는 글자 노드를 만들지 않는다(P9).
// ⚠ 장을 넘은 표는 같은 data-id 의 .blk 조각이 여러 개다 — 조각마다 따로 표지를 붙인다.
function applyVariantMarks(doc, pagesEl, cur) {
  // 전체보기(cur 없음) + 판 있는 문서에서만 이름표가 종이 «밖»에 선다 — 그때만 종이의
  // 내용 가두기(overflow:hidden)를 푼다(styles.css `#pages.vall .page`).
  // ⛔ 아래 «판 없으면 그만» 보다 «먼저» 꺼야 한다 — 판을 다 지운 문서에서 클래스가 남으면
  //    그 문서는 영영 내용을 안 가두게 된다.
  pagesEl.classList.toggle('vall', !cur && !!(doc.variants || []).length);
  if (!(doc.variants || []).length) return;
  const names = (list) => (list || []).map(id => variantName(doc, id)).filter(Boolean).join('·');
  const byId = new Map(doc.blocks.map(b => [b.id, b]));
  for (const el of pagesEl.querySelectorAll('.blk[data-id]')) {
    const b = byId.get(el.dataset.id);
    if (!b) continue;
    if (!cur && Array.isArray(b.variants)) {               // 전체보기 — 판 제한 블록
      el.classList.add('vlim');
      el.style.setProperty('--vc', variantColor(doc, b.variants[0]).fg);
      addVariantTag(doc, el, b.variants);
    }
    if (b.type !== 'table') continue;
    if (!cur && Array.isArray(b.rowv)) {                   // 전체보기 — 판 제한 행
      for (const tr of el.querySelectorAll('tbody tr')) {
        const v = b.rowv[Number(tr.dataset.r)];
        if (!Array.isArray(v) || !v.length) continue;
        tr.classList.add('vlim');
        tr.title = '보이는 판: ' + names(v);
        tr.style.setProperty('--vc', variantColor(doc, v[0]).fg);
      }
    }
    for (const td of el.querySelectorAll('td[data-r]')) {  // 판별 칸 — 삼각형·툴팁
      const r = td.dataset.r === 'h' ? 'h' : Number(td.dataset.r);
      const cell = r === 'h' ? (b.head[0] && b.head[0][Number(td.dataset.c)])
                             : (b.rows[r] && b.rows[r][Number(td.dataset.c)]);
      if (!cell || !cell.vals) continue;
      td.classList.add('vcell');
      const lines = ['공통: ' + runsText(cell.runs || [])];
      for (const v of doc.variants) {
        if (Object.prototype.hasOwnProperty.call(cell.vals, v.id)) {
          lines.push(v.name + ': ' + runsText(cell.vals[v.id]));
        }
      }
      td.title = lines.join('\n');
      if (cur && Object.prototype.hasOwnProperty.call(cell.vals, cur)) {
        td.classList.add('vown');                          // 지금 치는 값은 이 판 것
        td.style.setProperty('--vc', variantColor(doc, cur).fg);
      }
    }
  }
}

/* edit.js */
// 여러 편집 칸(문단·목록 항목)에 걸친 선택을 지우는 순수 로직. DOM 을 모른다.
// targets: 문서 순서의 [{ id, item|null, from, to }] — 화면의 crossTargets() 가 만든 좌표.
//
// 워드의 실제 규칙(2026-08-30 이 PC 워드 실측 — 4가지 변형):
// · 양쪽 끝이 모두 «글자 중간»이면: 지우고 머리와 꼬리를 **딴 문단으로 남긴다** (안 합친다)
// · 한쪽이라도 경계(머리를 하나도 안 물었거나, 꼬리를 하나도 안 문 경우)면: **합친다**
// · 엔터는 항상 가른다 → opt.break 로 강제 가르기
// 반환: { blocks, caret(머리 끝 — 지우기의 커서), caretTail(꼬리 시작 — 엔터의 커서), split }
// ⛔ 선택 밖 글자는 하나도 사라지지 않는다 — 시험(test/edit.test.js)이 이것을 못 박는다.



function runsAt(b, t) {
  if (t.item === null || t.item === undefined) return Array.isArray(b.runs) ? b.runs : null;
  return Array.isArray(b.items) && Array.isArray(b.items[t.item]) ? b.items[t.item] : null;
}

function deleteAcross(blocks, targets, opt) {
  if (!Array.isArray(targets) || targets.length < 2) return null;
  const first = targets[0];
  const last = targets[targets.length - 1];
  const fi = first.item === null || first.item === undefined ? null : first.item;
  const li = last.item === null || last.item === undefined ? null : last.item;
  const firstB = blocks.find(b => b.id === first.id);
  const lastB = blocks.find(b => b.id === last.id);
  const srcA = firstB ? runsAt(firstB, first) : null;
  const srcZ = lastB ? runsAt(lastB, last) : null;
  if (!srcA || !srcZ) return null;

  const headLen = runsLength(srcA);
  const tailLen = runsLength(srcZ);
  const head = sliceRuns(srcA, 0, first.from);
  const tail = sliceRuns(srcZ, last.to, tailLen);
  const split = !!(opt && opt.break)
    || (first.from > 0 && first.from < headLen && last.to > 0 && last.to < tailLen);
  const merged = normalizeRuns(head.concat(tail));

  // 첫 대상을 뺀 나머지는 통째로 없어진다. 갈라 두기(split)면 끝 대상도 남긴다.
  const gone = new Map();   // 블록 id -> 'block'(문단 통째) 또는 Set(목록 항목 번호들)
  for (let i = 1; i < targets.length; i++) {
    if (split && i === targets.length - 1) continue;
    const t = targets[i];
    if (t.item === null || t.item === undefined) gone.set(t.id, 'block');
    else {
      const set = gone.get(t.id) instanceof Set ? gone.get(t.id) : new Set();
      set.add(t.item);
      gone.set(t.id, set);
    }
  }

  const out = [];
  let caretTail = null;
  for (const b of blocks) {
    if (b.id === first.id) {
      if (fi === null) {
        out.push(Object.assign({}, b, { runs: split ? head : merged }));
      } else {
        // 첫 칸이 목록 항목 — 같은 블록에 끝 항목·지워질 항목이 함께 있을 수 있다
        const doomed = gone.get(b.id);
        const items = [];
        b.items.forEach((it, i) => {
          if (i === fi) items.push(split ? head : merged);
          else if (split && b.id === last.id && i === li) {
            caretTail = { id: b.id, item: items.length, pos: 0 };
            items.push(tail);
          } else if (doomed instanceof Set && doomed.has(i)) return;
          else items.push(it);
        });
        out.push(Object.assign({}, b, { items }));
      }
      continue;
    }
    if (split && b.id === last.id) {
      // 끝 칸을 꼬리만 남겨 딴 블록으로 둔다
      if (li === null) {
        caretTail = { id: b.id, item: null, pos: 0 };
        out.push(Object.assign({}, b, { runs: tail }));
      } else {
        const doomed = gone.get(b.id);
        const items = [];
        b.items.forEach((it, i) => {
          if (doomed instanceof Set && doomed.has(i)) return;
          if (i === li) {
            caretTail = { id: b.id, item: items.length, pos: 0 };
            items.push(tail);
          } else items.push(it);
        });
        out.push(Object.assign({}, b, { items }));
      }
      continue;
    }
    const g = gone.get(b.id);
    if (g === 'block') continue;
    if (g instanceof Set) {
      const items = b.items.filter((x, i) => !g.has(i));
      if (!items.length) continue;   // 항목이 다 없어진 목록은 블록째 없앤다
      out.push(Object.assign({}, b, { items }));
      continue;
    }
    out.push(b);
  }
  const caret = { id: first.id, item: fi, pos: first.from };
  if (!caretTail) caretTail = caret;   // 합쳐졌으면 이음매가 곧 꼬리 시작이다
  return { blocks: out, caret, caretTail, split };
}

// 표 칸이 낀 걸침 지우기(계획 R5·R6) — 표는 구조가 남고 칸 «속»만 비워진다.
// 표 밖 문단·항목은 각자 제 구간만 잃는다(통째로 물린 문단·항목·섹션 줄은 없어진다).
// ⛔ 표 경계를 넘는 병합은 하지 않는다 — deleteAcross 의 머리+꼬리 잇기를 여기서는 안 쓴다.
// cur = 지금 보고 있는 판 — 표 칸으로 그대로 흘려보낸다(벌이 있으면 그 벌만 비워진다, P3).
function deleteMixed(blocks, targets, cur) {
  if (!Array.isArray(targets) || !targets.length) return null;
  const byId = new Map();
  for (const t of targets) {
    if (!byId.has(t.id)) byId.set(t.id, []);
    byId.get(t.id).push(t);
  }
  const out = [];
  const survived = new Set();
  for (const b of blocks) {
    const ts = byId.get(b.id);
    if (!ts) { out.push(b); continue; }
    if (b.type === 'table') {
      const cellTs = ts.filter(t => t.cell).map(t => ({ r: t.cell[0], c: t.cell[1], from: t.from, to: t.to }));
      out.push(Object.assign({}, b, clearCellRanges(b, cellTs, cur)));
      survived.add(b.id);
      continue;
    }
    if (b.type === 'section') continue;                    // 물린 섹션 줄은 없어진다
    if (b.type === 'image') continue;                      // 물린 그림 블록도 없어진다(캡션째)
    if (Array.isArray(b.items)) {
      const hit = new Map(ts.filter(t => t.item !== null && t.item !== undefined).map(t => [t.item, t]));
      const items = [];
      b.items.forEach((it, i) => {
        const t = hit.get(i);
        if (!t) { items.push(it); return; }
        const len = runsLength(it);
        if (t.from <= 0 && t.to >= len) return;            // 통째로 물린 항목은 없어진다
        items.push(normalizeRuns(sliceRuns(it, 0, t.from).concat(sliceRuns(it, t.to, len))));
      });
      if (!items.length) continue;
      out.push(Object.assign({}, b, { items }));
      survived.add(b.id);
      continue;
    }
    const t = ts[0];
    const len = runsLength(b.runs || []);
    if (t.from <= 0 && t.to >= len) continue;              // 통째로 물린 문단은 없어진다
    out.push(Object.assign({}, b, {
      runs: normalizeRuns(sliceRuns(b.runs, 0, t.from).concat(sliceRuns(b.runs, t.to, len))),
    }));
    survived.add(b.id);
  }
  // 커서 — 살아남은 첫 대상. 다 없어졌으면 남은 첫 블록 처음.
  let caret = null;
  for (const t of targets) {
    if (!survived.has(t.id)) continue;
    caret = { id: t.id, item: t.item === undefined ? null : t.item, pos: t.from };
    if (t.cell) caret.cell = t.cell;
    break;
  }
  if (!caret && out.length) caret = { id: out[0].id, item: null, pos: 0 };
  if (!caret) return null;
  return { blocks: out, caret };
}

/* editor.js */
// 편집을 다스린다 (D16 — 한 장의 입력판).
// 선택·커서·한글 조합·터치는 브라우저가 한다. 우리는 «구조를 바꾸는 동작»만
// beforeinput 에서 가로채 모델에 반영한다: 엔터(가르기) · 블록 경계 지우기(병합) ·
// 걸침 선택 편집 · 걸침 붙여넣기 · 실행취소. 칸 «안»의 타자·지우기·붙여넣기는
// 브라우저가 하고, input 뒤 flush 가 그 칸을 모델로 되읽는다(붙여넣기 서식도 그때 걸러진다).
// ⛔ 한글 조합 중에는 모델·화면을 건드리지 않는다(§12-12). 걸침 위 조합은 조합이
//    끼어들기 «전»(compositionstart)에 수술(deleteCrossInPlace)로 지운다.










// getView() = 지금 보고 있는 판(전체보기면 null). 칸을 읽고 쓰는 모든 길목이 이 값을
// cellRuns/cellPut 에 흘려보낸다 — 그래야 판 X 에서 친 글이 다른 판 값을 안 덮는다(P3).
function attachEditor({ pagesEl, getDoc, setDoc, redraw, getView }) {
  let composing = false;
  // pending = { id, runs, view } (목록 항목이면 itemIndex, 표 칸이면 cell, 캡션이면 cap 이 함께).
  // view = 되읽은 «그때» 보고 있던 판 — flush 가 늦게 불릴 수 있어 함께 적어 둔다.
  let pending = null;
  let idle = null;
  function cancelIdle() { clearTimeout(idle); idle = null; }

  function flush(redrawAfter) {
    if (!pending) return;
    let p = pending;
    pending = null;
    const doc = getDoc();
    // 되읽은 토막에 밖에서 온 그림(src$)이 있으면 보관함에 담는다(중복이면 기존 번호)
    const got = Array.isArray(p.runs) ? adoptImages(p.runs, doc.assets) : null;
    if (got) p = Object.assign({}, p, { runs: got.runs });
    const assets = got && got.changed ? got.assets : doc.assets;
    let patch;
    if (p.cell) {
      const b = doc.blocks.find(x => x.id === p.id);
      if (!b || b.type !== 'table') return;
      // 되읽은 글은 «그때 화면에 보이던 판» 것이다 — flush 가 늦게(조합 끝) 불려도
      // 판을 바꾼 뒤의 슬롯에 꽂히면 안 된다(P3).
      if (p.cell[0] === 'h') {
        const head = [b.head[0].slice()];
        head[0][p.cell[1]] = cellPut(head[0][p.cell[1]], p.runs, p.view);
        patch = { head };
      } else {
        const rows = b.rows.slice();
        const row = rows[p.cell[0]].slice();
        row[p.cell[1]] = cellPut(row[p.cell[1]], p.runs, p.view);
        rows[p.cell[0]] = row;
        patch = { rows };
      }
    } else if (p.cap) {
      patch = { caption: p.runs };
    } else if (p.itemIndex === undefined) {
      patch = { runs: p.runs };
    } else {
      const b = doc.blocks.find(x => x.id === p.id);
      if (!b || !Array.isArray(b.items)) return;
      const items = b.items.slice();
      items[p.itemIndex] = p.runs;
      patch = { items };
    }
    setDoc(Object.assign({}, doc, { assets, blocks: replaceBlock(doc.blocks, p.id, patch) }));
    if (redrawAfter) redraw({ caretId: p.id, caretEnd: true });
  }

  // input 의 target 은 입력판 전체다 — 반영할 칸은 커서 위치로 찾는다.
  // ⛔ 판(view)도 «이때» 적는다 — 되읽은 글은 지금 보이는 판의 것이고, flush 는
  //    한글 조합이 끝날 때까지 미뤄질 수 있다. 네 갈래 모두 같은 모양으로 싣는다.
  function capture() {
    const blk = activeBlockEl(pagesEl);
    if (!blk) return;
    const view = getView();
    const cap = activeCapEl(blk);
    if (cap) { pending = { id: blk.dataset.id, cap: 1, runs: domToRuns(cap), view }; return; }
    const td = activeCellEl(blk);
    if (td) {
      pending = { id: blk.dataset.id,
        cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)],
        runs: domToRuns(td), view };
      return;
    }
    const li = activeItemEl(blk);
    if (li) pending = { id: blk.dataset.id, itemIndex: Number(li.dataset.i), runs: domToRuns(li), view };
    else pending = { id: blk.dataset.id, runs: domToRuns(blk), view };
  }

  pagesEl.addEventListener('input', () => {
    capture();
    if (!composing) flush(false);   // 모델만 갱신, 다시 그리지 않는다(커서가 튄다)
    // 다시 그리기(쪽 나눔 갱신)는 "다 치고 잠깐 멈췄을 때" 만 한다
    clearTimeout(idle);
    idle = setTimeout(() => { if (!composing) redraw({ keepCaret: true }); }, 350);
  });

  pagesEl.addEventListener('compositionstart', () => {
    // 걸침 선택 위에서 조합이 시작되면, 조합 글자가 끼기 전에 지금 지운다.
    // 입력판이 하나라 초점(#pages)은 그대로다 — 조합이 안전하게 이어진다.
    deleteCrossInPlace();
    composing = true;
  });
  pagesEl.addEventListener('compositionend', () => {
    composing = false;
    flush(false);   // 조합 중 미뤄 둔 마지막 글자를 모델로 — 이벤트 순서에 맡기지 않는다
  });

  // ── 걸침 선택(여러 칸) 좌표: 글자를 문 칸들 + 경계만 문 칸 + 사이에 낀 섹션 줄 ──
  function crossTargets() {
    const s = window.getSelection();
    if (!s.rangeCount || s.getRangeAt(0).collapsed) return [];
    const r = s.getRangeAt(0);
    const targets = targetsIn(pagesEl);
    const edge = (node, offset, atStart) => {
      const e = node.nodeType === 1 ? node : node.parentElement;
      const host = e && e.closest
        ? e.closest('.blk[data-id]:not(.blk-section):not(.blk-list), .blk-list .lst li[data-i]')
        : null;
      if (!host) return;
      const li = host.matches('.lst li[data-i]') ? host : null;
      const blk = li ? li.closest('.blk[data-id]') : host;
      const item = li ? Number(li.dataset.i) : null;
      if (targets.some(t => t.id === blk.dataset.id && t.item === item)) return;
      const pos = offsetIn(host, node, offset);
      const t = { id: blk.dataset.id, item, from: pos, to: pos };
      if (atStart) targets.unshift(t);
      else targets.push(t);
    };
    edge(r.startContainer, r.startOffset, true);
    edge(r.endContainer, r.endOffset, false);
    if (targets.length < 2) return targets;
    targets.splice(1, 0, ...coveredSections(r));
    return targets;
  }

  // 섹션 줄·그림 블록 — 글 칸이 아닌 «통짜 섬»은 걸침 선택에 물리면 통째로 없어진다
  function coveredSections(r) {
    return Array.from(pagesEl.querySelectorAll('.blk-section[data-id], .blk-image[data-id]'))
      .filter(el => r.intersectsNode(el) && !el.contains(r.startContainer) && !el.contains(r.endContainer))
      .map(el => ({ id: el.dataset.id, item: null, from: 0, to: 0 }));
  }

  function deleteTargets(targets, opt) {
    const doc = getDoc();
    const r = deleteAcross(doc.blocks, targets, opt);
    if (!r) return null;
    setDoc(Object.assign({}, doc, { blocks: r.blocks }));
    return r;
  }

  // 걸침 선택을 화면 전체를 다시 그리지 않고 지운다(조합 직전용 — §12-12).
  // 첫 칸의 «속»만 합쳐진 토막으로 갈아 끼우고, 없어진 블록·항목 DOM 을 떼고,
  // 커서를 이음매에 둔다. 쪽 나눔은 다음 다시 그리기가 바로잡는다.
  function deleteCrossInPlace() {
    const targets = crossTargets();
    if (targets.length < 2) return;
    if (targets.some(x => x.cell)) {
      // 표가 낀 걸침 위 조합 — 모델만 고치고, 화면은 문 칸들의 «속»만 갈아 끼운다.
      // 표 조각 DOM 수술은 위험해서 다시 그리기는 조합이 끝난 뒤 flush 경로에 맡긴다(§12-12).
      const doc = getDoc();
      const r = deleteMixed(doc.blocks, targets, getView());
      if (!r) return;
      setDoc(Object.assign({}, doc, { blocks: r.blocks }));
      const alive = new Set(r.blocks.map(b => b.id));
      const cellSel = (t) => '.blk[data-id="' + t.id + '"] td[data-r="' + t.cell[0]
        + '"][data-c="' + t.cell[1] + '"]';
      const refill2 = (el, runs) => {
        el.textContent = '';
        for (const n of runsToNodes(runs || [])) el.appendChild(n);
      };
      for (const t of targets) {
        const host = t.cell ? pagesEl.querySelector(cellSel(t))
                            : pagesEl.querySelector('.blk[data-id="' + t.id + '"]');
        if (!host) continue;
        if (!alive.has(t.id)) { host.remove(); continue; }
        const b = r.blocks.find(x => x.id === t.id);
        if (t.cell) refill2(host, cellRuns(t.cell[0] === 'h' ? b.head[0][t.cell[1]]
                                                             : b.rows[t.cell[0]][t.cell[1]], getView()));
        else if (t.item === null || t.item === undefined) { if (b.runs) refill2(host, b.runs); }
      }
      cancelIdle();
      const caretHost = r.caret.cell ? pagesEl.querySelector(cellSel(r.caret))
                                     : pagesEl.querySelector('.blk[data-id="' + r.caret.id + '"]');
      if (caretHost) caretTo(caretHost, r.caret.pos);
      return;
    }
    const first = targets[0];
    const last = targets[targets.length - 1];
    const firstItem = first.item === null || first.item === undefined ? null : first.item;
    const hostEl = (t) => (t.item === null || t.item === undefined)
      ? pagesEl.querySelector('.blk[data-id="' + t.id + '"]')
      : pagesEl.querySelector('.blk[data-id="' + t.id + '"] .lst li[data-i="' + t.item + '"]');
    const firstHost = hostEl(first);
    if (!firstHost) return;
    const lastHost = hostEl(last);
    const r = deleteTargets(targets);
    if (!r) return;
    const doc = getDoc();
    const refill = (el, runs) => {
      el.textContent = '';
      for (const n of runsToNodes(runs || [])) el.appendChild(n);
    };
    const firstB = doc.blocks.find(b => b.id === first.id);
    refill(firstHost, firstItem === null ? firstB.runs : firstB.items[firstItem]);
    if (r.split && lastHost && lastHost !== firstHost) {
      // 갈라 두기 — 끝 칸을 지우지 않고 꼬리로 갈아 끼운다
      const lastB = doc.blocks.find(b => b.id === r.caretTail.id);
      refill(lastHost, r.caretTail.item === null ? lastB.runs : lastB.items[r.caretTail.item]);
    }
    const alive = new Set(doc.blocks.map(b => b.id));
    for (let i = 1; i < targets.length; i++) {
      const t = targets[i];
      if (r.split && i === targets.length - 1) continue;   // 끝 칸은 남는다
      if (!alive.has(t.id)) {
        const el = pagesEl.querySelector('.blk[data-id="' + t.id + '"]');
        if (el) el.remove();
      } else if (t.item !== null && t.item !== undefined) {
        const li = pagesEl.querySelector('.blk[data-id="' + t.id + '"] .lst li[data-i="' + t.item + '"]');
        if (li) li.remove();
      }
    }
    // 남은 목록 항목 번호를 모델과 다시 맞춘다 (안 맞으면 다음 타자가 엉뚱한 항목에 붙는다)
    for (const id of new Set(targets.map(t => t.id))) {
      if (!alive.has(id)) continue;
      pagesEl.querySelectorAll('.blk[data-id="' + id + '"] .lst li')
        .forEach((li, i) => { li.dataset.i = String(i); });
    }
    cancelIdle();
    caretTo(firstHost, r.caret.pos);
  }

  // ── 구조 지킴이 ──
  pagesEl.addEventListener('beforeinput', (e) => {
    const t = e.inputType;
    if (t === 'historyUndo' || t === 'historyRedo') { e.preventDefault(); return; } // Ctrl+Z 는 main.js
    if (t === 'insertFromDrop') { e.preventDefault(); return; }  // 글 끌어놓기는 아직 — 구조가 깨진다
    if (composing || t === 'insertCompositionText') return;      // 조합은 compositionstart 가 처리했다

    const targets = crossTargets();
    if (targets.length > 1) {
      if (targets.some(x => x.cell)) {
        // 표가 낀 걸침 — 표 구조는 남고 칸 속만 비운다(계획 R5·R6). Enter 도 가르지 않는다.
        e.preventDefault();
        const doc = getDoc();
        const r = deleteMixed(doc.blocks, targets, getView());
        if (!r) return;
        setDoc(Object.assign({}, doc, { blocks: r.blocks }));
        let text = '';
        if (t === 'insertText' && e.data) text = e.data;
        if (t === 'insertFromPaste' && e.dataTransfer) text = e.dataTransfer.getData('text/plain') || '';
        const c = text ? insertLinesAt(r.caret, text)
                       : Object.assign({}, r.caret, { pos: r.caret.pos });
        cancelIdle();
        redraw({ caret: c });
        return;
      }
      // 여러 칸에 걸친 편집 — 브라우저가 블록을 제멋대로 병합하기 전에 우리가 지운다.
      // 워드 규칙(실측 2026-08-30): 엔터는 항상 가르고, 지우기·타자는 deleteAcross 의
      // 자동 규칙(양쪽 다 글자를 물었으면 가르고, 경계만 물렸으면 합친다)을 따른다.
      e.preventDefault();
      const r = deleteTargets(targets, t === 'insertParagraph' ? { break: true } : null);
      if (!r) return;
      if (t === 'insertParagraph') {
        cancelIdle();
        redraw({ caret: r.caretTail });
        return;
      }
      let text = '';
      if (t === 'insertText' && e.data) text = e.data;
      if (t === 'insertFromPaste' && e.dataTransfer) text = e.dataTransfer.getData('text/plain') || '';
      const c2 = text ? insertLinesAt(r.caret, text)
                      : { id: r.caret.id, item: r.caret.item, pos: r.caret.pos };
      cancelIdle();
      redraw({ caret: c2 });
      return;
    }

    // 섹션 줄이 낀 선택 지우기 (글 칸 없이 섹션만 문 경우 — 통짜 섬이라 직접 지운다)
    const s = window.getSelection();
    const collapsed = !s.rangeCount || s.getRangeAt(0).collapsed;
    if (!collapsed && (t === 'deleteContentBackward' || t === 'deleteContentForward'
        || t === 'insertText' || t === 'insertParagraph')) {
      const secs = coveredSections(s.getRangeAt(0));
      if (secs.length && targets.length === 0) {
        e.preventDefault();
        let doc = getDoc();
        let blocks = doc.blocks;
        for (const sec of secs) blocks = removeBlock(blocks, sec.id);
        setDoc(Object.assign({}, doc, { blocks }));
        cancelIdle();
        redraw({});
        return;
      }
    }

    if (t === 'insertParagraph') {
      e.preventDefault();
      const blk2 = activeBlockEl(pagesEl);
      const cap2 = blk2 && activeCapEl(blk2);
      if (cap2) { enterInCap(blk2, cap2); return; }   // 캡션 Enter = 캡션 안 줄바꿈
      const td = blk2 && activeCellEl(blk2);
      if (td) { enterInCell(blk2, td); return; }   // 칸 안 Enter = 줄바꿈(계획 R1)
      enterAt();
      return;
    }
    if (t === 'deleteContentBackward' && collapsed) { if (mergeAt(-1)) e.preventDefault(); return; }
    if (t === 'deleteContentForward' && collapsed) { if (mergeAt(1)) e.preventDefault(); return; }

    // 표를 붙여넣으면 «표»로 들어온다 (2026-08-30 SKY). 워드·엑셀에서 복사한 표도 같다.
    // ⚠ 표 칸 «안»에 표를 붙이는 것은 표 속의 표가 되어 버리니 하지 않는다(글자로 들어간다).
    if (t === 'insertFromPaste' && e.dataTransfer) {
      const html = e.dataTransfer.getData('text/html') || '';
      const blkT = activeBlockEl(pagesEl);
      const inCellT = blkT && activeCellEl(blkT);
      if (html.indexOf('<table') >= 0 && blkT && !inCellT && targets.length < 2) {
        const t2 = tableFromHtml(html);
        if (t2) {
          e.preventDefault();
          flush(false);
          const doc = getDoc();
          const got = adoptTable(t2, doc.assets);
          const made = got.block;
          setDoc(Object.assign({}, doc, { assets: got.assets,
            blocks: insertAfter(doc.blocks, blkT.dataset.id, made) }));
          cancelIdle();
          const first = made.head && made.head.length ? ['h', 0] : (made.rows.length ? [0, 0] : null);
          redraw(first ? { caret: { id: made.id, cell: first, pos: 0 } } : {});
          return;
        }
      }
    }

    // 여러 줄 붙여넣기 — 줄마다 문단이 되도록 우리가 넣는다(브라우저에 맡기면 한 문단에
    // 통째로 들어가 그 덩어리가 다음 장으로 밀린다). 표 칸 안은 줄바꿈이 정상이라 그대로.
    if (t === 'insertFromPaste' && e.dataTransfer) {
      const raw = e.dataTransfer.getData('text/plain') || '';
      if (raw.indexOf('\n') >= 0 || raw.indexOf('\r') >= 0) {
        const blk3 = activeBlockEl(pagesEl);
        const td3 = blk3 && activeCellEl(blk3);
        if (blk3 && !td3) {
          e.preventDefault();
          flush(false);
          const li3 = activeItemEl(blk3);
          const host3 = li3 || blk3;
          const rg3 = rangeIn(host3);
          if (!rg3) return;
          const c3 = insertLinesAt({ id: blk3.dataset.id, item: li3 ? Number(li3.dataset.i) : null,
                                     pos: rg3.from, end: rg3.to }, raw);
          cancelIdle();
          redraw({ caret: c3 });
          return;
        }
      }
    }
    // 그 밖(칸 안 타자·지우기·붙여넣기·Shift+Enter 줄바꿈)은 브라우저가 하고 flush 가 되읽는다
  });

  // 여러 줄 글을 넣는다 — 줄마다 문단(목록이면 항목)이 하나씩 된다. 워드와 같다.
  // ⛔ 한 문단에 통째로 넣으면 그 블록이 아주 길어지고, 장 나눔은 «블록을 쪼개지 않는»
  //    규칙이라 그 덩어리가 통째로 다음 장으로 밀린다 — 붙여넣은 글이 «사라진 것처럼»
  //    보인다(2026-08-30 SKY). 표 칸 안에서는 줄바꿈이 «칸 안 줄바꿈»이라 그대로 둔다.
  // caret.end 가 있으면 pos~end 구간을 덮어쓴다(칸 안에 고른 구간이 있을 때).
  // 반환: 넣고 난 뒤의 커서 좌표.
  function insertLinesAt(caret, text) {
    const lines = String(text).split(/\r\n|\r|\n/);
    const end = caret.end === undefined ? caret.pos : caret.end;
    if (lines.length < 2 || caret.cell) {
      insertAtCaret(caret, text);
      return { id: caret.id, item: caret.item, cell: caret.cell, pos: caret.pos + text.length };
    }
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === caret.id);
    if (!b) return caret;
    const isItem = caret.item !== null && caret.item !== undefined && Array.isArray(b.items);
    const src = isItem ? b.items[caret.item] : b.runs;
    if (!Array.isArray(src)) { insertAtCaret(caret, text); return caret; }
    const len = runsLength(src);
    const head = sliceRuns(src, 0, caret.pos);
    const tail = sliceRuns(src, Math.min(end, len), len);
    const lastLine = lines[lines.length - 1];
    const first = normalizeRuns(head.concat(runsFromText(lines[0])));
    const rest = lines.slice(1);

    if (isItem) {
      const items = b.items.slice();
      items[caret.item] = first;
      const made = rest.map((s, i) => (i === rest.length - 1
        ? normalizeRuns(runsFromText(s).concat(tail)) : runsFromText(s)));
      items.splice(caret.item + 1, 0, ...made);
      setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, b.id, { items }) }));
      return { id: b.id, item: caret.item + rest.length, pos: lastLine.length };
    }
    const fresh = rest.map((s, i) => createBlock('para', {
      runs: i === rest.length - 1 ? normalizeRuns(runsFromText(s).concat(tail)) : runsFromText(s),
    }));
    if (Array.isArray(b.variants)) for (const f of fresh) f.variants = b.variants;   // 새 문단도 같은 판에(P7)
    let blocks = replaceBlock(doc.blocks, b.id, { runs: first });
    const at = blocks.findIndex(x => x.id === b.id);
    blocks = blocks.slice(0, at + 1).concat(fresh, blocks.slice(at + 1));
    setDoc(Object.assign({}, doc, { blocks }));
    return { id: fresh[fresh.length - 1].id, item: null, pos: lastLine.length };
  }

  function insertAtCaret(caret, text) {
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === caret.id);
    if (!b) return;
    let patch;
    if (caret.cell) {
      if (b.type !== 'table') return;
      if (caret.cell[0] === 'h') {
        const head = [b.head[0].slice()];
        const hc = head[0][caret.cell[1]];
        head[0][caret.cell[1]] = cellPut(hc, insertText(cellRuns(hc, getView()), caret.pos, text), getView());
        patch = { head };
      } else {
        const rows = b.rows.slice();
        const row = rows[caret.cell[0]].slice();
        const rc = row[caret.cell[1]];
        row[caret.cell[1]] = cellPut(rc, insertText(cellRuns(rc, getView()), caret.pos, text), getView());
        rows[caret.cell[0]] = row;
        patch = { rows };
      }
    } else if (caret.item === null || caret.item === undefined) {
      patch = { runs: insertText(b.runs, caret.pos, text) };
    } else {
      const items = b.items.slice();
      items[caret.item] = insertText(items[caret.item], caret.pos, text);
      patch = { items };
    }
    setDoc(Object.assign({}, getDoc(), { blocks: replaceBlock(getDoc().blocks, b.id, patch) }));
  }

  // 엔터 — 커서 자리에서 가른다 (뒷부분이 새 문단/항목이 된다. 워드와 같다)
  function enterAt() {
    flush(false);
    const blk = activeBlockEl(pagesEl);
    if (!blk) return;
    const li = activeItemEl(blk);
    const host = li || blk;
    const r = rangeIn(host);
    if (!r) return;
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === blk.dataset.id);
    if (!b) return;

    if (li && Array.isArray(b.items)) {
      const i = Number(li.dataset.i);
      const item = b.items[i] || [];
      if (!runsLength(item)) {
        // 빈 항목에서 엔터 → 그 항목을 빼고 목록을 벗어나 문단이 된다
        const items = b.items.slice();
        items.splice(i, 1);
        const fresh = createBlock('para');
        if (Array.isArray(b.variants)) fresh.variants = b.variants;   // 나온 문단도 같은 판에(P7)
        let blocks;
        if (items.length) {
          blocks = insertAfter(replaceBlock(doc.blocks, b.id, { items }), b.id, fresh);
        } else {
          // ⛔ removeBlock 뒤에 insertAfter 를 쓰면 기준 id 가 이미 없어 오류가 난다
          blocks = doc.blocks.slice();
          blocks[blocks.findIndex(x => x.id === b.id)] = fresh;
        }
        setDoc(Object.assign({}, doc, { blocks }));
        cancelIdle();
        redraw({ caret: { id: fresh.id, item: null, pos: 0 } });
        return;
      }
      const items = b.items.slice();
      items[i] = sliceRuns(item, 0, r.from);
      items.splice(i + 1, 0, sliceRuns(item, r.to, runsLength(item)));
      setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, b.id, { items }) }));
      cancelIdle();
      redraw({ caret: { id: b.id, item: i + 1, pos: 0 } });
      return;
    }

    if (!Array.isArray(b.runs)) return;
    const before = sliceRuns(b.runs, 0, r.from);
    const after = sliceRuns(b.runs, r.to, runsLength(b.runs));
    const fresh = createBlock('para', { runs: after });
    if (Array.isArray(b.variants)) fresh.variants = b.variants;   // 가른 두 쪽 다 물려받는다(P7)
    const blocks = insertAfter(replaceBlock(doc.blocks, b.id, { runs: before }), b.id, fresh);
    setDoc(Object.assign({}, doc, { blocks }));
    cancelIdle();
    redraw({ caret: { id: fresh.id, item: null, pos: 0 } });
  }

  // 칸 안 Enter — 새 블록이 아니라 칸 «안» 줄바꿈이다(계획 R1). 워드도 화면상 같다.
  function enterInCell(blk, td) {
    flush(false);
    const r = rangeIn(td);
    if (!r) return;
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === blk.dataset.id);
    if (!b || b.type !== 'table') return;
    const cell = [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)];
    const cellObj = cell[0] === 'h' ? b.head[0][cell[1]] : b.rows[cell[0]][cell[1]];
    const src = cellRuns(cellObj, getView());
    const len = runsLength(src || []);
    const runs = sliceRuns(src || [], 0, r.from).concat([{ t: '\n' }], sliceRuns(src || [], r.to, len));
    let patch;
    if (cell[0] === 'h') {
      const head = [b.head[0].slice()];
      head[0][cell[1]] = cellPut(b.head[0][cell[1]], runs, getView());
      patch = { head };
    } else {
      const rows = b.rows.slice();
      const row = rows[cell[0]].slice();
      row[cell[1]] = cellPut(b.rows[cell[0]][cell[1]], runs, getView());
      rows[cell[0]] = row;
      patch = { rows };
    }
    setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, b.id, patch) }));
    cancelIdle();
    redraw({ caret: { id: b.id, cell, pos: r.from + 1 } });
  }

  // 캡션 안 Enter — 새 블록이 아니라 캡션 «안» 줄바꿈이다(표 칸과 같은 규칙)
  function enterInCap(blk, capEl) {
    flush(false);
    const r = rangeIn(capEl);
    if (!r) return;
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === blk.dataset.id);
    if (!b || b.type !== 'image') return;
    const src = b.caption || [];
    const len = runsLength(src);
    const runs = sliceRuns(src, 0, r.from).concat([{ t: '\n' }], sliceRuns(src, r.to, len));
    setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, b.id, { caption: runs }) }));
    cancelIdle();
    redraw({ caret: { id: b.id, cap: 1, pos: r.from + 1 } });
  }

  // Tab — 다음/이전 칸으로. 마지막 칸에서 Tab 은 행을 늘린다(계획 R2, 워드와 같다).
  function moveCell(blk, td, dir) {
    flush(false);
    const id = blk.dataset.id;
    const tds = Array.from(pagesEl.querySelectorAll(
      '.blk-table[data-id="' + id + '"] td[data-r]'));
    const i = tds.indexOf(td);
    const next = tds[i + dir];
    if (next) { caretTo(next, dir > 0 ? 0 : Number.MAX_SAFE_INTEGER); return; }
    if (dir < 0) return;
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === id);
    if (!b || b.type !== 'table') return;
    const t2 = addRow(b, b.rows.length);
    // 행 보임(rowv)도 행과 함께 나른다 — 안 나르면 행 연산 뒤 보임이 엉뚱한 행에 붙는다(설계_판 P6)
    setDoc(Object.assign({}, doc, {
      blocks: replaceBlock(doc.blocks, id, { rows: t2.rows, rowv: t2.rowv }) }));
    cancelIdle();
    redraw({ caret: { id, cell: [b.rows.length, 0], pos: 0 } });
  }

  pagesEl.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const blk = activeBlockEl(pagesEl);
    const td = blk && activeCellEl(blk);
    if (!td) return;                 // 표 밖 Tab 은 지금대로(브라우저)
    e.preventDefault();
    moveCell(blk, td, e.shiftKey ? -1 : 1);
  });

  // 블록 경계의 Backspace(-1)·Delete(+1) — 브라우저가 블록 DOM 을 제멋대로 합치기 전에
  // 우리가 병합한다. 이웃이 섹션 줄이면 섹션을 지운다. 처리했으면 true.
  function mergeAt(dir) {
    const s = window.getSelection();
    if (!s.rangeCount) return false;
    const blk = activeBlockEl(pagesEl);
    if (!blk) return false;
    const capH = activeCapEl(blk);
    if (capH) {
      // 캡션 경계 — 캡션 밖으로 새 나가는 병합은 없다(표 칸과 같은 규칙)
      const p = offsetIn(capH, s.anchorNode, s.anchorOffset);
      if (dir < 0 && p === 0) return true;
      if (dir > 0 && p >= textLen(capH)) return true;
      return false;                                      // 캡션 안 지우기 — 브라우저가 한다
    }
    const tdHost = activeCellEl(blk);
    if (tdHost) {
      // 칸 경계 지우기 — 칸 밖으로 새 나가는 병합은 하지 않는다(계획 R3, 워드와 같다).
      const p = offsetIn(tdHost, s.anchorNode, s.anchorOffset);
      if (dir < 0 && p === 0) return true;                 // 브라우저가 못 하게 막기만 한다
      if (dir > 0 && p >= textLen(tdHost)) return true;
      return false;                                        // 칸 안 지우기 — 브라우저가 한다
    }
    const li = activeItemEl(blk);
    const host = li || blk;
    const pos = offsetIn(host, s.anchorNode, s.anchorOffset);
    if (dir < 0 && pos !== 0) return false;              // 칸 안 지우기 — 브라우저가 한다
    if (dir > 0 && pos < textLen(host)) return false;
    flush(false);

    // 목록의 첫/끝 항목이 아니면 같은 목록의 이웃 항목과 병합 — 아래 공통 경로가 처리
    const edgeItem = li ? (dir < 0 ? Number(li.dataset.i) === 0 : !li.nextElementSibling) : true;
    if (edgeItem) {
      const doc = getDoc();
      // 판 보기에서 «이웃»은 모델 순서가 아니라 화면에 보이는 순서다 — 숨은 블록을
      // 건너뛰지 않으면 안 보이는 것이 지워진다(P7)
      const nb = visibleNeighbor(doc.blocks, blk.dataset.id, dir, getView());
      if (!nb) return true;                              // 문서의 처음/끝 — 아무 일도 없다
      if (nb.type === 'section') {
        setDoc(Object.assign({}, doc, { blocks: removeBlock(doc.blocks, nb.id) }));
        cancelIdle();
        redraw({ caret: { id: blk.dataset.id, item: li ? Number(li.dataset.i) : null, pos } });
        return true;
      }
      if (nb.type === 'table') return true;                // 문단이 표로 빨려 들지 않는다(계획 R4)
    }
    const els = editableEls(pagesEl);
    const i = els.indexOf(host);
    const other = els[i + dir];
    if (!other) return true;
    if (other.matches && other.matches('td[data-r]')) return true;   // 경계 너머가 표 칸 — 병합 금지
    if (other.matches && other.matches('.cap')) return true;         // 경계 너머가 캡션 — 병합 금지
    const at = (el, end) => {
      const l = el.matches('.lst li[data-i]') ? el : null;
      const bk = l ? l.closest('.blk[data-id]') : el;
      const p = end ? textLen(el) : 0;
      return { id: bk.dataset.id, item: l ? Number(l.dataset.i) : null, from: p, to: p };
    };
    const pair = dir < 0 ? [at(other, true), at(host, false)] : [at(host, true), at(other, false)];
    const r = deleteTargets(pair);   // 경계만 문 대상 — 자동 규칙이 합친다
    if (!r) return false;
    cancelIdle();
    redraw({ caret: r.caret });
    return true;
  }

  // 칸을 끄는 동안에는 열 손잡이의 파란 강조를 끈다 (2026-08-30 SKY) —
  // 그때는 열 너비를 바꾸는 게 아니라 칸을 고르는 중이라, 손끝이 손잡이 위를 지날 때마다
  // 파래지면 «지금 열을 끌고 있나?» 하고 헷갈린다. 열 손잡이에서 «시작»한 끌기는 예외다.
  pagesEl.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('.colgrip')) return;
    pagesEl.classList.add('picking');
  });
  const endPick = () => pagesEl.classList.remove('picking');
  document.addEventListener('pointerup', endPick);
  document.addEventListener('pointercancel', endPick);

  // ⭐ 끄는 동안 «몇 px 인지»를 보여 준다 (2026-09-01 SKY: "행열의 너비 수치를 알고 싶어.")
  //    전에는 눈으로 어림잡을 수밖에 없어서, 두 표의 열을 같게 맞추는 일이 거의 불가능했다.
  // ⚠ 양쪽 폭을 «둘 다» 보여 준다 — 열 하나를 넓히면 옆 열이 그만큼 좁아지므로, 한쪽만
  //   보면 «전체가 늘어난다»고 오해한다.
  // ⛔ 종이 안에 넣지 않는다 — body 에 띄운다. 종이 안에 두면 편집층(#pages)의 글자 번호
  //    셈에 끼어들어 커서가 엉뚱한 곳을 문다(설계_판.md P9 와 같은 이유).
  let 수치el = null;
  function 수치보이기(anchor, w1, w2) {
    if (!수치el) {
      수치el = document.createElement('div');
      수치el.id = 'colsize';
      수치el.setAttribute('contenteditable', 'false');
      document.body.appendChild(수치el);
    }
    수치el.textContent = Math.round(w1) + ' px  |  ' + Math.round(w2) + ' px';
    const r = anchor.getBoundingClientRect();
    수치el.style.left = Math.round(r.x + r.width / 2) + 'px';
    수치el.style.top = Math.round(r.top - 6) + 'px';
    수치el.classList.add('on');
  }
  function 수치숨기기() { if (수치el) 수치el.classList.remove('on'); }

  // ── 열 너비 끌기 — 끄는 동안은 colgroup 만 미리보기로 바꾸고, 놓으면 모델에 적는다 ──
  let grip = null;   // { id, col, startX, startW, pairW, cols:[colgroup,…] }
  pagesEl.addEventListener('pointerdown', (e) => {
    const g = e.target.closest && e.target.closest('.colgrip');
    if (!g) return;
    e.preventDefault();
    const blkEl = g.closest('.blk-table[data-id]');
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === blkEl.dataset.id);
    if (!b) return;
    const col = Number(g.dataset.col);
    // 눈금(손잡이)은 왼쪽부터 이 경계까지의 폭에 놓여 있다 — 끌 때 같이 옮기려면 그 값이 필요하다
    const left0 = b.cols.slice(0, col).reduce((s, c) => s + (c.w || 0), 0);
    grip = { id: b.id, col, startX: e.clientX,
      startW: b.cols[col].w, pairW: b.cols[col].w + b.cols[col + 1].w, left0,
      cols: Array.from(pagesEl.querySelectorAll('.blk-table[data-id="' + b.id + '"] colgroup')),
      // 같은 경계의 눈금은 장마다 하나씩 있다(이어진 장의 보기 전용 눈금 포함) — 전부 같이 옮긴다
      grips: Array.from(pagesEl.querySelectorAll(
        '.blk-table[data-id="' + b.id + '"] .colgrip[data-col="' + col + '"]')) };
    g.classList.add('on');
    수치보이기(g, grip.startW, grip.pairW - grip.startW);
    try { g.setPointerCapture(e.pointerId); } catch (err) { /* 합성 이벤트에는 없다 */ }
  });
  pagesEl.addEventListener('pointermove', (e) => {
    if (!grip) return;
    const w = Math.max(30, Math.min(grip.startW + (e.clientX - grip.startX), grip.pairW - 30));
    for (const cg of grip.cols) {                          // 모든 조각의 colgroup 을 같이
      cg.children[grip.col].style.width = w + 'px';
      cg.children[grip.col + 1].style.width = (grip.pairW - w) + 'px';
    }
    // ⭐ 눈금도 손끝을 따라간다 — 전에는 놓는 순간에야 제자리를 찾아 «선이 안 따라온다» 고 보였다
    for (const gg of grip.grips) gg.style.left = (grip.left0 + w - 3) + 'px';
    수치보이기(grip.grips[0], w, grip.pairW - w);
  });
  // ⚠ 어느 경계를 끌었는지는 e.target 이 아니라 grip 에서 읽는다 — setPointerCapture 덕에
  //   손잡이 밖에서 놓아도 이벤트는 오지만, target 을 믿으면 꼬인다.
  pagesEl.addEventListener('pointerup', (e) => {
    if (!grip) return;
    const { id, col, startX, startW, pairW } = grip;
    grip = null;
    pagesEl.querySelectorAll('.colgrip.on').forEach(x => x.classList.remove('on'));
    수치숨기기();
    const w = Math.max(30, Math.min(startW + (e.clientX - startX), pairW - 30));
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === id);
    if (!b || b.type !== 'table') return;
    const next = setColWidth(b, col, w);
    setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, id, { cols: next.cols }) }));
    cancelIdle();
    redraw({ keepCaret: true });
  });

  // ── 손가락으로 칸 고르기 (2026-08-30 SKY: "태블릿으로 손가락으로 드래그 칸이 골라지지 않아") ──
  // 터치에서는 그냥 끌면 브라우저가 «화면 넘기기»로 받아 글이 안 골라진다. 그래서 표 안에서만
  // 우리가 가로챈다. ⚠ 세로로 먼저 움직이면 화면 넘기기로 두고(표를 지나 아래로 읽어야 하니까),
  // 가로로 먼저 움직였을 때만 칸 고르기로 본다.
  let touchPick = null;   // { td, mode:'undecided'|'select'|'scroll', x0, y0 }
  // ⚠ 열 손잡이(.colgrip)가 칸 위를 7px 덮고 있다 — 그 자리를 짚으면 손잡이만 잡혀
  //   «칸이 없다» 고 나온다. 겹친 것을 다 훑어 «칸» 을 찾는다(실측 2026-08-30).
  const tdAt = (x, y) => {
    for (const el of document.elementsFromPoint(x, y)) {
      const td = el && el.closest ? el.closest('.blk-table td[data-r]') : null;
      if (td) return td;
    }
    return null;
  };
  pagesEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { touchPick = null; return; }
    const t = e.touches[0];
    const td = tdAt(t.clientX, t.clientY);
    touchPick = td ? { td, mode: 'undecided', x0: t.clientX, y0: t.clientY } : null;
  }, { passive: true });
  pagesEl.addEventListener('touchmove', (e) => {
    if (!touchPick || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - touchPick.x0;
    const dy = t.clientY - touchPick.y0;
    if (touchPick.mode === 'undecided') {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;      // 아직 어느 쪽인지 모른다
      touchPick.mode = Math.abs(dx) > Math.abs(dy) ? 'select' : 'scroll';
    }
    if (touchPick.mode !== 'select') return;
    const td = tdAt(t.clientX, t.clientY);
    const same = td && td.closest('.blk[data-id]') === touchPick.td.closest('.blk[data-id]');
    if (!same) return;                                      // 표 밖으로 나가면 그냥 둔다
    e.preventDefault();                                     // 화면이 밀리지 않게
    const a = nodeAt(touchPick.td, 0);
    const b = nodeAt(td, textLen(td));
    const s = window.getSelection();
    s.removeAllRanges();
    s.setBaseAndExtent(a.node, a.offset, b.node, b.offset);
  }, { passive: false });
  const endTouch = () => { touchPick = null; };
  pagesEl.addEventListener('touchend', endTouch, { passive: true });
  pagesEl.addEventListener('touchcancel', endTouch, { passive: true });

  // ── 칸이 골라진 것을 «보이게» 칠한다 (2026-08-30 SKY: "셀이 선택 되게 해줘") ──
  // 브라우저의 글자 선택 파란색만으로는 «칸이 골라졌다»가 안 보인다. 칸 통째로 무는
  // 선택이면 그 td 에 표시를 달고, CSS 가 칸 전체를 칠한다.
  function paintCells() {
    for (const td of pagesEl.querySelectorAll('td.cellsel')) td.classList.remove('cellsel');
    for (const t of pagesEl.querySelectorAll('.blk-table.cells-picking')) t.classList.remove('cells-picking');
    const cells = wholeCellsIn(pagesEl);
    for (const td of cells) {
      td.classList.add('cellsel');
      // 그 표에서는 브라우저의 «글자 파란색»을 끈다 — 네모 밖 칸이 파랗게 남으면 헷갈린다
      const t = td.closest('.blk-table');
      if (t) t.classList.add('cells-picking');
    }
  }
  document.addEventListener('selectionchange', paintCells);

  // 고른 구간의 «글»을 뽑는다 — 잘라내기가 클립보드에 담을 값이다.
  // 표 칸은 한 행을 탭으로 잇고 행마다 줄을 바꾼다(엑셀에 그대로 붙는 모양).
  // ⚠ 경계만 문 칸(from===to)은 글이 없으니 뺀다 — 넣으면 빈 줄이 생긴다.
  function targetsText(targets) {
    const doc = getDoc();
    const rows = new Map();     // '블록id/행' → 그 행의 칸 글 목록
    const lines = [];
    for (const t of targets) {
      if (t.to <= t.from) continue;
      const b = doc.blocks.find(x => x.id === t.id);
      if (!b) continue;
      let runs = null;
      if (t.cell) {
        const row = t.cell[0] === 'h' ? (b.head && b.head[0]) : (b.rows && b.rows[t.cell[0]]);
        // 복사되는 것은 «지금 보이는 값»이다 — 판 보기에서 딴 판 값이 담기면 안 된다(P8)
        runs = row && row[t.cell[1]] ? cellRuns(row[t.cell[1]], getView()) : null;
      } else if (t.item === null || t.item === undefined) runs = b.runs;
      else runs = b.items && b.items[t.item];
      if (!Array.isArray(runs)) continue;
      const s = runsText(sliceRuns(runs, t.from, t.to));
      if (t.cell) {
        const key = t.id + '/' + t.cell[0];
        if (!rows.has(key)) { rows.set(key, []); lines.push(rows.get(key)); }
        rows.get(key).push(s);
      } else lines.push(s);
    }
    return lines.map(l => (Array.isArray(l) ? l.join('\t') : l)).join('\n');
  }

  // 붙여넣기로 들어온 <table> 을 우리 표 블록으로 바꾼다 (2026-08-30 SKY).
  // 워드·엑셀·이 편집기가 담은 표를 다 받는다. 서식은 걸러내고 «글자와 격자»만 가져온다
  // — 붙여넣기는 원래 서식을 거르는 것이 이 프로그램의 방침이다.
  function tableFromHtml(html) {
    const doc0 = new DOMParser().parseFromString(html, 'text/html');
    const tbl = doc0.querySelector('table');
    if (!tbl) return null;
    const trs = Array.from(tbl.querySelectorAll('tr'));
    if (!trs.length) return null;
    // 격자를 직사각형으로 편다 — 병합(colspan/rowspan)은 덮인 자리를 cov 로 채운다
    const grid = [];
    const put = (r, c, cell) => {
      while (grid.length <= r) grid.push([]);
      grid[r][c] = cell;
    };
    trs.forEach((tr, r) => {
      let c = 0;
      for (const td of Array.from(tr.children)) {
        while (grid[r] && grid[r][c]) c += 1;
        const cs = Math.max(1, Number(td.getAttribute('colspan')) || 1);
        const rs = Math.max(1, Number(td.getAttribute('rowspan')) || 1);
        const txt = (td.innerText !== undefined ? td.innerText : td.textContent) || '';
        // 눈에 안 보이는 «붙는 공백»(nbsp)은 보통 공백으로 — 워드·엑셀이 그걸로 채워 보낸다
        const runs = runsFromText(txt.replace(/\u00a0/g, ' ').trim());
        // 칸 속 그림 — 글자와 격자만 받는 방침 그대로, 그림은 임시 표기로 얹어
        // 붙여넣는 쪽(adoptTable)이 보관함에 담는다. 원격 주소는 버린다(설계 5장).
        for (const im of Array.from(td.querySelectorAll('img'))) {
          const isrc = im.getAttribute('src') || '';
          if (isrc.indexOf('data:image/') !== 0) continue;
          runs.push({ t: OBJ, src$: isrc,
            w: Number(im.getAttribute('width')) || 0, h: Number(im.getAttribute('height')) || 0 });
        }
        const cell = { runs };
        if (cs > 1) cell.cs = cs;
        if (rs > 1) cell.rs = rs;
        put(r, c, cell);
        for (let i = 0; i < rs; i++) for (let j = 0; j < cs; j++) {
          if (i || j) put(r + i, c + j, { runs: [], cov: 1 });
        }
        c += cs;
      }
    });
    const ncols = grid.reduce((n, row) => Math.max(n, row.length), 0);
    if (!ncols) return null;
    for (const row of grid) for (let c = 0; c < ncols; c++) if (!row[c]) row[c] = { runs: [] };
    // ⭐ «복사한 그대로» 붙인다(2026-08-30 SKY) — <thead> 가 있을 때만 머리글이 된다.
    //    몸통 한 행만 복사했으면 머리글 없는 표가 되고, 빈 행을 억지로 만들지 않는다.
    //    머리글이 필요하면 도구모음 「머리글」 버튼으로 언제든 켠다.
    //    ⚠ 엑셀·워드가 담은 표에는 <thead> 가 없다 — 그때도 머리글 없이 들어온다.
    const hasHead = !!tbl.querySelector('thead tr');
    const head = hasHead ? [grid[0].slice(0, ncols)] : [];
    const rows = (hasHead ? grid.slice(1) : grid).map(r => r.slice(0, ncols));
    if (!head.length && !rows.length) return null;
    const made = createBlock('table', {
      cols: Array.from({ length: ncols }, () => ({ w: Math.floor(674 / ncols) })),
      head, rows,
    });
    // 열 너비 합을 텍스트 폭에 맞춘다 — 안 맞추면 표가 종이 밖으로 나간다
    const pg = getDoc().page;
