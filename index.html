    return Object.assign(made, normalizeWidths(made, pg.width - pg.margin.left - pg.margin.right));
  }

  // 붙여넣은 표의 그림(임시 표기)을 보관함에 담는다 — 칸마다 adoptImages
  function adoptTable(t2, assets0) {
    let assets = assets0;
    const fix = (row) => row.map((cell) => {
      if (!cell || !Array.isArray(cell.runs)) return cell;
      const got = adoptImages(cell.runs, assets);
      assets = got.assets;
      return Object.assign({}, cell, { runs: got.runs });
    });
    return { block: Object.assign({}, t2,
      { head: (t2.head || []).map(fix), rows: (t2.rows || []).map(fix) }), assets };
  }

  // 고른 표 칸들을 «표 모양»으로도 담는다 (2026-08-30 SKY: "표 자체도 복사 되게").
  // 글자만 담으면 워드·엑셀에 붙일 때 줄글이 된다 — text/html 로 <table> 을 같이 담으면
  // 워드·엑셀·이 편집기 모두 «표»로 받는다. 표 밖 대상이 섞이면 표로 안 담는다.
  function targetsTableHtml(targets) {
    const cells = targets.filter(t => t.cell);
    if (!cells.length || cells.length !== targets.filter(t => t.to > t.from || t.cell).length) return '';
    const id = cells[0].id;
    if (cells.some(t => t.id !== id)) return '';          // 표가 둘이면 표로 안 담는다
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === id);
    if (!b || b.type !== 'table') return '';
    // ⭐ 머리글 칸은 <thead> 로 담는다 — «복사한 그대로» 붙이려면 그 행이 머리글이었는지가
    //    함께 실려야 한다(2026-08-30 SKY). 몸통 한 행만 복사하면 머리글 없는 표가 된다.
    const headRow = [];
    const bodyRows = new Map();
    for (const t of cells) {
      if (t.cell[0] === 'h') headRow.push(t);
      else {
        const key = String(t.cell[0]);
        if (!bodyRows.has(key)) bodyRows.set(key, []);
        bodyRows.get(key).push(t);
      }
    }
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    // 칸 속 그림도 함께 담아야 «복사 → 붙여넣기» 왕복이 된다. 글자는 esc, 그림은 <img>.
    const runsHtml = (rs) => rs.map((r) => {
      if (r && r.img) {
        const a = getDoc().assets[r.img];
        if (!a) return '';
        return '<img src="' + a.data + '" width="' + (r.w || a.w) + '" height="' + (r.h || a.h) + '">';
      }
      return esc((r && r.t) || '');
    }).join('');
    const tr = (list, tag) => {
      list.sort((x, y) => x.cell[1] - y.cell[1]);
      return '<tr>' + list.map((t) => {
        const row = t.cell[0] === 'h' ? (b.head && b.head[0]) : (b.rows && b.rows[t.cell[0]]);
        const cell = row && row[t.cell[1]];
        const runs = cell ? cellRuns(cell, getView()) : null;   // 보이는 값이 담긴다(P8)
        const span = (cell && cell.cs > 1 ? ' colspan="' + cell.cs + '"' : '')
                   + (cell && cell.rs > 1 ? ' rowspan="' + cell.rs + '"' : '');
        return '<' + tag + span + '>' + runsHtml(sliceRuns(runs || [], t.from, t.to))
             + '</' + tag + '>';
      }).join('') + '</tr>';
    };
    const parts = [];
    if (headRow.length) parts.push('<thead>' + tr(headRow, 'th') + '</thead>');
    if (bodyRows.size) {
      parts.push('<tbody>' + Array.from(bodyRows.values()).map(l => tr(l, 'td')).join('') + '</tbody>');
    }
    return '<table border="1">' + parts.join('') + '</table>';
  }

  // 클립보드에 담는다 — 글자(text/plain)는 늘, 표면 표 모양(text/html)도 함께.
  function putClipboard(dt, targets) {
    if (!dt) return;
    dt.setData('text/plain', targetsText(targets));
    const html = targetsTableHtml(targets);
    if (html) dt.setData('text/html', html);
  }

  // 복사(Ctrl+C) — 지우지는 않고 담기만 한다. 표면 표 모양으로도 담는다.
  // ⚠ 표가 아닌 보통 글은 브라우저 기본 복사가 더 낫다(서식까지 그대로) — 건드리지 않는다.
  pagesEl.addEventListener('copy', (e) => {
    const targets = crossTargets();
    if (targets.length < 2) return;
    if (!targetsTableHtml(targets)) return;               // 표가 아니면 브라우저에 맡긴다
    e.preventDefault();
    putClipboard(e.clipboardData, targets);
  });

  // 잘라내기(Ctrl+X) — 고른 글을 클립보드에 담고, 걸침 지우기와 «똑같은 규칙»으로 지운다.
  // ⛔ 예전에는 반쪽 지움을 막으려고 아무 일도 안 하게 막아 뒀다(2026-08-30 풀었다).
  // 한 칸 «안»의 잘라내기는 그대로 브라우저가 하고 flush 가 되읽는다.
  pagesEl.addEventListener('cut', (e) => {
    const targets = crossTargets();
    if (targets.length < 2) return;
    e.preventDefault();
    putClipboard(e.clipboardData, targets);
    if (targets.some(x => x.cell)) {
      // 표가 끼면 구조는 남기고 칸 «속»만 비운다(계획 R5·R6)
      const doc = getDoc();
      const r = deleteMixed(doc.blocks, targets, getView());
      if (!r) return;
      setDoc(Object.assign({}, doc, { blocks: r.blocks }));
      cancelIdle();
      redraw({ caret: r.caret });
      return;
    }
    const r = deleteTargets(targets);
    if (!r) return;
    cancelIdle();
    redraw({ caret: r.caret });
  });
}

/* history.js */
// 블록 배열·판 정의(variants)와 «그 편집 순간의 선택»을 함께 쌓는다. 블록은 제자리에서
// 안 고치므로 안 바뀐 블록은 여러 상태가 같은 객체를 가리킨다 — 그래서 가볍다.
// 판 정의 변경(추가·복제·이름·순서·삭제)도 한 걸음이다(설계_판.md P5).
// 되돌릴 때는 방금 무른 편집의 선택을 준다 — 드래그해 굵게 → Ctrl+Z 하면
// 그 드래그가 다시 칠해져 이어서 다른 서식을 입힐 수 있다(워드와 같다).
function createHistory(limit = 200) {
  const past = [];     // [{ blocks, variants, sel }]
  const future = [];
  return {
    push(blocks, sel, variants) {
      // ⛔ 견줄 값을 «쌓을 값과 똑같이» 먼저 다듬는다 — 판을 안 넘겨 준 자리(variants
      //    없음)는 null 로 쌓이는데, 다듬지 않고 견주면 null !== undefined 라서
      //    «같은 상태를 두 번 넣어도 두 걸음»이 되어 버린다.
      const vs = variants || null;
      const last = past[past.length - 1];
      if (last && last.blocks === blocks && last.variants === vs) return;
      past.push({ blocks, variants: vs, sel: sel || null });
      while (past.length > limit) past.shift();
      future.length = 0;
    },
    undo() {
      if (past.length < 2) return null;
      const undone = past.pop();
      future.push(undone);
      const top = past[past.length - 1];
      return { blocks: top.blocks, variants: top.variants, sel: undone.sel };
    },
    redo() {
      if (!future.length) return null;
      const next = future.pop();
      past.push(next);
      return { blocks: next.blocks, variants: next.variants, sel: next.sel };
    },
    // 그림 청소(sweepAssets)가 «기록이 아직 가리키는 그림»을 지키는 데 쓴다(설계 §2-3)
    blocksLists() { return past.concat(future).map(x => x.blocks); },
    canUndo() { return past.length >= 2; },
    canRedo() { return future.length > 0; },
    size() { return past.length; },
  };
}

/* toolbar.js */







// 고른 구간이 통째로 그 서식이면 끄고, 아니면 켠다 (워드와 같다)
function allMarked(runs, from, to, key) {
  const part = sliceRuns(runs, from, to);
  return part.length > 0 && part.every(r => !!r[key]);
}

// alignPicked(align) → boolean : «고른 그림이 있으면 그것을 정렬하고 참을 돌려주는» 함수.
// 그림 쪽(image.js)이 만들어 주고 main.js 가 넘긴다. 없으면 지금까지와 똑같이 돈다.
// getView() = 지금 보고 있는 판(전체보기면 null). 칸 서식도 «보고 있는 판의 값»에만
// 먹어야 한다 — 안 그러면 굵게 한 번에 다른 판 글이 덮인다(설계_판 P3).
function attachToolbar({ barEl, pagesEl, getDoc, setDoc, redraw, alignPicked, getView }) {
  const buttons = Array.from(barEl.querySelectorAll('.tb[data-mark]'));
  let lastSels = null;  // [{ id, item, from, to }, …] — 도구모음을 누르면 선택이 풀리므로 기억해 둔다

  // 지금 고른 범위(여러 블록에 걸쳤으면 전부)를, 없으면 직전에 고른 범위를 쓴다
  function targetRanges() {
    const parts = targetsIn(pagesEl);
    if (parts.length) return parts;
    return lastSels;
  }

  // 서식을 입힐 토막 목록 — 문단은 블록의 runs, 목록은 그 항목(items[i])
  function runsOf(b, at) {
    if (at.cell) {
      const row = at.cell[0] === 'h' ? (b.head && b.head[0]) : (b.rows && b.rows[at.cell[0]]);
      const cell = row && row[at.cell[1]];
      // ⚠ 병합에 덮인 칸(cov)은 글이 없다 — 서식이 먹으면 안 보이는 자리에 값이 생긴다(종전 규칙 유지)
      return cell && !cell.cov ? cellRuns(cell, getView()) : null;
    }
    if (at.cap) return Array.isArray(b.caption) ? b.caption : null;
    if (at.item === null || at.item === undefined) return Array.isArray(b.runs) ? b.runs : null;
    return Array.isArray(b.items) && Array.isArray(b.items[at.item]) ? b.items[at.item] : null;
  }
  function patchOf(b, at, runs) {
    if (at.cell) {
      if (at.cell[0] === 'h') {
        const head = [b.head[0].slice()];
        head[0][at.cell[1]] = cellPut(head[0][at.cell[1]], runs, getView());
        return { head };
      }
      const rows = b.rows.slice();
      const row = rows[at.cell[0]].slice();
      row[at.cell[1]] = cellPut(row[at.cell[1]], runs, getView());
      rows[at.cell[0]] = row;
      return { rows };
    }
    if (at.cap) return { caption: runs };
    if (at.item === null || at.item === undefined) return { runs };
    const items = b.items.slice();
    items[at.item] = runs;
    return { items };
  }

  // 대상들(걸침 선택이면 여러 개)에 서식 계산을 한 번의 문서 갱신으로 입힌다 —
  // 되돌리기(Ctrl+Z) 한 번에 통째로 돌아오게 하기 위해서다.
  function applyAll(targets, fn) {
    const doc = getDoc();
    let blocks = doc.blocks;
    let touched = false;
    for (const t of targets) {
      if (t.to <= t.from) continue;      // 커서만 있는 자리 — 입힐 글자가 없다
      const b = blocks.find(x => x.id === t.id);
      const src = b ? runsOf(b, t) : null;
      if (!src) continue;
      blocks = replaceBlock(blocks, t.id, patchOf(b, t, fn(src, t)));
      touched = true;
    }
    if (!touched) return;
    setDoc(Object.assign({}, doc, { blocks }));
    redraw({ sel: selOf(targets) });
  }

  // 다시 그린 뒤 선택을 되살릴 좌표 — 하나면 그대로, 걸침이면 양 끝만
  function selOf(targets) {
    if (targets.length === 1) return targets[0];
    const a = targets[0];
    const b = targets[targets.length - 1];
    // ⚠ cell 을 같이 실어야 표 칸 걸침 선택이 다시 그린 뒤에도 되살아난다(draw 의 hostOf 가 본다)
    return { multi: 1, a: { id: a.id, item: a.item, cell: a.cell, pos: a.from },
             b: { id: b.id, item: b.item, cell: b.cell, pos: b.to } };
  }

  function toggle(key) {
    const targets = targetRanges();
    if (!targets || !targets.length) return;
    const doc = getDoc();
    // 고른 곳 전부가 이미 그 서식이면 끄고, 아니면 켠다 (워드와 같다)
    const on = targets.every(t => {
      const b = doc.blocks.find(x => x.id === t.id);
      const src = b ? runsOf(b, t) : null;
      return src && allMarked(src, t.from, t.to, key);
    });
    applyAll(targets, (src, t) => applyMark(src, t.from, t.to, key, on ? null : 1));
  }

  // 커서가 어디 있는지에 따라 버튼이 눌린 모양으로 보인다
  function refresh() {
    const doc = getDoc();
    const parts = targetsIn(pagesEl);
    const targets = parts.length ? parts : null;
    const el = activeBlockEl(pagesEl);
    const b = el ? doc.blocks.find(x => x.id === el.dataset.id) : null;
    const srcOf = (t) => {
      const bb = doc.blocks.find(x => x.id === t.id);
      return bb ? runsOf(bb, t) : null;
    };
    // 선택 없이 커서만 있을 때의 «지금 자리» 좌표 — 길이 0 이라 서식은 안 먹고,
    // 칸/블록 단위 기능(정렬·세로 맞춤·목록)만 이 자리에 먹는다
    let caretAt = null;
    let caretHost = null;
    if (el) {
      const capB = activeCapEl(el);
      if (capB) {
        caretHost = capB;
        caretAt = { id: el.dataset.id, item: null, cap: 1 };
      } else {
        const td = activeCellEl(el);
        const li = td ? null : activeItemEl(el);
        caretHost = td || li || el;
        caretAt = td
          ? { id: el.dataset.id, item: null,
              cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] }
          : { id: el.dataset.id, item: li ? Number(li.dataset.i) : null };
      }
    }
    for (const btn of buttons) {
      const key = btn.dataset.mark;
      let on = false;
      if (targets) {
        on = targets.every(t => {
          const src = srcOf(t);
          return src && allMarked(src, t.from, t.to, key);
        });
      } else if (b && caretAt) {
        const src = runsOf(b, caretAt);
        const r = src ? rangeIn(caretHost) : null;
        if (src && r) on = !!markAt(src, r.from)[key];
      }
      btn.classList.toggle('on', on);
      btn.disabled = !b && !targets;
    }
    // ⛔ 직전 선택을 «그대로 두면» 안 된다 — 드래그로 몇 칸을 고른 뒤 다른 칸에 커서만
    //   놓고 버튼을 누르면 아까 그 칸들이 바뀐다(2026-08-30 SKY 지적: 주 제어기판을
    //   눌렀는데 다른 칸이 위쪽 맞춤이 됨). 커서만 남았으면 «그 커서 자리»로 갈아 끼운다.
    if (targets && targets.some(t => srcOf(t))) lastSels = targets;
    else if (caretAt && caretHost) {
      const p = rangeIn(caretHost);
      const pos = p ? p.from : 0;
      lastSels = [Object.assign({}, caretAt, { from: pos, to: pos })];
    } else lastSels = null;
  }

  // 값이 있는 서식(크기·색)은 켜고 끄는 게 아니라 값을 넣거나 뺀다
  function setValue(key, value) {
    const targets = targetRanges();
    if (!targets || !targets.length) return;
    applyAll(targets, (src, t) => applyMark(src, t.from, t.to, key, value === '' ? null : value));
  }

  // 정렬은 토막이 아니라 블록 전체에 붙는다 — 걸침 선택이면 걸친 블록 전부에
  function setAlign(align) {
    // ⛔ 그림을 «골라 놓은» 상태가 먼저다. 그림 블록은 편집 불가 통짜 섬이라 그 안에 커서가
    //    없어 아래의 «커서가 있는 블록» 길에 절대 안 걸린다 — 그래서 그림을 고르고 정렬을
    //    눌러도 아무 일도 안 났다(2026-08-31 실측). 그림 서식 창의 정렬도 이 단추를 대행한다.
    if (alignPicked && alignPicked(align)) return;
    const targets = targetRanges();
    const parts = targets && targets.length ? targets : null;
    const cellTs = (parts || []).filter(t => t.cell);
    if (cellTs.length || (activeBlockEl(pagesEl) && activeCellEl(activeBlockEl(pagesEl)))) {
      // 표 칸 정렬 — 블록이 아니라 «칸»에 붙는다
      const doc0 = getDoc();
      let list = cellTs;
      if (!list.length) {
        const el = activeBlockEl(pagesEl);
        const td = activeCellEl(el);
        list = [{ id: el.dataset.id,
          cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] }];
      }
      let blocks = doc0.blocks;
      for (const t of list) {
        const b = blocks.find(x => x.id === t.id);
        if (!b || b.type !== 'table') continue;
        const row0 = t.cell[0] === 'h' ? b.head[0] : b.rows[t.cell[0]];
        const cell = Object.assign({}, row0[t.cell[1]], { align });
        blocks = replaceBlock(blocks, t.id, (() => {
          if (t.cell[0] === 'h') {
            const head = [b.head[0].slice()]; head[0][t.cell[1]] = cell; return { head };
          }
          const rows = b.rows.slice(); const row = rows[t.cell[0]].slice();
          row[t.cell[1]] = cell; rows[t.cell[0]] = row; return { rows };
        })());
      }
      setDoc(Object.assign({}, doc0, { blocks }));
      if (parts) redraw({ sel: selOf(parts) });
      else redraw({ caret: { id: list[0].id, cell: list[0].cell, pos: 0 } });
      return;
    }
    const doc = getDoc();
    let ids = [];
    if (targets && targets.length) ids = Array.from(new Set(targets.map(t => t.id)));
    else {
      const el = activeBlockEl(pagesEl);
      if (el) ids = [el.dataset.id];
    }
    if (!ids.length) return;
    let blocks = doc.blocks;
    for (const id of ids) {
      if (blocks.some(x => x.id === id)) blocks = replaceBlock(blocks, id, { align });
    }
    setDoc(Object.assign({}, doc, { blocks }));
    if (targets && targets.length) redraw({ sel: selOf(targets) });
    else redraw({ caretId: ids[0], caretEnd: true });
  }

  const sizeEl = barEl.querySelector('#tb-size');
  if (sizeEl) {
    sizeEl.addEventListener('change', () => {
      const v = sizeEl.value;
      sizeEl.value = '';
      if (v) setValue('sz', Number(v));
    });
  }

  // A− / A+ — 크기 사다리를 한 칸씩 오르내린다. 크기가 안 정해진 글은 본문 12.5 로 본다
  const SIZES = [8, 8.5, 9, 9.5, 10, 10.5, 11, 11.5, 12, 12.5, 13, 14, 15, 16, 18, 20, 22, 24, 27, 30, 36];
  function stepSize(dir) {
    const targets = targetRanges();
    if (!targets || !targets.length) return;
    const doc = getDoc();
    const at = targets[0];   // 지금 크기는 맨 앞 대상에서 읽는다
    const b = doc.blocks.find(x => x.id === at.id);
    const src = b ? runsOf(b, at) : null;
    if (!src) return;
    const part = sliceRuns(src, at.from, at.to);
    const cur = (part.find(r => r.sz) || {}).sz || 12.5;
    let i = 0;
    for (let k = 1; k < SIZES.length; k++) {
      if (Math.abs(SIZES[k] - cur) < Math.abs(SIZES[i] - cur)) i = k;
    }
    const next = SIZES[Math.max(0, Math.min(SIZES.length - 1, i + dir))];
    if (next !== cur) setValue('sz', next);
  }
  for (const btn of barEl.querySelectorAll('.tb[data-szstep]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => stepSize(Number(btn.dataset.szstep)));
  }
  for (const btn of barEl.querySelectorAll('.tb-c[data-color]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => setValue('c', btn.dataset.color));
  }
  for (const btn of barEl.querySelectorAll('.tb[data-align]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => setAlign(btn.dataset.align));
  }

  // 문단 ↔ 목록 서로 바꾸기. 글자(토막)는 그대로 가져간다
  for (const btn of barEl.querySelectorAll('.tb[data-list]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => {
      const el = activeBlockEl(pagesEl);
      const id = el ? el.dataset.id : (lastSels && lastSels.length ? lastSels[0].id : null);
      if (!id) return;
      const doc = getDoc();
      const b = doc.blocks.find(x => x.id === id);
      if (!b) return;
      const ordered = btn.dataset.list === '1' ? 1 : 0;
      const blocks = doc.blocks.slice();
      const at = blocks.findIndex(x => x.id === id);
      if (b.type === 'list') {
        // ⛔ 항목이 여러 개여도 하나도 버리지 않는다 — 항목마다 문단이 된다
        const paras = (b.items.length ? b.items : [[]]).map(item => createBlock('para', { runs: item }));
        blocks.splice(at, 1, ...paras);
        setDoc(Object.assign({}, doc, { blocks }));
        redraw({ caretId: paras[0].id, caretEnd: true });
        return;
      }
      if (!Array.isArray(b.runs)) return;   // 섹션 줄은 목록으로 바꾸지 않는다
      const next = createBlock('list', { ordered, items: [b.runs] });
      blocks[at] = next;
      setDoc(Object.assign({}, doc, { blocks }));
      redraw({ caretId: next.id, caretEnd: true });
    });
  }

  for (const btn of buttons) {
    // ⛔ mousedown 에서 막지 않으면 버튼을 누르는 순간 글에서 선택이 풀린다
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => toggle(btn.dataset.mark));
  }

  // 표 칸의 «위/가운데/아래 맞춤» (2026-08-30 SKY — 엑셀에 있던 기능).
  // 가로 정렬(setAlign)과 달리 이건 표 칸에만 있다 — 문단은 높이가 글에 딱 맞아 뜻이 없다.
  function setVAlign(va) {
    const targets = targetRanges();
    const cellTs = (targets || []).filter(t => t.cell);
    let list = cellTs;
    if (!list.length) {
      const el = activeBlockEl(pagesEl);
      const td = el && activeCellEl(el);
      if (!td) return;                                    // 표 밖에서는 아무 일도 없다
      list = [{ id: el.dataset.id,
        cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] }];
    }
    const doc = getDoc();
    let blocks = doc.blocks;
    for (const t of list) {
      const b = blocks.find(x => x.id === t.id);
      if (!b || b.type !== 'table') continue;
      const row0 = t.cell[0] === 'h' ? b.head[0] : b.rows[t.cell[0]];
      const cell = Object.assign({}, row0[t.cell[1]], { va });
      blocks = replaceBlock(blocks, t.id, (() => {
        if (t.cell[0] === 'h') {
          const head = [b.head[0].slice()]; head[0][t.cell[1]] = cell; return { head };
        }
        const rows = b.rows.slice(); const row = rows[t.cell[0]].slice();
        row[t.cell[1]] = cell; rows[t.cell[0]] = row; return { rows };
      })());
    }
    setDoc(Object.assign({}, doc, { blocks }));
    if (cellTs.length) redraw({ sel: selOf(targets) });
    else redraw({ caret: { id: list[0].id, cell: list[0].cell, pos: 0 } });
  }
  for (const btn of barEl.querySelectorAll('.tb[data-valign]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => setVAlign(btn.dataset.valign));
  }

  // ── 표 동작 — 커서가 표 안일 때만. 실제 텍스트 폭은 문서 여백에서 계산한다 ──
  function textWidth(doc) {
    const p = doc.page;
    return p.width - p.margin.left - p.margin.right;
  }
  function tableCtx() {
    const el = activeBlockEl(pagesEl);
    if (!el || !el.classList.contains('blk-table')) return null;
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === el.dataset.id);
    if (!b || b.type !== 'table') return null;
    const td = activeCellEl(el);
    const cell = td ? [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] : null;
    return { doc, b, cell };
  }
  function commitTable(doc, b, next, caret) {
    // ⛔ 코어가 «거부»하면 고치지 않은 그 표를 그대로 돌려준다(같은 객체다). 그때 문서를
    //    갈아 끼우면 아무것도 안 바뀐 되돌리기 한 걸음이 쌓여서, 나중에 Ctrl+Z 를 눌러도
    //    «아무 일도 안 일어나는» 헛걸음이 된다 — 사람 눈에는 되돌리기가 먹지 않는 것으로 보인다.
    //    그래서 거부면 여기서 그냥 돌아간다(조용히 — 왜 거부됐는지 말할 수 있는 자리는 부르는 쪽이다).
    if (next === b) return false;
    // 행 보임(rowv)도 행과 함께 나른다 — 안 나르면 행 연산 뒤 보임이 엉뚱한 행에 붙는다(설계_판 P6)
    setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, b.id,
      { cols: next.cols, head: next.head, rows: next.rows, rowv: next.rowv }) }));
    redraw({ caret });
    return true;
  }
  for (const btn of barEl.querySelectorAll('.tb[data-table]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => {
      const kind = btn.dataset.table;
      if (kind === 'insert') {
        const doc = getDoc();
        const el = activeBlockEl(pagesEl);
        const t = normalizeWidths(createBlock('table', { ncols: 3, nrows: 3 }), textWidth(doc));
        const blocks = el ? insertAfter(doc.blocks, el.dataset.id, t) : doc.blocks.concat([t]);
        setDoc(Object.assign({}, doc, { blocks }));
        redraw({ caret: { id: t.id, cell: ['h', 0], pos: 0 } });
        return;
      }
      const ctx = tableCtx();
      if (!ctx) return;
      const { doc, b, cell } = ctx;
      const r = cell && cell[0] !== 'h' ? cell[0] : 0;
      const c = cell ? cell[1] : 0;
      if (kind === 'del') {
        // 확인창 없음(D15) — Ctrl+Z 한 번에 통째로 돌아온다
        setDoc(Object.assign({}, doc, { blocks: removeBlock(doc.blocks, b.id) }));
        redraw({});
      } else if (kind === 'row+') {
        commitTable(doc, b, addRow(b, r + 1), { id: b.id, cell: [r + 1, 0], pos: 0 });
      } else if (kind === 'row-') {
        const next = delRow(b, r);
        if (next === b) return;
        commitTable(doc, b, next, { id: b.id, cell: [Math.min(r, next.rows.length - 1), 0], pos: 0 });
      } else if (kind === 'col+') {
        commitTable(doc, b, addCol(b, c + 1, textWidth(doc)), { id: b.id, cell: [r, c + 1], pos: 0 });
      } else if (kind === 'col-') {
        const next = delCol(b, c, textWidth(doc));
        if (next === b) return;
        commitTable(doc, b, next, { id: b.id, cell: [r, Math.min(c, next.cols.length - 1)], pos: 0 });
      } else if (kind === 'merge') {
        const 고른전부 = (lastSels || []).concat(targetsIn(pagesEl))
          .filter(t => t.cell && t.id === b.id);
        const cells = 고른전부.filter(t => t.cell[0] !== 'h');
        // ⛔ 조용히 물러나지 않는다 — 2026-09-01 SKY: "원하는 셀을 드래그해서 선택 후 병합
        //    버튼으로 표 병합이 동작 되지 않음." 끌어서 고른 것이 «머리글 행»이었는데
        //    아무 말도 없이 아무 일도 안 났다[실측]. 사람 눈에는 기능이 고장난 것으로 보인다.
        if (cells.length < 2) {                           // 몸통 칸 2개 이상을 골라야 한다(R10)
          if (고른전부.some(t => t.cell[0] === 'h')) {
            window.alert('머리글 줄의 칸은 아직 묶을 수 없습니다.\n'
              + '몸통(회색 띠 아래) 칸을 두 개 이상 끌어서 고르세요.');
          } else if (고른전부.length === 1) {
            window.alert('칸을 두 개 이상 끌어서 골라야 묶을 수 있습니다.');
          }
          return;
        }
        const rs = cells.map(t => t.cell[0]);
        const cs = cells.map(t => t.cell[1]);
        const next = mergeCells(b, Math.min(...rs), Math.min(...cs), Math.max(...rs), Math.max(...cs));
        // ⛔ 거부됐다(같은 객체가 돌아왔다). 까닭이 «행 보임이 서로 다르다»(P6)일 때만 알려 준다 —
        //    그건 사람이 고칠 수 있는 것이고, 아무 말이 없으면 «병합이 고장났다»로 보인다.
        //    그 밖의 아무 일도 안 되는 병합(이미 한 칸인 자리 등)은 종전대로 조용히 넘긴다.
        if (next === b) {
          const a = Math.min(...rs);
          const z = Math.max(...rs);
          if ((doc.variants || []).length && z > a && Array.isArray(b.rowv)) {
            const key = (v) => JSON.stringify(Array.isArray(v) && v.length ? v : null);
            let 다르다 = false;
            for (let r2 = a + 1; r2 <= z; r2++) if (key(b.rowv[r2]) !== key(b.rowv[a])) 다르다 = true;
            if (다르다) {
              window.alert('행 보임이 다른 행끼리는 묶을 수 없습니다 — 먼저 「행 보일 판…」으로 보임을 같게 하세요');
            }
          }
          return;
        }
        commitTable(doc, b, next, { id: b.id, cell: [Math.min(...rs), Math.min(...cs)], pos: 0 });
      } else if (kind === 'split') {
        if (!cell || cell[0] === 'h') return;
        const [ar, ac] = anchorOf(b, cell[0], cell[1]);
        commitTable(doc, b, splitCell(b, cell[0], cell[1]), { id: b.id, cell: [ar, ac], pos: 0 });
      } else if (kind === 'head') {
        // 머리글 켜고 끄기 — 글은 사라지지 않고 자리만 옮긴다(2026-08-30 SKY)
        const next = toggleHead(b);
        if (next === b) return;                          // 세로 병합이 걸린 행은 못 올린다
        const 켜졌나 = next.head && next.head.length;
        commitTable(doc, b, next,
          { id: b.id, cell: 켜졌나 ? ['h', 0] : [0, 0], pos: 0 });
      } else if (kind === 'splitx') {
        if (!cell || cell[0] === 'h') return;                    // 머리글은 나누지 않는다(R16)
        const [ar, ac] = anchorOf(b, cell[0], cell[1]);
        commitTable(doc, b, splitCellAcross(b, cell[0], cell[1], textWidth(doc)),
                    { id: b.id, cell: [ar, ac], pos: 0 });
      } else if (kind === 'splity') {
        if (!cell || cell[0] === 'h') return;
        const [ar, ac] = anchorOf(b, cell[0], cell[1]);
        commitTable(doc, b, splitCellDown(b, cell[0], cell[1]),
                    { id: b.id, cell: [ar, ac], pos: 0 });
      }
    });
  }

  document.addEventListener('selectionchange', refresh);
  pagesEl.addEventListener('keyup', refresh);

  // ⛔ e.key 로만 보면 «한글 자판»에서 Ctrl+B 가 'ㅠ' 로 와서 굵게가 안 먹는다
  //    (되돌리기와 같은 뿌리 — 2026-08-30 실측). e.code(자판과 무관한 키 자리)를 같이 본다.
  const hit = (e, ch, code) => e.key === ch || e.key === ch.toUpperCase() || e.code === code;
  document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.shiftKey) return;
    const key = hit(e, 'b', 'KeyB') ? 'b' : hit(e, 'i', 'KeyI') ? 'i' : hit(e, 'u', 'KeyU') ? 'u' : null;
    if (!key) return;
    e.preventDefault();
    toggle(key);
  });

  refresh();
}

/* image.js */
// 그림 넣기·고르기·크기 조절 (설계_그림.md §4·§5). UI 전용 — 모델 규칙은 core 에 있다.
// ⛔ 최상위 이름 주의(빌드가 한 덩어리로 합친다): MAXPX·fileToAsset·attachImages 만 쓴다.









const MAXPX = 2000;   // 붙일 때 긴 변 한도 — A4 인쇄 200dpi 상당(설계 §2-2)

// 파일 → { data(dataURL), w, h }. 긴 변이 MAXPX 를 넘으면 줄여 담는다.
// 안 넘으면 원본 바이트를 그대로 담는다(재압축으로 화질을 깎지 않는다). bmp 는 png 로.
async function fileToAsset(file) {
  const bmp = await createImageBitmap(file);
  const w0 = bmp.width;
  const h0 = bmp.height;
  const long = Math.max(w0, h0);
  if (long <= MAXPX && /^image\/(png|jpeg|gif|webp)$/.test(file.type)) {
    bmp.close();
    const data = await new Promise((res, rej) => {
      const rd = new FileReader();
      rd.onload = () => res(rd.result);
      rd.onerror = () => rej(new Error('그림 파일을 읽지 못했다'));
      rd.readAsDataURL(file);
    });
    return { data, w: w0, h: h0 };
  }
  const k = Math.min(1, MAXPX / long);
  const w = Math.max(1, Math.round(w0 * k));
  const h = Math.max(1, Math.round(h0 * k));
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  bmp.close();
  const jpeg = file.type === 'image/jpeg';
  return { data: jpeg ? cv.toDataURL('image/jpeg', 0.9) : cv.toDataURL('image/png'), w, h };
}

// getView() = 지금 보고 있는 판(전체보기면 null). 칸 그림도 «보고 있는 판의 값»에
// 들어가고 거기서만 빠진다 — 안 그러면 다른 판 칸이 덮인다(설계_판 P3).
function attachImages({ barEl, pagesEl, getDoc, setDoc, redraw, getView }) {
  function textWidth(doc) {
    const p = doc.page;
    return p.width - p.margin.left - p.margin.right;
  }

  // 지금 커서 문맥을 좌표로 뜬다 — 파일을 읽는 사이 선택이 바뀌어도 붙는 곳이 안 바뀐다
  function caretCtx() {
    const blk = activeBlockEl(pagesEl);
    if (!blk) return null;
    const td = activeCellEl(blk);
    const li = td ? null : activeItemEl(blk);
    const host = td || li || blk;
    const rg = rangeIn(host);
    return {
      id: blk.dataset.id,
      cell: td ? [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] : null,
      item: li ? Number(li.dataset.i) : null,
      pos: rg ? rg.from : 0,
    };
  }

  // ⭐ 칸 그림이 오가는 길목은 이 둘뿐이다 — 여기만 판을 거치면 이 파일 전체가 판 안전이다
  function cellRunsOf(b, cell) {
    const row = cell[0] === 'h' ? (b.head && b.head[0]) : (b.rows && b.rows[cell[0]]);
    return row && row[cell[1]] ? cellRuns(row[cell[1]], getView()) : null;
  }
  function cellPatch(b, cell, runs) {
    if (cell[0] === 'h') {
      const head = [b.head[0].slice()];
      head[0][cell[1]] = cellPut(head[0][cell[1]], runs, getView());
      return { head };
    }
    const rows = b.rows.slice();
    const row = rows[cell[0]].slice();
    row[cell[1]] = cellPut(row[cell[1]], runs, getView());
    rows[cell[0]] = row;
    return { rows };
  }

  // 자산 하나를 문맥에 맞게 넣는다. at 을 다음 그림이 이어 붙도록 고쳐 준다.
  // ⭐ 「알아서」 규칙 — 워드처럼 (2026-08-31 SKY 2차 지시):
  //    · 표 칸 안 → 칸 안 그림 (칸 폭에 맞춘다 — 부품 사진)
  //    · 그 밖    → 한 줄짜리 그림 블록 (+ 설명 자리)
  // ⛔ «글자 사이면 글자 높이로 줄인다» 규칙은 폐기했다(2026-08-31 SKY:
  //    "작은 심볼 같은건 기호나 특수문자 같은걸로 나중에 대체 … 일반 적인 워드 처럼 할 꺼야").
  //    문단 어디에 커서가 있든 제대로 된 크기로 들어가고, 작게 쓰려면 손잡이로 줄인다.
  // dispW = 표시 폭 힌트(px). 붙여넣기가 «잘라낸 그 크기»를 지키는 데 쓴다.
  // 없으면 원본 폭에서 시작한다.
  function insertOne(a, at, dispW) {
    const doc = getDoc();
    const got = addAsset(doc.assets, a.data, a.w, a.h);
    const b = at ? doc.blocks.find(x => x.id === at.id) : null;
    const asInline = !!(at && at.cell);
    if (asInline && b) {
      const src = at.cell ? cellRunsOf(b, at.cell)
        : (at.item !== null && at.item !== undefined ? b.items[at.item] : b.runs);
      if (!Array.isArray(src)) return;
      // 표 칸 — 칸 안폭에 맞춘다(부품 사진 용도, 설계 §4-2). 패딩 몫 18px.
      const cw = (b.cols[at.cell[1]] ? b.cols[at.cell[1]].w : 200) - 18;
      const w = Math.max(24, Math.min(dispW || a.w, cw));
      const h = Math.max(1, Math.round(w * a.h / Math.max(1, a.w)));
      const runs = insertRun(src, at.pos, imgRun(got.id, w, h));
      const patch = at.cell ? cellPatch(b, at.cell, runs)
        : (at.item !== null && at.item !== undefined
          ? (() => { const items = b.items.slice(); items[at.item] = runs; return { items }; })()
          : { runs });
      setDoc(Object.assign({}, doc, { assets: got.assets,
        blocks: replaceBlock(doc.blocks, b.id, patch) }));
      redraw({ caret: { id: b.id, item: at.item, cell: at.cell, pos: at.pos + 1 } });
      at.pos += 1;
      return;
    }
    // 독립 블록 — 빈 문단이면 그 자리를 차지, 아니면 바로 다음(설계 §5)
    const w = Math.min(dispW || a.w, textWidth(doc));
    const fresh = createBlock('image', { src: got.id, w });
    let blocks;
    if (b && b.type === 'para' && !runsLength(b.runs || [])) {
      blocks = doc.blocks.slice();
      blocks[blocks.findIndex(x => x.id === b.id)] = fresh;
    } else if (b) {
      blocks = insertAfter(doc.blocks, b.id, fresh);
    } else {
      blocks = doc.blocks.concat([fresh]);
    }
    setDoc(Object.assign({}, doc, { assets: got.assets, blocks }));
    redraw({});
    if (at) { at.id = fresh.id; at.cell = null; at.item = null; at.pos = 0; }
    // 붙인 그림을 고른 상태로 둔다 — 손잡이가 바로 보이고 빈 캡션이 펴진다
    const el = pagesEl.querySelector('.blk-image[data-id="' + fresh.id + '"] img.bimg');
    if (el) selectImg(el);
  }

  async function insertFiles(files) {
    const list = Array.from(files || []).filter(f => /^image\//.test(f.type || ''));
    if (!list.length) return;
    const at = caretCtx();
    for (const f of list) {
      let a;
      try { a = await fileToAsset(f); }
      catch (e) { console.warn('그림을 못 읽었다:', f.name, e.message); continue; }
      insertOne(a, at);
    }
  }

  // ── 도구모음 버튼 → 숨은 파일 입력 ──
  const fileEl = document.getElementById('imgfile');
  for (const btn of barEl.querySelectorAll('.tb[data-image]')) {
    btn.addEventListener('mousedown', (e) => e.preventDefault());   // 선택이 안 풀리게
    btn.addEventListener('click', () => fileEl.click());
  }
  fileEl.addEventListener('change', () => {
    insertFiles(fileEl.files);
    fileEl.value = '';
  });

  // data: 주소를 파일처럼 만들어 넣는 길로 보낸다 — 크기 재기·줄여 담기·중복 제거를
  // 파일 붙이기와 «같은 경로»로 태우기 위해서다.
  async function insertDataUrls(items) {
    const at = caretCtx();
    for (const it of items) {
      try {
        const blob = await fetch(it.url).then(r => r.blob());
        const a = await fileToAsset(new File([blob], 'paste', { type: blob.type || 'image/png' }));
        insertOne(a, at, it.w);
      } catch (err) { console.warn('붙여넣은 그림을 못 읽었다:', err.message); }
    }
  }

  // 붙여넣은 HTML 을 토막으로 바꾼다. 블록이 여럿이면 사이에 줄바꿈을 넣는다 —
  // 안 넣으면 두 문단이 소리 없이 한 줄로 붙는다.
  function runsFromHtml(html) {
    const d0 = new DOMParser().parseFromString(html, 'text/html');
    const BLOCKY = /^(DIV|P|LI|TR|H1|H2|H3|H4|H5|H6|SECTION|ARTICLE|BLOCKQUOTE)$/;
    const kids = Array.from(d0.body.childNodes)
      .filter(n => n.nodeType === 1 && BLOCKY.test(n.tagName));
    if (kids.length > 1) {
      const out = [];
      kids.forEach((n, i) => {
        if (i) out.push({ t: '\n' });
        for (const r of domToRuns(n)) out.push(r);
      });
      return out;
    }
    return domToRuns(d0.body);
  }

  // 토막들을 커서 자리에 넣는다. 줄바꿈이 있으면 줄마다 문단이 된다
  // (표 칸 안에서는 칸 안 줄바꿈이 정상이라 그대로 둔다 — 편집기의 여러 줄 붙여넣기와 같은 규칙).
  function insertRunsAt(list, at) {
    const doc = getDoc();
    const b = at ? doc.blocks.find(x => x.id === at.id) : null;
    if (!b) return false;
    const got = adoptImages(list, doc.assets);
    const runs = got.runs.filter(r => r && r.t);
    if (!runs.length) return false;
    const inItem = at.item !== null && at.item !== undefined;
    const src = at.cell ? cellRunsOf(b, at.cell) : (inItem ? b.items[at.item] : b.runs);
    if (!Array.isArray(src)) return false;
    const len = runsLength(src);
    const pos = Math.max(0, Math.min(at.pos, len));
    const head = sliceRuns(src, 0, pos);
    const tail = sliceRuns(src, pos, len);
    const assets = got.assets;

    const lines = [[]];
    for (const r of runs) {
      if (r.img || r.t.indexOf('\n') < 0) { lines[lines.length - 1].push(r); continue; }
      const parts = r.t.split('\n');
      parts.forEach((t, i) => {
        if (i) lines.push([]);
        if (t) lines[lines.length - 1].push(Object.assign({}, r, { t }));
      });
    }

    const itemPatch = (rs) => { const items = b.items.slice(); items[at.item] = rs; return { items }; };
    if (at.cell || lines.length === 1) {
      const merged = normalizeRuns(head.concat(runs, tail));
      const patch = at.cell ? cellPatch(b, at.cell, merged) : (inItem ? itemPatch(merged) : { runs: merged });
      setDoc(Object.assign({}, doc, { assets, blocks: replaceBlock(doc.blocks, b.id, patch) }));
      redraw({ caret: { id: b.id, item: at.item, cell: at.cell, pos: pos + runsLength(runs) } });
      return true;
    }
    // 여러 줄 — 첫 줄은 이 문단에, 나머지는 새 문단으로(편집기의 여러 줄 붙여넣기와 같다)
    const first = normalizeRuns(head.concat(lines[0]));
    const rest = lines.slice(1);
    const fresh = rest.map((ln, i) => createBlock('para', {
      runs: normalizeRuns(i === rest.length - 1 ? ln.concat(tail) : ln) }));
    let blocks = replaceBlock(doc.blocks, b.id, inItem ? itemPatch(first) : { runs: first });
    const idx = blocks.findIndex(x => x.id === b.id);
    blocks = blocks.slice(0, idx + 1).concat(fresh, blocks.slice(idx + 1));
    setDoc(Object.assign({}, doc, { assets, blocks }));
    redraw({ caret: { id: fresh[fresh.length - 1].id, item: null,
                      pos: runsLength(lines[lines.length - 1]) } });
    return true;
  }

  // ── 붙여넣기 ──
  // ⛔ 그림 붙여넣기를 브라우저 기본에 맡기면 그림이 조용히 사라진다.
  //    크롬은 붙여넣은 <img> 를 «어느 블록에도 속하지 않는 자리»(.page-body 바로 아래)에
  //    넣는다(2026-08-31 실측). 우리 코드는 «그 문단»을 되읽으므로 그림을 못 보고,
  //    다음 다시 그리기가 그 <img> 를 통째로 쓸어 버린다 —
  //    잘라내기 뒤 붙여넣기가 «아무 일도 안 일어남»으로 보이던 진짜 원인이다.
  //    그래서 그림이 든 클립보드는 우리가 직접 받는다.
  // 붙여넣을 내용을 «우리가» 넣는다 — 이벤트 없이도 부를 수 있게 몸을 함수로 뽑았다
  // (우클릭 메뉴의 「붙여넣기」가 이것을 쓴다. 합성 paste 이벤트는 만들지 않는다 —
  //  브라우저 기본 글 넣기가 합성 이벤트로는 안 일어난다).
  // 돌려주는 값 = «우리가 처리했다». false 면 부른 쪽이 브라우저 기본에 맡긴다.
  // ⚠ textOnly:true 로 부르면 «글만»도 우리가 넣는다 — 메뉴에는 맡길 기본 동작이 없어서다.
  function pasteData({ html, text, files, textOnly } = {}) {
    const h = html || '';
    if (h.indexOf('<table') >= 0) return false;        // 표 붙여넣기는 편집기가 맡는다
    const fs = (files || []).filter(f => /^image\//.test((f && f.type) || ''));
    if (fs.length) { insertFiles(fs); return true; }
    const t = (text || '').trim();
    // ⛔ 글과 그림이 «섞인» 붙여넣기도 우리가 받아야 한다. 브라우저에 맡기면 크롬이
    //    그림과 «그 뒤의 모든 것»을 문단 밖으로 밀어내고 커서까지 밖에 놓는다 —
    //    우리 코드는 «커서가 있는 문단»을 읽으므로 읽을 문단을 못 찾고, 다음 다시 그리기가
    //    밖에 나와 있던 것을 통째로 쓸어 버린다. 글까지 함께 사라진다(2026-08-31 실측).
    if (t && h.indexOf('data:image') >= 0) {
      const list = runsFromHtml(h);
      if (list.some(r => r && (r.img || r.src$))) { insertRunsAt(list, caretCtx()); return true; }
    }
    if (t) {
      if (!textOnly) return false;                     // 글만이면 브라우저 기본이 더 낫다
      const list = h ? runsFromHtml(h) : [];
      return insertRunsAt(list.length ? list : [{ t: text }], caretCtx());
    }
    // 태그를 통째로 집어 src 와 width 를 함께 읽는다 — 속성 차례는 앱마다 다르다
    const items = [];
    const re = /<img\b[^>]*>/gi;
    let m = re.exec(h);
    while (m) {
      const tag = m[0];
      const src = /src=["'](data:image\/[^"']+)["']/i.exec(tag);
      if (src) {
        const wm = /width=["']?(\d+)/i.exec(tag);
        items.push({ url: src[1], w: wm ? Number(wm[1]) : 0 });
      }
      m = re.exec(h);
    }
    if (!items.length) return false;
    insertDataUrls(items);
    return true;
  }

  pagesEl.addEventListener('paste', (e) => {
    const dt = e.clipboardData;
    if (!dt) return;
    const handled = pasteData({ html: dt.getData('text/html') || '',
                                text: dt.getData('text/plain') || '',
                                files: dt.files ? Array.from(dt.files) : [] });
    if (handled) e.preventDefault();
  });

  // ── 끌어다 놓기 ──
  // ⛔ 문서 «안»에서 끈 그림과 바깥에서 끌어온 파일을 반드시 구분한다.
  //    크롬은 문서 안에서 끈 그림도 dataTransfer.files 에 «파일»로 넣어 준다
  //    (2026-08-31 실측: drop(files=1)). 구분을 안 하면 그림을 옮기려 끌었을 뿐인데
  //    «새 파일을 가져온 것»으로 보고 원본 크기 복제본이 하나 더 생긴다.
  let moving = null;   // 문서 안에서 끌고 있는 그림 { at, w, h, img }

  // 놓은 자리를 찾는다 — 표 칸이 먼저다.
  // ⚠ elementFromPoint(단수)는 겹쳐 놓은 것(열 손잡이 등)에 걸려 엉뚱한 것을 준다.
  //   복수로 훑는다(2B 에서 겪은 함정과 같다).
  function dropSpot(x, y) {
    for (const el of document.elementsFromPoint(x, y)) {
      if (!el || !el.closest) continue;
      const td = el.closest('#pages td[data-r]');
      if (td) return { td, blk: td.closest('.blk[data-id]') };
      const blk = el.closest('#pages .blk[data-id]');
      if (blk) return { td: null, blk };
    }
    return null;
  }

  // 끌어 온 그림을 놓은 자리로 «옮긴다». 지우기와 넣기를 한 번의 문서 갱신으로 해야
  // Ctrl+Z 한 번에 통째로 되돌아온다.
  function moveTo(mv, x, y) {
    const spot = dropSpot(x, y);
    if (!spot || !spot.blk) return;
    const doc = getDoc();
    const a = doc.assets[mv.img];
    if (!a) return;
    const at = mv.at;
    const 같은자리 = spot.blk.dataset.id === at.b.id
      && (!spot.td) === (!at.cell)
      && (!spot.td || (String(at.cell && at.cell[0]) === spot.td.dataset.r
                       && String(at.cell && at.cell[1]) === spot.td.dataset.c));
    if (같은자리) return;                       // 제자리에 놓았다 — 아무 일도 안 한다

    // ① 원래 자리에서 뺀다
    let blocks;
    if (at.kind === 'block') {
      if (doc.blocks.length <= 1) return;      // 옮길 데가 없다
      blocks = removeBlock(doc.blocks, at.b.id);
    } else {
      const src = runsAtTarget(at);
      if (!Array.isArray(src)) return;
      const runs = normalizeRuns(
        sliceRuns(src, 0, at.pos).concat(sliceRuns(src, at.pos + 1, runsLength(src))));
      blocks = replaceBlock(doc.blocks, at.b.id, patchAtTarget(at, runs));
    }

    // ② 놓은 자리에 넣는다
    const destId = spot.blk.dataset.id;
    const dest = blocks.find(x => x.id === destId);
    if (!dest) return;                          // 옮기다 그 블록이 없어졌다(제자리 이동)
    let caret = null;
    if (spot.td) {
      // 표 칸으로 — 칸 안폭에 맞춰 칸 글 끝에 붙인다
      if (dest.type !== 'table') return;
      const cell = [spot.td.dataset.r === 'h' ? 'h' : Number(spot.td.dataset.r),
                    Number(spot.td.dataset.c)];
      const cur = cellRunsOf(dest, cell);
      if (!Array.isArray(cur)) return;
      const cw = (dest.cols[cell[1]] ? dest.cols[cell[1]].w : 200) - 18;
      const w = Math.max(24, Math.min(mv.w || a.w, cw));
      const h = Math.max(1, Math.round(w * a.h / Math.max(1, a.w)));
      const runs = insertRun(cur, runsLength(cur), imgRun(mv.img, w, h));
      blocks = replaceBlock(blocks, destId, cellPatch(dest, cell, runs));
      caret = { id: destId, cell, pos: runsLength(cur) + 1 };
    } else {
      // 보통 블록 다음에 — 한 줄짜리 그림으로. 끌기 전 크기를 그대로 지킨다.
      const w = Math.min(mv.w || a.w, textWidth(doc));
      const fresh = createBlock('image', { src: mv.img, w });
      blocks = insertAfter(blocks, destId, fresh);
      caret = null;
      mv.freshId = fresh.id;
    }
    setDoc(Object.assign({}, doc, { blocks }));
    redraw(caret ? { caret } : {});
    if (mv.freshId) {
      const el = pagesEl.querySelector('.blk-image[data-id="' + mv.freshId + '"] img.bimg');
      if (el) selectImg(el);
    }
  }

  pagesEl.addEventListener('dragstart', (e) => {
    moving = null;
    const t = e.target;
    if (!(t && t.matches && t.matches('img.ri, img.bimg'))) return;
    const at = targetOf(t);
    if (!at) return;
    moving = { at, w: dispWOf(t), h: dispHOf(t), img: t.dataset.img };
    if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
  }, true);
  document.addEventListener('dragend', () => { moving = null; hideMark(); }, true);

  // 놓일 자리를 미리 보여 준다 (2026-08-31 SKY: "어느 문단 사이로 가는지 미리보기로")
  const mark = document.createElement('div');
  mark.id = 'imgdrop';
  mark.setAttribute('contenteditable', 'false');
  function hideMark() { if (mark.parentNode) mark.parentNode.removeChild(mark); }
  function showMark(x, y) {
    const spot = dropSpot(x, y);
    if (!spot || !spot.blk) { hideMark(); return; }
    const pr = pagesEl.getBoundingClientRect();
    const k = scaleOf(pagesEl);                    // 화면이 축소돼 있어도 맞게
    const r = (spot.td || spot.blk).getBoundingClientRect();
    if (spot.td) {                                  // 표 칸 — 그 칸을 테두리로 감싼다
      mark.className = 'cell';
      mark.style.left = ((r.left - pr.left) / k) + 'px';
      mark.style.top = ((r.top - pr.top) / k) + 'px';
      mark.style.width = (r.width / k) + 'px';
      mark.style.height = (r.height / k) + 'px';
    } else {                                        // 보통 블록 — 그 «아래»에 굵은 줄
      mark.className = '';
      mark.style.left = ((r.left - pr.left) / k) + 'px';
      mark.style.top = ((r.bottom - pr.top) / k - 1) + 'px';
      mark.style.width = (r.width / k) + 'px';
      mark.style.height = '';
    }
    if (!mark.parentNode) pagesEl.appendChild(mark);
  }

  pagesEl.addEventListener('dragover', (e) => {
    if (moving) {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      showMark(e.clientX, e.clientY);
      return;
    }
    const ts = e.dataTransfer ? Array.from(e.dataTransfer.types) : [];
    if (ts.indexOf('Files') >= 0) e.preventDefault();
  });
  pagesEl.addEventListener('drop', (e) => {
    hideMark();
    if (moving) {
      e.preventDefault();
      const mv = moving;
      moving = null;
      moveTo(mv, e.clientX, e.clientY);
      return;
    }
    const files = e.dataTransfer && e.dataTransfer.files;
    if (!files || !files.length) return;
    e.preventDefault();
    if (document.caretRangeFromPoint) {
      const r = document.caretRangeFromPoint(e.clientX, e.clientY);
      if (r) {
        const s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
      }
    }
    insertFiles(files);
  });

  // ── 그림 고르기 + 크기 손잡이 (Task 10) ──
  // ⭐ 2026-08-31: 한 장이 아니라 «목록»이다(설계_서식과우클릭.md S2).
  //   picks = 고른 순서, 맨 뒤가 «기준»(picked) — 손잡이·자르기·서식 창의 현재 값이 기준 것이다.
  let picks = [];
  let picked = null;   // = picks 의 마지막. 다시 그리면 DOM 이 없어지므로 isConnected 로 확인
  const pickCbs = [];
  const ui = document.createElement('div');
  ui.id = 'imgui';
  ui.setAttribute('contenteditable', 'false');
  for (const c of ['nw', 'ne', 'sw', 'se']) {
    const hd = document.createElement('div');
    hd.className = 'imgh';
    hd.dataset.c = c;
    ui.appendChild(hd);
  }

  // ⭐ 선택 네모·크기의 «기준»은 눈에 보이는 네모다. 자른 그림은 감싸개(.iclip)가 그것이고
  //   안쪽 img 는 원본 전체를 배율로 키운 것이라 훨씬 크다 — img 로 재면 손잡이가
  //   그림 밖 엉뚱한 데 붙는다(설계_서식과우클릭.md §4-3).
  function dispBoxOf(img) { return (img && img.closest && img.closest('.iclip')) || img; }
  function dispWOf(img) { return Number(img.dataset.dw) || img.width; }
  function dispHOf(img) { return Number(img.dataset.dh) || img.height; }
  function cropOf(img) {
    if (!img.dataset.crop) return null;
    const p = img.dataset.crop.split(',').map(Number);
    if (p.length !== 4 || !p.every(n => Number.isFinite(n))) return null;
    return { x: p[0], y: p[1], w: p[2], h: p[3] };
  }

  // 끄는 동안 «화면만» 표시 폭을 바꾼다 — 모델은 pointerup 에서 한 번만 기록한다.
  // 자른 그림은 감싸개와 안쪽 원본을 함께 다시 계산해야 잘린 자리가 안 어긋난다.
  function setDispW(img, w) {
    const a = getDoc().assets[img.dataset.img];
    if (!a) return;
    const crop = cropOf(img);
    const h = dispHeight(w, { crop }, a);
    img.dataset.dw = String(w);
    img.dataset.dh = String(h);
    const box = img.closest('.iclip');
    if (!box) { img.width = w; img.height = h; return; }
    const c = clipLayout(w, { crop }, a);
    box.style.width = w + 'px';
    box.style.height = h + 'px';
    img.width = c.iw;
    img.height = c.ih;
    img.style.marginLeft = c.ml + 'px';
    img.style.marginTop = c.mt + 'px';
  }

  // #main 이 확대(transform)돼 있어도 맞도록 화면 좌표를 입력판 눈금으로 바꾼다
  function place() {
    if (!picked || !picked.isConnected) return;
    const pr = pagesEl.getBoundingClientRect();
    const ir = dispBoxOf(picked).getBoundingClientRect();
    const k = scaleOf(pagesEl);                 // 확대·축소 배율
    ui.style.left = ((ir.left - pr.left) / k) + 'px';
    ui.style.top = ((ir.top - pr.top) / k) + 'px';
    ui.style.width = (ir.width / k) + 'px';
    ui.style.height = (ir.height / k) + 'px';
  }
  // 다시 그려져 DOM 이 사라진 그림을 목록에서 뺀다 — 기준도 함께 다시 잡는다
  function alive() {
    const live = picks.filter(el => el.isConnected);
    if (live.length !== picks.length) picks = live;
    picked = picks[picks.length - 1] || null;
    return picks;
  }
  function pickedImgs() { alive(); return picks.slice(); }
  function onPick(cb) { if (typeof cb === 'function') pickCbs.push(cb); }
  function firePick() {
    for (const cb of pickCbs) {
      try { cb(); } catch (err) { console.warn('선택 알림 처리기 오류:', err.message); }
    }
  }
  // 기준 그림만 진한 테두리 — 손잡이가 어디 붙는지 눈으로 알아야 한다
  function markBase() {
    for (const el of picks) {
      if (!el.isConnected) continue;
      el.classList.add('imgsel');
      if (el === picked) el.classList.add('imgbase');
      else el.classList.remove('imgbase');
    }
  }
  function deselect() {
    for (const el of picks) {
      if (!el.isConnected) continue;
      el.classList.remove('imgsel');
      el.classList.remove('imgbase');
    }
    picks = [];
    picked = null;
    if (ui.parentNode) ui.parentNode.removeChild(ui);
    firePick();
  }
  // add = Ctrl/⌘+클릭. 이미 고른 그림을 Ctrl+클릭하면 «뺀다»(워드·탐색기와 같다).
  function selectImg(img, add) {
    if (!img) return;
    if (!add) {
      for (const el of picks) {
        if (el.isConnected && el !== img) { el.classList.remove('imgsel'); el.classList.remove('imgbase'); }
      }
      picks = picks.includes(img) ? [img] : [];
    } else if (picks.includes(img)) {
      picks = picks.filter(el => el !== img);
      img.classList.remove('imgsel');
      img.classList.remove('imgbase');
      picked = picks[picks.length - 1] || null;
      if (!picked) { if (ui.parentNode) ui.parentNode.removeChild(ui); }
      else { markBase(); place(); }
      firePick();
      return;
    }
    if (!picks.includes(img)) picks.push(img);
    picked = img;
    markBase();
    pagesEl.appendChild(ui);
    place();
    firePick();
  }

  pagesEl.addEventListener('click', (e) => {
    const t = e.target;
    const add = e.ctrlKey || e.metaKey;
    if (t && t.matches && t.matches('img.ri, img.bimg')) { selectImg(t, add); return; }
    // 자른 그림은 감싸개가 위를 덮는 수가 있다 — 감싸개를 눌러도 안쪽 그림을 고른다
    const ic = t && t.closest && t.closest('.iclip');
    if (ic) { const im = ic.querySelector('img'); if (im) { selectImg(im, add); return; } }
    if (!(t && t.closest && t.closest('#imgui'))) deselect();
  });
  document.addEventListener('selectionchange', () => {
    if (!picks.length) return;
    const n = picks.length;
    alive();
    if (!picks.length) deselect();                          // 전부 다시 그려져 사라졌다
    else if (picks.length !== n) { markBase(); place(); firePick(); }
  });

  // 고른 그림의 모델 좌표를 찾는다 → { kind:'block', b } 또는 { kind:'run', b, cell|item|cap, pos }
  function targetOf(el) {
    if (!el || !el.isConnected) return null;
    const blkEl = el.closest('.blk[data-id]');
    if (!blkEl) return null;
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === blkEl.dataset.id);
    if (!b) return null;
    if (el.classList.contains('bimg')) return { kind: 'block', b };
    const td = el.closest('td[data-r]');
    const li = el.closest('.lst li[data-i]');
    const cap = el.closest('.blk-image .cap');
    const host = td || li || cap || blkEl;
    const parent = el.parentNode;
    const idx = Array.prototype.indexOf.call(parent.childNodes, el);
    const pos = offsetIn(host, parent, idx);
    return { kind: 'run', b, pos,
      cell: td ? [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] : null,
      item: li ? Number(li.dataset.i) : null,
      cap: cap ? 1 : 0 };
  }
  function pickedTarget() { return targetOf(picked); }
  // 고른 그림 전부의 모델 좌표 — DOM 이 사라져도 안전하게 «먼저» 다 뜬다.
  // el·img(보관함 번호)를 함께 실어 두면 뒤 계산에서 화면을 다시 안 봐도 된다.
  function pickedTargets() {
    alive();
    return picks.map((el) => {
      const at = targetOf(el);
      return at ? Object.assign(at, { el, img: el.dataset.img }) : null;
    }).filter(Boolean);
  }
  // 다시 그린 화면에서 같은 자리의 그림을 찾아낸다 — 이어서 또 조절할 수 있게.
  // 토막 그림은 «글자 번호»로 찾는다(같은 칸에 그림이 여럿일 수 있다).
  function findImgAt(at) {
    if (at.kind === 'block') {
      return pagesEl.querySelector('.blk-image[data-id="' + at.b.id + '"] img.bimg');
    }
    const blkEl = pagesEl.querySelector('.blk[data-id="' + at.b.id + '"]');
    if (!blkEl) return null;
    const host = at.cell
      ? pagesEl.querySelector('.blk[data-id="' + at.b.id + '"] td[data-r="' + at.cell[0]
        + '"][data-c="' + at.cell[1] + '"]')
      : (at.cap ? blkEl.querySelector('.cap')
        : (at.item !== null && at.item !== undefined
          ? blkEl.querySelector('.lst li[data-i="' + at.item + '"]') : blkEl));
    if (!host) return null;
    for (const im of host.querySelectorAll('img')) {
      const parent = im.parentNode;
      const idx = Array.prototype.indexOf.call(parent.childNodes, im);
      if (offsetIn(host, parent, idx) === at.pos) return im;
    }
    return null;
  }
  function reselect(ats) {
    const found = (ats || []).map(findImgAt).filter(Boolean);
    deselect();
    for (const im of found) selectImg(im, true);
  }
  // 블록에 patch 를 얹는다. 값이 null 이면 그 칸을 «뗀다».
  // ⚠ replaceBlock 의 Object.assign 은 null 을 그대로 남겨 저장 파일에 "crop": null 이 낀다 —
  //   그래서 여기서 직접 만든다.
  function blockPatched(blocks, id, patch) {
    const i = blocks.findIndex(x => x.id === id);
    if (i < 0) return blocks;
    const next = Object.assign({}, blocks[i]);
    for (const k of Object.keys(patch || {})) {
      if (patch[k] === null || patch[k] === undefined) delete next[k];
      else next[k] = patch[k];
    }
    const out = blocks.slice();
    out[i] = next;
    return out;
  }
  // pos 자리의 그림 토막 자체 — crop 을 알아야 높이를 다시 잴 수 있다
  function runAtPos(runs, pos) {
    let p = 0;
    for (const r of runs || []) {
      if (r && r.img && p === pos) return r;
      p += (r && r.t ? r.t.length : 0);
    }
    return null;
  }
  // 그 그림이 놓일 수 있는 최대 표시 폭 — 표 칸이면 칸 안폭(패딩 몫 18px), 아니면 본문 폭
  function limitOf(at, b, doc) {
    if (at.kind === 'run' && at.cell) {
      return Math.max(24, ((b.cols[at.cell[1]] ? b.cols[at.cell[1]].w : 200) - 18));
    }
    return textWidth(doc);
  }
  function runsAtTarget(at) {
    if (at.cell) return cellRunsOf(at.b, at.cell);
    if (at.cap) return at.b.caption || [];
    if (at.item !== null && at.item !== undefined) return at.b.items[at.item];
    return at.b.runs;
  }
  function patchAtTarget(at, runs) {
    if (at.cell) return cellPatch(at.b, at.cell, runs);
    if (at.cap) return { caption: runs };
    if (at.item !== null && at.item !== undefined) {
      const items = at.b.items.slice();
      items[at.item] = runs;
      return { items };
    }
    return { runs };
  }

  // ── 손잡이 끌기 — 끄는 동안은 화면(img 속성)만, 놓으면 모델에 1회 기록 ──
  let rz = null;   // { startX, startW, ratio, max, dir }
  ui.addEventListener('pointerdown', (e) => {
    const hd = e.target.closest && e.target.closest('.imgh');
    if (!hd || !picked || !picked.isConnected) return;
    e.preventDefault();
    e.stopPropagation();
    const host = picked.closest('td[data-r], .lst li[data-i], .blk-image, .blk[data-id]');
    // ⚠ 시작 폭은 «보이는 폭»(data-dw)이다 — 자른 그림의 img.width 는 원본 확대 크기라
    //   그걸로 시작하면 손잡이를 잡는 순간 그림이 배율만큼 튄다.
    rz = { startX: e.clientX, startW: dispWOf(picked),
           max: Math.max(24, (host ? host.clientWidth : pagesEl.clientWidth) - 4),
           dir: (hd.dataset.c === 'nw' || hd.dataset.c === 'sw') ? -1 : 1 };
    try { hd.setPointerCapture(e.pointerId); } catch (err) { /* 합성 이벤트에는 없다 */ }
  });
  ui.addEventListener('pointermove', (e) => {
    if (!rz || !picked || !picked.isConnected) return;
    // ⛔ 손가락이 움직인 거리는 «눈에 보이는» 눈금이고, 그림 폭은 «자리» 눈금이다.
    //    좁은 화면에서 종이를 줄여 보여 줄 때 이 둘이 다르므로 배율로 나눠 준다 —
    //    안 그러면 100px 끌었는데 그림은 130px 커지는 식으로 손과 따로 논다.
    // ⚠ 반올림한다 — 배율로 나누면 소수가 나오고, 그대로 두면 저장 파일에 299.2 같은
    //    어중간한 값이 남는다(폭은 언제나 정수 px 다).
    const k = scaleOf(pagesEl);
    const w = Math.round(
      Math.max(24, Math.min(rz.max, rz.startW + rz.dir * ((e.clientX - rz.startX) / k))));
    setDispW(picked, w);
    place();
  });
  ui.addEventListener('pointerup', () => {
    if (!rz || !picked || !picked.isConnected) { rz = null; return; }
    const w = dispWOf(picked);
    const h = dispHOf(picked);
    rz = null;
    // 여러 장을 골랐으면 «전부 같은 폭»으로 — 손잡이는 기준 그림에 붙어 있었을 뿐이다(설계 §3)
    if (picks.length > 1) { setPickedWidths(w); return; }
    const at = pickedTarget();
    if (!at) return;
    const doc = getDoc();
    if (at.kind === 'block') {
      setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, at.b.id, { w }) }));
    } else {
      const runs = setImgSize(runsAtTarget(at), at.pos, w, h);
      setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, at.b.id, patchAtTarget(at, runs)) }));
    }
    redraw({ keepCaret: true });
    // 다시 그린 화면에서 같은 그림을 다시 고른다 — 이어서 또 조절할 수 있게
    const again = at.kind === 'block'
      ? pagesEl.querySelector('.blk-image[data-id="' + at.b.id + '"] img.bimg')
      : null;
    if (again) selectImg(again);
  });

  // 고른 그림을 «전부» 모델에서 뺀다 — Delete·Backspace 와 잘라내기가 함께 쓴다.
  // ⭐ 한 번의 setDoc 이라 Ctrl+Z 한 번에 통째로 돌아온다(설계 §3).
  function removePicked() {
    const ats = pickedTargets();
    deselect();
    if (!ats.length) return;
    const doc = getDoc();
    let blocks = doc.blocks;
    // ① 토막 — 같은 자리(칸·항목·캡션·문단)끼리 묶어 «뒤 위치부터» 뺀다.
    //    앞에서부터 빼면 뒤 그림의 글자 번호가 밀려 엉뚱한 글자가 지워진다.
    const runTargets = ats.filter(a => a.kind === 'run');
    const keyOf = (a) => a.b.id + '|' + JSON.stringify(a.cell) + '|' + a.item + '|' + a.cap;
    const groups = new Map();
    for (const a of runTargets) {
      const k = keyOf(a);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(a);
    }
    for (const list of groups.values()) {
      list.sort((x, y) => y.pos - x.pos);
      const b = blocks.find(x => x.id === list[0].b.id);
      if (!b) continue;
      const here = Object.assign({}, list[0], { b });
      let src = runsAtTarget(here);
      if (!Array.isArray(src)) continue;
      for (const a of list) {
        src = sliceRuns(src, 0, a.pos).concat(sliceRuns(src, a.pos + 1, runsLength(src)));
      }
      // ⚠ normalizeRuns 로 감싼다 — 그냥 이으면 그림 양옆의 같은 서식이 안 합쳐져
      //   토막이 계속 늘어난다
      blocks = replaceBlock(blocks, b.id, patchAtTarget(here, normalizeRuns(src)));
    }
    // ② 블록 그림 — 문서가 통째로 비면 빈 문단 하나를 남긴다
    for (const a of ats.filter(x => x.kind === 'block')) {
      if (blocks.some(x => x.id === a.b.id)) blocks = removeBlock(blocks, a.b.id);
    }
    if (!blocks.length) blocks = [createBlock('para')];
    setDoc(Object.assign({}, doc, { blocks }));
    // 한 장만 지웠으면 그 자리에 커서를 놓는다(지금까지의 감각 그대로).
    // 여러 장이면 어디에 놓아도 엉뚱하므로 놓지 않는다.
    const one = ats.length === 1 && ats[0].kind === 'run' ? ats[0] : null;
    redraw(one ? { caret: { id: one.b.id, item: one.item, cell: one.cell, cap: one.cap, pos: one.pos } } : {});
  }

  // 고른 그림 전부를 «같은 표시 폭»으로 — 부품 사진 폭 통일이 핵심 용도(설계 §3).
  // 표 칸 안 그림은 칸 안폭이 한도다. 한 번의 setDoc = Ctrl+Z 한 번.
  function setPickedWidths(wPx) {
    const ats = pickedTargets();
    if (!ats.length) return;
    const doc = getDoc();
    let blocks = doc.blocks;
    for (const at of ats) {
      const b = blocks.find(x => x.id === at.b.id);
      const a = doc.assets[at.img];
      if (!b || !a) continue;
      const w = Math.max(24, Math.min(Math.round(wPx), limitOf(at, b, doc)));
      if (at.kind === 'block') { blocks = blockPatched(blocks, b.id, { w }); continue; }
      const here = Object.assign({}, at, { b });
      const src = runsAtTarget(here);
      if (!Array.isArray(src)) continue;
      const h = dispHeight(w, runAtPos(src, at.pos) || {}, a);
      blocks = replaceBlock(blocks, b.id, patchAtTarget(here, patchImgAt(src, at.pos, { w, h })));
    }
    setDoc(Object.assign({}, doc, { blocks }));
    redraw({});
    reselect(ats);
  }

  // 그림 서식 칸(crop·rad)을 얹는다. 값이 null 이면 그 칸을 뗀다.
  // ⚠ patch 에 w 가 있으면 토막의 h 도 함께 다시 계산해 싣는다 — 안 그러면 비율이 어긋난다.
  function patchTargets(ats, patch) {
    if (!ats.length) return;
    const doc = getDoc();
    let blocks = doc.blocks;
    for (const at of ats) {
      const b = blocks.find(x => x.id === at.b.id);
      const a = doc.assets[at.img];
      if (!b || !a) continue;
      const p = Object.assign({}, patch);
      if (p.w !== undefined && p.w !== null) {
        p.w = Math.max(24, Math.min(Math.round(p.w), limitOf(at, b, doc)));
      }
      if (at.kind === 'block') {
        delete p.h;                          // 블록은 높이를 저장하지 않는다 — 비율로 계산한다
        blocks = blockPatched(blocks, b.id, p);
        continue;
      }
      const here = Object.assign({}, at, { b });
      const src = runsAtTarget(here);
      if (!Array.isArray(src)) continue;
      const cur = runAtPos(src, at.pos) || {};
      // 자르기가 바뀌면 비율이 바뀐다 — 높이를 다시 잰다
      const next = Object.assign({}, cur);
      for (const k of Object.keys(p)) {
        if (p[k] === null || p[k] === undefined) delete next[k];
        else next[k] = p[k];
      }
      p.h = dispHeight(p.w !== undefined && p.w !== null ? p.w : (cur.w || a.w), next, a);
      blocks = replaceBlock(blocks, b.id, patchAtTarget(here, patchImgAt(src, at.pos, p)));
    }
    setDoc(Object.assign({}, doc, { blocks }));
    redraw({});
    reselect(ats);
  }
  function patchPicked(patch) { patchTargets(pickedTargets(), patch); }
  function patchBase(patch) {
    const ats = pickedTargets();
    if (ats.length) patchTargets([ats[ats.length - 1]], patch);
  }

  // ── 고른 그림 «블록»의 정렬 ──
  // ⛔ 그림 블록은 편집 불가 «통짜 섬»이라 그 안에 커서가 없다. 그래서 리본의 정렬 단추가
  //    쓰는 «커서가 있는 블록» 길로는 절대 닿지 않는다 — 그림을 골라 놓고 「가운데」를 눌러도
  //    아무 일도 안 일어났다(2026-08-31 실측). 리본이 이것을 «먼저» 물어보게 해서 잇는다.
  //    글줄 안 그림 토막은 정렬이 없다 — 그 자리는 문단 정렬이 정하므로 손대지 않는다.
  //    돌려주는 값 = «우리가 처리했다».
  function alignPicked(align) {
    const ats = pickedTargets().filter(a => a.kind === 'block');
    if (!ats.length) return false;
    patchTargets(ats, { align });
    return true;
  }

  // 서식 창이 보여 줄 «기준 그림»의 지금 값. 고른 게 없으면 null.
  function pickedInfo() {
    alive();
    if (!picked) return null;
    const at = targetOf(picked);
    const doc = getDoc();
    const a = at ? doc.assets[picked.dataset.img] : null;
    if (!at || !a) return null;
    const b = doc.blocks.find(x => x.id === at.b.id) || at.b;
    return { kind: at.kind, n: picks.length,
             w: dispWOf(picked), h: dispHOf(picked),
             rad: Number(picked.dataset.rad) || 0, crop: cropOf(picked),
             align: at.kind === 'block' ? (b.align || 'center') : null,
             maxW: limitOf(at, b, doc), asset: { w: a.w, h: a.h } };
  }

  // 자른 그림은 «잘린 모습 그대로» 구워서 담는다(설계_서식과우클릭.md §4-4) —
  // 워드·엑셀에 붙였을 때 잘리기 전 원본이 튀어나오면 안 된다.
  // ⚠ 둥근 모서리는 굽지 않는다(워드도 안 굽는다). crop 이 없으면 원본을 그대로 담는다.
  // ⚠ 그래서 밖에 나갔다 돌아온 그림은 «구워진 새 원본»이다 — 자르기 정보는 안 따라간다.
  function bakedHtml(img) {
    const a = getDoc().assets[img.dataset.img];
    if (!a) return '';
    const w = dispWOf(img) || a.w;
    const h = dispHOf(img) || a.h;
    const crop = cropOf(img);
    if (!crop) {
      return '<img src="' + a.data + '" width="' + w + '" height="' + h + '">';
    }
    try {
      const cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      cv.getContext('2d').drawImage(img, crop.x, crop.y, crop.w, crop.h, 0, 0, w, h);
      return '<img src="' + cv.toDataURL('image/png') + '" width="' + w + '" height="' + h + '">';
    } catch (err) {
      // 굽기가 막히면(그림이 아직 안 실렸다 등) 원본이라도 담는다 — 빈 클립보드보다 낫다
      console.warn('자른 그림을 굽지 못했다:', err.message);
      return '<img src="' + a.data + '" width="' + w + '" height="' + h + '">';
    }
  }

  // ⛔ 사람이 «칸에 글을 치고 있는» 중이면 그림 단축키가 끼어들면 안 된다.
  //    서식 창의 폭 칸에서 숫자를 지우려고 Backspace 를 누르면 그림이 통째로 지워지고,
  //    Ctrl+C 는 친 숫자 대신 그림을 클립보드에 담는다. 칸 안에서는 손을 뗀다.
  //    ⚠ #pages 는 그 자체가 입력판(contenteditable)이라 여기 걸리지 않는다 — 지금까지대로 돈다.
  function inField(el) {
    return !!(el && el.closest && el.closest('input, textarea, select'));
  }

  // 고른 그림을 클립보드에 담는다. 담을 게 없으면 거짓.
  // 여러 장이면 <img> 를 이어 담는다 — 워드·엑셀에 나란히 붙는다.
  function putPickedOnClipboard(e) {
    alive();
    if (!picks.length) return false;
    if (inField(e.target) || inField(document.activeElement)) return false;
    const s2 = window.getSelection();
    if (s2 && s2.rangeCount && !s2.getRangeAt(0).collapsed) return false;  // 글을 골랐으면 브라우저에
    if (!e.clipboardData) return false;
    const html = picks.map(bakedHtml).filter(Boolean).join('');
    if (!html) return false;
    e.clipboardData.setData('text/html', html);
    e.clipboardData.setData('text/plain', '');
    return true;
  }

  // ── 고른 그림 복사(Ctrl+C) ──
  // ⛔ 그림 블록은 편집 불가 «통짜 섬»이라 브라우저의 «문서 선택»에 안 잡힌다.
  //    그래서 Ctrl+C 를 눌러도 담을 게 없어 클립보드가 통째로 빈다
  //    (2026-08-31 실측: «빈 클립보드» — 엑셀·워드에 안 붙던 진짜 원인).
  //    고른 그림이 있으면 우리가 직접 담는다. 글줄 안 그림은 브라우저가 이미 잘 담으므로
  //    글을 고른 상태면 손대지 않는다.
  document.addEventListener('copy', (e) => {
    if (putPickedOnClipboard(e)) e.preventDefault();
  });

  // ── 고른 그림 잘라내기(Ctrl+X) — 워드·엑셀과 같다 (2026-08-31 SKY) ──
  document.addEventListener('cut', (e) => {
    if (!putPickedOnClipboard(e)) return;
    e.preventDefault();
    removePicked();
  });

  // ── 고른 그림 지우기 — Delete·Backspace. Esc 는 해제 ──
  document.addEventListener('keydown', (e) => {
    alive();
    if (!picks.length) return;
    if (inField(e.target)) return;          // 서식 창 칸에 숫자를 치는 중이면 손대지 않는다
    if (e.key === 'Escape') { deselect(); return; }
    if (e.key !== 'Delete' && e.key !== 'Backspace') return;
    e.preventDefault();
    removePicked();
  });

  // 판 지정(설계_판.md §4-4)이 다중 선택을 읽는 창구 — 고른 독립 그림 블록의 id 들.
  // ⚠ DOM 을 뒤지지 않는다 — 고른 목록(picks)을 이미 배열로 들고 있고 pickedTargets 가
  //   그 좌표를 뜬다. 글줄 «안» 그림 토막(kind:'run')은 블록이 아니라 글자 한 개라
  //   판을 붙일 자리가 없어 뺀다.
  function pickedIds() {
    return pickedTargets().filter(a => a.kind === 'block').map(a => a.b.id);
  }

  // 검사·서식 창·메뉴가 쓰는 공개 창구. 화면 동작은 여기 안 기댄다(창구가 없어도 앱은 돈다).
  return { insertFiles, pasteData, pickedImgs, onPick, selectImg, deselect,
           patchPicked, patchBase, setPickedWidths, removePicked, pickedInfo, alignPicked,
           pickedIds };
}

/* format.js */
// 그림 서식 창 — 설계_서식과우클릭.md §4. UI 전용이고 모델 규칙은 core 에 있다.
// ⛔ 최상위 이름은 attachFormat 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로
//    파일이 달라도 최상위 이름이 겹치면 «Identifier has already been declared»로
//    화면이 통째로 안 뜬다(2026-08-30 실측).
// 단위 규칙(S1): 저장·모델은 px, 사람이 보고 치는 칸만 mm. 변환은 core/imgfmt.js 만 안다.



function attachFormat({ barEl, pagesEl, imageApi }) {
  const panel = document.createElement('div');
  panel.id = 'imgpanel';
  panel.setAttribute('contenteditable', 'false');
  // ⭐ 그림에 관한 것은 «이 창 하나»가 전부다(2026-08-31 SKY: «서식은 동일하게 같이 쓰게 통합»).
  //    더블클릭으로 들어오나 우클릭으로 들어오나 나오는 것은 이 창이다. 그래서 우클릭
  //    메뉴에만 있던 복사·잘라내기·삭제도 여기 함께 둔다 — 그러지 않으면 우클릭으로
  //    할 수 있던 일이 사라진다.
  panel.innerHTML = ''
    + '<div class="fp-ttl">그림 서식<button class="fp-x" type="button" title="닫기">✕</button></div>'
    + '<div class="fp-n"></div>'
    + '<label>폭 <input class="fp-w" type="number" step="0.1" min="1"><i>mm</i></label>'
    + '<label>높이 <input class="fp-h" type="number" step="0.1" min="1"><i>mm</i></label>'
    // 「둥근 모서리」는 단추가 곧 이름표다 — 눌러서 켜고 끄고(2mm), 다른 값이 필요하면
    // 옆 칸에 mm 로 친다. 이름이 두 번 나오지 않게 이렇게 묶었다.
    + '<div class="fp-line"><button class="fp-round" type="button"'
    + ' title="둥근 모서리 켜기/끄기 — 2mm. 다른 값은 옆 칸에 mm 로 칩니다">둥근 모서리</button>'
    + '<input class="fp-r" type="number" step="0.5" min="0"><i>mm</i></div>'
    + '<div class="fp-btns"><button class="fp-crop" type="button">자르기</button>'
    + '<button class="fp-reset" type="button">처음 상태로</button></div>'
    + '<div class="fp-btns fp-align"><button type="button" data-a="left">왼쪽</button>'
    + '<button type="button" data-a="center">가운데</button>'
    + '<button type="button" data-a="right">오른쪽</button></div>'
    + '<div class="fp-btns fp-edit"><button class="fp-copy" type="button">복사</button>'
    + '<button class="fp-cut" type="button">잘라내기</button>'
    + '<button class="fp-del" type="button">삭제</button></div>';

  const inW = panel.querySelector('.fp-w');
  const inH = panel.querySelector('.fp-h');
  const inR = panel.querySelector('.fp-r');
  const nEl = panel.querySelector('.fp-n');
  const alignRow = panel.querySelector('.fp-align');
  const roundBtn = panel.querySelector('.fp-round');

  const isOpen = () => !!panel.parentNode;

  // 눈에 보이는 네모 — 자른 그림은 감싸개(.iclip)가 곧 보이는 네모다
  function baseBox() {
    const list = imageApi.pickedImgs();
    const img = list[list.length - 1];
    if (!img) return null;
    const box = (img.closest && img.closest('.iclip')) || img;
    return box.getBoundingClientRect();
  }

  // 기준 그림 오른쪽에 붙인다. 오른쪽에 자리가 없으면 왼쪽으로 넘긴다(설계 §4-1).
  function place() {
    const r = baseBox();
    if (!r) return;
    const w = panel.offsetWidth || 200;
    const h = panel.offsetHeight || 220;
    let x = r.right + 12;
    if (x + w > window.innerWidth - 8) x = r.left - 12 - w;
    if (x < 8) x = 8;
    let y = r.top;
    if (y + h > window.innerHeight - 8) y = window.innerHeight - 8 - h;
    if (y < 8) y = 8;
    panel.style.left = Math.round(x) + 'px';
    panel.style.top = Math.round(y) + 'px';
  }

  // ⛔ mm 를 px 로 바꿔 저장하므로 되돌려 보여 주면 «친 값»과 달라진다 —
  //    1 을 치면 4px 이 되고 그걸 다시 mm 로 재면 1.1 이다(2 → 2.1 · 3 → 2.9. 2026-08-31 SKY 지적).
  //    반올림이라 없앨 수 없는 어긋남이다. 그래서 «사람이 친 값이 지금 저장된 px 와 같은 뜻이면
  //    그대로 둔다» — 값은 정확히 그대로이고, 다른 데서 바뀌었을 때만 새로 채운다.
  function showMm(input, px) {
    const cur = Number(input.value);
    if (input.value !== '' && Number.isFinite(cur) && pxOf(cur) === px) return;
    input.value = String(mmOf(px));
  }

  // 지금 고른 그림의 값을 칸에 채운다. 고른 게 없으면 창을 닫는다.
  function fill() {
    const info = imageApi.pickedInfo();
    if (!info) { close(); return null; }
    showMm(inW, info.w);
    showMm(inH, info.h);
    if (info.rad) showMm(inR, info.rad);
    else inR.value = '0';
    // 여러 장을 골랐을 때 «무엇이 보이는 값인지» 헷갈리지 않게 한 줄로 알려 준다
    nEl.textContent = info.n > 1 ? (info.n + '장 골랐습니다 — 값은 진한 테두리 그림 것입니다') : '';
    nEl.style.display = info.n > 1 ? 'block' : 'none';
    // 정렬은 «한 줄짜리 그림 블록»에만 있다. 글줄 안 그림은 문단 정렬을 따라간다.
    alignRow.style.display = info.kind === 'block' ? 'flex' : 'none';
    for (const b of alignRow.querySelectorAll('button')) {
      b.classList.toggle('on', b.dataset.a === info.align);
    }
    // ⛔ 켜짐/꺼짐이 «눈에» 보여야 한다 — 눌러서 켠 건지 끈 건지 알 수가 없었다(SKY 지적)
    roundBtn.classList.toggle('on', !!info.rad);
    return info;
  }

  function close() {
    if (panel.parentNode) panel.parentNode.removeChild(panel);
  }

  // 서식 창·자르기가 열릴 때 알린다 — 미니 패널이 같은 그림 옆에 겹쳐 뜨지 않게 한다.
  // ⛔ 둘 다 «고른 그림 옆»에 놓이는데 오른쪽에 자리가 없으면 둘 다 왼쪽으로 접혀 겹친다
  //    (2026-08-31 SKY 지적, 태블릿 사진). 서식 창이 더 자세하므로 그때는 미니가 물러난다.
  function tellOpened() {
    document.dispatchEvent(new CustomEvent('imgui:panel-open'));
  }

  function openPanel() {
    if (!imageApi.pickedInfo()) return;      // 고른 그림이 없으면 아무 일도 안 한다
    if (!panel.parentNode) document.body.appendChild(panel);
    if (!fill()) return;
    place();
    tellOpened();
  }

  // 둥근 모서리 켜기/끄기 — 기준값 2mm(8px). 리본 단추 하나로 쓰는 길이다(2026-08-31 SKY).
  // ⭐ mm 를 치는 칸은 그대로 두고, «늘 쓰는 값»만 단추 한 번으로 되게 한 것이다.
  const ROUND_MM = 2;
  function toggleRound() {
    const info = imageApi.pickedInfo();
    if (!info) return;
    const 켠다 = !info.rad;
    // ⚠ 칸도 «2» 로 맞춰 둔다. 안 그러면 8px 을 되돌려 재서 2.1 이 뜬다 —
    //   단추로 2mm 를 켰는데 칸에는 2.1 이라 또 헷갈린다(반올림, showMm 설명 참고).
    inR.value = 켠다 ? String(ROUND_MM) : '0';
    imageApi.patchPicked({ rad: 켠다 ? pxOf(ROUND_MM) : null });
  }
  // 지금 켜져 있는지를 리본 단추에 눌린 모양으로 보여 준다
  function syncRoundBtn() {
    const b = barEl.querySelector('.tb[data-imgfmt="round"]');
    if (!b) return;
    const info = imageApi.pickedInfo();
    b.classList.toggle('on', !!(info && info.rad));
  }
  imageApi.onPick(() => setTimeout(syncRoundBtn, 0));

  // ── 자르기 모드 (S7 — 원본은 그대로, «보이는 창»만 바뀐다) ──
  // ⭐ 자르기는 원본을 깎지 않는다. «원본의 어디를 보여 줄지»(crop)만 기록하므로
  //    나중에 언제든 처음 상태로 돌아온다. 보관함의 원본은 손대지 않는다.
  // 화면 구조: 유령(.cg)이 «원본 전체»를 지금 배율로 깔고, 창(.cw)이 보여 줄 자리다.
  // 창 밖이 어두운 것은 칸 4개가 아니라 창의 box-shadow 하나다 — 어긋날 데가 없다.
  const cropUi = document.createElement('div');
  cropUi.id = 'cropui';
  cropUi.setAttribute('contenteditable', 'false');
  const ghost = document.createElement('img');
  ghost.className = 'cg';
  const cwin = document.createElement('div');
  cwin.className = 'cw';
  for (const c of ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w']) {
    const hd = document.createElement('div');
    hd.className = 'ch';
    hd.dataset.c = c;
    cwin.appendChild(hd);
  }
  // ⛔ 안내 줄이 없으면 «어떻게 끝내는지» 알 길이 없다. 그리고 태블릿에는 Enter·Esc 키가
  //    아예 없어 단추가 없으면 «취소»를 못 한다 — 키만 믿으면 태블릿에서 갇힌다.
  const ctip = document.createElement('div');
  ctip.className = 'ctip';
  ctip.innerHTML = '<span>모서리를 끌어 보일 자리를 고르세요 · 원본은 그대로 남습니다</span>'
    + '<button class="ct-ok" type="button">적용</button>'
    + '<button class="ct-no" type="button">취소</button>';
  cropUi.appendChild(ghost);
  cropUi.appendChild(cwin);
  cropUi.appendChild(ctip);

  let cropState = null;    // { base, a, k, gx, gy, gw, gh, wasPanel }
  let cropDrag = null;     // 끄는 중
  const cropOpen = () => !!cropUi.parentNode;

  function setWin(x, y, w, h) {
    cwin.style.left = x + 'px';
    cwin.style.top = y + 'px';
    cwin.style.width = w + 'px';
    cwin.style.height = h + 'px';
  }

  function closeCrop() {
    if (cropUi.parentNode) cropUi.parentNode.removeChild(cropUi);
    cropState = null;
    cropDrag = null;
  }

  function openCrop() {
    if (cropOpen()) return;
    const info = imageApi.pickedInfo();
    const list = imageApi.pickedImgs();
    const base = list[list.length - 1];
    if (!info || !base) return;
    const box = ((base.closest && base.closest('.iclip')) || base).getBoundingClientRect();
    const a = info.asset;
    const c = info.crop || { x: 0, y: 0, w: a.w, h: a.h };
    // 배율 k = «보이는 폭 ÷ 지금 잘라 놓은 폭». 유령을 이 배율로 깔면 창이 지금 그림과 딱 겹친다.
    const k = box.width / Math.max(1, c.w);
    const s = { base, a, k, gx: box.left - c.x * k, gy: box.top - c.y * k,
                gw: a.w * k, gh: a.h * k, wasPanel: isOpen() };
    ghost.src = base.src;                    // 화면의 <img> src 가 곧 보관함 원본이다
    ghost.style.left = s.gx + 'px';
    ghost.style.top = s.gy + 'px';
    ghost.style.width = s.gw + 'px';
    ghost.style.height = s.gh + 'px';
    setWin(box.left, box.top, box.width, box.height);
    cropState = s;
    close();                                 // 서식 창은 덮개 밑에 깔리므로 잠시 닫는다
    document.body.appendChild(cropUi);
    tellOpened();                            // 미니 패널도 물러난다
  }

  // 적용 — 창 자리를 원본 좌표로 되돌려 crop 으로 적는다. patchBase 한 번(Ctrl+Z 한 번).
  function applyCrop() {
    const s = cropState;
    if (!s) { closeCrop(); return; }
    const r = cwin.getBoundingClientRect();
    // 창이 원본 전체와 같으면 «자르기 해제»로 적는다 — crop:null 이 남으면 안 된다
    const full = Math.abs(r.left - s.gx) < 1.5 && Math.abs(r.top - s.gy) < 1.5
      && Math.abs(r.width - s.gw) < 1.5 && Math.abs(r.height - s.gh) < 1.5;
    // ⛔ 덮개 좌표는 «눈에 보이는» 눈금이고 모델에 적는 폭은 «자리» 눈금이다.
    //    좁은 화면에서 종이를 줄여 보여 줄 때 이 둘이 다르므로 배율로 나눈다 —
    //    안 나누면 축소된 화면에서 자를 때마다 그림이 그만큼 작아진다.
    //    ⚠ crop(원본 좌표)은 s.k 가 «화면 폭 ÷ 잘린 폭»이라 둘 다 화면 눈금이어서 저절로 맞는다.
    const w = Math.round(r.width / scaleOf(pagesEl));
    const crop = full ? null : clampCrop({ x: (r.left - s.gx) / s.k, y: (r.top - s.gy) / s.k,
                                           w: r.width / s.k, h: r.height / s.k }, s.a);
    const wasPanel = s.wasPanel;
    closeCrop();
    imageApi.patchBase({ crop, w });
    if (wasPanel) setTimeout(openPanel, 0);
  }

  // ⛔ 끌기의 «잡기»는 손잡이나 창 자신에 건다. 덮개에 걸면 끌기가 끝난 뒤 click 의
  //    과녁이 덮개가 되어 «바깥을 눌렀다»로 읽히고, 크기를 조절하자마자 그대로 적용돼 버린다.
  cropUi.addEventListener('pointerdown', (e) => {
    if (!cropState) return;
    const t = e.target;
    const hd = t && t.closest ? t.closest('.ch') : null;
    const cap = hd || (t && t.closest && t.closest('.cw'));
    if (!cap) return;                        // 어두운 바깥은 click 이 «적용»으로 받는다
    e.preventDefault();
    const r = cwin.getBoundingClientRect();
    cropDrag = { c: hd ? hd.dataset.c : null, cap, id: e.pointerId,
                 x0: e.clientX, y0: e.clientY, l: r.left, t: r.top, w: r.width, h: r.height };
    try { cap.setPointerCapture(e.pointerId); } catch (err) { /* 잡기 실패해도 끌기는 된다 */ }
  });
  cropUi.addEventListener('pointermove', (e) => {
    const s = cropState;
    const g = cropDrag;
    if (!g || !s) return;
    const MIN = 12;                          // 창이 0 이 되면 나누기가 깨진다
    const dx = e.clientX - g.x0;
    const dy = e.clientY - g.y0;
    let l = g.l, t = g.t, w = g.w, h = g.h;
    if (!g.c) {                              // 창을 통째로 옮긴다 — 유령 안으로만
      l = Math.max(s.gx, Math.min(g.l + dx, s.gx + s.gw - w));
      t = Math.max(s.gy, Math.min(g.t + dy, s.gy + s.gh - h));
    } else {
      if (g.c.indexOf('w') >= 0) {
        const nl = Math.max(s.gx, Math.min(g.l + dx, g.l + g.w - MIN));
        w = g.l + g.w - nl; l = nl;
      }
      if (g.c.indexOf('e') >= 0) w = Math.max(MIN, Math.min(g.w + dx, s.gx + s.gw - g.l));
      if (g.c.indexOf('n') >= 0) {
        const nt = Math.max(s.gy, Math.min(g.t + dy, g.t + g.h - MIN));
        h = g.t + g.h - nt; t = nt;
      }
      if (g.c.indexOf('s') >= 0) h = Math.max(MIN, Math.min(g.h + dy, s.gy + s.gh - g.t));
    }
    setWin(l, t, w, h);
  });
  const endCropDrag = (e) => {
    if (!cropDrag) return;
    try { cropDrag.cap.releasePointerCapture(cropDrag.id); } catch (err) { /* 이미 놓였다 */ }
    cropDrag = null;
    if (e) e.preventDefault();
  };
  cropUi.addEventListener('pointerup', endCropDrag);
  cropUi.addEventListener('pointercancel', endCropDrag);
  // 어두운 바깥을 누르면 적용(설계 §4-2). 안내 줄은 «바깥»이 아니다 — 제 단추가 있다.
  cropUi.addEventListener('click', (e) => {
    if (!cropState) return;
    const t = e.target;
    if (!(t && t.closest)) return;
    if (t.closest('.ct-ok')) { applyCrop(); return; }
    if (t.closest('.ct-no')) { closeCrop(); return; }
    if (t.closest('.cw') || t.closest('.ch') || t.closest('.ctip')) return;
    applyCrop();
  });
  // 덮개가 떠 있는 동안은 편집을 잠근다 — Enter 적용 · Esc 취소 말고는 아무것도 안 통한다.
  // ⛔ stopPropagation 까지 해야 한다. 안 그러면 Esc 가 «그림 고르기 해제»로도 함께 먹어
  //    적용할 그림이 사라진다(그림 단축키는 document 에 붙어 있다).
  document.addEventListener('keydown', (e) => {
    if (!cropOpen()) return;
    e.stopPropagation();
    e.preventDefault();
    if (e.key === 'Escape') closeCrop();
    else if (e.key === 'Enter') applyCrop();
  }, true);
  window.addEventListener('wheel', (e) => { if (cropOpen()) e.preventDefault(); },
                          { passive: false, capture: true });

  // 크기·모서리를 처음 상태로. 자르기·둥근 모서리를 떼고 폭을 원본으로 되돌린다.
  // ⭐ 한 번의 patchPicked = setDoc 한 번 → Ctrl+Z 한 번에 통째로 돌아온다.
  // ⚠ 여러 장을 골랐으면 폭은 «기준 그림의 원본 폭»으로 모인다(설계 §3 — 일괄은 기준을 따른다).
  function reset() {
    const info = imageApi.pickedInfo();
    if (!info) return;
    imageApi.patchPicked({ crop: null, rad: null, w: info.asset.w });
  }

  // ── 칸 입력 ──
  // 입력 한 번 = setDoc 한 번(각자 Ctrl+Z 한 단계). number 칸의 change 는
  // 「엔터」와 「칸 밖으로 나가기」 둘 다에서 온다 — 치는 도중에는 안 온다.
  inW.addEventListener('change', () => {
    const v = Number(inW.value);
    if (!(v > 0)) { fill(); return; }
    imageApi.setPickedWidths(pxOf(v));
  });
  inH.addEventListener('change', () => {
    const info = imageApi.pickedInfo();
    const v = Number(inH.value);
    if (!info || !(v > 0)) { fill(); return; }
    // 높이는 «비율을 거꾸로 풀어» 폭으로 바꾼다 — 저장하는 것은 언제나 폭이다.
    const ratio = ratioOf({ crop: info.crop }, info.asset);
    imageApi.setPickedWidths(Math.round(pxOf(v) / Math.max(0.01, ratio)));
  });
  inR.addEventListener('change', () => {
    const v = Number(inR.value);
    imageApi.patchPicked({ rad: v > 0 ? pxOf(v) : null });
  });

  // ── 단추 ──
  // ⛔ 단추의 mousedown 을 막아야 «편집 자리»가 안 풀린다. 칸(input)은 막지 않는다 —
  //    막으면 초점이 안 들어가 아무것도 못 친다.
  for (const b of panel.querySelectorAll('button')) {
    b.addEventListener('mousedown', (e) => e.preventDefault());
  }
  panel.querySelector('.fp-x').addEventListener('click', close);
  panel.querySelector('.fp-crop').addEventListener('click', () => openCrop());
  panel.querySelector('.fp-reset').addEventListener('click', reset);
  panel.querySelector('.fp-round').addEventListener('click', toggleRound);
  // 복사·잘라내기는 «우리가» 담지 않는다 — 브라우저의 copy/cut 을 일으키면 이미 있는
  // 처리기가 그대로 돌아 자른 그림 굽기가 공짜다(우클릭 메뉴와 같은 길이다).
  panel.querySelector('.fp-copy').addEventListener('click', () => document.execCommand('copy'));
  panel.querySelector('.fp-cut').addEventListener('click', () => {
    document.execCommand('cut');
    close();                                 // 그림이 없어졌으니 창도 닫는다
  });
  panel.querySelector('.fp-del').addEventListener('click', () => {
    imageApi.removePicked();
    close();
  });
  // 정렬은 리본 단추를 «대행»한다(M4) — 정렬 규칙은 리본에 한 벌만 있다.
  for (const b of alignRow.querySelectorAll('button')) {
    b.addEventListener('click', () => {
      const t = barEl.querySelector('.tb[data-align="' + b.dataset.a + '"]');
      if (t) t.click();
    });
  }

  // ── 닫는 길 ──
  document.addEventListener('mousedown', (e) => {
    if (!isOpen()) return;
    const t = e.target;
    if (t && t.closest && (t.closest('#imgpanel') || t.closest('#imgui') || t.closest('#bar'))) return;
    // 그림을 다시 누르는 것은 «다른 그림 고르기»다 — 창은 열어 둔 채 값만 갈아 끼운다
    if (t && t.closest && (t.matches('img.ri, img.bimg') || t.closest('.iclip'))) return;
    close();
  }, true);
  document.addEventListener('keydown', (e) => {
    if (isOpen() && e.key === 'Escape') close();
  });

  // 다시 그리면 <img> 가 새것이 되고 선택도 다시 잡힌다(reselect). 그 사이 한 번은
  // «아무것도 안 골라진» 순간이 지나가므로 곧바로 닫으면 창이 깜빡인다 —
  // 한 박자 뒤에 «최종 상태»를 보고 판단한다.
  let pending = 0;
  imageApi.onPick(() => {
    if (!isOpen() || pending) return;
    pending = setTimeout(() => {
      pending = 0;
      if (!isOpen()) return;
      if (fill()) place();
    }, 0);
  });
  window.addEventListener('resize', () => { if (isOpen()) place(); });
  window.addEventListener('scroll', () => { if (isOpen()) place(); }, true);

  // ── 여는 길 ──
  // ⓐ 그림 더블클릭(S8) — 워드와 같은 감각
  pagesEl.addEventListener('dblclick', (e) => {
    const t = e.target;
    if (!(t && t.closest)) return;
    if (!(t.matches('img.ri, img.bimg') || t.closest('.iclip'))) return;
    e.preventDefault();
    // 더블클릭의 첫 클릭이 그림을 고르므로 이 시점엔 이미 골라져 있다
    openPanel();
  });
  // ⓑ 리본의 그림 묶음 단추
  for (const b of barEl.querySelectorAll('.tb[data-imgfmt]')) {
