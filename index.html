    b.addEventListener('mousedown', (e) => e.preventDefault());
    b.addEventListener('click', () => {
      const k = b.dataset.imgfmt;
      if (k === 'crop') openCrop();
      else if (k === 'reset') reset();
      else if (k === 'round') toggleRound();
      else openPanel();
    });
  }

  return { openPanel, openCrop, reset, close, closeCrop, cropOpen,
           panelOpen: isOpen, toggleRound };
}

/* context.js */
// 문맥 판정 · 리본 대행 · 상황별 리본 — 설계_서식과우클릭.md §5-1·§5-4 (S3·M4).
// ⛔ 최상위 이름은 attachContext 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로
//    파일이 달라도 최상위 이름이 겹치면 화면이 통째로 안 뜬다.
//
// ⭐ 여기서 «기능»을 새로 만들지 않는다. 지금 무엇을 골랐는지 «읽기»만 하고,
//    실제 동작은 언제나 리본 단추를 눌러 대신한다(M4). 그래야 우클릭 메뉴·미니 패널·
//    리본이 서로 어긋나지 않는다 — 규칙이 리본 한 벌뿐이기 때문이다.


function attachContext({ pagesEl, barEl, imageApi }) {
  // 지금 «무엇을 고른 상태인가». 순서가 곧 우선순위다 — 그림이 가장 세다.
  function ctxOf() {
    const n = imageApi.pickedImgs().length;
    if (n) return { kind: 'image', label: '🖼 그림 · ' + n + '장' };
    const cells = wholeCellsIn(pagesEl);
    if (cells.length > 1) return { kind: 'table', label: '▦ 표 · ' + cells.length + '칸 고름' };
    const el = activeBlockEl(pagesEl);
    if (el && activeCellEl(el)) return { kind: 'table', label: '▦ 표' };
    // 글자를 «집어» 놓았나 — 걸침 선택이면 블록마다 조각이 온다
    const chars = targetsIn(pagesEl).reduce((s, t) => s + Math.abs((t.to || 0) - (t.from || 0)), 0);
    if (chars > 0) return { kind: 'text', label: '가 글자 · ' + chars + '자' };
    if (el && activeCapEl(el)) return { kind: 'caret', label: '그림 설명' };
    const cls = el ? (el.className || '') : '';
    const label = cls.indexOf('blk-list') >= 0 ? '• 목록'
      : cls.indexOf('blk-heading') >= 0 ? '제목'
      : cls.indexOf('blk-section') >= 0 ? '절 제목' : '¶ 문단';
    return { kind: 'caret', label };
  }

  // 리본 단추 대행 — 메뉴·미니 패널이 «자기 손»으로 문서를 고치지 않게 하는 창구다.
  // ⚠ 숨어 있는(hidden) 묶음의 단추도 click() 은 그대로 동작한다. 보임/숨김은 보기 문제일 뿐이다.
  function pressButton(sel) {
    const btn = barEl.querySelector(sel);
    if (btn) { btn.click(); return true; }
    console.warn('리본 단추를 못 찾았다:', sel);   // 조용히 삼키지 않되 죽지도 않는다
    return false;
  }

  // ⛔ 손가락·마우스를 «누르고 있는 동안»에는 리본을 절대 바꾸지 않는다.
  //    표 칸을 끌기 시작하면 곧바로 「표」 묶음이 나타나 리본이 한 줄 늘고,
  //    그만큼 문서가 아래로 밀린다 — 끄는 손 밑에서 표가 움직이니 엉뚱한 칸이 골라진다
  //    (2026-08-31 실측: 표 실입력 검사 12건이 이것 때문에 깨졌다).
  //    누르고 있는 동안 온 갱신은 «밀린 일»로 적어 두었다가 손을 뗀 뒤에 한 번만 한다.
  let holding = false;
  let missed = false;
  document.addEventListener('pointerdown', () => { holding = true; }, true);
  const release = () => {
    holding = false;
    if (!missed) return;
    missed = false;
    refreshCtxGroups();
  };
  document.addEventListener('pointerup', release, true);
  document.addEventListener('pointercancel', release, true);

  // 상황 묶음을 보이거나 숨긴다. 표와 그림을 동시에 만족할 수도 있다(표 칸 안 그림).
  // ⛔ 묶음이 나타나면 리본이 한 줄 늘고 그만큼 문서가 «아래로 밀린다». 태블릿에서는
  //    188px 이나 밀려서, 표 칸을 누른 자리에서 표가 손끝 아래로 도망가 버린다(실측).
  //    그래서 늘어난 만큼 화면을 같이 굴려 문서가 «가만히 있는 것처럼» 보이게 한다.
  //    ⚠ 높이는 «정말 바뀔 때만» 잰다 — 커서가 움직일 때마다 재면 화면이 느려진다.
  function refreshCtxGroups() {
    if (holding) { missed = true; return; }
    const el = activeBlockEl(pagesEl);
    const gt = barEl.querySelector('[data-ctx="table"]');
    const gi = barEl.querySelector('[data-ctx="image"]');
    const 표켤까 = !!(wholeCellsIn(pagesEl).length
      || (el && (activeCellEl(el) || (el.className || '').indexOf('blk-table') >= 0)));
    const 그림켤까 = !!imageApi.pickedImgs().length;
    if ((!gt || gt.hidden === !표켤까) && (!gi || gi.hidden === !그림켤까)) return;
    // ⛔ «리본이 얼마나 커졌나»로 보정하면 안 된다. 크롬이 이미 스스로 보정해 주는
    //    경우가 있어서(스크롤 앵커링) 그때는 두 번 굴러 문서가 그만큼 튄다 —
    //    2쪽 그림을 눌렀는데 화면이 위로 뛰던 진짜 원인이다(2026-08-31 SKY 지적,
    //    실측: 리본은 70px 커졌는데 화면은 140px 굴렀다).
    //    그래서 «문서가 실제로 움직인 거리»를 잰다. 크롬이 이미 맞춰 놨으면 0 이라
    //    아무 일도 안 하고, 안 맞춰 놨으면 딱 그만큼만 되돌린다.
    const ref = pagesEl.querySelector('.page');
    const 전 = ref ? ref.getBoundingClientRect().top : null;
    if (gt) gt.hidden = !표켤까;
    if (gi) gi.hidden = !그림켤까;
    const 후 = ref ? ref.getBoundingClientRect().top : null;
    if (전 === null || 후 === null || Math.abs(후 - 전) < 0.5) return;
    // ⛔ 이 «보정 스크롤»은 사람이 화면을 굴린 것이 아니다. 그런데 브라우저는 똑같은
    //    scroll 사건으로 알려 주므로, 그것을 «굴렸으니 메뉴를 닫자»로 읽는 곳이 있으면
    //    방금 연 우클릭 메뉴가 곧바로 닫힌다(2026-08-31 실측: 그림 위 우클릭이 통째로 안 됐다).
    //    그래서 «지금은 내가 굴리는 중»이라고 잠깐 표시해 둔다.
    adjustUntil = Date.now() + 300;
    window.scrollBy(0, 후 - 전);
  }
  let adjustUntil = 0;
  const isAdjusting = () => Date.now() < adjustUntil;

  document.addEventListener('selectionchange', refreshCtxGroups);
  imageApi.onPick(refreshCtxGroups);
  refreshCtxGroups();

  return { ctxOf, pressButton, refreshCtxGroups, isAdjusting };
}

// 우클릭 문맥 메뉴 + 미니 패널 — 설계_서식과우클릭.md §5-2·§5-3 (S4·S5·S6·M4·M5).
// ⛔ 최상위 이름은 attachMenu 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로
//    파일이 달라도 최상위 이름이 겹치면 화면이 통째로 안 뜬다.
//
// ⭐ 이 파일은 문서를 «직접» 고치지 않는다. 무엇을 누르든 결국 리본 단추를 대신 누른다(M4).
//    그래야 규칙이 리본 한 벌뿐이어서 메뉴와 리본이 서로 어긋날 수가 없다.
//    예외는 리본에 단추가 없는 것들뿐이다 — 복사·잘라내기·붙여넣기·그림 서식 창.

    { label: '복사', run: 'copy' }, { label: '잘라내기', run: 'cut' },
    { label: '붙여넣기', run: 'paste' },
    // 판(版) — 표 칸에서는 «행»과 «칸»까지 다룬다. 「보일 판…」 은 이 표 블록 전체에 붙는다.
    { label: '보일 판…', press: '[data-vars="block"]', when: 'vars' },
    { label: '행 보일 판…', press: '[data-vars="row"]', when: 'vars' },
    // ⭐ 「판별 값…」 이 판마다의 값을 한 창에 모아 보여 준다(2026-09-01 SKY). 아래 두 항목은
    //    그 창 안에서도 할 수 있지만, 손에 익은 길을 없애지 않으려고 그대로 둔다.
    { label: '판별 값…', press: '[data-vars="cellvals"]', when: 'vars' },
    { label: '이 칸 판별로', press: '[data-vars="cellmake"]', when: 'vars' },
    { label: '판별 풀기', press: '[data-vars="cellclear"]', when: 'vars' },
    { label: '판 관리…', press: '[data-vars="mgr"]' },
    // 부품 목록(기둥 3) — 이 칸의 값을 목록에서 가져온다. 판이 없는 문서에서도 쓴다.
    { label: '부품 값 넣기…', press: '[data-parts="cellref"]' },
    // ⭐ 표 다음에는 커서를 둘 자리가 없어 글을 넣을 수 없었다(2026-09-02 SKY)
    { label: '⬆ 위에 새 줄', press: '[data-newline="before"]' },
    { label: '⬇ 아래에 새 줄', press: '[data-newline="after"]' },
  ],
  text: [
    { label: '복사', run: 'copy' }, { label: '잘라내기', run: 'cut' },
    { label: '붙여넣기', run: 'paste' },
    { label: '보일 판…', press: '[data-vars="block"]', when: 'vars' },
    { label: '판 관리…', press: '[data-vars="mgr"]' },
    { label: '⬆ 위에 새 줄', press: '[data-newline="before"]' },
    { label: '⬇ 아래에 새 줄', press: '[data-newline="after"]' },
  ],
  caret: [
    { label: '붙여넣기', run: 'paste' },
    { label: '표 넣기', press: '[data-table="insert"]' },
    { label: '그림 넣기', press: '[data-image="auto"]' },
    { label: '보일 판…', press: '[data-vars="block"]', when: 'vars' },
    { label: '⬆ 위에 새 줄', press: '[data-newline="before"]' },
    { label: '⬇ 아래에 새 줄', press: '[data-newline="after"]' },
    // ⭐ 「판 관리…」 는 «판이 없는 문서에서도» 보인다 — 판이 0개면 판 바도 리본 「판」 묶음도
    //    없어서 관리 창을 열 길이 아예 없었다(첫 판을 만들 입구가 없는 막힌 길이었다).
    { label: '판 관리…', press: '[data-vars="mgr"]' },
  ],
};

function attachMenu({ pagesEl, barEl, ctxApi, imageApi, formatApi, varsRects }) {
  const menu = document.createElement('div');
  menu.id = 'ctxmenu';
  menu.setAttribute('contenteditable', 'false');
  const mini = document.createElement('div');
  mini.id = 'minibar';
  mini.setAttribute('contenteditable', 'false');
  // ⭐ 표 안 글자를 고르면 «글자 서식바»와 «표 서식바»가 함께 뜬다(2026-09-01 SKY).
  //    한 상자에 몰아넣지 않는 까닭은 옛 4.4MB 프로그램과 같다 — 뜻이 다른 것을 한 덩어리로
  //    두면 무엇이 글자에 걸리고 무엇이 표에 걸리는지 눈으로 안 갈린다.
  const mini2 = document.createElement('div');
  mini2.id = 'minibar2';
  mini2.className = 'minibar';
  mini2.setAttribute('contenteditable', 'false');

  // ⛔ 마지막으로 무엇으로 눌렀는지 기억한다. 태블릿에서 «길게 누르기»는 브라우저가
  //    이미 글자 고르기·붙여넣기 메뉴로 쓴다 — 우리가 가로채면 그 익숙한 것이 사라진다(M5).
  let lastPtr = 'mouse';
  document.addEventListener('pointerdown', (e) => { lastPtr = e.pointerType || 'mouse'; }, true);

  // ── 부품 만들기 ──
  // 리본 단추의 속(SVG)을 그대로 복제한다 — 없으면 만들지 않는다(리본이 바뀌면 여기도 따라간다)
  function cloneBtn(sel, tip) {
    const src = barEl.querySelector(sel);
    if (!src) return null;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'q';
    b.dataset.press = sel;
    b.title = tip || src.title || '';
    // ⚠ 리본 단추는 2026-09-01 부터 «심볼(.ic) + 작은 이름(.lb)» 두 칸이다. 통째로 베끼면
    //   30px 짜리 작은 단추에 이름까지 들어가 글자가 접힌다 — 심볼만 가져온다.
    const svg = src.querySelector('svg');
    const ic = src.querySelector('.ic');
    if (svg) b.appendChild(svg.cloneNode(true));
    else if (ic) b.textContent = ic.textContent.trim();
    else b.textContent = src.textContent.trim();
    return b;
  }
  function markBtn(m) {
    if (!barEl.querySelector(m.sel)) return null;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'q' + (m.cls ? ' ' + m.cls : '');
    b.dataset.press = m.sel;
    b.title = m.tip;
    b.textContent = m.txt;
    if (m.color) b.style.color = m.color;
    return b;
  }

  // 문맥에 맞는 «빠른 줄» — 미니 패널(§5-3)도 이 함수를 그대로 쓴다.
  // ⚠ 한 줄로 죽 늘어놓으면 폭에 따라 아무 데서나 접혀 «5개, 1개»처럼 갈라진다(캡처 실측).
  //   뜻이 같은 것끼리 묶어(.qg) 줄을 나눈다 — 글자꼴 / 색 / 정렬·맞춤.
  function quickStrip(kind) {
    const wrap = document.createElement('div');
    wrap.className = 'qs';
    const group = (els) => {
      const live = els.filter(Boolean);
      if (!live.length) return;
      const g = document.createElement('div');
      g.className = 'qg';
      for (const el of live) g.appendChild(el);
      wrap.appendChild(g);
    };
    if (kind === 'image') {
      group(MENU_ALIGN.map(s => cloneBtn(s)));
      return wrap;
    }
    if (kind === 'tableops') {                 // 표 서식바 — 행·열·병합·머리글·세로 맞춤
      group(MENU_TABLEOPS.map(s => cloneBtn(s)));
      group(MENU_VALIGN.map(s => cloneBtn(s)));
      return wrap;
    }
    // 글자 서식바 — 굵게·색·정렬·목록. 표 안이든 문단이든 «글자에 걸리는 것»은 이것뿐이다.
    group(MENU_MARKS.map(markBtn));
    group(MENU_COLORS.map(markBtn));
    group(MENU_ALIGN.map(s => cloneBtn(s)).concat(MENU_LIST.map(markBtn)));
    return wrap;
  }

  // ── 실행 ──
  // 1.5초짜리 알림 — 메뉴 자리에 띄운다. 실패를 조용히 삼키지 않기 위한 것이다.
  function say(text, x, y) {
    const t = document.createElement('div');
    t.className = 'mtoast';
    t.textContent = text;
    t.style.left = Math.round(Math.min(x, window.innerWidth - 320)) + 'px';
    t.style.top = Math.round(Math.min(y, window.innerHeight - 60)) + 'px';
    document.body.appendChild(t);
    setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 1800);
  }

  let lastXY = { x: 40, y: 40 };

  // 메뉴의 붙여넣기 — 브라우저가 «클립보드를 읽어도 되겠냐»고 한 번 묻는다.
  // 막히면 안내로 물러난다(설계 §5-2 U1). ⛔ 조용히 아무 일도 안 하면 안 된다.
  async function runPaste() {
    try {
      if (!navigator.clipboard || !navigator.clipboard.read) {
        say('이 브라우저는 메뉴 붙여넣기를 막습니다 — Ctrl+V 를 눌러 주세요', lastXY.x, lastXY.y);
        return;
      }
      const items = await navigator.clipboard.read();
      let html = '';
      let text = '';
      const files = [];
      for (const it of items) {
        for (const ty of it.types) {
          if (ty === 'text/html') html = await (await it.getType(ty)).text();
          else if (ty === 'text/plain') text = await (await it.getType(ty)).text();
          else if (ty.indexOf('image/') === 0) {
            files.push(new File([await it.getType(ty)], 'paste', { type: ty }));
          }
        }
      }
      if (html.indexOf('<table') >= 0) {
        say('표 붙여넣기는 Ctrl+V 를 눌러 주세요', lastXY.x, lastXY.y);
        return;
      }
      if (imageApi.pasteData({ html, text, files, textOnly: true })) return;
      say('붙여넣을 내용을 읽지 못했습니다 — Ctrl+V 를 눌러 주세요', lastXY.x, lastXY.y);
    } catch (err) {
      say('브라우저가 클립보드 읽기를 막았습니다 — Ctrl+V 를 눌러 주세요', lastXY.x, lastXY.y);
    }
  }

  function run(kind) {
    if (kind === 'panel') { formatApi.openPanel(); return; }
    if (kind === 'crop') { formatApi.openCrop(); return; }
    if (kind === 'reset') { formatApi.reset(); return; }
    if (kind === 'remove') { imageApi.removePicked(); return; }
    // ⭐ copy·cut 은 «우리가 직접» 담지 않는다. execCommand 가 브라우저의 copy/cut 을
    //    일으키면 이미 있는 처리기가 그대로 돈다 — 자른 그림 굽기·표 모양 담기가 공짜다.
    if (kind === 'copy') { document.execCommand('copy'); return; }
    if (kind === 'cut') { document.execCommand('cut'); return; }
    if (kind === 'paste') { runPaste(); return; }
  }

  // ── 메뉴 ──
  const menuOpen = () => !!menu.parentNode;

  function closeMenu() {
    if (menu.parentNode) menu.parentNode.removeChild(menu);
  }

  // 이 문서에 판이 있나 — 판 관련 항목의 보임 조건이다.
  // ⚠ menu.js 는 문서(getDoc)를 모른다. 리본 「판」 묶음의 보임으로 대신 판단한다:
  //   그 묶음은 vbar.js 의 refreshGroup() 이 «문서의 판 수»로만 켜고 끄므로(고른 것과
  //   무관하다) «판이 있나»와 정확히 같은 뜻이다.
  function 판있나() {
    const g = barEl.querySelector('[data-ctx="vars"]');
    return !!g && !g.hidden;
  }

  function buildMenu(ctx) {
    menu.textContent = '';
    const badge = document.createElement('div');
    badge.className = 'mbadge';
    badge.textContent = ctx.label;
    menu.appendChild(badge);
    menu.appendChild(quickStrip(ctx.kind));
    const list = document.createElement('div');
    list.className = 'mlist';
    for (const it of (MENU_ITEMS[ctx.kind] || MENU_ITEMS.caret)) {   // 그림은 여기 안 온다
      if (it.when === 'vars' && !판있나()) continue;
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = it.label;
      if (it.press) b.dataset.press = it.press;
      else b.dataset.run = it.run;
      list.appendChild(b);
    }
    menu.appendChild(list);
  }

  function openMenuAt(x, y) {
    lastXY = { x, y };
    const ctx0 = ctxApi.ctxOf();
    // 그림은 «그림 서식» 창 하나로 통합했다 — 들어오는 길만 둘이다(더블클릭·우클릭).
    if (ctx0.kind === 'image') { closeMenu(); formatApi.openPanel(); return; }
    buildMenu(ctx0);
    if (!menu.parentNode) document.body.appendChild(menu);
    menu.style.left = '0px';
    menu.style.top = '0px';
    // 화면 밖으로 나가면 안쪽으로 접는다 — 잘려 나가면 아래 항목을 아예 못 누른다
    const w = menu.offsetWidth;
    const h = menu.offsetHeight;
    menu.style.left = Math.round(Math.max(6, Math.min(x, window.innerWidth - w - 6))) + 'px';
    menu.style.top = Math.round(Math.max(6, Math.min(y, window.innerHeight - h - 6))) + 'px';
    hideMini();
  }

  pagesEl.addEventListener('contextmenu', (e) => {
    if (lastPtr === 'touch') return;      // 태블릿 길게 누르기는 브라우저 기본에 맡긴다(M5)
    const t = e.target;
    // 그림 위에서 우클릭하면 그 그림을 먼저 고른다 — 워드와 같다
    const box = t && t.closest ? t.closest('.iclip') : null;
    const img = t && t.matches && t.matches('img.ri, img.bimg') ? t
      : (box ? box.querySelector('img') : null);
    if (img && imageApi.pickedImgs().indexOf(img) < 0) imageApi.selectImg(img);
    e.preventDefault();
    openMenuAt(e.clientX, e.clientY);
  });

  // ⛔ mousedown 을 막아야 «고른 글»이 안 풀린다. 리본 단추가 쓰는 것과 같은 수법이다.
  const guard = (root) => root.addEventListener('mousedown', (e) => {
    if (e.target.closest && e.target.closest('button')) e.preventDefault();
  });
  guard(menu);
  guard(mini);

  const fire = (e, closeAfter) => {
    const b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.dataset.press) ctxApi.pressButton(b.dataset.press);
    else if (b.dataset.run) run(b.dataset.run);
    if (closeAfter) closeMenu();
  };
  menu.addEventListener('click', (e) => fire(e, true));
  mini.addEventListener('click', (e) => fire(e, false));

  document.addEventListener('mousedown', (e) => {
    if (!menuOpen()) return;
    if (e.target.closest && e.target.closest('#ctxmenu')) return;
    closeMenu();
  }, true);
  document.addEventListener('keydown', (e) => {
    if (menuOpen() && e.key === 'Escape') { closeMenu(); return; }
    // 타자를 치기 시작하면 미니 패널은 물러난다 — 글자를 가리면 안 된다
    if (miniOpen() && e.key.length === 1) hideMini();
    if (miniOpen() && e.key === 'Escape') hideMini();
  }, true);
  // 화면을 굴리면 메뉴는 따라가지 않으므로 닫는다.
  // ⛔ 단 «리본이 커진 만큼 맞춰 굴린 것»은 사람이 굴린 게 아니다 — 그것까지 닫으면
  //    그림 위 우클릭이 열리자마자 닫혀 통째로 안 되는 것처럼 보인다(2026-08-31 실측).
  window.addEventListener('scroll', () => {
    if (ctxApi.isAdjusting && ctxApi.isAdjusting()) return;
    closeMenu();
    hideMini();
  }, true);

  // ── 미니 패널 (S4) ──
  // 마우스로 «고른 그 순간»에만 뜬다. 태블릿에서는 안 띄운다 — 브라우저 제 메뉴와 겹친다(M5).
  const miniOpen = () => !!mini.parentNode || !!mini2.parentNode;
  function hideMini() {
    if (mini.parentNode) mini.parentNode.removeChild(mini);
    if (mini2.parentNode) mini2.parentNode.removeChild(mini2);
  }

  // 지금 고른 것을 감싸는 «화면 위 네모». 없으면 null(= 미니 패널을 안 띄운다).
  function targetRect(kind) {
    if (kind === 'image') {
      const list = imageApi.pickedImgs();
      const base = list[list.length - 1];
      if (!base) return null;
      return ((base.closest && base.closest('.iclip')) || base).getBoundingClientRect();
    }
    const s = window.getSelection();
    if (!s || !s.rangeCount || s.getRangeAt(0).collapsed) return null;
    const r = s.getRangeAt(0).getBoundingClientRect();
    return (r.width || r.height) ? r : null;
  }

  function showMini() {
    if (lastPtr === 'touch' || menuOpen()) { hideMini(); return; }
    // ⛔ 서식 창·자르기가 열려 있으면 미니 패널은 물러난다. 둘 다 «고른 그림 옆»에 놓이는데
    //    오른쪽에 자리가 없으면 둘 다 왼쪽으로 접혀 서로 겹쳐 보인다(2026-08-31 SKY 지적).
    //    서식 창이 더 자세하니 그쪽을 남긴다.
    if ((formatApi.panelOpen && formatApi.panelOpen())
      || (formatApi.cropOpen && formatApi.cropOpen())) { hideMini(); return; }
    const ctx = ctxApi.ctxOf();
    if (ctx.kind === 'caret') { hideMini(); return; }   // 커서만 있으면 띄울 까닭이 없다
    const r = targetRect(ctx.kind);
    if (!r) { hideMini(); return; }

    // 한 상자를 채워 넣는다. 뱃지 + 빠른 줄.
    const fill = (el, label, kind) => {
      el.textContent = '';
      const badge = document.createElement('div');
      badge.className = 'mbadge';
      badge.textContent = label;
      el.appendChild(badge);
      el.appendChild(quickStrip(kind));
      if (!el.parentNode) document.body.appendChild(el);
    };
    const drop = (el) => { if (el.parentNode) el.parentNode.removeChild(el); };

    // ⭐ 표 안 글자를 고르면 «글자 서식바»와 «표 서식바»가 함께 뜬다(2026-09-01 SKY).
    if (ctx.kind === 'image') {
      fill(mini, ctx.label, 'image');
      drop(mini2);
    } else {
      fill(mini, ctx.kind === 'table' ? '가 글자' : ctx.label, 'text');
      if (ctx.kind === 'table') fill(mini2, ctx.label, 'tableops'); else drop(mini2);
    }

    // ⭐ «종이 왼쪽 빈 자리»에 세운다 — 가로는 늘 같은 자리, 세로만 고른 자리를 따라간다.
    //    2026-09-01 SKY: "드래그를 했을 떄 뜨는 서식바는 현재 드래그한 위치의 종이 좌측에
    //    표시 되도록 했었는데, 어느 순간 변해 있어." 옛 4.4MB 프로그램과 같은 규칙이다.
    //    ⛔ 옛 코드는 «고른 것 바로 왼쪽»(r.left − 8 − 폭)이라 글자 위를 덮었다.
    // ⭐ 판별 값 창·판 관리 창이 떠 있으면 «물러나지 않고» 그 아래에 쌓는다
    //    (2026-09-01 SKY: "둘다 표시 되는 조건이니까 둘다 표시 되어야지. 겹치지만 않게").
    const taken = (varsRects && varsRects()) || [];
    const put = (el) => {
      el.style.left = leftGutterX(pagesEl, el.offsetWidth) + 'px';
      el.style.top = packInGutter(r.top, el.offsetHeight, taken) + 'px';
      taken.push(el.getBoundingClientRect());
    };
    put(mini);
    if (mini2.parentNode) put(mini2);
  }

  // 선택은 mouseup «뒤»에 확정된다 — 한 박자 뒤에 잰다
  pagesEl.addEventListener('mouseup', () => {
    if (lastPtr === 'touch') return;
    setTimeout(showMini, 0);
  });
  imageApi.onPick(() => {
    if (lastPtr === 'touch') return;
    setTimeout(showMini, 0);
  });
  document.addEventListener('selectionchange', () => {
    if (!miniOpen()) return;
    const ctx = ctxApi.ctxOf();
    if (ctx.kind === 'caret') hideMini();
  });
  // 서식 창·자르기가 열리면 곧바로 비켜 준다(이미 떠 있던 경우)
  document.addEventListener('imgui:panel-open', hideMini);

  return { openMenuAt, closeMenu, quickStrip, showMini, hideMini, menuOpen, miniOpen };
}

/* fit.js */
// 좁은 화면에서 종이를 «화면에 맞게 줄여» 보여 준다 (2026-08-31 SKY).
// ⛔ 최상위 이름은 attachFit 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합친다.
//
// 왜 필요한가: A4 종이는 794px 이라 태블릿을 반으로 나눠 쓰면 자리에 안 들어간다.
// 전에는 종이가 그대로 넘쳐서 좌우로 밀어야 했다. 이제 자리에 맞게 줄여 보여 준다.
//
// ⭐ «줄이기»만 한다 — 자리가 넉넉하면 원래 크기 그대로다. 크게 키우지는 않는다.
//    글자가 못 읽을 만큼 작아지지 않게 바닥(MINZOOM)을 둔다. 그보다 좁으면 거기서 멈추고
//    나머지는 좌우로 밀어 본다.
//
// ⚠ transform 이 아니라 zoom 을 쓴다. transform 은 «자리»를 그대로 두고 그림만 줄여서
//   종이 아래에 빈 자리가 그만큼 남는다. zoom 은 자리까지 함께 줄어 그런 일이 없다.
// ⛔ 인쇄에서는 반드시 1 이어야 한다 — 줄어든 채로 인쇄되면 A4 한복판에 작게 찍힌다.
//   (styles.css 의 @media print 에서 zoom 을 1 로 되돌린다.)

const MINZOOM = 0.55;   // 이보다 작아지면 글자를 못 읽는다 — 거기서 멈춘다
const SLACK = 10;       // 종이 옆에 남기는 숨통(px). 0 이면 그림자가 잘려 답답하다
const TAGGAP = 14;      // 종이 끝과 판 이름표 사이 (styles.css 의 .vtag left offset 과 같아야 한다)

// ⭐ 최종 배율 = 자동맞춤 × 사용자배율(ui/zoom.js). 둘은 하는 일이 다르다 —
//    자동맞춤은 «좁은 화면에서 종이를 자리에 넣는» 것이고, 사용자배율은 «크게 보고 싶다»다.
//    getUser 를 안 주면 1 로 보므로 지금까지와 똑같이 동작한다.
function attachFit({ mainEl, pagesEl, getDoc, getUser }) {
  let last = -1;
  let lastPad = -1;

  // ⭐ 전체보기의 «판 이름표»는 종이 밖에 선다 — 그 자리를 안 세면 이름표가 잘린다
  //    (2026-09-01 SKY: 태블릿에서 첫 글자만 보였다). 판 보기·판 없는 문서면 0 이라
  //    지금까지와 똑같이 동작한다.
  // ⚠ 반드시 zoom 을 벗긴 «맨 크기»로 재야 한다 — 부르는 쪽이 벗겨 놓고 부른다.
  function tagRoom() {
    let w = 0;
    for (const t of pagesEl.querySelectorAll('.vtag')) {
      const r = t.getBoundingClientRect().width;
      if (r > w) w = r;
    }
    return w ? Math.ceil(w) + TAGGAP : 0;
  }

  function fit() {
    const doc = getDoc && getDoc();
    const paper = (doc && doc.page && doc.page.width) || 794;
    // 자리 폭은 «지금 배율을 뺀» 값이어야 한다. zoom 이 걸린 채로 clientWidth 를 재면
    // 줄인 만큼 넓게 나와서, 재고 → 줄이고 → 다시 재면 또 넓어 보이는 되먹임이 생긴다.
    pagesEl.style.zoom = '';
    const room = mainEl.clientWidth;
    if (!room) return;
    // 종이는 가운데 정렬이라, 아무것도 안 해도 이름표가 보이려면 자리가 «양쪽»으로
    // 이름표 폭만큼 있어야 한다. 그만큼 넉넉하면 손대지 않는다(넓은 화면은 지금 그대로).
    // 모자라면 오른쪽에만 자리를 비우고(padding), 그래도 모자라면 그때 줄인다.
    const gutter = tagRoom();
    const 넉넉 = !gutter || room - SLACK >= paper + gutter * 2;
    const pad = 넉넉 ? 0 : gutter;
    let auto = (room - SLACK) / (paper + pad);
    if (auto >= 1) auto = 1;                 // 자리가 넉넉하면 손대지 않는다
    else if (auto < MINZOOM) auto = MINZOOM;
    // ⛔ 사용자배율은 «곱한다». 자동맞춤을 덮어쓰면 좁은 화면에서 종이가 다시 넘친다.
    const user = (getUser && getUser()) || 1;
    let z = auto * user;
    // ⚠ 사용자가 키우겠다고 했으면 1 을 넘겨도 된다 — 바닥만 지킨다.
    if (z < MINZOOM * 0.7) z = MINZOOM * 0.7;
    z = Math.round(z * 1000) / 1000;
    if (z === last && pad === lastPad && z === 1 && !pad) { pagesEl.style.zoom = ''; return; }
    last = z;
    lastPad = pad;
    pagesEl.style.paddingRight = pad ? pad + 'px' : '';
    pagesEl.style.zoom = z === 1 ? '' : String(z);
  }

  // 화면 크기가 바뀔 때마다. ⚠ 리본이 한 줄 늘고 주는 것은 «세로»라 여기와 무관하다.
  window.addEventListener('resize', fit);
  if (typeof ResizeObserver === 'function') {
    // 사이드바가 접히거나 하면 window resize 없이도 자리가 바뀐다
    new ResizeObserver(fit).observe(mainEl);
  }
  fit();
  return { fit, zoomNow: () => (Number(pagesEl.style.zoom) || 1) };
}

/* zoom.js */
// 종이만 확대·축소한다 (2026-09-01 SKY).
//
// SKY: "화면 축소 및 확대를 할 때 사이드바나 리본도 같이 축소 확대 되는데,
//       종이 부분만 확대 축소 되도록"
//
// ⛔ 브라우저의 확대(Ctrl+휠 · 두 손가락)는 «화면 전체»를 키운다 — 사이드바·리본까지.
//    그것은 CSS 로 막을 수 없다. 그래서 그 동작을 «우리가 가로채서» 종이(#pages)에만 건다.
//
// ⭐ 최종 배율 = 자동맞춤(fit.js) × 사용자배율(여기)
//    자동맞춤은 «좁은 화면에서 종이를 자리에 넣는» 일이고, 사용자배율은 «내가 크게 보고 싶다»다.
//    둘은 하는 일이 달라서 곱해야 맞다. 사용자배율이 1 이면 지금까지와 똑같이 동작한다.
//
// ⛔ 최상위 이름은 attachZoom 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로
//    같은 이름이 둘이면 화면이 통째로 안 뜬다.
// ⚠ 인쇄에는 영향이 없다 — styles.css @media print 가 #pages 의 zoom 을 1 로 되돌린다.

// ⛔ 이름을 ZMIN·ZMAX·ZSTEP 으로 짓는다. 처음엔 MIN·MAX 로 썼다가 ui/sidebar.js 의
//    MIN·MAX 와 겹쳐 «화면이 통째로 안 떴다»(Identifier 'MIN' has already been declared).
//    빌드가 모듈 34개를 한 덩어리로 합치므로 최상위 이름은 저장소 전체에서 겹치면 안 된다.
const ZMIN = 0.4;      // 이보다 작으면 글자를 못 읽는다
const ZMAX = 3;        // 이보다 크면 한 줄도 안 보인다
const ZSTEP = 1.1;     // 휠 한 칸

function attachZoom({ mainEl, pagesEl, refit, onChange }) {
  let user = 1;

  const 알림 = () => { if (onChange) onChange(user); };
  const 맞추기 = () => { if (refit) refit(); };

  function 정하기(v) {
    const n = Math.max(ZMIN, Math.min(ZMAX, Math.round(v * 1000) / 1000));
    if (n === user) return;
    user = n;
    맞추기();
    알림();
  }

  // ── PC: Ctrl + 휠 ────────────────────────────────────────────
  // ⛔ passive:false 여야 preventDefault 가 먹는다 — 안 그러면 브라우저가 화면 전체를 키운다.
  mainEl.addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    정하기(e.deltaY < 0 ? user * ZSTEP : user / ZSTEP);
  }, { passive: false });

  // ── 태블릿: 두 손가락 ────────────────────────────────────────
  // ⚠ 브라우저의 두 손가락 확대는 styles.css 에서 껐다(touch-action 에 pinch-zoom 을 뺐다).
  //   그래야 우리 손가락 처리가 «화면 전체 확대»에 먼저 먹히지 않는다.
  // ⚠ 한 손가락 세로 끌기는 그대로 브라우저에 맡긴다(pan-y) — 종이를 손으로 넘겨 봐야 한다.
  const 손 = new Map();
  let 시작거리 = 0;
  let 시작배율 = 1;
  const 거리 = () => {
    const p = [...손.values()];
    if (p.length < 2) return 0;
    return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  };
  pagesEl.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    손.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (손.size === 2) { 시작거리 = 거리(); 시작배율 = user; }
  });
  pagesEl.addEventListener('pointermove', (e) => {
    if (!손.has(e.pointerId)) return;
    손.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (손.size !== 2 || !시작거리) return;
    e.preventDefault();
    정하기(시작배율 * (거리() / 시작거리));
  });
  const 떼기 = (e) => {
    if (!손.has(e.pointerId)) return;
    손.delete(e.pointerId);
    if (손.size < 2) 시작거리 = 0;
  };
  pagesEl.addEventListener('pointerup', 떼기);
  pagesEl.addEventListener('pointercancel', 떼기);

  // ── 자판 ────────────────────────────────────────────────────
  // ⛔ e.key 로만 보면 한글 자판에서 안 먹는다 — e.code 는 «자판에 상관없는 키 자리»다
  //    (2026-08-30 실측: Ctrl+Z 가 key='ㅋ' 로 왔다).
  document.addEventListener('keydown', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    if (e.code === 'Equal' || e.key === '+' || e.key === '=') { e.preventDefault(); 정하기(user * ZSTEP); }
    else if (e.code === 'Minus' || e.key === '-') { e.preventDefault(); 정하기(user / ZSTEP); }
    else if (e.code === 'Digit0' || e.key === '0') { e.preventDefault(); 정하기(1); }
  });

  return {
    get: () => user,
    set: 정하기,
    reset: () => 정하기(1),
  };
}

/* sidebar.js */
// 사이드바 너비 조절 — 손잡이를 끌면 사이드바가 넓어지고 좁아진다. 기억한다.
// 2026-09-01 SKY: "태블릿에서 사이드바 너비도 좀 줄이고(일단 사이드바 너비는 조절할 수 있게
// 기존처럼)". «기존» = 옛 4.4MB 프로그램의 같은 기능(손잡이 끌기 · 180~480px · 브라우저에 기억).
//
// ⛔ 최상위 이름은 attachSidebar 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로 같은 이름이
//    둘이면 화면이 통째로 안 뜬다.
// ⚠ 옛 프로그램은 mouse 사건만 들었다 — 태블릿에서는 손가락으로 못 끌었다.
//    여기서는 pointer 사건을 쓴다(마우스·손가락·S펜이 한 길로 들어온다).
// ⚠ 폭은 브라우저에 기억한다(localStorage). 문서가 아니라 «이 기기에서 보는 방식»이라
//    문서 파일에 넣지 않는다.

const KEY = 'doc-editor-sbw';
const MIN = 180;
const MAX = 480;

function attachSidebar({ onResize }) {
  const grip = document.getElementById('sbresize');
  if (!grip) return { widthNow: () => 0 };

  const put = (w) => document.documentElement.style.setProperty('--sbw', w + 'px');
  const clamp = (w) => Math.max(MIN, Math.min(MAX, Math.round(w)));

  // 기억해 둔 폭이 있으면 되살린다 — 없으면 CSS 기본값(넓은 화면 250 · 좁은 화면 190)을 쓴다.
  // ⚠ 값이 망가져 있어도(사람이 손댔거나 옛 판) 조용히 무시하고 기본값으로 간다.
  try {
    const saved = parseInt(window.localStorage.getItem(KEY) || '', 10);
    if (saved >= MIN && saved <= MAX) put(saved);
  } catch (e) { /* 사생활 보호 모드 등 — 기억이 안 되는 것뿐이라 그냥 간다 */ }

  let dragging = false;
  grip.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dragging = true;
    grip.classList.add('on');
    grip.setPointerCapture(e.pointerId);      // 손가락이 손잡이 밖으로 나가도 계속 따라온다
  });
  grip.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    put(clamp(e.clientX));                    // 화면 왼쪽 끝에서 손끝까지가 곧 사이드바 폭이다
    if (onResize) onResize();
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    grip.classList.remove('on');
    const w = parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue('--sbw'), 10);
    if (w >= MIN && w <= MAX) {
      try { window.localStorage.setItem(KEY, String(w)); } catch (e) { /* 못 기억해도 그만 */ }
    }
    if (onResize) onResize();
  };
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);

  return {
    widthNow: () => parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue('--sbw'), 10) || 0,
    // 검사 도구가 «사람이 끈 것처럼» 폭을 정할 수 있게 열어 둔다
    setWidth: (w) => { put(clamp(w)); if (onResize) onResize(); },
  };
}

/* docinfo.js */
// 「머리글 및 바닥글」 창 — 종이 맨 위·맨 아래에 나올 값을 고치는 유일한 자리.
// ⚠ 이름은 2026-09-01 SKY 지시로 「문서 정보」에서 바꿨다 — 무엇을 고치는 창인지가 이름에 있어야 한다.
// 설계: docs/설계_머리글바닥글.md §5. SKY 지시(2026-09-01): "머리글 바닥글은 추천대로 진행".
//
// ⛔ 최상위 이름은 attachDocInfo 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로 같은 이름이
//    둘이면 화면이 통째로 안 뜬다.
// ⛔ 머리글을 «종이에서 직접» 고치게 하지 않는다. 편집층(D16)은 #pages 하나가 입력판이라,
//    머리글을 편집 칸으로 만들면 글자 번호 셈(offsetIn)에 끼어들어 커서·지우기가 엉뚱한
//    곳을 문다(설계_판.md P9 와 같은 이유). 그래서 창으로 고친다.
// ⚠ 「적용」 단추를 두지 않는다(D15 과잉 방어 금지) — 치는 대로 곧바로 문서에 들어간다.

// ⭐ 로고·회사·분류는 «거의 안 바뀌는 것»이다(2026-09-01 SKY: "머리글이나 바닥글에 로고라던가
// 회사명 같은건 거이 고정으로 쓴단말야"). 그래서 이 셋만 «이 기기의 기본값»으로 기억해 두고,
// 새 문서를 만들 때 자동으로 채운다. 문서마다 다르게 쓰고 싶으면 그 문서에서 고치면 되고,
// 그러면 그 문서만 바뀐다(값은 여전히 문서 파일 안에 있다).
// ⚠ 브라우저에 기억한다(사이드바 폭과 같은 자리) — 문서 파일에는 «그 문서의 값»만 담긴다.
//   그래야 남에게 문서를 줘도 내 기본값이 따라가지 않는다.
const DEFKEY = 'doc-editor-hdr-default';
const DEFAULTABLE = ['logo', 'company', 'category'];

function readHeaderDefaults() {
  try {
    const o = JSON.parse(window.localStorage.getItem(DEFKEY) || '{}');
    const out = {};
    for (const k of DEFAULTABLE) if (typeof o[k] === 'string' && o[k]) out[k] = o[k];
    // ⛔ 로고는 그림이 아니면 버린다 — 머리글에 깨진 그림이 박히면 인쇄물이 망가진다
    if (out.logo && out.logo.indexOf('data:image/') !== 0) delete out.logo;
    return out;
  } catch (e) { return {}; }
}

const FIELDS = [
  ['category', '분류', '예: 기술 서류'],
  ['title', '제목', '머리글에 크게 나온다'],
  ['subtitle', '부제', '제목 아래 작은 줄'],
  ['doc', '문서번호', '예: SPEC-4000'],
  ['rev', '개정', '예: 1.0'],
  ['date', '날짜', '예: 2026.01.02'],
  ['company', '회사', '바닥글 왼쪽. 비우면 SAMIL ELTEC CO., LTD.'],
];

function attachDocInfo({ getDoc, setDoc, redraw, onSaved, onSave }) {
  const btn = document.getElementById('btn-docinfo');
  let el = null;

  const close = () => { if (el) { el.remove(); el = null; } };

  // meta 한 칸만 갈아 끼운다 — 나머지는 그대로 두고 새 문서 객체를 만든다(블록 불변 규칙).
  function put(key, value) {
    const doc = getDoc();
    const meta = Object.assign({}, doc.meta || {});
    if (value) meta[key] = value; else delete meta[key];
    setDoc(Object.assign({}, doc, { meta }));
    // ⚠ keepCaret 을 주지 않는다 — 주면 다시 그리며 종이에 초점을 옮겨 이 창의 입력칸에서
    //   손이 튕겨 나간다(판별 값 창과 같은 이유).
    redraw();
  }

  function open() {
    close();
    const doc = getDoc();
    const m = doc.meta || {};
    el = document.createElement('div');
    el.id = 'docinfo';
    el.setAttribute('contenteditable', 'false');

    const ttl = document.createElement('div');
    ttl.className = 'di-ttl';
    ttl.append(document.createTextNode('머리글 및 바닥글'));
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'di-x';
    x.title = '닫기';
    x.textContent = '✕';
    x.addEventListener('click', close);
    ttl.appendChild(x);
    el.appendChild(ttl);

    const note = document.createElement('div');
    note.className = 'di-note';
    note.textContent = '여기 적은 것이 종이 맨 위(머리글)와 맨 아래(바닥글)에 모든 쪽마다 나옵니다.';
    el.appendChild(note);

    for (const [key, label, tip] of FIELDS) {
      const row = document.createElement('div');
      row.className = 'di-row';
      const lb = document.createElement('span');
      lb.className = 'nm';
      lb.textContent = label;
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = m[key] || '';
      inp.placeholder = tip;
      inp.title = tip;
      inp.addEventListener('input', () => put(key, inp.value));
      row.append(lb, inp);
      el.appendChild(row);
    }

    // 로고 — 그림 넣기와 같은 방식으로 파일을 읽어 문서 «안»에 담는다.
    // 그래야 문서 파일 하나만 주고받아도 로고가 따라간다(설계 §6-2).
    const row = document.createElement('div');
    row.className = 'di-row di-logo';
    const lb = document.createElement('span');
    lb.className = 'nm';
    lb.textContent = '로고';
    const view = document.createElement('span');
    view.className = 'di-logoview';
    if (m.logo) {
      const img = document.createElement('img');
      img.src = m.logo;
      view.appendChild(img);
    } else {
      view.textContent = '(없음)';
    }
    const file = document.createElement('input');
    file.type = 'file';
    file.accept = 'image/*';
    file.style.display = 'none';
    file.addEventListener('change', () => {
      const f = file.files && file.files[0];
      if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        const url = String(fr.result || '');
        // ⛔ 그림이 아닌 것은 안 받는다 — 머리글에 깨진 그림이 박히면 인쇄물이 망가진다
        if (url.indexOf('data:image/') !== 0) { window.alert('그림 파일이 아닙니다'); return; }
        put('logo', url);
        open();                                   // 미리보기를 새로 그린다
      };
      fr.readAsDataURL(f);
    });
    const pick = document.createElement('button');
    pick.type = 'button';
    pick.textContent = '파일';
    pick.title = '로고 그림 고르기 — 문서 안에 담긴다';
    pick.addEventListener('click', () => file.click());
    const del = document.createElement('button');
    del.type = 'button';
    del.textContent = '지움';
    del.title = '로고 지우기';
    del.disabled = !m.logo;
    del.addEventListener('click', () => { put('logo', ''); open(); });
    row.append(lb, view, pick, del, file);
    el.appendChild(row);

    const foot = document.createElement('div');
    foot.className = 'di-foot';
    // ⭐ 「저장」 — 창에서 친 값은 곧바로 문서에 들어가지만, 파일에 굳으려면 저장을 해야 한다.
    //    그걸 하러 창을 닫고 사이드바까지 가야 했다(2026-09-01 SKY: "저장 버튼을 눌러야
    //    머리글 및 바닥글 내용이 저장 되잖아. 머리글 및 바닥글 내부에도 저장 버튼을 만들자").
    // ⚠ 저장하는 «일 자체»는 main.js 한 곳에만 있다 — 여기서 베끼면 한쪽만 고쳐진다.
    const wr = document.createElement('button');
    wr.type = 'button';
    wr.className = 'di-save';
    wr.textContent = '저장';
    wr.title = '지금 문서를 파일에 저장한다 — 사이드바 「저장」과 같다';
    wr.addEventListener('click', () => { if (onSave) onSave(); });
    if (!onSave) wr.disabled = true;
    foot.appendChild(wr);
    // 「기본으로」 = 로고·회사·분류를 이 기기에 기억한다. 새 문서가 그것을 물려받는다.
    const save = document.createElement('button');
    save.type = 'button';
    save.textContent = '기본으로';
    save.title = '로고·회사·분류를 이 기기의 기본값으로 기억한다 — 새 문서가 자동으로 물려받는다';
    save.addEventListener('click', () => {
      const cur = getDoc().meta || {};
      const keep = {};
      for (const k of DEFAULTABLE) if (cur[k]) keep[k] = cur[k];
      try { window.localStorage.setItem(DEFKEY, JSON.stringify(keep)); } catch (e) { /* 못 기억해도 그만 */ }
      if (onSaved) onSaved('로고·회사·분류를 기본값으로 기억했습니다 — 새 문서가 물려받습니다');
    });
    // 「기본 불러오기」 = 기억해 둔 값을 지금 문서에 넣는다(옛 문서에 나중에 붙일 때 쓴다)
    const load = document.createElement('button');
    load.type = 'button';
    load.textContent = '기본 넣기';
    load.title = '기억해 둔 로고·회사·분류를 이 문서에 넣는다';
    load.addEventListener('click', () => {
      const d = readHeaderDefaults();
      if (!Object.keys(d).length) { if (onSaved) onSaved('기억해 둔 기본값이 없습니다'); return; }
      const doc = getDoc();
      setDoc(Object.assign({}, doc, { meta: Object.assign({}, doc.meta || {}, d) }));
      redraw();
      open();
      if (onSaved) onSaved('기본값을 이 문서에 넣었습니다');
    });
    foot.append(save, load);
    const ok = document.createElement('button');
    ok.type = 'button';
    ok.textContent = '닫기';
    ok.addEventListener('click', close);
    foot.appendChild(ok);
    el.appendChild(foot);

    document.body.appendChild(el);
    방금열림();
  }

  // ⛔ 창을 여는 그 클릭이 열고 나서도 계속 퍼져 나가 아래 «바깥 클릭»까지 온다 —
  //    그러면 열리자마자 닫혀 아무 일도 안 일어난 것처럼 보인다(판 창에서 겪은 그 함정).
  let 방금 = false;
  const 방금열림 = () => { 방금 = true; setTimeout(() => { 방금 = false; }, 0); };

  if (btn) btn.addEventListener('click', open);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  document.addEventListener('click', (e) => {
    if (방금 || !el) return;
    const t = e.target;
    if (t && t.closest && t.closest('#docinfo, #btn-docinfo')) return;
    close();
  });

  return { open, close, isOpen: () => !!el, rect: () => (el ? [el.getBoundingClientRect()] : []) };
}

/* toast.js */
// 잠깐 뜨는 알림 — 「무엇을 했는지」를 눈에 보이게 한다.
// 2026-09-01 SKY: "좌측 사이드바를 누르거나 뭐 저장을 하거나 했을 떄 저장을 했는데 뭐 했는데
// 알 수 가 없어. 토스트 같은게 뜨던가 뭔가 했다는걸 좀 더 효과를 추가 해줘."
//
// ⛔ 최상위 이름은 toast·toastErr 둘뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로
//    같은 이름이 둘이면 화면이 통째로 안 뜬다.
// ⚠ 사이드바의 조용한 안내줄(#folder-msg)은 그대로 둔다 — 그것은 «지금 상태»(어느 폴더인가)를
//    보여 주는 자리고, 이것은 «방금 무슨 일이 일어났나»를 알리는 자리다. 둘은 하는 일이 다르다.
// ⚠ 인쇄에는 안 찍힌다(styles.css @media print).

let box = null;
let timer = 0;

function show(text, kind) {
  if (!box) {
    box = document.createElement('div');
    box.id = 'toast';
    box.setAttribute('contenteditable', 'false');
    document.body.appendChild(box);
  }
  box.textContent = text;
  box.className = 'on' + (kind ? ' ' + kind : '');
  clearTimeout(timer);
  // ⚠ 한 번 껐다 켜야 «같은 글»이 다시 떠도 애니메이션이 다시 돈다
  timer = setTimeout(() => { if (box) box.className = ''; }, kind === 'err' ? 3600 : 2000);
}

function toast(text) { show(text, ''); }
function toastErr(text) { show(text, 'err'); }

/* vbar.js */
// 판(版) 바·판 관리 창 — 설계_판.md §4-1·§4-5. 판이 없는 문서에는 아무것도 안 보인다.
// ⛔ 최상위 이름은 attachVbar 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로 같은 이름이
//    둘이면 화면이 통째로 안 뜬다. 안쪽 이름(refresh·apply·delOne·mgrEl…)은 전부
//    이 함수 «안»에 갇혀 있어 다른 파일과 부딪히지 않는다.
// ⚠ 판 바는 #pages 밖(리본 아래)이라 좁은 화면 자동 축소(zoom)를 안 받고 인쇄에도 안 찍힌다.







// 리본의 「판」 상황 묶음도 이 파일이 맡는다(설계 §4-4) — 판 바와 같은 문(setDoc)으로
// 문서를 고쳐야 되돌리기가 한 걸음으로 맞는다.
function attachVbar({ pagesEl, barEl, getDoc, setDoc, redraw, getView, setView, imageApi }) {
  const vbarEl = document.getElementById('vbar');

  // 문서와 판 바를 맞춘다. draw() 안에서 부르지 않는다 — draw 는 이 문이 생기기 «전»에도
  // 불리므로, 문서가 바뀌는 자리(열기·새 문서·되돌리기·판 편집)에서만 부른다.
  function refresh() {
    const doc = getDoc();
    const defs = doc.variants || [];
    vbarEl.hidden = !defs.length;
    // ⚠ 리본 「판」 묶음도 여기서 맞춘다. 아래에 «판이 없으면 그만»(early return)이 있어서
    //   함수 끝에 두면 판이 0개인 문서에서 한 번도 안 불린다 — 그러면 판을 다 지운 뒤에도
    //   묶음이 리본에 남는다. 그래서 바를 켜고 끄는 «이 자리»에 나란히 둔다.
    refreshGroup();
    vbarEl.textContent = '';
    // 관리 창이 열려 있으면 «지금 문서»로 다시 세운다 — 되돌리기·다시하기·문서 전환 뒤에
    // 목록이 낡아 있으면(없는 판이 남아 있거나 살아난 판이 안 보이면) 사람이 헛것을 누른다.
    // ⛔ 판이 0개가 되어도 닫지 않는다 — 「＋ 새 판」 이 남아 있어야 다시 만들 길이 있다.
    // ⚠ 아래 두 문(관리 창·고르기 팝업)으로 낡음이 전부 막힌다 — refresh() 는 판이 바뀌는
    //   모든 자리와 문서가 바뀌는 다섯 자리에서 불린다.
    if (mgrEl) openMgr();
    // 「보일 판」 고르기 팝업도 닫는다 — 관리 창과 같은 이유다. 되돌리기·문서 전환 뒤에도
    // 떠 있으면 그 체크칸은 «앞 문서의 판» 을 가리키고 있어서, 「적용」 을 누르는 순간
    // 없는 판 id 가 문서에 박힌다(그 판은 어디에도 없으니 글이 통째로 안 보이게 된다).
    closePick();
    if (!defs.length) return;
    const chip = (label, id, dotColor) => {
      const b = document.createElement('button');
      b.className = 'vchip' + ((getView() || null) === id ? ' on' : '');
      if (dotColor) {
        const d = document.createElement('span');
        d.className = 'dot';
        d.style.setProperty('--vc', dotColor);
        b.appendChild(d);
      }
      b.appendChild(document.createTextNode(label));
      b.addEventListener('click', () => { setView(id); });
      return b;
    };
    // ⭐ 2026-09-01 SKY: "판과 관련된 버튼들이 디자인같은거나 뭐 배치 같은데 너무 맘에 안들어."
    //    옛 모양은 «똑같이 생긴 네모 일곱 개»가 죽 늘어서 있어, 어느 것이 «보기 고르기»이고
    //    어느 것이 «관리»인지 눈으로 갈리지 않았다.
    //    이제 «보기 고르기»는 테두리를 맞붙인 한 덩어리(.vseg)로 묶고 — 라디오 단추처럼
    //    «이 중 하나»임이 모양으로 보인다 — 관리는 그 밖에 조용한 단추로 뗀다.
    const seg = document.createElement('div');
    seg.className = 'vseg';
    seg.appendChild(chip('전체보기', null, null));
    for (const v of defs) seg.appendChild(chip(v.name, v.id, variantColor(doc, v.id).fg));
    vbarEl.appendChild(seg);
    const mgr = document.createElement('button');
    mgr.className = 'vchip vchip-ghost';
    mgr.title = '판 추가·이름·복제·순서·삭제';
    mgr.textContent = '⚙ 판 관리';
    mgr.addEventListener('click', openMgr);
    vbarEl.appendChild(mgr);
    // ⛔ 「판별 PDF」(판 전부를 한 번에 뽑기)는 2026-09-01 SKY 지시로 뺐다 —
    //    «어차피 pdf 저장은 한 판씩 내가 고르고 pdf 추출 하면 돼. 전체 판 pdf 기능은 제외.»
    //    판을 고른 뒤 사이드바 「PDF 저장」을 누르면 파일 이름이 «문서명_판이름» 으로 나온다.
  }

  // 판 정의 변경은 전부 이 문으로 — applyDoc(setDoc) 을 거쳐 Ctrl+Z 한 걸음이 된다(P5).
  // 빈 이름·중복 이름은 코어가 오류를 던진다 — 여기서 받아 사람에게 그대로 알린다.
  function apply(fn) {
    try {
      const next = fn(getDoc());
      if (!next || next === getDoc()) return;
      // 판 삭제로 블록이 다 사라졌으면 빈 문단 하나를 살린다(문서는 늘 블록 1개 이상)
      if (!next.blocks.length) return;                     // deleteVariant 는 아래 delOne 이 감싼다
      setDoc(next);
      redraw({ keepCaret: true });
      refresh();
    } catch (e) { window.alert(e.message); }
  }

  function delOne(id, name) {
    const doc = getDoc();
    const n = deleteVariantCount(doc, id);
    const msg = '판 「' + name + '」 을 지웁니다.\n'
      + '이 판에만 보이던 블록 ' + n.blocks + '개 · 행 ' + n.rows + '개가 사라지고, '
      + '판별 값 ' + n.vals + '벌이 지워집니다.\n(Ctrl+Z 한 번으로 전부 되돌릴 수 있습니다)';
    if (!window.confirm(msg)) return;                      // 데이터가 사라지는 자리 — D15 예외
    let next = deleteVariant(doc, id);
    if (!next.blocks.length) {
      // 모든 블록이 이 판 것이었다 — 빈 문단 하나로 살린다.
      // ⚠ id 를 손으로 적지 않는다(createBlock 이 늘 새 번호를 준다) — 되돌린 뒤 같은 id 가
      //   두 개 생기면 화면이 커서를 엉뚱한 블록에 놓는다.
      next = Object.assign({}, next, { blocks: [createBlock('para')] });
    }
    if (getView() === id) setView(null);
    setDoc(next);
    redraw();
    refresh();
  }

  // 판 관리 창 — 목록 한 줄: [색점] 이름 [이름][복제][↑][↓][삭제]
  let mgrEl = null;
  function openMgr() {
    closeMgr();
    const doc = getDoc();
    mgrEl = document.createElement('div');
    mgrEl.id = 'vmgr';
    const list = document.createElement('div');
    (doc.variants || []).forEach((v) => {
      const row = document.createElement('div');
      row.className = 'vmgr-row';
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.setProperty('--vc', variantColor(doc, v.id).fg);
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = v.name;
      const btn = (label, title, fn) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.title = title;
        b.addEventListener('click', fn);
        return b;
      };
      row.append(dot, nm,
        btn('이름', '판 이름 바꾸기 — 문서 내용은 안 변한다', () => {
          const name = window.prompt('판 「' + v.name + '」의 새 이름:', v.name);
          if (name !== null) { apply(d => renameVariant(d, v.id, name)); openMgr(); }
        }),
        btn('복제', '이 판의 지정·판별 값을 그대로 가진 새 판 — 파생 모델 시작용', () => {
          const name = window.prompt('「' + v.name + '」 을 복제한 새 판의 이름:', v.name + ' 복제');
          if (name !== null) { apply(d => duplicateVariant(d, v.id, name)); openMgr(); }
        }),
        btn('↑', '위로', () => { apply(d => reorderVariant(d, v.id, -1)); openMgr(); }),
        btn('↓', '아래로', () => { apply(d => reorderVariant(d, v.id, +1)); openMgr(); }),
        btn('삭제', '이 판을 지운다 — 몇 건이 사라지는지 먼저 보여준다', () => { delOne(v.id, v.name); openMgr(); }));
      list.appendChild(row);
    });
    const add = document.createElement('button');
    add.textContent = '＋ 새 판';
    add.addEventListener('click', () => {
      const name = window.prompt('새 판 이름 (예: 4000):', '');
      if (name !== null) { apply(d => addVariant(d, name)); openMgr(); }
    });
    const close = document.createElement('button');
    close.textContent = '닫기';
    close.addEventListener('click', closeMgr);
    mgrEl.append(list, add, close);
    document.body.appendChild(mgrEl);
    열림표시();
  }
  function closeMgr() { if (mgrEl) { mgrEl.remove(); mgrEl = null; } }

  // ── 리본 「판」 상황 묶음 (설계 §4-4) ──
  const grp = barEl ? barEl.querySelector('[data-ctx="vars"]') : null;

  // 「판」 묶음은 판이 있는 문서에서만 — 리본 높이가 판 지정 도중에 널뛰지 않도록
  // 문서 단위로만 켜고 끈다(칸/블록을 오갈 때는 아무것도 안 바뀐다).
  // ⚠ 표·그림 묶음과 달리 context.js 는 이 묶음을 안 건드린다 — 켜는 조건이 «고른 것»이
  //   아니라 «문서에 판이 있나»라서 서로 다투면 안 된다.
  function refreshGroup() {
    if (grp) grp.hidden = !(getDoc().variants || []).length;
    // ⛔ 묶음이 나타나면 리본이 한 줄 커진다(실측 75→145px). 판 바는 리본 «높이만큼»
    //    내려와 붙어 있어야 하는데, 그 높이를 재 주는 ResizeObserver 는 «다음 그림 그릴 때»
    //    한 박자 늦게 돈다 — 그 사이에 화면을 굴리면 판 바가 리본 «속»에 겹쳐 글자가 포개진다.
    //    그래서 여기서 곧바로 한 번 더 잰다(실측으로 확인함).
    stickUnderBar();
    refreshButtons();
  }

  // 단추의 «눌릴 수 있음»만 지금 고른 것에 맞춘다 — 묶음이 뜨고 지는 것은 문서 단위라
  // 리본 높이는 여기서 절대 안 바뀐다(설계 §4-4: «칸/블록을 오갈 때는 단추의 활성/비활성만»).
  // ⛔ 이게 없으면 문단에 커서를 둔 채 「행 보일 판…」 을 눌러도 «눌리는 모양»만 하고
  //    아무 일도 안 난다 — 고장으로 보인다. 회색으로 죽여 «여기서는 못 쓴다»를 눈에 보인다
  //    (`.tb:disabled { opacity:.4 }` 가 이미 있다).
  function refreshButtons() {
    if (!grp || grp.hidden) return;                 // 판 없는 문서는 아무 값도 안 잰다(공짜)
    const t = target();
    const 칸 = !!t && t.kind === 'cell';
    const cellObj = 칸 ? cellOf(getDoc().blocks.find(x => x.id === t.id), t.cell) : null;
    const set = (k, on) => {
      const b = grp.querySelector('[data-vars="' + k + '"]');
      if (b) b.disabled = !on;
    };
    set('block', !!t);                              // 블록·고른 그림 — 대상이 있으면 된다
    set('row', 칸 && t.cell[0] !== 'h');            // 머리글은 늘 공통이다(P6) — 행 지정이 없다
    // ⭐ 「판별 값…」 은 판별 칸이 아니어도 쓴다 — 공통 칸에서 «판별로» 를 시작하는
    //    가장 쉬운 입구이기도 하다(설계: 정해야 할 것 2번, 추천안 그대로).
    set('cellvals', 칸 && !!cellObj);
    set('cellmake', 칸 && !!cellObj);
    set('cellclear', 칸 && !!cellObj && !!Object.keys((cellObj || {}).vals || {}).length);
  }

  // 표 칸 하나 꺼내기 — 좌표가 표 밖이거나 머리글이 없는 표면 null(터지지 않는다)
  function cellOf(b, cell) {
    if (!b || b.type !== 'table' || !cell) return null;
    const row = cell[0] === 'h' ? (b.head || [])[0] : (b.rows || [])[cell[0]];
    return (row && row[cell[1]]) || null;
  }

  // 판 보임 목록 두 개가 «같은 뜻»인가 — null·빈 배열·없음은 모두 «모든 판 공통»이다.
  // ⛔ 이 견줌이 없으면 체크를 하나도 안 바꾸고 「적용」 을 눌러도 문서를 갈아 끼워서,
  //    아무것도 안 바뀐 되돌리기 걸음이 쌓인다(나중에 Ctrl+Z 가 헛걸음이 된다).
  const 같은목록 = (a, b) => JSON.stringify(Array.isArray(a) && a.length ? a : null)
    === JSON.stringify(Array.isArray(b) && b.length ? b : null);

  // ⚠ 값을 재는 것뿐이라 paintCells(editor.js)처럼 곧바로 한다 — 미루면(setTimeout) 단추가
  //   한 박자 늦게 살아나 «눌렀는데 안 먹는» 틈이 생긴다. 판 없는 문서는 위에서 곧장 돌아온다.
  document.addEventListener('selectionchange', refreshButtons);
  if (imageApi && imageApi.onPick) imageApi.onPick(refreshButtons);

  // 지금 무엇이 대상인가 — 고른 그림들 > 표 칸 > 블록
  function target() {
    const picked = imageApi && imageApi.pickedIds ? imageApi.pickedIds() : [];
    if (picked.length) return { kind: 'blocks', ids: picked };
    const blk = activeBlockEl(pagesEl);
    if (!blk) return null;
    const td = activeCellEl(blk);
    if (td) {
      return { kind: 'cell', id: blk.dataset.id,
        cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] };
    }
    return { kind: 'blocks', ids: [blk.dataset.id] };
  }

  // 체크 목록 창 — 「보일 판」 고르기. onDone(list|null) : null = 모든 판
  // ⭐ 2026-09-01 SKY: "보일판, 행 보일 버튼 눌러서 뜨는 팝업창도 보기좋게 양식 변경.
  //    추가로 서식바 처럼 서식바 외각 부분을 클릭하면 창에 닫히도록 같이 적용."
  //    → 다른 창(머리글·부품 목록·판별 값)과 «같은 양식»으로 만든다: 제목줄 + ✕ ·
  //      무엇을 하는 창인지 한 줄 · 목록 · 아래 단추. 바깥을 누르면 닫힌다.
  // ⭐ 「무엇을 하는 창인지」 한 줄을 넣는다 — SKY 가 "어떻게 사용해야 하는지 모르겠어"
  //    라고 했다. 이름을 바꾸는 것은 뒤로 미뤘으니(SKY: "일단 유지"), 설명으로 메운다.
  let pickEl = null;
  function openPick(current, onDone, 무엇) {
    closePick();
    const doc = getDoc();
    pickEl = document.createElement('div');
    pickEl.id = 'vpick';
    pickEl.setAttribute('contenteditable', 'false');

    const ttl = document.createElement('div');
    ttl.className = 'vp-ttl';
    ttl.append(document.createTextNode((무엇 && 무엇.제목) || '보일 판'));
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'vp-x';
    x.title = '닫기';
    x.textContent = '✕';
    x.addEventListener('click', closePick);
    ttl.appendChild(x);
    pickEl.appendChild(ttl);

    const note = document.createElement('div');
    note.className = 'vp-note';
    note.textContent = (무엇 && 무엇.설명)
      || '체크한 판에서만 보입니다. 전부 체크하면 모든 판에 보입니다(공통).';
    pickEl.appendChild(note);

    const body = document.createElement('div');
    body.className = 'vp-body';
    const boxes = [];
    for (const v of doc.variants || []) {
      const label = document.createElement('label');
      label.className = 'vp-row';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = v.id;
      cb.checked = !Array.isArray(current) || current.includes(v.id);
      boxes.push(cb);
      const dot = document.createElement('span');
      dot.className = 'vp-dot';
      const c = variantColor(doc, v.id);
      dot.style.background = c.fg;
      const nm = document.createElement('span');
      nm.className = 'vp-nm';
      nm.textContent = v.name;
      label.append(cb, dot, nm);
      body.appendChild(label);
    }
    pickEl.appendChild(body);

    const foot = document.createElement('div');
    foot.className = 'vp-foot';
    // 「모두」 — 판이 많으면 하나씩 누르는 것이 번거롭다
    const all = document.createElement('button');
    all.type = 'button';
    all.className = 'vp-all';
    all.textContent = '모두';
    all.title = '모든 판에 보이게 한다(= 공통)';
    all.addEventListener('click', () => { for (const b of boxes) b.checked = true; });
    const ok = document.createElement('button');
    ok.type = 'button';
    ok.className = 'vp-ok';
    ok.textContent = '적용';
    ok.addEventListener('click', () => {
      const on = boxes.filter(b => b.checked).map(b => b.value);
      // ⛔ 모든 체크를 풀면 «아무 판에도 안 보임» 이다 — 그것은 지우는 것과 같아서 거부한다.
      //    조용히 넘기면 글이 화면에서 사라져 «없어졌다»로 보인다(설계_판 D15 예외).
      if (!on.length) { window.alert('최소 한 판에는 보여야 합니다 — 없애려면 지우세요'); return; }
      closePick();
      onDone(on.length === (getDoc().variants || []).length ? null : on);   // 전부 체크 = 공통
    });
    const no = document.createElement('button');
    no.type = 'button';
    no.textContent = '취소';
    no.addEventListener('click', closePick);
    foot.append(all, ok, no);
    pickEl.appendChild(foot);

    document.body.appendChild(pickEl);
    열림표시();
  }
  function closePick() { if (pickEl) { pickEl.remove(); pickEl = null; } }

  // ⛔ 리본 단추를 누르는 «순간» 글에서 선택이 풀리면 대상(커서가 있는 칸·블록)을 잃는다 —
  //    다른 리본 단추(굵게·정렬·표)와 똑같이 mousedown 을 막아 선택을 붙들어 둔다.
  //    이걸 빼면 단추를 눌러도 «대상이 없다»며 아무 일도 안 난다.
  // ⚠ barEl 이 없어도(검사 도구가 배선을 일부만 줄 때) 판 바 자체는 돌아야 한다 — 리본
  //   묶음만 조용히 없는 셈이 된다. 여기서 터지면 화면이 통째로 안 뜬다.
  if (barEl) barEl.addEventListener('mousedown', (e) => {
    if (e.target.closest && e.target.closest('[data-vars]')) e.preventDefault();
  });

  if (barEl) barEl.addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('[data-vars]');
    if (!btn) return;
    const kind = btn.dataset.vars;
    // 판 관리 창 열기는 «대상»이 없어도 된다 — 판이 0개인 문서의 유일한 입구다(우클릭 메뉴 대행)
    if (kind === 'mgr') { openMgr(); return; }
    // 「판별 값…」 — 칸이 아니면 창 스스로 «칸을 누르세요» 라고 알려 준다(여기서 조용히 안 삼킨다)
    if (kind === 'cellvals') { openVals(null); return; }
    const doc = getDoc();
    const t = target();
    if (!t) return;

    if (kind === 'block') {
      // ⚠ 표 칸에 커서가 있어도 «그 표 블록»에 붙인다. 표는 커서가 늘 칸 «안»에 있어서
      //   t.kind 가 'cell' 이 아닌 때가 없다 — 그것만 받으면 표 하나를 어느 판에만 보이게
      //   하는 길이 아예 없어진다(브리프의 t.kind==='blocks' 조건을 여기서 넓혔다).
      const ids = t.kind === 'blocks' ? t.ids : [t.id];
      const first = doc.blocks.find(b => b.id === ids[0]);
      openPick(first ? first.variants : null, (list) => {
        let blocks = getDoc().blocks;
        let 바뀌었나 = false;
        // ⚠ replaceBlock 은 Object.assign 이라 list 가 null 이어도 그대로 얹힌다(확인함) —
        //   null = «지정 없음(모든 판 공통)» 이라 반드시 얹혀야 한다.
        for (const id of ids) {
          const b0 = blocks.find(x => x.id === id);
          if (!b0) continue;                        // 팝업이 떠 있는 사이에 없어진 블록
          if (같은목록(b0.variants, list)) continue;  // 체크를 안 바꿨다 — 헛걸음을 쌓지 않는다
          blocks = replaceBlock(blocks, id, { variants: list });
          바뀌었나 = true;
        }
        if (!바뀌었나) return;
        setDoc(Object.assign({}, getDoc(), { blocks }));
        redraw({ keepCaret: true });
      }, { 제목: '보일 판 — 이 덩어리',
           설명: '문단 하나 · 표 하나 · 그림 하나가 «통째로» 어느 판에 보일지 고릅니다. '
               + '체크한 판에서만 보이고, 전부 체크하면 모든 판에 보입니다.' });
      return;
    }
    if (kind === 'row' && t.kind === 'cell' && t.cell[0] !== 'h') {
      const b = doc.blocks.find(x => x.id === t.id);
      if (!b) return;
      const cur = Array.isArray(b.rowv) ? b.rowv[t.cell[0]] : null;
      openPick(cur, (list) => {
        const b2 = getDoc().blocks.find(x => x.id === t.id);
        if (!b2) return;
        // setRowVariants 는 «세로 병합 묶음째» 지정한다(P6) — 묶음이 찢어지지 않는다
        const next = setRowVariants(b2, t.cell[0], list);
        // 체크를 안 바꿨으면 보임도 그대로다 — 헛걸음을 쌓지 않는다
        // ⚠ 둘 다 «없음(undefined)» 일 수 있다. JSON.stringify(undefined) 는 undefined 라
        //   그때도 이 견줌이 참이 된다(둘 다 «다 공통» 이라는 같은 뜻이다).
        if (JSON.stringify(next.rowv) === JSON.stringify(b2.rowv)) return;
        // ⚠ rowv 를 `|| null` 로 바꿔 넣지 않는다 — 보임을 다 푼 표는 «키가 없는» 모양이어야
        //   한다(table.js 의 withRowv·repairVariants 와 같은 모양). 저장 파일 모양이 갈라지면
        //   같은 문서가 열 때마다 달라 보인다.
        setDoc(Object.assign({}, getDoc(), {
          blocks: replaceBlock(getDoc().blocks, t.id, { rows: next.rows, rowv: next.rowv }) }));
        redraw({ keepCaret: true });
      }, { 제목: '행 보일 판 — 이 줄',
           설명: '표의 «이 한 줄»이 어느 판에 보일지 고릅니다. '
               + '세로로 묶인 줄은 묶음째 함께 움직입니다.' });
      return;
    }
    if ((kind === 'cellmake' || kind === 'cellclear') && t.kind === 'cell') {
      const b = doc.blocks.find(x => x.id === t.id);
      if (!b || b.type !== 'table') return;
      const cellObj = cellOf(b, t.cell);
      if (!cellObj) return;
      if (kind === 'cellmake') {
        if (!getView()) { window.alert('판 보기에서 쓰는 단추입니다 — 위 판 바에서 판을 고른 뒤 다시 누르세요'); return; }
        putCell(t, makeCellVariant(cellObj, getView()));
      } else {
        const n = Object.keys(cellObj.vals || {}).length;
        if (!n) return;                                   // 판별 값이 없으면 풀 것도 없다
        // 데이터가 사라지는 자리 — 몇 벌이 지워지는지 먼저 세어 보여준다(D15 예외)
        if (!window.confirm('판별 값 ' + n + '벌을 지우고 «지금 보이는 값»을 공통값으로 둡니다.')) return;
        putCell(t, clearCellVariant(cellObj, getView()));
      }
    }
  });

  // ══ 판별 값 창 (2026-09-01 SKY) ═══════════════════════════════════════════════
  // SKY 원문: "삼각형 부분을 클릭 하면 뭐가 다른지 볼수 있나? 어떤 판은 어떤 값이고 …
  //            그 창이 뜬 상태에서도 수정 가능하게끔 … 통일 시킬수도 있고"
  // 한 칸이 판마다 어떤 값인지 «한 창에» 모아 보여 주고, 그 자리에서 고친다.
  // ⛔ 창은 document.body 에 산다 — 편집 칸 «안»에 글자 노드를 만들면 커서 셈이 어긋난다(P9).
  // ⚠ 「적용」 단추를 두지 않는다(D15 과잉 방어 금지) — 치는 대로 곧바로 문서에 들어간다.
  let valsEl = null;
  let valsFor = null;              // { kind:'cell', id, cell } — 지금 창이 보고 있는 칸

  const closeVals = () => { if (valsEl) { valsEl.remove(); valsEl = null; valsFor = null; } };

  // 글자만 갈아 끼우고 «서식은 그대로» 둔다 — 첫 토막의 서식(굵게·색·모노…)을 물려준다.
  // ⛔ 이게 없으면 기준 열의 모노 서식이 창에서 한 글자만 고쳐도 통째로 풀린다.
  function reText(runs, text) {
    const m = Object.assign({}, (runs && runs[0]) || {});
    delete m.t;
    delete m.img; delete m.src$; delete m.crop; delete m.rad;   // 그림은 안 나른다
    return text ? [Object.assign({ t: text }, m)] : [];
  }
  const hasImg = (runs) => (runs || []).some(r => r && (r.img || r.src$));
  // 「이 판만 공통으로」 — 그 판의 벌 하나만 뗀다(전부 푸는 clearCellVariant 와 다르다)
  function dropVal(cell, id) {
    if (!cell || !cell.vals || !Object.prototype.hasOwnProperty.call(cell.vals, id)) return cell;
    const vals = Object.assign({}, cell.vals);
    delete vals[id];
    const nc = Object.assign({}, cell);
    if (Object.keys(vals).length) nc.vals = vals; else delete nc.vals;
    return nc;
  }

  // anchorEl = 누른 칸(있으면 그 높이에 창을 맞춘다). 없으면 화면 위쪽에 둔다.
  function openVals(t0, anchorEl) {
    const t = t0 || target();
    if (!t || t.kind !== 'cell') {
      window.alert('표 칸에서 쓰는 창입니다 — 값을 볼 칸을 먼저 누르세요');
      return;
    }
    const doc = getDoc();
    if (!(doc.variants || []).length) { window.alert('이 문서에는 판이 없습니다'); return; }
    const b = doc.blocks.find(x => x.id === t.id);
    const cell = b && cellOf(b, t.cell);
    if (!cell) return;
    closeVals();
    valsFor = t;

    valsEl = document.createElement('div');
    valsEl.id = 'vvals';
    valsEl.setAttribute('contenteditable', 'false');
    const 그림칸 = hasImg(cell.runs) || Object.values(cell.vals || {}).some(hasImg);

    const ttl = document.createElement('div');
    ttl.className = 'vv-ttl';
    ttl.append(document.createTextNode('판별 값'));
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'vv-x';
    x.title = '닫기';
    x.textContent = '✕';
    x.addEventListener('click', closeVals);
    ttl.appendChild(x);
    valsEl.appendChild(ttl);

    if (그림칸) {
      const n = document.createElement('div');
      n.className = 'vv-note';
      n.textContent = '그림이 든 칸이라 여기서는 값을 못 고칩니다 — 판을 고르고 칸에서 직접 고치세요.';
      valsEl.appendChild(n);
    }

    // 한 줄 = [색점] 이름 [값 칸] [단추]
    const row = (id, name, color) => {
      const r = document.createElement('div');
      r.className = 'vv-row';
      const dot = document.createElement('span');
      dot.className = 'dot';
      if (color) dot.style.background = color; else dot.style.visibility = 'hidden';
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = name;
      r.append(dot, nm);
      return r;
    };

    const 다시 = () => { const keep = valsFor; closeVals(); openVals(keep); };

    // ① 공통값 — 벌이 없는 판이 쓰는 값
    const cur = () => cellOf(getDoc().blocks.find(x => x.id === t.id), t.cell) || { runs: [] };
    const r0 = row(null, '공통', null);
    const in0 = document.createElement('input');
    in0.type = 'text';
    in0.value = runsText(cell.runs || []);
    in0.disabled = 그림칸;
    in0.title = '벌이 없는 판이 모두 이 값을 씁니다 — 여기를 고치면 그 판들이 함께 바뀝니다';
    in0.addEventListener('input', () => {
      const c = cur();
      putCell(t, Object.assign({}, c, { runs: reText(c.runs, in0.value) }));
      redraw();
    });
    r0.appendChild(in0);
    valsEl.appendChild(r0);

    // ② 판마다 한 줄
    for (const v of doc.variants) {
      const has = !!(cell.vals && Object.prototype.hasOwnProperty.call(cell.vals, v.id));
      const r = row(v.id, v.name, variantColor(doc, v.id).fg);
      if (has) {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.value = runsText(cell.vals[v.id] || []);
        inp.disabled = 그림칸;
        inp.addEventListener('input', () => {
          const c = cur();
          const vals = Object.assign({}, c.vals || {});
          vals[v.id] = reText(vals[v.id], inp.value);
          putCell(t, Object.assign({}, c, { vals }));
          redraw();
        });
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '공통';
        btn.title = '이 판의 값을 지우고 다시 공통값을 쓰게 한다';
        btn.addEventListener('click', () => { putCell(t, dropVal(cur(), v.id)); redraw(); 다시(); });
        r.append(inp, btn);
      } else {
        const same = document.createElement('span');
        same.className = 'vv-same';
        same.textContent = '공통을 씀';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '판별';
        btn.title = '이 판만 다른 값을 갖게 한다 — 지금 공통값을 복사해 시작한다';
        btn.disabled = 그림칸;
        btn.addEventListener('click', () => {
          putCell(t, makeCellVariant(cur(), v.id));
          redraw();
          다시();
        });
        r.append(same, btn);
      }
      valsEl.appendChild(r);
    }

    // ③ 아래 단추 — 통일
    const foot = document.createElement('div');
    foot.className = 'vv-foot';
    const all = document.createElement('button');
    all.type = 'button';
    all.textContent = '전부 공통으로';
    all.title = '판별 값을 모두 지우고 «지금 보이는 값» 하나로 통일한다';
    all.disabled = !Object.keys(cell.vals || {}).length;
    all.addEventListener('click', () => {
      const c = cur();
      const n = Object.keys(c.vals || {}).length;
      if (!n) return;
      // 데이터가 사라지는 자리 — 몇 벌이 지워지는지 먼저 세어 보여준다(P5·D15 예외)
      if (!window.confirm('판별 값 ' + n + '벌을 지우고 «지금 보이는 값»으로 통일합니다.\n'
        + '(Ctrl+Z 한 번으로 되돌릴 수 있습니다)')) return;
      putCell(t, clearCellVariant(c, getView()));
      redraw();
      다시();
    });
    const close = document.createElement('button');
    close.type = 'button';
    close.textContent = '닫기';
    close.addEventListener('click', closeVals);
    foot.append(all, close);
    valsEl.appendChild(foot);

    document.body.appendChild(valsEl);
    열림표시();
    // ⭐ «종이 왼쪽 빈 자리»에 세운다 — 옛 4.4MB 프로그램의 서식바와 같은 자리다
    //    (2026-09-01 SKY: "표에 삼각형 붙은 칸 클릭 했을 때도 종이 좌측에 표시 되도록").
    //    가로는 늘 같은 자리, 세로만 누른 칸을 따라간다. 화면 가운데에 띄우면 표를 덮는다.
    const box = anchorEl ? anchorEl.getBoundingClientRect() : null;
    valsEl.style.transform = 'none';
    valsEl.style.left = leftGutterX(pagesEl, valsEl.offsetWidth) + 'px';
    valsEl.style.top = clampTop(box ? box.top - 8 : 90, valsEl.offsetHeight) + 'px';
  }

  // Esc 로 닫는다 — 관리 창·고르기 팝업과 같은 규칙
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVals(); });

  // ⭐ 바깥(종이·빈 자리)을 누르면 닫힌다 — 2026-09-01 SKY: "판별값이나, 판관리 눌렀을 떄
  //    뜨는 창 들은 종이 외각 부분을 클릭 하면 취소 되도록 해줘. 창이 계속 떠있으니까."
  // ⚠ 안 닫아야 하는 자리를 하나라도 빠뜨리면 «누르자마자 닫혀» 아무것도 못 한다:
  //    창 자신(#vvals·#vmgr·#vpick) · 판 바 · 리본 · 판별 칸(누르면 새로 여는 자리).
  // ⚠ pointerdown 이 아니라 click 이다 — pointerdown 으로 닫으면 창 안 단추를 누르는 순간
  //    창이 먼저 사라져 그 단추의 click 이 영영 안 온다.
  // ⛔ «방금 연 클릭»이 이어서 닫는 것을 막는다. 창을 여는 클릭은 열고 나서도 계속 퍼져
  //    나가 이 처리기까지 온다 — 그러면 열리자마자 닫혀 «아무 일도 안 일어난 것»처럼 보인다.
  //    (실측: 우클릭 메뉴 「판 관리…」 가 통째로 안 열렸다. 메뉴는 숨은 리본 단추를 대신
  //     누르는 구조라 여는 자리가 #ctxmenu 였고, 그 자리가 허용 목록에 없었다.)
  //    자리 목록만 늘리면 새 입구가 생길 때마다 같은 사고가 난다 — «지금 막 열렸나»로 막는다.
  let 방금열림 = false;
  const 열림표시 = () => { 방금열림 = true; setTimeout(() => { 방금열림 = false; }, 0); };
  document.addEventListener('click', (e) => {
    if (방금열림) return;
    // ⭐ «보일 판» 고르기 창(#vpick)도 바깥을 누르면 닫는다 (2026-09-01 SKY:
    //    "서식바 외각 부분을 클릭하면 창에 닫히도록 같이 적용").
    //    전에는 «닫지 않는 자리»로만 들어 있어서 종이를 눌러도 계속 떠 있었다.
    if (!valsEl && !mgrEl && !pickEl) return;
    const t = e.target;
    if (t && t.closest && t.closest('#vvals, #vmgr, #vpick, #vbar, #bar, #ctxmenu, td.vcell')) return;
    closeVals();
    closeMgr();
    closePick();
  });
  // Esc 로도 닫힌다 — 다른 창과 같다
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePick(); });

  // ⭐ 판별 칸을 «아무 곳이나» 누르면 열린다(2026-09-01 SKY 2차 지적).
  // ⛔ 처음에는 «오른쪽 위 모서리 18×18px»만 손잡이로 삼았는데 세 가지가 잘못됐다[실측]:
  //    ① 마우스를 올려도 아무 표시가 없어 누를 수 있는 줄을 모른다
  //    ② 그 자리가 표의 «열 너비 손잡이»(.colgrip, x 703~710)와 3px 겹친다 — 손잡이가
  //       z-index 3 으로 위에 있어서 파란 강조가 대신 뜨고 클릭도 그쪽이 먹는다
  //    ③ 5px 짜리 삼각형은 손가락으로 못 누른다
  //    이제 칸 전체가 손잡이다. 마우스를 올리면 칸이 옅게 물든다(styles.css td.vcell:hover).
  // ⚠ 커서를 놓는 브라우저 기본 동작은 그대로 둔다 — 창을 열면서 칸 편집도 이어진다.
  pagesEl.addEventListener('click', (e) => {
    const td = e.target && e.target.closest && e.target.closest('td.vcell');
    if (!td) return;
    if (e.target.closest('.colgrip')) return;      // 열 너비를 끄는 중이면 우리 일이 아니다
    const blk = td.closest('.blk');
    if (!blk) return;
    openVals({ kind: 'cell', id: blk.dataset.id,
      cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] }, td);
  });

  function putCell(t, nextCell) {
    const b = getDoc().blocks.find(x => x.id === t.id);
    if (!b) return;
    // ⛔ 코어가 «바꿀 것이 없다»고 판단하면 «같은 칸 객체»를 그대로 돌려준다
    //    (이미 판별인 칸에 「이 칸 판별로」 를 또 누르는 경우 — makeCellVariant).
    //    그때 문서를 갈아 끼우면 아무것도 안 바뀐 되돌리기 걸음이 쌓여서, 나중에 Ctrl+Z 를
    //    눌러도 아무 일이 안 나는 헛걸음이 된다(toolbar.js commitTable 과 같은 가드다).
    if (cellOf(b, t.cell) === nextCell) return;
    let patch;
    if (t.cell[0] === 'h') {
      const head = [b.head[0].slice()];
      head[0][t.cell[1]] = nextCell;
      patch = { head };
    } else {
      const rows = b.rows.slice();
      const row = rows[t.cell[0]].slice();
      row[t.cell[1]] = nextCell;
      rows[t.cell[0]] = row;
      patch = { rows };
    }
    setDoc(Object.assign({}, getDoc(), { blocks: replaceBlock(getDoc().blocks, t.id, patch) }));
    redraw({ keepCaret: true });
  }

  // Esc 로 닫는다 — 우클릭 메뉴·그림 서식 창과 같은 몸짓이라 손이 이미 알고 있다.
  // ⚠ 여기서는 e.code 를 안 본다. 한글 자판 함정은 «글자 키»(Z·Y) 이야기고,
  //   Escape 는 자판과 무관하게 늘 'Escape' 로 온다.
  // ⚠ 사건을 멈추지(stopPropagation) 않는다 — 다른 창의 Esc 처리를 빼앗으면 안 된다.
  // ⚠ 「보일 판」 고르기 팝업이 떠 있으면 그것부터 닫는다 — 관리 창 위에 뜨는 것이라
  //   위에 있는 것이 먼저 닫혀야 손이 예상한 대로다.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (pickEl) { closePick(); return; }
    if (mgrEl) closeMgr();
  });

  // 판 바를 리본 «바로 아래»에 붙여 둔다(styles.css 가 position:sticky 를 준다).
  // ⛔ top 을 CSS 에 숫자로 적을 수 없다 — 리본은 상황 묶음(표·그림·판)이 나타나면
  //    한 줄에서 두세 줄로 커진다(실측 247→317px). 숫자로 박으면 리본이 커진 순간
  //    판 바가 리본 «속»에 겹쳐 글자가 서로 포개진다.
  //    그래서 리본 높이를 재서 넣고, 높이가 바뀌면(묶음이 뜨고 지고, 화면 폭이 바뀌고)
  //    다시 넣는다. 판 바는 흐름에서 빠지지 않으므로(sticky) 문서 자리는 그대로다 —
  //    리본 높이 보정(context.js)과 부딪히지 않는다.
  function stickUnderBar() {
    if (!barEl) return;
    const h = Math.round(barEl.getBoundingClientRect().height);
    if (h) vbarEl.style.top = h + 'px';
  }
  if (barEl && typeof ResizeObserver === 'function') {
    new ResizeObserver(stickUnderBar).observe(barEl);
  }
  stickUnderBar();

  refresh();
  // openMgr 을 내보낸다 — 판이 0개인 문서에서 관리 창을 열 유일한 길(우클릭 메뉴 → 숨은
  // 리본 단추 → 여기)이 제대로 물려 있는지 검사 도구가 직접 확인할 수 있어야 한다.
  // 미니 패널(드래그 서식바)이 이 창들과 겹치지 않게 알려 준다 — 둘 다 «종이 왼쪽»에
  // 놓이므로 함께 뜨면 서로 포개진다(2026-09-01 SKY 1번, 캡처로 확인).
  // 그림 서식 창이 이미 쓰는 규칙과 같다: 자세한 쪽(이 창)을 남기고 미니가 물러난다.
  const panelOpen = () => !!valsEl || !!mgrEl;
  // 그 창들이 지금 «어디를» 차지하고 있나 — 미니 패널이 그 자리를 피해 쌓는다.
  const panelRects = () => [valsEl, mgrEl].filter(Boolean).map(el => el.getBoundingClientRect());

  return { refresh, stickUnderBar, refreshGroup, openMgr, panelOpen, panelRects };
}

/* main.js */





























// ⛔ 머리글 높이는 «한 곳»에서만 정한다 — 쪽 나눔을 재는 JS(measure.js HDR_H)와 그리는
//    CSS 가 어긋나면 본문이 머리글 위로 올라타거나 아래가 잘린다. JS 값을 CSS 에 넣어 준다.
document.documentElement.style.setProperty('--hdr-h', HDR_H + 'px');

const APP_NAME = '문서 편집기';
document.title = APP_NAME;

// ⚠ parts 를 여기서 «먼저» 만든다 — applyDoc·draw 가 첫 그리기부터 이 값을 읽는다.
//   아래 폴더 절에서만 만들면 첫 그리기 때 undefined 를 읽는다(지금은 안 터지지만,
//   꼬리표가 있는 문서를 나중에 그 자리에서 열면 터진다).
const state = { doc: null, view: null, parts: { parts: [] } };   // view: null=전체보기 · 'v1'=판 보기(설계_판.md)

function demoDoc() {
  const doc = createDocument({ title: '신청 모델의 세부 사양서' });
  doc.blocks = [
    createBlock('heading', { text: '신청 모델의 세부 사양서' }),
    createBlock('section', { no: '01', title: '제어반 적용 범위 및 제품 특기사항' }),
  ];
  const cell = (s) => ({ runs: s ? [{ t: s }] : [] });
  // ⛔ 열 너비 합을 «그 문서의 글 폭»에 맞춘다 — 숫자로 박아 두면 여백을 고치는 순간 어긋난다.
  //    합이 글 폭과 다르면 표는 화면에서 늘어나 보이는데(table-layout:fixed + width:100%)
  //    열 손잡이(.colgrip)는 «모델의 px» 자리에 그려져서, 보이는 선과 손잡이가 따로 논다.
  //    2026-09-01 여백을 674 → 702 로 넓혔을 때 실제로 11px 어긋났다(table-check 가 잡았다).
  const tw = doc.page.width - doc.page.margin.left - doc.page.margin.right;
  doc.blocks.push(normalizeWidths(createBlock('table', {
    cols: [{ w: 200, align: 'left' }, { w: 240, align: 'left' }, { w: 234, align: 'center' }],
    head: [[cell('기판 구분'), cell('인쇄회로기판명'), cell('Revision')]],
    rows: [
      [cell('안전회로기판'), cell('UCMP-600'), cell('Rev1.0')],
      [cell('주 제어기판'), cell('UMCB-4000Zi-B'), cell('Rev5.0')],
      [cell('안전회로 경유기판'), cell('EMR-100R'), cell('Rev5.0')],
    ],
  }), tw));
  for (let i = 1; i <= 60; i++) {
    doc.blocks.push(createBlock('para', {
      text: i + '. 안전회로의 전압은 AC 110V 를 사용하며, 브레이크 및 도어 모터 전압은 따로 분기한다.',
    }));
  }
  return doc;
}

// ⚠ 아래 attachFit 이 채운다. draw() 가 이 이름을 쓰므로 «먼저» 선언해 둔다 —
//   const 로 아래에만 두면 첫 draw() 가 「초기화 전 접근」으로 터진다.
let fitApi = null;
let zoomApi = null;      // 사용자 확대·축소(ui/zoom.js) — fit 이 곱해 쓴다

function draw(opt = {}) {
  const pagesEl = document.getElementById('pages');

  // 다시 그리기 전에 지금 커서가 몇 번째 글자에 있는지 세어 둔다.
  // 목록이면 "블록 전체"가 아니라 "그 항목 안"에서 센다 — 블록 전체로 세면 항목 경계에서
  // 이전 항목 끝과 다음 항목 처음이 같은 번호가 되어, 커서가 이전 항목으로 붙는다(실기기 지적 1).
  let keepId = null;
  let keepItem = null;
  let keepCell = null;
  let keepCap = 0;
  let keepPos = 0;
  if (opt.keepCaret) {
    const blk = activeBlockEl(pagesEl);
    const sel = window.getSelection();
    if (blk && sel && sel.anchorNode) {
      keepId = blk.dataset.id;
      const cap = activeCapEl(blk);
      const td = cap ? null : activeCellEl(blk);
      const li = (cap || td) ? null : activeItemEl(blk);
      if (cap) {
        keepCap = 1;
        keepPos = offsetIn(cap, sel.anchorNode, sel.anchorOffset);
      } else if (td) {
        keepItem = null;
        keepCell = [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)];
        keepPos = offsetIn(td, sel.anchorNode, sel.anchorOffset);
      } else if (li) {
        keepItem = li.dataset.i;
        keepPos = offsetIn(li, sel.anchorNode, sel.anchorOffset);
      } else {
        keepPos = offsetIn(blk, sel.anchorNode, sel.anchorOffset);
      }
    }
  }

  // 부품 꼬리표의 «지금 상태»를 그리는 쪽에 넘긴다 — 어느 참조가 깨졌고 무엇을 가리키는지.
  // ⚠ 목록이 비어 있어도 글자는 그대로 그려진다(꼬리표 표시만 없다).
  {
    const st = refState(state.doc, state.parts);
    useParts(st.broken, st.label);
  }
  // 보고 있던 판이 지워졌으면 전체보기로 돌아간다(설계 §4-5)
  if (state.view && !(state.doc.variants || []).some(v => v.id === state.view)) state.view = null;
  const r = renderPages(state.doc, pagesEl, document.getElementById('gauge'), state.view);

  // p = { id, item?, cell? } — 커서·선택을 되돌릴 편집 칸(문단/목록 항목/표 칸)을 찾는다.
  // ⚠ 표 칸은 pagesEl 전체에서 찾는다 — 장을 넘은 표는 같은 id 의 .blk 조각이 여러 개라,
  //   첫 조각만 봐서는 뒷장의 칸을 못 찾는다.
  const hostOf = (p) => {
    if (p.cell) {
      return pagesEl.querySelector('.blk[data-id="' + p.id + '"] td[data-r="' + p.cell[0]
        + '"][data-c="' + p.cell[1] + '"]');
    }
    if (p.cap) return pagesEl.querySelector('.blk[data-id="' + p.id + '"] .cap');
    const el = pagesEl.querySelector('.blk[data-id="' + p.id + '"]');
    if (!el) return null;
    if (p.item === null || p.item === undefined) return el;
    return el.querySelector('.lst li[data-i="' + p.item + '"]');
  };

  if (opt.sel && opt.sel.multi) {
    // 여러 블록에 걸친 선택 복원 — 양 끝 좌표만 있으면 브라우저가 사이를 채운다
    const resolve = (p) => { const host = hostOf(p); return host ? nodeAt(host, p.pos) : null; };
    const na = resolve(opt.sel.a);
    const nb = resolve(opt.sel.b);
    if (na && nb) window.getSelection().setBaseAndExtent(na.node, na.offset, nb.node, nb.offset);
  } else if (opt.sel) {
    const host = hostOf(opt.sel);
    if (host) selectRange(host, opt.sel.from, opt.sel.to);
  } else if (opt.caret) {
    // 정확한 자리(블록·목록 항목·표 칸·글자 번호)로 커서를 놓는다 — 걸침 지우기가 쓴다
    const host = hostOf(opt.caret) || pagesEl.querySelector('.blk[data-id="' + opt.caret.id + '"]');
    if (host) caretTo(host, opt.caret.pos);
  } else if (opt.caretId) {
    const el = pagesEl.querySelector('.blk[data-id="' + opt.caretId + '"]');
    if (el) caretTo(el, opt.caretEnd ? Number.MAX_SAFE_INTEGER : 0);
  } else if (keepId) {
    const host = hostOf({ id: keepId, item: keepItem, cell: keepCell, cap: keepCap });
    if (host) caretTo(host, keepPos);
  }
  // ⚠ 판을 오가면 «판 이름표»가 생겼다 사라진다 — 종이 옆에 비워 둘 자리가 달라지는데
  //    화면 크기는 그대로라 ResizeObserver 가 안 깨어난다. 그래서 그릴 때마다 한 번 맞춘다.
  //    (아무것도 안 바뀌면 fit() 은 곧바로 물러난다.)
  if (fitApi) fitApi.fit();
  return r;
}

state.doc = demoDoc();

const history = createHistory(200);
history.push(state.doc.blocks, null, state.doc.variants);

// 편집을 멈추고 5초가 지나면 브라우저 내부 저장소에 스스로 보관한다(최근 20시점)
let snapTimer = null;
function markDirty() {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(async () => {
    try { await saveSnapshot(serializeSwept(), state.name || '(이름 없음)'); }
    catch (e) { console.warn('자동 보관 실패:', e.message); }
  }, 5000);
}

// 저장 직전에만 참조 없는 그림을 청소한다(설계 §2-3) — 되돌리기 기록이 가리키면 남긴다.
// ⛔ 화면 갱신마다 하지 않는다. 저장·읽기 때만이면 충분하고, 매번 하면 되돌리기가
//    아직 쓰는 그림을 지울 위험만 커진다.
function serializeSwept() {
  const assets = sweepAssets(state.doc.assets, [state.doc.blocks].concat(history.blocksLists()));
  if (assets !== state.doc.assets) state.doc = Object.assign({}, state.doc, { assets });
  return serialize(state.doc);
}

// 지금 화면의 선택(커서·드래그)을 모델 좌표로 뜬다 — 되돌리기가 이 자리를 되살린다.
// setDoc(=applyDoc) 은 항상 다시 그리기 «전»에 불리므로 이 순간의 선택이 곧 편집 자리다.
function selSnapshot() {
  const pagesEl = document.getElementById('pages');
  if (!pagesEl) return null;
  const parts = targetsIn(pagesEl);
  if (parts.length === 1) return parts[0];
  if (parts.length > 1) {
    const a = parts[0];
    const b = parts[parts.length - 1];
    return { multi: 1, a: { id: a.id, item: a.item, cell: a.cell, pos: a.from },
             b: { id: b.id, item: b.item, cell: b.cell, pos: b.to } };
  }
  const blk = activeBlockEl(pagesEl);
  const s = window.getSelection();
  if (!blk || !s || !s.anchorNode) return null;
  const cap = activeCapEl(blk);
  if (cap) {
    return { caret: 1, id: blk.dataset.id, item: null, cap: 1,
             pos: offsetIn(cap, s.anchorNode, s.anchorOffset) };
  }
  const td = activeCellEl(blk);
  if (td) {
    return { caret: 1, id: blk.dataset.id, item: null,
             cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)],
             pos: offsetIn(td, s.anchorNode, s.anchorOffset) };
  }
  const li = activeItemEl(blk);
  const host = li || blk;
  return { caret: 1, id: blk.dataset.id, item: li ? Number(li.dataset.i) : null,
           pos: offsetIn(host, s.anchorNode, s.anchorOffset) };
}

// 편집이 문서를 바꿀 때는 항상 이 문으로 들어와 기록이 쌓인다
const applyDoc = (d) => {
  // ⭐ 부품 꼬리표가 붙은 글자를 사람이 «직접 고쳤으면» 꼬리표를 뗀다 — 이제 손으로 쓴 값이다.
  //    안 그러면 다음 «다시 맞추기»가 사람이 친 글자를 조용히 되돌려 버린다.
  //    ⛔ 부품이 없어졌거나 목록을 아직 못 읽었을 때는 안 뗀다(core/parts.js dropStaleRefs).
  const r = dropStaleRefs(d, state.parts);
  state.doc = r.doc;
  history.push(state.doc.blocks, selSnapshot(), state.doc.variants);
  markDirty();
  if (r.unref.length) toast('부품 값을 직접 고치셨습니다 — 이제 목록과 따로 갑니다');
};

// 되돌린 편집의 선택을 되살린다. 그 블록이 이 상태에 없으면(문단 가르기 되돌림 등)
// 조용히 선택 없이 그린다 — 못 찾으면 커서를 안 놓을 뿐, 글은 정상이다.
function drawWithSel(sel) {
  if (!sel) { draw(); return; }
  if (sel.caret) { draw({ caret: { id: sel.id, item: sel.item, cell: sel.cell, cap: sel.cap, pos: sel.pos } }); return; }
  draw({ sel });
}

// ⛔ 단축키를 e.key 로만 보면 «한글 자판»에서 통째로 안 먹는다 — Ctrl+Z 가 key='ㅋ' 로
//    오기 때문이다(2026-08-30 실측). 잘라내기·복사는 브라우저가 알아서 해 주니 되는데
//    되돌리기만 안 돼서 «잘라내기 뒤 되돌리기가 안 된다»로 보였다.
//    e.code 는 «자판에 상관없는 키 자리»라 한글 상태에서도 KeyZ 로 온다. 둘 다 본다.
const isKey = (e, ch, code) => e.key === ch || e.key === ch.toUpperCase() || e.code === code;

document.addEventListener('keydown', (e) => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (!ctrl) return;
  const z = isKey(e, 'z', 'KeyZ');
  const y = isKey(e, 'y', 'KeyY');
  if (z && !e.shiftKey) {
    const r = history.undo();
    if (r) {
      e.preventDefault();
      state.doc = Object.assign({}, state.doc, { blocks: r.blocks, variants: r.variants || [] });
      drawWithSel(r.sel);
      vbarApi.refresh();              // 판 추가·삭제도 한 걸음이다(P5) — 바가 따라와야 한다
    }
  } else if (y || (z && e.shiftKey)) {
    const r = history.redo();
    if (r) {
      e.preventDefault();
      state.doc = Object.assign({}, state.doc, { blocks: r.blocks, variants: r.variants || [] });
      drawWithSel(r.sel);
      vbarApi.refresh();
    }
  }
});
