<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<!-- 태블릿 전용 화면은 없다 — PC 화면(1100px)을 그대로 축소해 보인다 (2026-08-30 SKY) -->
<meta name="viewport" content="width=1100">
<title>문서 편집기</title>
<!-- 앱 정보(D17 주소 배포용) — 홈 화면·설치 아이콘이 여기서 나온다. file:// 로 열면 조용히 무시된다 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1c1e24">
<style>
:root {
  /* ── 종이(인쇄물) 값 — ⛔ CP 관리시스템 기준을 여기에 들이지 않는다 ─────────────
     2026-09-01 SKY: "Q1 종이 부분은 제외, 도구 부분만 진행 해줘."
     종이는 «인쇄되는 서류»다. 화면 도구의 파랑·그림자·14px 본문을 넣으면 제출 서류가
     웹 화면처럼 된다. 종이 값은 docs/설계서.md §8 확정값을 따른다. */
  --point:#e5231b; --ink:#1c1e24; --sub:#5a5e6a; --dim:#8a8e98;
  --line:#e4e5e9; --line-soft:#eef0f4; --paper:#fff; --desk:#e8e9ec;
  --page-w:794px; --page-h:1123px;

  /* ── 도구(사이드바·리본·창·단추) 값 — CP 관리시스템과 같게 ────────────────────
     근거: C:\cp-inspection-system\_디자인_기준.md (§1 색 · §2 모양 · §0 취향)
     ⭐ 왜 맞추나: SKY 가 두 도구를 번갈아 쓴다. 같은 성격의 것이 다르게 보이면
        «다른 프로그램»처럼 느껴진다(§0 「일관성 최우선」).
     ⚠ 글자 «크기»는 아직 안 건드린다 — CP 본문은 14px 인데 여기 도구는 10.5~13.5px 이고,
       전부 올리면 리본·사이드바가 눈에 띄게 커진다. 재서 보고한 뒤 정한다. */
  --u-accent:#2563EB;        /* 채움 + 흰 글자 (blue-600) */
  --u-accent-dark:#1D4ED8;   /* 눌림 · 호버 */
  --u-accent-mid:#3B82F6;    /* 글자를 안 올리는 곳 — 아이콘 · 선 */
  --u-accent-light:#DBEAFE;  /* 옅은 강조 바탕 */
  --u-accent-ring:rgba(37,99,235,.15);
  --u-surface-blue:#EFF6FF;  /* 고른 줄 */
  --u-text-strong:#111827;   /* 제목 · 라벨 */
  --u-text:#1F2937;          /* 본문 */
  --u-text-sub:#4B5563;      /* 설명 · 보조 */
  --u-text-faint:#9CA3AF;    /* 안내문구 — ⛔ 본문 금지 */
  --u-border:#D1D5DB;        /* 입력칸 · 단추 (손으로 만지는 것) */
  --u-border-card:#E5E7EB;   /* 창 · 카드 */
  --u-surface:#fff;          /* L1 */
  --u-surface-soft:#F9FAFB;  /* L2 — 카드 안에서만 */
  --u-surface-mute:#F3F4F6;  /* 카드 안의 옅은 바탕 */
  /* 모서리는 세 가지뿐이다(§2) — 전에는 9가지가 흩어져 있었다 */
  --u-r-card:10px;           /* 창 · 카드 · 패널 */
  --u-r-ctl:6px;             /* 단추 · 입력칸 · 세그먼트 */
  --u-r-badge:4px;           /* 배지 · 칩 */
  /* 글자 크기 — 세 가지로만 쓴다. ⚠ CP 의 14px 을 그대로 들이지 않는다
     (2026-09-01 SKY: "크기 기준은 14px 같은건 무시 해. 크기는 그냥 통일만 하면 돼.")
     ⛔ 값은 «지금 쓰는 것 가운데 가장 흔한 것»으로 골랐다 — 리본·사이드바가 커지지 않게. */
  --u-fs-body:12.5px;        /* 창 본문 · 입력칸 · 단추 (전에 12·12.5·13px 로 흩어져 있었다) */
  --u-fs-small:11.5px;       /* 설명 · 작은 라벨 · 배지 (전에 10.5·11·11.5px) */
  --u-fs-mini:9.5px;         /* 리본 단추 아래 이름 · 묶음 이름 (전에 8.5·9.5·10px) */
}
* { box-sizing:border-box; }
/* ⛔ 가로로 쓸어도 «뒤로 가기»가 되지 않게 한다 — 태블릿에서 표를 손가락으로 끌면
   브라우저가 그걸 뒤로 가기로 받아 «편집 중인 화면이 통째로 날아간다»(실측 2026-08-30). */
html, body { overscroll-behavior-x:contain; }
body { margin:0; background:var(--desk); color:var(--ink);
       font-family:'Noto Sans KR','맑은 고딕','Malgun Gothic',sans-serif; }
#app { display:flex; min-height:100vh; }
/* 사이드바 — B안 「목록이 주인공」 (2026-08-30 SKY 확정): 종이처럼 흰 바탕에
   표처럼 헤어라인 구획. 머리는 문서 머리글 모티프(굵은 아래 경계 + 왼쪽 끝 64px만 빨강).
   화면을 내려도 왼쪽에 붙어 있는다 — 높이는 화면만큼, 넘치면 저 혼자 스크롤 */
/* 세로로 쌓되 맨 아래 «판» 표시를 바닥에 붙인다(margin-top:auto 가 먹으려면 flex 여야 한다) */
/* ⛔ 사이드바·리본·판 바의 글자는 «고를 수 없게» 한다(user-select:none).
   2026-09-01 SKY 실기기 지적: 태블릿에서 문서 목록의 «글자 부분»을 누르면 화면 아래에
   검은 사전 상자가 떴다(«제:어-반 · 명사 · 기계·장치의 원격 조작에…»). 이것은 크롬의
   «탭해서 검색(Touch to Search)» 으로, 링크·단추가 아닌 «그냥 글»을 탭하면 뜬다.
   목록 항목이 href 없는 <a> 라 크롬이 링크로 안 보고 글로 봤고, 글이 골라지면서 사전이
   떴다. 배경을 누르면 글이 안 골라지니 그때만 제대로 열렸던 것이다.
   조작부의 글자는 «내용»이 아니므로 못 고르게 하는 것이 맞다.
   ⚠ #pages(문서)에는 절대 걸지 않는다 — 거기서는 글을 골라야 한다. */
#side, #bar, #vbar { -webkit-user-select:none; user-select:none; }
/* ⭐ 사이드바 폭은 변수다 — 사람이 손잡이를 끌어 바꾸고(ui/sidebar.js) 기억된다.
   좁은 화면(태블릿)에서는 기본값을 줄인다 — 종이(794px) 옆에 판 이름표가 설 자리를
   그만큼 벌어 준다(2026-09-01 SKY: "태블릿에서 사이드바 너비도 좀 줄이고").
   ⚠ 사람이 손으로 정한 폭이 있으면 그것이 이긴다(스크립트가 :root 에 직접 넣는다). */
:root { --sbw: 250px; }
@media (max-width: 1200px) { :root { --sbw: 190px; } }
#side { width:var(--sbw); flex:none; background:var(--u-surface); color:var(--u-text);
        border-right:1px solid var(--u-border); padding:0;
        display:flex; flex-direction:column;
        position:sticky; top:0; height:100vh; overflow-y:auto; }
/* 너비 손잡이 — 사이드바가 스크롤되는 상자라 그 «안»에 두면 같이 굴러간다. fixed 로 띄운다.
   ⚠ touch-action:none 이 있어야 태블릿에서 끌기가 «화면 넘기기»에 먼저 잡히지 않는다. */
#sbresize { position:fixed; top:0; bottom:0; left:calc(var(--sbw) - 3px); width:7px; z-index:20;
            cursor:ew-resize; touch-action:none; }
#sbresize::after { content:''; position:absolute; inset:0 3px; background:transparent; }
#sbresize:hover::after, #sbresize.on::after { background:var(--u-accent-mid); }
@media print { #sbresize { display:none !important; } }
#side .side-ttl, #side .side-btns, #folder-msg { flex:none; }
#side .side-ttl { padding:24px 18px 16px; border-bottom:1.5px solid var(--u-text); position:relative; }
#side .side-ttl::after { content:''; position:absolute; left:0; bottom:-1.5px;
                         width:64px; height:3px; background:var(--point); }
.s-name { font-size:19px; font-weight:900; letter-spacing:-.3px; }
.s-eyebrow { font:600 var(--u-fs-mini) 'IBM Plex Mono',Consolas,monospace; color:#aeb0b8;
             letter-spacing:1.4px; margin-top:6px; }
/* ⛔ min-width:0 이 없으면 이 칸이 «안의 내용만큼» 커져 화면 밖으로 나간다(flex 기본값이
   min-width:auto 라서다). 리본의 표 묶음이 좁은 화면에서 잘려 보이던 진짜 원인이었다
   (실측 2026-08-30: 화면 800px 인데 main 이 884px). 이게 있어야 안쪽 max-width 가 통한다. */
/* overflow-x:clip — 전체보기의 판 이름표가 종이 «밖»에 서므로, 화면이 좁으면 그 이름표가
   오른쪽으로 삐져나가 가로 스크롤을 만든다(태블릿에서 가로 스크롤은 이미 사고를 냈다).
   ⛔ hidden 이 아니라 clip 이어야 한다 — hidden 은 스크롤 상자를 만들어 리본의
      position:sticky 를 죽인다. clip 은 자르기만 하고 스크롤 상자를 안 만든다. */
#main { flex:1; min-width:0; padding:0 0 60px; overflow-x:clip; }
/* 입력판(D16) — 문서 전체가 하나의 contenteditable 이라 초점 테두리를 끈다 */
/* position:relative 는 그림 크기 손잡이(#imgui)의 좌표 기준이다 — 없으면 손잡이가
   엉뚱한 곳(화면 왼쪽 위)에 뜬다 */
/* ⛔ align-items 에 «safe» 가 꼭 있어야 한다. 그냥 center 로 두면 자리가 모자랄 때 종이가
   «양쪽»으로 넘쳐 왼쪽 사이드바 위로 올라탄다 — 저장·PDF 저장 단추가 종이에 가려 못 누른다
   (2026-08-31 SKY 지적, 태블릿 화면 나눠 쓰기. 실측: 화면 900px 이면 72px, 600px 이면 222px 덮음).
   safe 를 붙이면 자리가 모자란 순간 «가운데»를 포기하고 왼쪽 끝에 붙는다 — 넘치는 것은
   오른쪽뿐이라 사이드바를 절대 안 덮는다. */
#pages { display:flex; flex-direction:column; align-items:safe center; gap:28px; padding-top:28px;
         outline:none; caret-color:var(--ink); position:relative; }

/* 위쪽 도구모음 — 화면에 붙어 있고 문서와 함께 스크롤되지 않는다 */
/* 줄 사이는 조금 넓게 — 표 묶음의 「표」 이름표가 윗줄에 붙어 답답해 보였다(캡처 실측) */
#bar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:10px 5px;
       align-items:center; padding:7px 14px; background:var(--u-surface);
       border-bottom:1px solid var(--u-border); box-shadow:0 1px 6px rgba(20,22,30,.06); }
/* ⛔ 버튼 글자는 꺾지 않는다(white-space) · 버튼도 줄이지 않는다(flex:none) —
   자리가 모자라면 글자가 두 줄이 되는 게 아니라 버튼 줄이 다음 줄로 내려간다 */
/* ⭐ 단추는 «심볼 + 작은 이름»의 두 칸이고 크기가 하나로 고정이다 (2026-09-01 SKY:
   "해당 항목에 맞는 심볼 모양을 하나씩 추가해서 표시 하고, 그 심볼 아래 작게 대략적인
   기능 … 버튼들의 크기를 어느 하나의 높이 및 너비로 고정 하는거야. 정렬 되게끔.")
   옛 모양은 «글자 길이만큼» 넓어져 「굵게」는 56px, 「아래 나누기」는 100px 이라
   줄이 들쭉날쭉했다. 이제 전부 60×52 라 격자처럼 줄이 맞는다.
   ⚠ 이름(.lb)은 5글자를 넘기지 않는다 — 넘으면 60px 을 벗어나 잘린다. */
.tb { width:58px; height:44px; padding:0; border:1px solid var(--u-border);
      border-radius:var(--u-r-ctl); background:var(--u-surface); color:var(--u-text); cursor:pointer;
      white-space:nowrap; flex:none; overflow:hidden;
      display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
      font:600 var(--u-fs-body) 'Noto Sans KR','맑은 고딕',sans-serif;
      transition:box-shadow .12s, background .12s, border-color .12s; }
.tb .ic { display:flex; align-items:center; justify-content:center;
          height:15px; font-size:13.5px; line-height:1; }
.tb .ic svg, svg.ic { width:17px; height:13px; display:block; }
.tb .lb { font-size:var(--u-fs-mini); font-weight:600; color:var(--u-text-faint); line-height:1;
          letter-spacing:-.2px; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
/* ⛔ 이 한 줄이 없으면 숨긴 단추(hidden)가 그대로 보인다 — 위의 display:inline-flex 가
   브라우저 기본 [hidden]{display:none} 을 이기기 때문이다. .tbg 에서 이미 한 번 겪은
   함정인데 .tb 를 flex 로 바꾸는 순간 똑같이 되살아났다(2026-09-01 캡처로 발견:
   숨겨야 할 「이 칸 판별로」·「판별 풀기」·「판 관리…」 셋이 리본에 나와 격자를 깨고 있었다). */
.tb[hidden] { display:none !important; }
.tb:hover { background:var(--u-surface-mute); box-shadow:0 2px 8px rgba(20,22,30,.10); }
.tb:hover .lb { color:var(--u-text-sub); }
.tb.on .lb { color:var(--u-accent-dark); }
/* 글자 크기 고르기 — 폭·높이가 다른 단추와 똑같다(2026-09-01 SKY). 고르는 칸 자체가
   지금 값을 보여 주므로 아래 이름표는 두지 않는다 — 「크기」가 두 번 나온다.
   ⚠ 글자를 10px 로 줄여야 «12.5 본문» 같은 힌트가 잘리지 않고 들어간다(58px 안에). */
/* ⛔ 고르는 칸에 «제 테두리»를 두면 단추 테두리와 겹쳐 이중선으로 보인다(2026-09-01 SKY:
   "외각 테두리 안에 드롭 버튼 테두리가 둘다 있으니 이중 테두리 같이 보여").
   바깥 단추 테두리 하나만 쓰고, 속의 고르는 칸은 테두리 없이 그 안을 꽉 채운다. */
.tb-selwrap { cursor:default; padding:0; }
.tb-selwrap .tb-sel { width:100%; height:100%; padding:0 4px; border:0; outline:none;
      border-radius:var(--u-r-ctl); background:transparent; color:var(--u-text); cursor:pointer;
      text-align:center; text-align-last:center;
      font:600 var(--u-fs-mini) 'Noto Sans KR','맑은 고딕',sans-serif; }
.tb-selwrap:hover { background:var(--u-surface-mute); }
/* 눌린 상태(켜짐) — ⛔ 검은 배경은 너무 튀고(SKY 2026-08-28), 옅은 회색은 «꺼진 것과
   차이가 없어» 켠 건지 끈 건지 알 수가 없었다(SKY 2026-08-31: «선택/해제가 구분이 없어서
   헷갈려»). 그래서 이 앱이 «고른 것»에 쓰는 그 파랑을 그대로 쓴다 — 옅은 파란 바탕 +
   파란 테두리 + 진한 파란 글자. 종이를 덮지 않으면서 켜진 것이 한눈에 보인다. */
.tb.on { background:var(--u-accent-light); border-color:var(--u-accent-mid); color:var(--u-accent-dark); font-weight:800;
         box-shadow:inset 0 1px 3px rgba(84,144,255,.28); }
.tb:disabled { opacity:.4; cursor:default; transform:none; box-shadow:none; }
.blk-list { margin:0 0 6px; }
.lst { margin:0; padding-left:22px; font-size:12.5px; line-height:1.85; color:#2b2f3a; }
.lst li { outline:none; margin:0 0 2px; }
/* 빈 항목: 속 빈 상자(inline-block)는 기준선 위에 얹혀 줄이 6px 커지고 커서가 떠 보였다(실측).
   폭 0짜리 보이지 않는 글자를 놓으면 기준선이 정상이라 커서가 번호와 나란히 선다. */
.lst li:empty::before { content:'\200B'; }

/* 같은 기능 묶음 — 줄바꿈될 때 묶음째 다음 줄로 내려간다 (2026-08-30 SKY) */
/* 사이드바 맨 아래 «판» 표시 — 평소엔 아주 작은 회색 글씨,
   새 판이 올라오면 눌러서 새로고침하는 단추가 된다 (2026-08-30 SKY) */
#ver { margin-top:auto; padding:10px 18px 14px; font-size:var(--u-fs-mini); color:var(--u-text-faint);
       letter-spacing:.2px; }
#ver.new { margin:12px 12px 14px; padding:9px 10px; border-radius:8px; cursor:pointer;
           background:var(--point); color:var(--u-surface); font-size:var(--u-fs-small); font-weight:700;
           text-align:center; letter-spacing:0; }
@media print { #ver { display:none !important; } }
.tbg { display:flex; gap:6px; align-items:center; flex:none; }
/* ⛔ 이 한 줄이 없으면 상황 묶음의 hidden 이 «아무 일도 안 한다» — 위의 display:flex 가
   브라우저 기본 [hidden]{display:none} 을 이기기 때문이다. 코드는 hidden 을 제대로 켜고
   끄는데 화면은 그대로여서 «안 되는 것처럼» 보인다(2026-08-31 실측: 리본 높이가
   글만 칠 때도 그림 고를 때도 317px 로 똑같았다). */
.tbg[hidden] { display:none !important; }
/* 표 묶음 — 「표」 이름표가 붙은 한 덩어리로 보이게 (2026-08-30 SKY).
   ⚠ 버튼이 13개라 태블릿 폭에서는 묶음 자체가 화면보다 넓어져 «가로 스크롤»이 생겼다(실측).
      묶음은 하나로 두되 «묶음 안에서» 접히게 한다 — 상자는 하나로 보이고 줄만 늘어난다. */
.tbg-table { position:relative; padding:9px 8px 5px; border:1px solid var(--u-border); border-radius:var(--u-r-card);
             flex:0 1 auto; min-width:0; max-width:100%; flex-wrap:wrap; row-gap:6px; }
.tbg-table::before { content:attr(data-label); position:absolute; top:-1px; left:9px;
                     transform:translateY(-50%); padding:0 5px; background:var(--u-surface);
                     font-size:var(--u-fs-mini); font-weight:700; letter-spacing:.4px; color:var(--u-text-faint); }
.tb-sep { width:1px; height:26px; background:var(--u-border); margin:0 4px; }
/* ⚠ 옛 폭 지정(.tb-sel 96px · .tb-c 42px · .tb-ic 42px)은 없앴다 — 이제 .tb 하나가
   모든 단추의 크기를 정한다. 클래스 이름은 남긴다(menu.js·검사가 셀렉터로 쓴다). */
.tb-c .ic { font-size:15px; }
/* ⭐ 좁은 화면(태블릿)에서는 리본을 낮춘다 — 2026-09-01 SKY: "리본 부분도 너무 커".
   실측으로 리본이 4줄에 129px, 판 바까지 180px 이 문서 위를 먹고 있었다.
   ⚠ 판 바 칩(.vchip 40px)은 그대로 둔다 — 바로 앞서 «작아서 누르기 힘들다» 고 키운 것이다.
      줄이는 것은 리본 단추뿐이고, 그래도 36px 이라 손가락에 충분하다. */
@media (max-width: 1200px) {
  #bar { gap: 9px 3px; padding: 5px 9px; }
  .tb { width: 50px; height: 40px; gap: 1px; }
  .tb .ic { height: 14px; font-size: 12.5px; }
  .tb .ic svg, svg.ic { width: 16px; height: 12px; }
  .tb .lb { font-size:var(--u-fs-mini); }
  .tb-selwrap .tb-sel { font-size:var(--u-fs-mini); }
  .tb-sep { height: 22px; margin: 0 2px; }
  .tbg { gap: 3px; }
  .tbg-table { padding: 8px 5px 4px; row-gap: 4px; }
  #vbar { padding: 4px 8px; }
}
@media print { #bar { display:none !important; } }
/* 높이를 재는 숨은 상자 — 화면 밖에 두되 크기는 진짜 페이지와 같아야 한다 */
/* ⛔ 높이를 재는 상자의 폭은 «진짜 종이의 글 폭»과 같아야 한다 — 다르면 줄바꿈이
   달라져 쪽 나눔이 어긋난다. main.js 가 문서의 여백에서 계산해 넣어 준다. */
#gauge { position:absolute; left:-10000px; top:0; width:var(--text-w, 702px); visibility:hidden; }

.page { width:var(--page-w); height:var(--page-h); background:var(--paper);
        box-shadow:0 2px 14px rgba(20,22,30,.12); padding:var(--pg-pad, 34px 46px 26px);
        position:relative; overflow:hidden;
        /* ⛔ 인쇄에서 «배경색»을 살린다 — 없으면 브라우저가 배경을 지워 머리글의 빨간 선과
           표 머리글 회색 띠가 통째로 안 찍힌다(2026-09-01 SKY: "인쇄 할 떄, 머리글의 빨간색
           선 부분이 보이지 않아"). 그 선은 가짜요소의 background 라 이 규칙이 없으면 사라진다. */
        -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.page-body { display:flex; flex-direction:column; gap:0; }
/* ── 머리글 (설계서 §8 확정값) ───────────────────────────────────────────────
   ⛔ 높이는 «고정»이다 — 글자 수에 따라 늘었다 줄었다 하면 쪽 나눔이 그때마다 달라진다.
      그래서 제목은 한 줄로 자른다. 이 높이는 measure.js 의 HDR_H 와 «같은 값»이어야 하고,
      어긋나면 본문이 머리글 위로 올라탄다 — main.js 가 HDR_H 를 이 변수에 넣어 준다. */
.page-hdr { flex:none; height:var(--hdr-h, 88px); display:flex; align-items:flex-start;
            justify-content:space-between; gap:16px; position:relative;
            padding-bottom:10px; margin-bottom:12px;
            border-bottom:1.5px solid var(--ink); }
/* 아래 경계의 왼쪽 끝 64px 만 3px 빨강 — 사이드바 머리와 같은 모티프다(§8) */
.page-hdr::after { content:''; position:absolute; left:0; bottom:-1.5px;
                   width:64px; height:3px; background:var(--point); }
.page-hdr .ph-l { min-width:0; }
.page-hdr .ph-cat { font:600 10px 'IBM Plex Mono',Consolas,monospace; color:#9aa0b4;
                    letter-spacing:1.6px; text-transform:uppercase; }
.page-hdr .ph-title { font-size:27px; font-weight:900; line-height:1.2; letter-spacing:-.4px;
                      margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.page-hdr .ph-sub { font-size:12.5px; font-weight:500; color:#5a5e6a; margin-top:3px;
                    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.page-hdr .ph-r { flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.page-hdr .ph-logo { height:38px; width:auto; display:block; }
.page-hdr .ph-id { font:500 9px 'IBM Plex Mono',Consolas,monospace; color:#9aa0b4;
                   text-align:right; line-height:1.5; }
.page-hdr .ph-id b { color:var(--ink); font-weight:700; margin-left:6px; }
/* ── 바닥글 ─────────────────────────────────────────────────────────────────
   ⚠ 종이 아래 여백(34px) «안»에 얹는다 — 본문 높이를 안 먹는다. 쪽 번호가 있던 자리다.
      그래서 바닥글이 생겨도 옛 문서의 쪽 나눔이 한 장도 안 바뀐다. */
.page-ftr { position:absolute; left:var(--pg-l, 46px); right:var(--pg-r, 46px); bottom:9px; height:18px;
            display:flex; align-items:center; justify-content:space-between;
            border-top:1px solid #e8eaef; padding-top:5px;
            font:500 9px 'IBM Plex Mono',Consolas,monospace; color:#aeb0b8; }
.page-ftr .pf-r b { color:var(--ink); font-weight:600; font-size:10px; margin-left:2px; }
/* 옛 쪽 번호 — 바닥글이 그 일을 물려받았다. 규칙은 남겨 둔다(옛 캡처·검사가 가리킬 수 있다). */
.pgno { position:absolute; right:var(--pg-r, 46px); bottom:14px;
        font:600 10px 'IBM Plex Mono',Consolas,monospace; color:var(--ink); }

/* 고른 범위 표시 — 브라우저 기본(진한 파랑)은 글자 색을 덮어, 색을 바꿔도 바뀌었는지
   안 보였다(실기기 지적 3). 연한 파랑이면 선택된 채로도 빨강·회색이 그대로 읽힌다.
   글자 색은 건드리지 않는다(background 만 지정하면 글자는 제 색을 지킨다). */
.page ::selection { background:rgba(84,144,255,.25); }

/* 연속 공백과 Shift+Enter 줄바꿈을 그대로 살린다 */
.blk { outline:none; white-space:pre-wrap; }
.blk .mono { font-family:'IBM Plex Mono',Consolas,monospace; }
/* 표 — §8 확정값. 열 너비는 colgroup 픽셀(합 674)이 정하고 table-layout:fixed 가 지킨다 */
/* touch-action: pan-y — 표 위에서 «세로»로 끄는 것만 브라우저에 맡긴다(화면 넘기기).
   가로로 끄는 것은 우리가 «칸 고르기»로 쓴다. 이 한 줄이 없으면 손가락 가로 끌기가
   브라우저 손에 먼저 넘어가 칸이 안 골라진다(실측 2026-08-30).
   ⭐ pinch-zoom 을 «함께» 적어야 두 손가락 확대/축소가 산다(2026-09-01 SKY: "태블릿에서
      종이 부분을 엄지와 검지로 확대/축소를 할수 있게 해줘"). pan-y 만 적으면 그 요소 위에서
      확대/축소가 통째로 죽는데, 이 문서는 거의 표라서 «종이에서 핀치가 안 되는» 것처럼 보였다.
   ⚠ 가로 끌기(칸 고르기)는 그대로 우리 것이다 — pan-x 는 여전히 안 준다. */
/* ⛔ pinch-zoom 을 뺐다 (2026-09-01 SKY: "종이 부분만 확대 축소 되도록").
   브라우저의 두 손가락 확대는 «화면 전체»를 키운다 — 사이드바·리본까지. 그래서 그것을 끄고
   ui/zoom.js 가 두 손가락을 직접 받아 종이(#pages)에만 배율을 건다.
   ⚠ pan-y 는 남긴다 — 한 손가락 세로 끌기(종이 넘겨 보기)는 브라우저가 하는 게 자연스럽다. */
.blk-table { margin:3px 0 9px; position:relative; touch-action:pan-y; }
/* 종이 전체에서도 두 손가락을 우리가 받는다 — 표 밖에서 오므려도 종이가 줄어야 한다 */
#pages { touch-action:pan-y; }
.blk-table table { width:100%; border-collapse:collapse; table-layout:fixed; }
.blk-table td { outline:none; word-break:break-word; }
/* ⭐ 행 여백은 2026-09-01 SKY 지시로 줄였다 — «전체적으로 표를 조금씩 줄여서 행 여백을
   줄이자. 앞으로 표를 생성해도 그걸 기본값으로 하고.» 설계서 §8 의 옛 값은 머리글 7px ·
   본문 6.5px 이었다. 표 기본값이 CSS 한 곳이라 새로 만드는 표도 자동으로 이 값을 쓴다. */
.blk-table thead td { background:#f6f7fa; border-bottom:1.5px solid var(--ink);
                      padding:5.5px 8px; font-size:10.5px; font-weight:700; color:#454a58;
                      text-align:center; line-height:1.3; letter-spacing:-.1px; }
/* ⭐ 세로 맞춤 기본은 «가운데»다 (2026-08-30 SKY) — 한 칸만 아래로 나누면 같은 행의 안 나뉜
   칸이 위쪽에 붙어 어긋나 보였다. 칸마다 위/가운데/아래를 따로 고를 수 있다(엑셀과 같다). */
.blk-table tbody td { padding:4.5px 8px; font-size:11.5px; border-bottom:1px solid var(--line-soft);
                      color:#2b2f3a; font-variant-numeric:tabular-nums; line-height:1.35;
                      vertical-align:middle; }
.blk-table thead td { vertical-align:middle; }
.blk-table tbody tr:last-child td { border-bottom:1px solid #d8dbe3; }
/* 빈 칸에도 커서가 서게 — 목록 빈 항목과 같은 수법(폭 0 보이지 않는 글자) */
.blk-table td:empty::before { content:'\200B'; }
/* 열 경계 손잡이 — 평소엔 투명, 올리면 §8 헤어라인보다 살짝 진하게 */
.colgrip { position:absolute; top:0; bottom:0; width:7px; cursor:col-resize; z-index:3; }
.colgrip-fixed { cursor:default; pointer-events:none; }   /* 이어진 장의 것은 보기 전용 */
.colgrip:hover, .colgrip.on { background:rgba(84,144,255,.35); }
/* ⛔ 칸을 끄는 동안 손잡이는 «없는 것»으로 둔다(2026-08-30 SKY 실측).
   손잡이가 마우스를 가로채면 브라우저가 선택의 끝점을 «칸»이 아니라 «표 전체»로 잡아,
   네모 규칙이 무너지고 아래 행까지 전부 골라졌다. pointer-events 를 끄면
   그 자리 아래의 칸이 정상으로 잡히고, 파란 강조도 함께 사라진다.
   ⚠ 손잡이에서 «시작»한 열 끌기에는 picking 이 안 붙으므로 그대로 잘 끌린다. */
#pages.picking .colgrip { pointer-events:none; }
/* 표에 마우스를 올리면 칸 경계가 세로 눈금으로 보인다 — 세로선이 없어 열 구분이 안 되던 것.
   ⭐ 눈금은 «격자 열»이 아니라 «실제 칸»의 오른쪽에 그린다(2026-08-30 SKY 지적) —
      한 칸만 옆으로 나눴을 때, 안 나뉜 다른 행까지 선이 가로지르면 안 된다.
      td 에 그리므로 병합(cs)·나누기가 저절로 반영된다.
   ⚠ var(--line)(#e4e5e9)로는 흰 종이에서도 칸 선택(연파랑) 위에서도 안 보였다(캡처 실측) —
      반투명 먹으로 둬야 두 바탕 모두에서 읽힌다. 인쇄에는 안 나온다. */
/* 세로 안내선 — 마우스를 표에 올리면 «칸 경계»가 보인다.
   ⭐ 선은 «칸»의 오른쪽에 붙는다(격자 열이 아니다) — 2026-08-30 SKY: 한 칸만 옆으로
   나눴을 때 «안 나뉜 행»까지 선이 가로지르면 안 된다.
   ⛔ 전에는 «그 줄의 마지막 칸»(:last-child)을 뺐다. 그런데 세로 병합(rowspan)이 있으면
   어떤 줄은 칸이 적어서, 그 줄의 «마지막 칸»이 표 오른쪽 끝이 아닌데도 선이 빠졌다 —
   그래서 병합된 표에서 «세로선이 다 안 보인다»로 보였다(2026-09-01 SKY 지적 2·3).
   ⭐ 이제 «표의 오른쪽 끝인 칸»만 뺀다. 그 판정은 CSS 로는 알 수 없어서 그릴 때
   .edge 를 붙여 준다(render.js) — c + colspan 이 열 수와 같으면 오른쪽 끝이다. */
.blk-table:hover td:not(.edge) { border-right:1px solid rgba(28,30,36,.22); }
/* 여러 칸에 걸쳐 고르면 «칸 통째»로 칠한다 — 워드처럼 칸이 선택된 것이 보인다.
   반쪽만 파랗다가 칸 통째로 지워지면 놀라므로, 칠하는 범위와 지워지는 범위를 같게 뒀다. */
.blk-table td.cellsel { background:rgba(84,144,255,.25); }
/* 칸을 고르는 동안에는 그 표의 «글자 파란색»을 끈다 — 골라진 네모 밖 칸까지 파랗게
   보이면 어디가 골라진 것인지 알 수 없다(2026-08-30 SKY 지적) */
.blk-table.cells-picking td::selection, .blk-table.cells-picking td *::selection { background:transparent; }
@media print { .colgrip { display:none !important; }
               .blk-table td { border-right:0 !important; }
               .blk-table td.cellsel { background:transparent; } }
.blk-heading { font-size:27px; font-weight:900; line-height:1.2; margin:0 0 5px; letter-spacing:-.4px; }
.blk-section { display:flex; align-items:center; gap:9px; margin:16px 0 7px; }
.blk-section .n { font:600 11.5px 'IBM Plex Mono',Consolas,monospace;
                  color:var(--point); letter-spacing:1px; }
.blk-section .t { font-size:13px; font-weight:700; letter-spacing:-.2px; white-space:nowrap; }
.blk-section .rule { flex:1; height:1px; background:#e8eaef; }
.blk-para { font-size:12.5px; line-height:1.85; color:#2b2f3a; margin:0 0 6px; min-height:1.85em; }
.blk.sel { box-shadow:0 0 0 2px rgba(229,35,27,.25); border-radius:3px; }
#gauge .blk { margin-left:0; margin-right:0; }

/* ⭐ 묶음 이름 — CP 검사성적서 관리시스템의 사이드바와 같은 방식(2026-09-01 SKY).
   작고 조용한 글씨로 «여기서부터 무슨 묶음인가»만 알린다. */
.sg { font:700 var(--u-fs-mini) 'Noto Sans KR','맑은 고딕',sans-serif; color:var(--u-text-faint); letter-spacing:.6px;
      padding:0 4px; margin:12px 0 5px; }
.sg:first-child { margin-top:2px; }
.sg-list { margin:14px 16px 6px; }
/* 단추 앞 기호 — 폭을 고정해 글자 시작 자리가 모든 단추에서 같다(줄이 맞는다) */
.side-btns .si { display:inline-flex; width:17px; flex:none; justify-content:center;
                 font-size:var(--u-fs-body); line-height:1; }
.side-btns { display:flex; flex-direction:column; gap:4px; margin:12px 12px; }
/* ⚠ 테두리는 «만지는 것»의 색을 쓴다(--u-border, gray-300) — CP 기준 §1:
   카드는 옅게, 입력칸·단추는 한 단계 진하게. 전에는 종이 쪽 --line 을 쓰고 있었다. */
.side-btns button { display:flex; align-items:center; gap:8px; text-align:left;
      border:1px solid var(--u-border); border-radius:var(--u-r-ctl); padding:10px 12px;
                    cursor:pointer; font:600 var(--u-fs-body) 'Noto Sans KR',sans-serif;
                    background:var(--u-surface); color:var(--u-text); }
.side-btns button:hover { background:var(--u-surface-soft); }
/* ⭐ 누른 순간 «눌렸다»가 보이게 — 2026-09-01 SKY: "뭔가 했다는걸 좀 더 효과를 추가 해줘"
   ⚠ 위의 lift 규칙이 :active 에서 translateY(0) 로 되돌리므로 여기서는 배경만 바꾼다 */
.side-btns button:active { background:var(--u-surface-mute); }
.side-btns button.pri:active { background:var(--point); color:var(--u-surface); }

/* 잠깐 뜨는 알림 — 「방금 무엇을 했는지」. 화면 아래 가운데. */
#toast { position:fixed; left:50%; bottom:26px; transform:translate(-50%, 14px); z-index:200;
  max-width:min(520px, 86vw); padding:11px 16px; border-radius:var(--u-r-card);
  background:var(--u-text); color:var(--u-surface); font-size:var(--u-fs-body); font-weight:600; letter-spacing:-.1px;
  box-shadow:0 10px 30px rgba(20,22,30,.30);
  opacity:0; pointer-events:none; transition:opacity .16s, transform .16s; }
#toast.on { opacity:1; transform:translate(-50%, 0); }
#toast.err { background:var(--point); }
@media print { #toast { display:none !important; } }
.side-btns button.pri { border:1.5px solid var(--point); color:var(--point); font-weight:800; }
.side-btns button.pri:hover { background:var(--point); color:var(--u-surface); }
#folder-msg { padding:2px 18px 6px; color:var(--u-text-faint); line-height:1.7; word-break:break-all;
              font:500 var(--u-fs-mini) 'IBM Plex Mono',Consolas,monospace; letter-spacing:.4px; }
/* 문서 목록 — §8 표의 행과 같은 문법: 아래선 헤어라인 · 모노 번호 · 고른 것은 기준 행(옅은 빨강) */
/* ⚠ 목록 항목은 <a> 가 아니라 <button> 이다 — href 없는 <a> 는 브라우저가 «링크»로 안 보고
   «그냥 글»로 봐서, 태블릿에서 글자를 탭하면 크롬의 «탭해서 검색» 사전이 떴다(위 #side 주석).
   <button> 은 누가 봐도 단추라 그 일이 없고 키보드(Tab·Enter)로도 눌린다. */
#doclist { counter-reset:doc; }
#doclist button { display:flex; gap:10px; align-items:baseline; counter-increment:doc;
             color:var(--u-text); text-decoration:none; font-size:var(--u-fs-body); text-align:left;
             width:100%; border:0; border-bottom:1px solid var(--u-border-card); background:none;
             font-family:inherit; padding:11px 18px; cursor:pointer; }
#doclist button:first-child { border-top:1px solid var(--u-border-card); }
#doclist button::before { content:counter(doc, decimal-leading-zero);
                     font:600 var(--u-fs-small) 'IBM Plex Mono',Consolas,monospace; color:var(--u-text-faint);
                     flex:none; }
#doclist button:hover { background:var(--u-surface-soft); color:var(--u-text); }
#doclist button.on { background:#fdf5f4; color:var(--u-text); font-weight:700; }
#doclist button.on::before { color:var(--point); font-weight:700; }

/* 스크립트가 막힌 곳(구글드라이브 미리보기 등)에서만 보이는 안내 */
.nojs { background:var(--point); color:#fff; font-size:14px; font-weight:700;
        line-height:1.7; padding:14px 18px; }

@page { size: A4 portrait; margin: 0; }
/* ── 그림 (설계_그림.md) ── */
/* position:relative 는 아래 캡션 안내글(::before)의 좌표 기준이다 — 없으면 안내글이
   종이 왼쪽 위 구석에 뜬다 */
.blk-image { margin:6px 0; position:relative; }
.blk-image img.bimg { display:inline-block; }
/* ⛔ 여기에 text-align 을 못 박지 않는다. 박아 두면 그림을 왼쪽·오른쪽으로 정렬해도
   설명만 가운데에 남아 따로 논다(2026-08-31 SKY 지적). 정렬은 블록(.blk-image)에
   붙어 있으므로 «물려받게» 두면 그림과 설명이 함께 움직인다.
   ⚠ 그림 블록은 만들 때 align 이 늘 들어간다(기본 'center', core/blocks.js) — 그래서
   물려받기만 해도 지금까지의 «가운데»가 그대로 유지된다. */
.blk-image .cap { font-size:10.5px; color:#5a5e6a; }
/* 캡션이 비면 높이 0 — 화면과 인쇄의 장 나눔이 같아야 한다.
   ⚠ min-height:0 으로는 안 된다(실측 2026-08-31: 그래도 15px). 크롬이 «글자를 칠 수 있는
   빈 칸»에는 커서 놓을 자리를 한 줄 강제로 만들어 주기 때문이다 — CSS 여백이 아니라
   편집 기능이 만드는 높이다. 그래서 접어 둔다(height:0). 커서가 들어오면 편다. */
.blk-image .cap:empty:not(:focus) { height:0; overflow:hidden; }
.blk-image .cap:focus { min-height:1.4em; overflow:visible; }
.blk-image .cap:focus:empty::before {
  content:'그림 설명 (비우면 안 보임)'; color:#aeb0b8; position:absolute; left:0; right:0; }
/* 그림을 고르면 빈 캡션이 펴진다 — 안 그러면 새로 넣은 그림에 설명을 달 길이 없다
   (접혀 있어 누를 수가 없다). 인쇄에서는 고른 상태가 의미 없으므로 다시 접는다. */
.blk-image img.imgsel ~ .cap:empty { height:auto; overflow:visible; min-height:1.4em; }
.blk-image img.imgsel ~ .cap:empty::before {
  content:'그림 설명 (비우면 안 보임)'; color:#aeb0b8; }
#pages img.ri, #gauge img.ri { vertical-align:middle; max-width:100%; height:auto; }
/* 여러 장 고르기(Ctrl+클릭) — ⛔ 예전에는 함께 고른 것을 «연한 하늘색»으로만 그렸더니
   무엇을 골랐는지 알아보기 어려웠다(2026-08-31 SKY 지적: «마지막 항목만 파란색으로
   표시되니까 어떤 걸 선택했는지 헷갈려»). 이제 고른 것은 «전부» 같은 파란 테두리에
   퍼지는 파란 테를 둘러 한눈에 보이게 하고, «기준»(손잡이가 붙고 서식 창이 값을 보여 주는
   그 한 장)은 테두리를 더 굵고 진하게 해서 가른다. 손잡이도 기준에만 붙는다. */
#pages img.imgsel { outline:2px solid #5490ff; outline-offset:1px;
  box-shadow:0 0 0 4px rgba(84,144,255,.30); }
#pages img.imgsel.imgbase { outline:3px solid #2f6fe0; outline-offset:1px;
  box-shadow:0 0 0 5px rgba(47,111,224,.38); }
/* ── 자르기 감싸개(.iclip) — 표시 크기를 박아 두는 «창» (설계_서식과우클릭.md §4-3) ──
   안쪽 img 는 «원본 전체»를 배율로 키운 것이라 감싸개보다 크고 음수 마진으로 밀려 있다.
   ⛔ max-width 를 풀지 않으면 그 img 가 감싸개 폭으로 눌려 자르기가 통째로 무너진다
      (#pages img.ri 의 max-width:100% 가 감싸개 안에서는 «감싸개 폭»을 뜻하기 때문). */
#pages .iclip, #gauge .iclip { display:inline-block; overflow:hidden;
  vertical-align:middle; line-height:0; }
#pages .iclip img, #gauge .iclip img { max-width:none; }
/* 자른 그림은 «감싸개»가 곧 눈에 보이는 네모다 — 선택 테두리도 거기 그린다.
   안쪽 img 에 그리면 overflow:hidden 에 잘려 안 보인다. */
#pages .iclip:has(img.imgsel) { outline:2px solid #5490ff; outline-offset:1px;
  box-shadow:0 0 0 4px rgba(84,144,255,.30); touch-action:none; }
#pages .iclip:has(img.imgbase) { outline:3px solid #2f6fe0;
  box-shadow:0 0 0 5px rgba(47,111,224,.38); }
#pages .iclip img.imgsel { outline:none; box-shadow:none; }
/* 빈 캡션 펴기도 감싸개를 건너 이어져야 한다 — img 가 span 안으로 들어가면서
   기존 «img.imgsel ~ .cap» 형제 규칙이 안 닿는다 */
.blk-image .iclip:has(img.imgsel) ~ .cap:empty {
  height:auto; overflow:visible; min-height:1.4em; }
.blk-image .iclip:has(img.imgsel) ~ .cap:empty::before {
  content:'그림 설명 (비우면 안 보임)'; color:#aeb0b8; }
/* 크기 손잡이 — 편집 화면 전용, 인쇄에 안 찍힌다.
   ⚠ #imgui 자체는 pointer-events:none 이라 밑에 있는 글자를 가리지 않는다(2B 함정 재발 방지) */
#imgui { position:absolute; z-index:30; pointer-events:none; }
/* ⛔ touch-action:none 이 없으면 태블릿·폰에서 크기 조절이 통째로 죽는다 —
   손가락이 두어 번 움직이는 순간 크롬이 «이건 화면 넘기기구나» 하고 판단해
   pointercancel 로 끊어 버린다(2026-08-31 실측: pointerdown → move 2번 → cancel).
   ⭐ 잡히는 영역은 26px(손가락용), 눈에 보이는 네모는 그 안의 11px 이다.
   보이는 것만 크게 하면 화면이 지저분해지고, 잡히는 것만 작으면 못 쓴다. */
#imgui .imgh { position:absolute; width:26px; height:26px; pointer-events:auto;
  touch-action:none; display:flex; align-items:center; justify-content:center; }
#imgui .imgh::before { content:''; width:11px; height:11px; background:#fff;
  border:1.5px solid #5490ff; border-radius:2px; }
#imgui .imgh[data-c="nw"] { left:-13px; top:-13px; cursor:nwse-resize; }
#imgui .imgh[data-c="ne"] { right:-13px; top:-13px; cursor:nesw-resize; }
#imgui .imgh[data-c="sw"] { left:-13px; bottom:-13px; cursor:nesw-resize; }
#imgui .imgh[data-c="se"] { right:-13px; bottom:-13px; cursor:nwse-resize; }
/* 고른 그림 자체도 손가락 끌기가 스크롤로 새지 않게 */
#pages img.imgsel { touch-action:none; }
/* 끌 때 «어디로 가는지» 미리보기 — 보통 블록은 그 아래 굵은 줄, 표 칸은 테두리 */
#imgdrop { position:absolute; z-index:29; pointer-events:none; height:3px;
  background:#5490ff; border-radius:2px; box-shadow:0 0 0 1px rgba(84,144,255,.3); }
#imgdrop.cell { height:auto; background:transparent; border:2px solid #5490ff;
  border-radius:3px; box-shadow:none; }
@media print { #imgdrop { display:none !important; } }

/* ── 그림 서식 창 (설계_서식과우클릭.md §4-1) ──
   body 에 살면서 기준 그림 옆에 fixed 로 떠 있는 작은 카드다. 종이 위가 아니라
   «화면 위»에 있어야 페이지가 넘어가거나 다시 그려져도 자리가 안 흔들린다(M6). */
#imgpanel { position:fixed; z-index:100; width:206px; background:#fff;
  border:1px solid var(--line); border-radius:10px; padding:10px 12px 12px;
  box-shadow:0 6px 24px rgba(20,22,30,.16); font-size:12px; color:var(--ink); }
#imgpanel .fp-ttl { display:flex; align-items:center; justify-content:space-between;
  font-weight:800; font-size:12.5px; padding-bottom:8px; margin-bottom:8px;
  border-bottom:1px solid var(--line-soft); }
#imgpanel .fp-x { border:0; background:none; cursor:pointer; color:var(--dim);
  font-size:13px; line-height:1; padding:2px 4px; }
#imgpanel .fp-x:hover { color:var(--ink); }
#imgpanel .fp-n { display:none; color:var(--sub); font-size:11px; line-height:1.45;
  margin-bottom:8px; }
/* ⚠ 라벨 글자 길이가 제각각(「폭」·「둥근 모서리」)이라 flex 로 두면 입력칸 폭이 줄마다
   달라져 들쭉날쭉해 보인다(캡처 실측). 격자로 칸을 «세로로 맞춰» 놓는다. */
#imgpanel label { display:grid; grid-template-columns:62px 1fr auto; align-items:center;
  gap:6px; margin-bottom:7px; color:var(--sub); }
#imgpanel label input { min-width:0; width:100%; height:28px; padding:0 6px;
  border:1px solid var(--line); border-radius:6px; font:inherit; color:var(--ink); }
#imgpanel label i { font-style:normal; color:var(--dim); }
#imgpanel .fp-btns { display:flex; gap:6px; margin-top:9px; }
#imgpanel .fp-btns button { flex:1; min-width:0; height:30px; padding:0 6px;
  border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
  font:inherit; cursor:pointer; white-space:nowrap; }
#imgpanel .fp-btns button:hover { background:#f5f6f8; }
#imgpanel .fp-align { display:flex; }
/* 「둥근 모서리」 단추 한 줄 — 단추가 곧 이름표이고, 옆 칸에 정확한 mm 를 친다 */
#imgpanel .fp-line { display:grid; grid-template-columns:1fr 58px auto; align-items:center;
  gap:6px; margin-bottom:7px; color:var(--sub); }
#imgpanel .fp-line button { height:30px; padding:0 8px; border:1px solid var(--line);
  border-radius:7px; background:#fff; color:var(--ink); font:inherit; cursor:pointer;
  white-space:nowrap; }
#imgpanel .fp-line input { min-width:0; width:100%; height:28px; padding:0 6px;
  border:1px solid var(--line); border-radius:6px; font:inherit; color:var(--ink); }
#imgpanel .fp-line i { font-style:normal; color:var(--dim); }
/* 편집 줄(복사·잘라내기·삭제)은 서식과 성격이 달라 선으로 갈라 둔다 */
#imgpanel .fp-edit { border-top:1px solid var(--line-soft); margin-top:10px; padding-top:9px; }
#imgpanel .fp-edit .fp-del { color:var(--point); }
/* 켜짐 표시는 리본 단추와 «같은 모양»이어야 한다 — 어디서 눌러도 같은 뜻으로 읽힌다 */
#imgpanel button.on, #ctxmenu .q.on, #minibar .q.on, #minibar2 .q.on {
  background:var(--u-accent-light) !important; border-color:var(--u-accent-mid) !important; color:var(--u-accent-dark) !important;
  font-weight:800; }
@media print { #imgpanel { display:none !important; } }

/* ── 자르기 덮개 (설계_서식과우클릭.md §4-2) ──
   유령(.cg)이 «원본 전체»를 지금 배율로 깔고, 창(.cw)이 보여 줄 자리다.
   ⭐ 창 밖을 어둡게 하는 것은 칸 4개가 아니라 창의 box-shadow 하나다 — 창을 옮기면
      어두운 부분이 저절로 따라오므로 어긋날 데가 없다. */
#cropui { position:fixed; inset:0; z-index:110; overflow:hidden; }
#cropui .cg { position:fixed; max-width:none; user-select:none; -webkit-user-drag:none; }
#cropui .cw { position:fixed; box-shadow:0 0 0 9999px rgba(20,22,28,.45);
  outline:1.5px solid #5490ff; cursor:move; touch-action:none; }
/* ⛔ 잡히는 영역은 26px(손가락용), 눈에 보이는 네모는 그 안의 11px 이다 —
   #imgui 손잡이와 같은 방식이다. touch-action:none 이 없으면 태블릿에서
   크롬이 «화면 넘기기»로 채 가서 조절이 통째로 죽는다(2026-08-31 실측). */
#cropui .ch { position:absolute; width:26px; height:26px; touch-action:none;
  display:flex; align-items:center; justify-content:center; }
#cropui .ch::before { content:''; width:11px; height:11px; background:#fff;
  border:1.5px solid #5490ff; border-radius:2px; }
#cropui .ch[data-c="nw"] { left:-13px; top:-13px; cursor:nwse-resize; }
#cropui .ch[data-c="n"]  { left:50%; margin-left:-13px; top:-13px; cursor:ns-resize; }
#cropui .ch[data-c="ne"] { right:-13px; top:-13px; cursor:nesw-resize; }
#cropui .ch[data-c="e"]  { right:-13px; top:50%; margin-top:-13px; cursor:ew-resize; }
#cropui .ch[data-c="se"] { right:-13px; bottom:-13px; cursor:nwse-resize; }
#cropui .ch[data-c="s"]  { left:50%; margin-left:-13px; bottom:-13px; cursor:ns-resize; }
#cropui .ch[data-c="sw"] { left:-13px; bottom:-13px; cursor:nesw-resize; }
#cropui .ch[data-c="w"]  { left:-13px; top:50%; margin-top:-13px; cursor:ew-resize; }
/* 안내 줄 — 화면 위 가운데. 태블릿에는 Enter·Esc 키가 없어 단추가 유일한 «취소» 길이다. */
#cropui .ctip { position:fixed; left:50%; top:14px; transform:translateX(-50%);
  display:flex; align-items:center; gap:10px; max-width:calc(100vw - 24px);
  padding:8px 10px 8px 14px; background:#fff; border-radius:10px;
  box-shadow:0 6px 24px rgba(20,22,30,.28); font-size:12.5px; color:var(--ink); }
#cropui .ctip span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#cropui .ctip button { flex:none; height:32px; padding:0 14px; border-radius:7px;
  border:1px solid var(--line); background:#fff; color:var(--ink); font:inherit; cursor:pointer; }
#cropui .ctip .ct-ok { border-color:var(--ink); background:var(--ink); color:#fff; font-weight:700; }
@media print { #cropui { display:none !important; } }

/* ── 우클릭 문맥 메뉴 · 미니 패널 (설계_서식과우클릭.md §5-2·§5-3) ──
   ⭐ 맨 위 «뱃지»가 지금 무엇을 고른 상태인지 말해 준다 — 「▦ 표 · 3칸 고름」처럼.
      메뉴가 왜 이 모습인지 알려 주는 한 줄이라 이것부터 읽게 크기를 잡았다. */
#ctxmenu, #minibar, #minibar2 { position:fixed; z-index:120; background:var(--u-surface); color:var(--u-text);
  border:1px solid var(--u-border); border-radius:var(--u-r-card); padding:8px;
  box-shadow:0 8px 28px rgba(20,22,30,.20); font-size:var(--u-fs-body); }
#minibar, #minibar2 { z-index:115; }
#ctxmenu { width:264px; }
#ctxmenu .mbadge, #minibar .mbadge, #minibar2 .mbadge { font-size:var(--u-fs-small); color:var(--u-text-faint); letter-spacing:.2px;
  padding:0 2px 6px; }
/* 빠른 줄 — 기호만 쓴 작은 단추. 뜻이 같은 것끼리(.qg) 줄을 나눈다:
   글자꼴(B I U A＋ A−) / 색(■■■ ✕) / 정렬·맞춤. 한 줄로 죽 늘어놓으면 폭에 따라
   아무 데서나 접혀 «7개, 7개, 1개»처럼 갈라진다(캡처 실측). */
/* ⭐ 줄을 «격자»로 세운다 — 2026-09-01 SKY: "서식바 크기가 다 달라. 어느정도 통일감 있게
   정렬 해줘. 지금 각 서식바 안에 내용도 좀 정렬 해주고 각 항목끼리 같은 줄에 표시 된다던가."
   옛 방식(flex + wrap)은 묶음마다 단추 수가 달라 칸이 제각각 어긋났고, 바의 폭도 내용에
   따라 달라져 두 바가 나란히 뜰 때 들쭉날쭉했다.
   이제 모든 묶음이 «6칸 격자»다 — 묶음이 달라도 세로줄이 맞고, 바의 폭도 늘 같다. */
.qs { display:flex; flex-direction:column; gap:3px; padding-bottom:6px; }
.qs .qg { display:grid; grid-template-columns:repeat(6, 30px); gap:3px; justify-content:start; }
.qs .q { width:30px; height:30px; padding:0; flex:none; display:flex; align-items:center;
  justify-content:center; border:1px solid transparent; border-radius:var(--u-r-ctl);
  background:var(--u-surface); color:var(--u-text); font:inherit; cursor:pointer; }
/* ⭐ 리본 단추(.tb)와 «같은 기준» (2026-09-01 SKY: "우클릭 했을 떄 뜨는 서식바도 상단
   리본 같은 기준을 적용 해줘") — 호버 그림자·눌림 되먹임을 리본과 똑같이 맞춘다.
   ⚠ 크기(30px)는 안 키운다. 리본은 58×44 인데 그대로 쓰면 서식바가 377px 이 되어
     종이를 덮는다 — 종이 왼쪽 빈 자리는 PC 1600 에서 258px · PC 1280 에서 98px ·
     태블릿에서 38px 뿐이다[실측 2026-09-01]. 이름은 말풍선(title)이 대신 알려 준다. */
.qs .q:hover { background:var(--u-surface-mute); border-color:var(--u-border);
  box-shadow:0 2px 8px rgba(20,22,30,.10); }
.qs .q:active { background:var(--u-accent-light); border-color:var(--u-border);
  box-shadow:0 1px 2px rgba(20,22,30,.10); }
#ctxmenu .mlist button:active { background:var(--u-accent-light); }
.qs .q-b { font-weight:900; }
.qs .q-i { font-style:italic; }
.qs .q-u { text-decoration:underline; }
/* 목록은 2열이다 — 세로로 길면 손이 아래까지 내려가야 해서 태블릿에서 특히 나빴다 */
#ctxmenu .mlist { display:grid; grid-template-columns:1fr 1fr; gap:3px;
  border-top:1px solid var(--u-border-card); padding-top:6px; }
#ctxmenu .mlist button { height:31px; padding:0 8px; text-align:left; border:1px solid transparent;
  border-radius:var(--u-r-ctl); background:var(--u-surface); color:var(--u-text); font:inherit; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#ctxmenu .mlist button:hover { background:var(--u-surface-mute); border-color:var(--u-border); }
#minibar, #minibar2 { padding:6px; }
/* 두 서식바(글자·표)가 나란히 뜨므로 폭이 같아야 나란해 보인다 — 격자 6칸이 그 폭을 정한다
   (30×6 + 3×5 틈 = 195px). max-width 로 «접히게» 두면 내용에 따라 폭이 달라진다. */
#minibar .qs, #minibar2 .qs { padding-bottom:0; }
#minibar, #minibar2 { width:211px; }
/* 알림 — 붙여넣기가 브라우저에 막혔을 때 «막혔다»고 말해 준다. 조용히 삼키지 않는다. */
/* ⚠ 이 규칙은 도구 토큰 훑기에서 빠져 있었다(도구 선택자 목록에 .mtoast 가 없었다) —
   2026-09-01 에 손으로 맞췄다. 토큰을 쓰는 규칙과 안 쓰는 규칙이 섞이면 다음에 색을
   고칠 때 한쪽만 바뀐다. */
.mtoast { position:fixed; z-index:130; max-width:300px; padding:9px 12px;
  border-radius:var(--u-r-card);
  background:var(--u-text-strong); color:var(--u-surface); font-size:var(--u-fs-body);
  line-height:1.5; box-shadow:0 6px 20px rgba(20,22,30,.28); }
@media print { #ctxmenu, #minibar, #minibar2, .mtoast { display:none !important; } }

@media print {
  /* ⭐ 2026-09-01 SKY 지적 — «인쇄 미리보기에서 바닥글 1/1 이 2페이지로 넘어가서 표시된다».
     원인은 «두 가지가 겹친 것»이었다[실측: 진짜 PDF 를 뽑아 쪽수를 세어 확인].
     ① 브라우저 기본 인쇄 여백(사방 0.4in ≈ 38px) 때문에 찍을 수 있는 높이가 1123px 보다
        작았다 → @page 로 종이를 우리 종이와 똑같이 못 박는다.
     ② ⛔ 진짜 범인은 이쪽이다 — #pages 의 위쪽 여백 28px 이 인쇄에서 안 지워져, 종이가
        28px 아래에서 시작했다. 그만큼 아래가 밀려 «쪽 번호(바닥에서 14px)만» 다음 장으로
        넘어갔다. 아래 #pages 규칙의 padding-top:0 이 그것이다.
        (gap 은 이미 0 으로 껐는데 padding-top 은 빠져 있었다.)
     ⚠ A4 라고만 적으면 210×297mm = 793.7px 폭이라 우리 종이(794px)보다 좁다. px 로 적으면
       크롬이 pt 로 반올림해 794.56×1122.56px 을 준다 — 폭이 넉넉해 안전하다.
       크기는 A4 와 사실상 같다(209.9×296.9mm). */
  @page { size: 794px 1123px; margin: 0; }
  /* ⛔ 좁은 화면에서 줄여 보여 주던 배율은 인쇄에서 반드시 1 이어야 한다 —
     줄어든 채로 인쇄되면 A4 한복판에 작게 찍힌다(ui/fit.js) */
  #pages { zoom:1 !important; }
  #side, #gauge, #folder-msg { display:none !important; }
  #imgui { display:none !important; }
  /* ⛔ box-shadow 도 함께 꺼야 한다 — outline 만 끄면 파란 테가 종이에 그대로 찍힌다 */
  #pages img.imgsel { outline:none !important; box-shadow:none !important; }
  #pages .iclip:has(img.imgsel) { outline:none !important; box-shadow:none !important; }
  /* 인쇄에서는 «고른 그림»이 의미가 없다 — 펴 뒀던 빈 캡션을 도로 접는다 */
  .blk-image .cap:empty { height:0 !important; overflow:hidden !important;
                          min-height:0 !important; }
  .blk-image .cap:empty::before { content:none !important; }
  body { background:#fff; }
  /* ⛔ 확대/축소가 인쇄에 남으면 A4 밖으로 잘린다 (설계서 §12-10) */
  #main { padding:0 !important; transform:none !important; zoom:1 !important; }
  /* ⛔ padding-top 도 함께 꺼야 한다 — 화면에서 종이 위에 두던 28px 틈이 인쇄에 남으면
     종이가 28px 아래에서 시작해 아래쪽이 다음 장으로 밀린다(위 @page 주석 ②). */
  #pages { gap:0 !important; padding-top:0 !important; }
  .nojs { display:none !important; }
  .page { box-shadow:none !important; margin:0 !important;
          page-break-after:always; break-after:page; }
  .page:last-child { page-break-after:auto; break-after:auto; }
  .blk { outline:none !important; box-shadow:none !important; }
}

/* ── 판(版) — 화면 전용 표지 (설계_판.md §4 · P9: 글자 노드를 만들지 않는다) ── */
/* 리본처럼 자리를 지킨다 — 문서를 내려 보다가도 판을 바꿀 수 있어야 한다.
   ⛔ top 을 여기에 숫자로 적을 수 없다: 리본은 상황 묶음이 나타나면 한 줄에서 두세 줄로
      커진다(실측 247→317px). vbar.js 의 stickUnderBar() 가 리본 높이를 재서 style.top 에
      넣는다(여기 top:0 은 스크립트가 아직 안 잰 첫 순간용 기본값이다).
   ⚠ z-index 는 리본(5)보다 낮게 둔다 — 높이가 바뀌는 한순간에도 리본을 가리지 않는다. */
#vbar { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--u-surface);
  border-bottom: 1px solid #e4e5e9; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 4; }
#vbar[hidden] { display: none; }
/* ⭐ 칩은 리본 단추(.tb)와 «같은 물건»으로 보여야 한다 — 2026-09-01 SKY: «판 선택 버튼이
   작아서 클릭 하기 힘들어. 다른 버튼처럼 모서리 굴곡 같은거도 통일 하자.»
   옛 값은 알약 모양(border-radius:999px)에 높이 24px 이라 태블릿에서 손가락으로 누르기
   어려웠다. 이제 모서리 6px · 높이 40px 로 리본과 맞춘다(리본 42px 보다 2px 낮게 둬
   판 바가 리본보다 얇아 보이게 한다 — 판 바가 문서 자리를 먹는 느낌을 줄인다). */
#vbar .vchip { height: 40px; padding: 0 12px; border-radius:var(--u-r-ctl); border: 1px solid var(--u-border);
  background: var(--u-surface); color: var(--u-text); cursor: pointer; display: inline-flex; align-items: center;
  gap: 8px; white-space: nowrap; flex: none;
  font: 600 var(--u-fs-body) 'Noto Sans KR', '맑은 고딕', sans-serif;
  transition: transform .12s, box-shadow .12s, background .12s; }
#vbar .vchip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--vc, #8a8e98); }
#vbar .vchip.on { background: var(--u-accent-light); border-color: var(--u-accent-mid); color: var(--u-accent-dark); font-weight: 800; }
/* ⭐ «보기 고르기»는 테두리를 맞붙인 한 덩어리다(2026-09-01 SKY: 판 버튼 배치 개선).
   라디오 단추처럼 «이 중 하나»임이 모양으로 보인다 — 옛 모양은 똑같은 네모 일곱 개가
   죽 늘어서 있어 «고르는 것»과 «관리»가 눈으로 안 갈렸다.
   ⚠ 켜진 칩은 z-index 로 올린다 — 안 그러면 파란 테두리가 옆 칩 테두리에 가려 한 변이 끊긴다. */
#vbar .vseg { display: inline-flex; align-items: center; }
#vbar .vseg .vchip { border-radius: 0; margin-left: -1px; position: relative; }
#vbar .vseg .vchip:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
#vbar .vseg .vchip:last-child { border-radius: 0 6px 6px 0; }
#vbar .vseg .vchip:hover { background: var(--u-surface-mute); z-index: 1; }
#vbar .vseg .vchip.on { z-index: 2; }
/* 「⚙ 판 관리」 — 고르는 것이 아니라 관리다. 테두리를 없애 조용히 물러나 있는다. */
#vbar .vchip-ghost { border-color: transparent; color: var(--u-text-sub); margin-left: 6px; }
#vbar .vchip-ghost:hover { border-color: var(--u-border); background: var(--u-surface-mute); color: var(--u-text); }
/* ⭐ 판 표지는 «본문 밖»으로 뺀다 — 2026-09-01 SKY: «이름표 자리를 종이 우측 부분에
   표시 하자. 외각에.»
   옛 방식(색줄은 블록 안쪽 그림자 · 이름표는 블록 오른쪽 위)은 글자를 덮었다[실측 2026-09-01]:
     · 이름표가 표 머리글 마지막 칸(「기준」)을 가로 27~120px 덮었다. 그 칸 폭이 128px 이라
       이름표가 길면 글자가 통째로 안 보였다.
     · 왼쪽 3px 색줄은 섹션 번호(01·02)의 왼쪽 여백이 0px 이라 첫 글자를 물었다.
   이제 색줄은 왼쪽 여백(−14px, 종이 안)에, 이름표는 종이 오른쪽 «밖»에 세운다.
   ⚠ 이름표가 종이 밖으로 나가려면 .page 의 overflow 를 풀어야 한다 → #pages.vall 참고. */
.blk.vlim { position: relative; }
.blk.vlim::before { content: ''; position: absolute; left: -14px; top: 0; bottom: 0; width: 3px;
  background: var(--vc, #8a8e98); border-radius: 2px; pointer-events: none; }
/* 판 이름표 — 종이 «밖»에 세운다(2026-09-01 SKY: "아예 종이 바깥에… 글씨 크기도 좀 키워줘.
   판과 같은 색상으로 맞춰 주고"). 옛 값은 9px 이었고 종이 안쪽 여백에 걸쳐 지저분했다.
   ⭐ 이름표는 종이의 «덮개 층»(.vtags)에 그린다 — 편집 칸 안이 아니라서 판마다 제 색을 줄 수
      있고(render.js addVariantTag), 커서 셈(P9)도 안 건드린다.
   ⚠ left:calc(100% + 14px) 의 100% 는 «종이 폭»이다(덮개가 inset:0 이라) — 그래서 이름표가
      본문이 아니라 «종이» 밖에 선다. 종이가 내용을 가두면 안 보인다 → #pages.vall 참고. */
.vtags { position: absolute; inset: 0; pointer-events: none; }
.vtag { position: absolute; left: calc(100% + 14px); display: flex; align-items: center; gap: 3px;
  font: 700 11px/1.4 'IBM Plex Mono', Consolas, monospace; white-space: nowrap;
  background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px;
  box-shadow: 0 1px 4px rgba(20, 22, 30, .08); }
.vtag .sep { color: #c9ccd4; font-weight: 400; }
/* 전체보기에서만 종이 밖으로 나가는 것을 허락한다 — 판 보기·판 없는 문서는 종전대로
   .page 가 내용을 가둔다(render.js 가 #pages 에 vall 을 붙였다 뗀다). */
#pages.vall .page { overflow: visible; }
tr.vlim td:first-child { box-shadow: inset 3px 0 0 var(--vc, #8a8e98); }
td.vcell { position: relative; }
td.vcell::after { content: ''; position: absolute; top: 0; right: 0; border: 5px solid transparent;
  border-top-color: #8a8e98; border-right-color: #8a8e98; pointer-events: none; }
/* ⭐ 마우스를 올리면 «누를 수 있는 칸»임을 보인다(2026-09-01 SKY: "마우스 오버 시 피드백이
   없기도 하고"). 칸 «전체»가 손잡이라 표시도 칸 전체에 준다 — 옛 모서리 18px 손잡이는
   표의 열 너비 손잡이(.colgrip)와 3px 겹쳐 파란 강조에 먹혔다[실측 x 688~706 vs 703~710].
   ⚠ 아주 옅게 — 표를 읽는 데 방해되면 안 된다. 삼각형은 그때 진해져 «여기»를 가리킨다. */
td.vcell:hover { background: rgba(84, 144, 255, .07); }
td.vcell:hover::after { border-top-color: #5490ff; border-right-color: #5490ff; }
@media print { td.vcell:hover { background: none; } }
td.vown::after { border-top-color: var(--vc); border-right-color: var(--vc); }
/* 판 관리 창 (설계 §4-5) — 그림 서식 창과 같은 계열의 작은 창. 목록이 동적이라 JS 로 만든다 */
#vmgr { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); z-index: 60;
  background: var(--u-surface); border: 1px solid var(--u-border); border-radius:var(--u-r-card); padding: 12px;
  box-shadow: 0 8px 30px rgba(28, 30, 36, .18); min-width: 340px; font-size:var(--u-fs-body); }
#vmgr .vmgr-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
#vmgr .vmgr-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--vc, #8a8e98); }
#vmgr .vmgr-row .nm { flex: 1; font-weight: 600; }
#vmgr button { font-size:var(--u-fs-body); padding: 2px 8px; }
/* 문서 정보 창 — 머리글·바닥글 값(제목·문서번호·개정·날짜·회사·로고)을 고친다.
   판 관리 창과 같은 계열의 작은 카드다. body 에 살아서 종이가 다시 그려져도 안 흔들린다. */
#docinfo { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 60;
  background: var(--u-surface); border: 1px solid var(--u-border); border-radius:var(--u-r-card); padding: 12px 14px;
  box-shadow: 0 8px 30px rgba(28, 30, 36, .18); font-size:var(--u-fs-body); width: 380px; }
#docinfo .di-ttl { display: flex; align-items: center; justify-content: space-between;
  font-weight: 800; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--u-border-card); }
#docinfo .di-x { border: 0; background: none; cursor: pointer; color: var(--u-text-faint);
  font-size:var(--u-fs-body); line-height: 1; padding: 2px 4px; }
#docinfo .di-x:hover { color: var(--u-text); }
#docinfo .di-note { color: var(--u-text-sub); font-size:var(--u-fs-small); line-height: 1.5; margin: 0 0 9px; }
#docinfo .di-row { display: grid; grid-template-columns: 58px 1fr; align-items: center;
  gap: 8px; padding: 3px 0; }
#docinfo .di-row .nm { font-weight: 700; color: var(--u-text-sub); }
#docinfo .di-row input[type=text] { min-width: 0; width: 100%; height: 28px; padding: 0 7px;
  border: 1px solid var(--u-border); border-radius:var(--u-r-ctl); font: inherit; color: var(--u-text); }
#docinfo .di-logo { grid-template-columns: 58px 1fr auto auto; }
#docinfo .di-logoview { display: flex; align-items: center; height: 30px; color: var(--u-text-faint);
  font-size:var(--u-fs-small); }
#docinfo .di-logoview img { max-height: 28px; max-width: 150px; }
#docinfo button { height: 28px; padding: 0 9px; font-size:var(--u-fs-body); border: 1px solid var(--u-border);
  border-radius:var(--u-r-ctl); background: var(--u-surface); cursor: pointer; }
#docinfo button:hover { background: var(--u-surface-mute); }
#docinfo button:disabled { opacity: .4; cursor: default; }
#docinfo .di-foot { display: flex; justify-content: flex-end; gap: 6px;
  border-top: 1px solid var(--u-border-card); margin-top: 10px; padding-top: 9px; }
/* 「저장」만 눈에 띄게 — 이 창에서 «해야 하는 일»은 저장 하나다(2026-09-01 SKY).
   나머지(기본으로·기본 넣기·닫기)는 가끔 쓰는 것이라 평범한 단추로 둔다.
   ⚠ 왼쪽 끝에 세운다 — 오른쪽 끝은 「닫기」 자리라 손에 익은 자리를 바꾸면 잘못 누른다. */
#docinfo .di-foot .di-save { margin-right: auto; font-weight: 700;
  border-color: var(--u-border); background: var(--u-surface-mute); }
#docinfo .di-foot .di-save:hover { background: var(--u-surface-mute); }
@media print { #docinfo { display: none !important; } }

/* 「부품 목록」 창 (기둥 3, 2026-09-01) — 문서 정보 창과 같은 계열이되 «표»라서 더 넓다.
   ⚠ 폭 640px 은 칸 4개(이름·도면번호·개정·개정일자)＋지움 단추가 한 줄에 들어가는 최소다.
   ⚠ 좁은 화면(태블릿 세로 753)에서는 화면 폭에 맞춰 줄인다 — 안 그러면 창이 화면 밖으로 나간다. */
#partslist { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 60;
  background: var(--u-surface); border: 1px solid var(--u-border); border-radius:var(--u-r-card); padding: 12px 14px;
  box-shadow: 0 8px 30px rgba(28, 30, 36, .18); font-size:var(--u-fs-body);
  /* ⚠ 넓힌 까닭: 2026-09-01 SKY — "이름 항목 같은경우 잘려서 보이지 않는게 있어. 이 창을
     좀 더 크게 보이게끔 하자". 이름에 「SICON-4000EKZi(5.5kW~15kW)표준」 처럼 30자 넘는
     것이 있다. 좁은 화면에서는 화면 폭에 맞춰 줄어든다(max-width). */
  width: 1320px; max-width: calc(100vw - 24px);
  /* ⚠ 창 높이도 화면에 맞춘다 — 부품이 60개를 넘어가면 목록만으로도 화면을 넘는다.
     제목·머리줄·아래 단추는 늘 보이고 «목록만» 스크롤한다(.pl-body). */
  max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
#partslist .pl-ttl { display: flex; align-items: center; justify-content: space-between;
  font-weight: 800; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--u-border-card); }
#partslist .pl-x { border: 0; background: none; cursor: pointer; color: var(--u-text-faint);
  font-size:var(--u-fs-body); line-height: 1; padding: 2px 4px; }
#partslist .pl-x:hover { color: var(--u-text); }
#partslist .pl-note { color: var(--u-text-sub); font-size:var(--u-fs-small); line-height: 1.5; margin: 0 0 9px; }
/* 부품이 많아지면 창이 화면을 넘는다 — 목록만 스크롤한다(머리줄·바닥은 늘 보인다) */
/* ⭐ 목록이 남는 자리를 다 쓴다(flex:1) — 2026-09-02 SKY: "팝업창은 좀더 크게".
   ⚠ min-height:0 이 없으면 flex 안에서 스크롤이 안 생기고 창이 화면 밖으로 자란다. */
#partslist .pl-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
/* 칸 다섯(구분·이름·도면번호·개정·개정일자) + 지움 단추.
   ⚠ 「구분」 이 맨 앞이다 — 갈래 제목과 같은 줄에서 눈이 이어진다. */
#partslist .pl-row { display: grid; grid-template-columns: .9fr 1.2fr 1.1fr .7fr .8fr auto;
  align-items: center; gap: 6px; padding: 2px 0; }
/* 갈래 제목 — 2026-09-01 SKY: "구분은 필요해". 56개가 한 덩어리면 무엇이 무엇인지 안 갈린다 */
/* 갈래 제목 줄 — 이름을 그 자리에서 고치고, 그 갈래에 부품을 바로 더한다(2026-09-01 SKY) */
#partslist .pl-group { display: flex; align-items: center; gap: 6px;
  background: var(--u-surface-mute); border-radius:var(--u-r-ctl); padding: 2px 6px; margin: 7px 0 3px;
  position: sticky; top: 0; z-index: 1; }
#partslist .pl-group .pl-gname { flex: 1; min-width: 0; height: 24px; padding: 0 6px;
  font: inherit; font-weight: 800; font-size:var(--u-fs-small); color: var(--u-text);
  background: transparent; border: 1px solid transparent; border-radius:var(--u-r-ctl); }
/* ⚠ 가만히 있을 때 테두리를 안 보인다 — 제목처럼 읽히게. 만지면 «고칠 수 있는 것»으로 바뀐다 */
#partslist .pl-group .pl-gname:hover { border-color: var(--u-border); background: var(--u-surface); }
#partslist .pl-group .pl-gname:focus { border-color: var(--u-border); background: var(--u-surface); outline: none; }
#partslist .pl-group .pl-gcnt { color: var(--u-text-faint); font-size:var(--u-fs-small); }
#partslist .pl-group .pl-gadd { height: 22px; padding: 0 7px; font-size:var(--u-fs-small); }
#partslist .pl-group:first-child { margin-top: 0; }
#partslist .pl-row .pl-note { color: var(--u-text-sub); }
/* 머리줄 — 스크롤 상자 «밖»에 있어 늘 보인다(2026-09-01 SKY: "헤더도 고정 되서 스크롤").
   ⭐ 가운데 정렬 — SKY: "헤더는 가운데 정렬 배치 하고".
   ⚠ 맨 끝 칸(지움 단추 자리)의 머리글은 비어 있다 — 자리만 지킨다. */
#partslist .pl-head { font-weight: 700; color: var(--u-text-sub); font-size:var(--u-fs-small);
  text-align: center; padding-bottom: 5px;
  border-bottom: 1px solid var(--u-border); margin-bottom: 0; }
#partslist .pl-body { padding-top: 4px; }
#partslist .pl-row input[type=text] { min-width: 0; width: 100%; height: 28px; padding: 0 7px;
  border: 1px solid var(--u-border); border-radius:var(--u-r-ctl); font: inherit; color: var(--u-text); }
#partslist .pl-empty { color: var(--u-text-faint); font-size:var(--u-fs-body); padding: 14px 2px; text-align: center; }
#partslist button { height: 28px; padding: 0 9px; font-size:var(--u-fs-body); border: 1px solid var(--u-border);
  border-radius:var(--u-r-ctl); background: var(--u-surface); cursor: pointer; }
#partslist button:hover { background: var(--u-surface-mute); }
#partslist .pl-del { color: var(--u-text-faint); padding: 0 7px; }
/* ⚠ 지움은 되돌릴 수 없다 — 마우스를 올렸을 때 빨갛게 해서 «무거운 단추»임을 알린다 */
#partslist .pl-del:hover { color: #e5231b; border-color: #f0b6b2; background: #fdf2f1; }
#partslist .pl-foot { display: flex; justify-content: flex-end; gap: 6px;
  border-top: 1px solid var(--u-border-card); margin-top: 10px; padding-top: 9px; }
#partslist .pl-add { margin-right: auto; font-weight: 700;
  border-color: var(--u-border); background: var(--u-surface-mute); }
#partslist .pl-add:hover { background: var(--u-surface-mute); }
@media print { #partslist { display: none !important; } }

/* 열 너비 수치 말풍선 (2026-09-01 SKY: "행열의 너비 수치를 알고 싶어.")
   ⛔ 종이 안에 두지 않는다 — 편집층의 글자 번호 셈에 끼어든다(P9). body 에 띄운다.
   ⚠ 손끝 «위»에 뜬다(translate 로 위로 올린다) — 손가락·마우스에 가리지 않게. */
#colsize { position: fixed; z-index: 70; transform: translate(-50%, -100%);
  background: var(--u-text-strong); color: #fff; border-radius: var(--u-r-badge);
  padding: 3px 8px; font: 600 var(--u-fs-small) 'IBM Plex Mono', Consolas, monospace;
  white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .1s ease; }
#colsize.on { opacity: 1; }
@media print { #colsize { display: none !important; } }

/* ── 도구 단추의 호버·눌림 — CP 관리시스템과 같게 (2026-09-01 SKY) ──────────────
   근거: _디자인_기준.md §0 「클릭 가능한 것은 호버 시 lift(translateY(-2px)) + 그림자」
   ⛔ 리본 단추(.tb)에는 걸지 않는다 — 58×44px 이 촘촘히 붙은 격자라, 하나가 들리면
      옆 것들과 어긋나 «리본이 흔들리는» 것처럼 보인다. 리본은 배경으로만 알린다.
   ⚠ 눌림은 lift 를 되돌린다 — 들렸다가 눌리는 것이 «손에 닿는» 느낌을 준다. */
.side-btns button, #docinfo .di-foot button, #partslist .pl-foot button,
#prefpick .pp-foot button {
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.side-btns button:hover:not(:disabled), #docinfo .di-foot button:hover:not(:disabled),
#partslist .pl-foot button:hover:not(:disabled), #prefpick .pp-foot button:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(17, 24, 39, .10);
}
.side-btns button:active:not(:disabled), #docinfo .di-foot button:active:not(:disabled),
#partslist .pl-foot button:active:not(:disabled), #prefpick .pp-foot button:active:not(:disabled) {
  transform: translateY(0);
  box-shadow: 0 1px 2px rgba(17, 24, 39, .10);
}
/* ⚠ 「움직임 줄이기」를 켠 기기에서는 들지 않는다 — 어지럼을 겪는 사람이 있다 */
@media (prefers-reduced-motion: reduce) {
  .side-btns button, #docinfo .di-foot button, #partslist .pl-foot button,
  #prefpick .pp-foot button { transition: none; }
  .side-btns button:hover, #docinfo .di-foot button:hover,
  #partslist .pl-foot button:hover, #prefpick .pp-foot button:hover { transform: none; }
}

/* 부품 목록에서 온 값(기둥 3) — 「이 글자는 목록이 관리한다」를 아주 조용히 알린다.
   ⛔ 인쇄에는 안 나온다. 제출 서류에 화면 표시가 찍히면 안 된다.
   ⚠ 밑줄(u 서식)과 헷갈리지 않게 «점선»으로, 색도 옅게 둔다. */
.pref { text-decoration: underline dotted rgba(28, 30, 36, .28);
  text-underline-offset: 2.5px; text-decoration-thickness: 1px; }
/* 가리키는 부품이 목록에서 사라졌다 — ⛔ 조용히 두면 개정번호를 고쳐도 이 칸만 안 바뀐다.
   설계서 §7: "빨갛게 표시하고 목록으로 안내한다(조용히 빈칸이 되면 안 된다)". */
.pref-x { text-decoration: underline wavy #e5231b;
  text-underline-offset: 2.5px; text-decoration-thickness: 1px; }
@media print { .pref, .pref-x { text-decoration: none !important; } }

/* 「부품 값 넣기」 고르기 창 (기둥 3) — 부품 목록 창과 같은 계열, 더 좁다.
   ⚠ 종이를 덜 가리도록 화면 위쪽 가운데에 둔다(문서 정보 창과 같은 자리). */
#prefpick { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 60;
  background: var(--u-surface); border: 1px solid var(--u-border); border-radius:var(--u-r-card); padding: 12px 14px;
  box-shadow: 0 8px 30px rgba(28, 30, 36, .18); font-size:var(--u-fs-body);
  width: 460px; max-width: calc(100vw - 24px); }
#prefpick .pp-ttl { display: flex; align-items: center; justify-content: space-between;
  font-weight: 800; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--u-border-card); }
#prefpick .pp-x { border: 0; background: none; cursor: pointer; color: var(--u-text-faint);
  font-size:var(--u-fs-body); line-height: 1; padding: 2px 4px; }
#prefpick .pp-x:hover { color: var(--u-text); }
#prefpick .pp-note { color: var(--u-text-sub); font-size:var(--u-fs-small); line-height: 1.5; margin: 0 0 9px; }
#prefpick .pp-body { max-height: 46vh; overflow-y: auto; overflow-x: hidden; }
#prefpick .pp-row { display: flex; align-items: center; gap: 8px; padding: 4px 0;
  border-bottom: 1px solid var(--u-border-card); }
#prefpick .pp-nm { flex: 1; min-width: 0; font-weight: 700;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#prefpick .pp-btns { display: flex; gap: 4px; }
#prefpick button { height: 26px; padding: 0 8px; font-size:var(--u-fs-small); border: 1px solid var(--u-border);
  border-radius:var(--u-r-ctl); background: var(--u-surface); cursor: pointer; }
#prefpick button:hover:not(:disabled) { background: var(--u-surface-mute); }
#prefpick button:disabled { opacity: .35; cursor: default; }
#prefpick .pp-foot { display: flex; justify-content: flex-end; gap: 6px;
  border-top: 1px solid var(--u-border-card); margin-top: 10px; padding-top: 9px; }
#prefpick .pp-off { margin-right: auto; color: var(--u-text-faint); }
#prefpick .pp-off:hover { color: #e5231b; border-color: #f0b6b2; background: #fdf2f1; }
@media print { #prefpick { display: none !important; } }

/* 판별 값 창 (2026-09-01 SKY) — 한 칸이 판마다 어떤 값인지 모아 보고 그 자리에서 고친다.
   판 관리 창과 같은 계열의 작은 카드다. body 에 살아서 종이가 다시 그려져도 안 흔들린다.
   ⚠ z-index 는 관리 창(60)과 같은 층 — 둘이 동시에 뜰 일이 없다(입구가 다르다). */
/* ⚠ 폭이 264px 인 까닭: 이 창은 «종이 왼쪽 빈 자리»에 선다(2026-09-01 SKY). 그 자리는
   PC 1600 에서 사이드바 오른쪽 250 ~ 종이 왼쪽 528 = 278px 뿐이다[실측]. 더 넓게 만들면
   종이를 덮는다. 그래서 이름 칸을 줄이고 단추 글자를 짧게(「판별」·「공통」) 했다. */
#vvals { position: fixed; top: 90px; left: 8px; z-index: 60;
  background: var(--u-surface); border: 1px solid var(--u-border); border-radius:var(--u-r-card); padding: 11px 12px;
  box-shadow: 0 8px 30px rgba(28, 30, 36, .18); font-size:var(--u-fs-body); width: 264px; }
#vvals .vv-ttl { display: flex; align-items: center; justify-content: space-between;
  font-weight: 800; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--u-border-card); }
#vvals .vv-x { border: 0; background: none; cursor: pointer; color: var(--u-text-faint);
  font-size:var(--u-fs-body); line-height: 1; padding: 2px 4px; }
#vvals .vv-x:hover { color: var(--u-text); }
#vvals .vv-note { color: var(--point); font-size:var(--u-fs-small); line-height: 1.45; margin: 2px 0 8px; }
/* 한 줄: [색점] 이름(60px) [값 칸 — 남는 자리 전부] [단추] */
#vvals .vv-row { display: grid; grid-template-columns: 9px 44px 1fr auto;
  align-items: center; gap: 6px; padding: 3px 0; }
#vvals .vv-row .dot { width: 9px; height: 9px; border-radius: 50%; background: #8a8e98; }
#vvals .vv-row .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#vvals .vv-row input { min-width: 0; width: 100%; height: 28px; padding: 0 6px;
  border: 1px solid var(--u-border); border-radius:var(--u-r-ctl); font: inherit; color: var(--u-text); }
#vvals .vv-row input:disabled { background: var(--u-surface-soft); color: var(--u-text-faint); }
#vvals .vv-same { color: var(--u-text-faint); font-size:var(--u-fs-small); }
#vvals .vv-row button, #vvals .vv-foot button { height: 28px; padding: 0 7px; font-size:var(--u-fs-small);
  white-space: nowrap;
  border: 1px solid var(--u-border); border-radius:var(--u-r-ctl); background: var(--u-surface); cursor: pointer; }
#vvals .vv-row button:hover, #vvals .vv-foot button:hover { background: var(--u-surface-mute); }
#vvals .vv-row button:disabled, #vvals .vv-foot button:disabled { opacity: .4; cursor: default; }
#vvals .vv-foot { display: flex; gap: 6px; justify-content: flex-end;
  border-top: 1px solid var(--u-border-card); margin-top: 9px; padding-top: 9px; }
@media print { #vvals { display: none !important; } }

/* 「보일 판」 고르기 팝업 (설계 §4-4) — 판 관리 창(60) «위»에 뜬다(61). 목록이 동적이라 JS 로 만든다 */
/* ⭐ 2026-09-01 SKY: "보일판, 행 보일 버튼 눌러서 뜨는 팝업창도 보기좋게 양식 변경."
   → 다른 창(머리글·부품 목록·판별 값)과 «같은 양식»이다: 제목줄 + ✕ · 한 줄 설명 ·
     목록 · 아래 단추. 사람이 창마다 다른 규칙을 익힐 필요가 없다. */
#vpick { position: fixed; top: 130px; left: 50%; transform: translateX(-50%); z-index: 61;
  background: var(--u-surface); border: 1px solid var(--u-border);
  border-radius:var(--u-r-card); padding: 12px 14px;
  box-shadow: 0 8px 30px rgba(28, 30, 36, .18); font-size:var(--u-fs-body);
  width: 300px; max-width: calc(100vw - 24px); }
#vpick .vp-ttl { display: flex; align-items: center; justify-content: space-between;
  font-weight: 800; padding-bottom: 8px; margin-bottom: 6px;
  border-bottom: 1px solid var(--u-border-card); }
#vpick .vp-x { border: 0; background: none; cursor: pointer; color: var(--u-text-faint);
  font-size:var(--u-fs-body); line-height: 1; padding: 2px 4px; }
#vpick .vp-x:hover { color: var(--u-text); }
#vpick .vp-note { color: var(--u-text-sub); font-size:var(--u-fs-small); line-height: 1.5;
  margin: 0 0 9px; }
/* 판이 많아지면 목록만 스크롤한다 — 제목과 아래 단추는 늘 보인다 */
#vpick .vp-body { max-height: 44vh; overflow-y: auto; }
#vpick .vp-row { display: flex; align-items: center; gap: 7px; padding: 4px 2px;
  cursor: pointer; border-radius: var(--u-r-ctl); }
#vpick .vp-row:hover { background: var(--u-surface-mute); }
/* 판 색 점 — 판 바의 칩·이름표와 같은 색이라 «어느 판인지»가 눈으로 이어진다 */
#vpick .vp-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
#vpick .vp-nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
#vpick .vp-foot { display: flex; justify-content: flex-end; gap: 6px;
  border-top: 1px solid var(--u-border-card); margin-top: 10px; padding-top: 9px; }
#vpick button { height: 28px; padding: 0 9px; font-size:var(--u-fs-body);
  border: 1px solid var(--u-border); border-radius: var(--u-r-ctl);
  background: var(--u-surface); cursor: pointer; }
#vpick button:hover { background: var(--u-surface-mute); }
/* 「모두」 는 왼쪽 끝 — 오른쪽 끝은 「취소」 자리라 손에 익은 자리를 바꾸지 않는다 */
#vpick .vp-all { margin-right: auto; color: var(--u-text-sub); }
#vpick .vp-ok { font-weight: 700; border-color: #c9ced8; background: var(--u-surface-mute); }
@media print {
  #vbar { display: none; }
  #vmgr { display: none; }
  #vpick { display: none; }
  .blk.vlim { box-shadow: none; }
  .blk.vlim::before { content: none; }
  .vtags { display: none; }
  /* 인쇄에서는 종이가 다시 내용을 가둔다 — 표지가 없으니 밖으로 나갈 것도 없다 */
  #pages.vall .page { overflow: hidden; }
  tr.vlim td:first-child { box-shadow: none; }
  td.vcell::after { content: none; }
}

</style>
</head>
<body>
<noscript><div class="nojs">⚠ 여기서는 이 프로그램이 동작하지 않습니다 (구글드라이브 미리보기는 스크립트를 막습니다).
