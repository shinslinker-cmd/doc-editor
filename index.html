const NEED_DIR = '먼저 왼쪽 위 「📁 문서 폴더 열기」를 눌러 폴더를 고르세요 — 그 안에 「서류」 폴더가 생기고 문서가 거기 저장됩니다';
const dirLabel = (h) => '폴더: ' + h.name + (h.name === '서류' ? '' : ' ▸ 서류');

async function refreshList() {
  const box = document.getElementById('doclist');
  box.textContent = '';
  if (!state.dir) return;
  for (const name of await listDocs(state.dir)) {
    // ⚠ <a> 가 아니라 <button> 이다 — href 없는 <a> 는 태블릿 크롬이 «그냥 글»로 봐서
    //    글자를 탭하면 «탭해서 검색» 사전 상자가 화면 아래에 떴다(2026-09-01 SKY 실기기).
    const a = document.createElement('button');
    a.type = 'button';
    a.textContent = name.replace(DOC_EXT, '');
    a.className = name === state.name ? 'on' : '';
    // ⛔ 실패를 조용히 삼키면 «눌러도 아무 일 없음» 이 된다 — 판 5 문서를 옛 프로그램으로 열면
    //    deserialize 가 «더 새로운 판…프로그램을 새로 받아야 한다» 로 거부하고, 파일이 깨져도
    //    여기서 터진다. 둘 다 사람 눈에는 «목록을 눌렀는데 반응이 없다» 로만 보인다.
    //    그래서 openFileHandle 과 똑같이 감싸고 똑같은 문구로 알린다.
    a.addEventListener('click', async () => {
      try {
        state.doc = deserialize(await readDoc(state.dir, name));
        state.name = name;
        state.view = null;              // 다른 문서다 — 앞 문서의 판 보기는 버린다
        state.fileHandle = null;        // 폴더의 문서를 열었다 — 파일 하나 연결은 푼다
        history.push(state.doc.blocks, null, state.doc.variants);
        draw();
        vbarApi.refresh();            // 다른 문서다 — 판 바를 이 문서의 판으로 갈아 끼운다
        resyncParts();                // 부품 목록에 맞춘다(Task 4) — 바뀐 것이 없으면 조용하다
        refreshList();
      } catch (e) { msg('문서를 열지 못했다: ' + e.message); toastErr('문서를 열지 못했습니다 — ' + e.message); }
    });
    box.appendChild(a);
  }
}

// ⭐ 다시 맞추기 (기둥 3 Task 4) — 「안전관리 부품 목록」의 값으로 이 문서의 글자를 맞춘다.
//    2026-09-01 SKY 결정: "문서를 열 때 자동으로 맞추고 «몇 칸 바뀌었다»고 알린다."
//
// ⛔ 이 프로젝트에서 가장 위험한 자리다 — 여러 칸의 글자를 한꺼번에 갈아 끼운다. 그래서
//    ① 조용히 안 한다(몇 칸이 바뀌었는지 반드시 알린다)
//    ② 되돌릴 수 있다(applyDoc 을 거치므로 Ctrl+Z 한 번으로 전부 돌아간다)
//    ③ 깨진 참조는 글자를 안 건드리고 «몇 곳이 깨졌다»고만 알린다(빈칸으로 만들지 않는다)
// ⚠ 바뀐 것이 없으면 아무 말도 안 하고 문서도 안 건드린다 — 문서를 열 때마다 알림이
//   뜨면 알림 자체가 무시된다.
// ⛔ 최상위 이름 resyncParts 는 이 파일만 쓴다.
function resyncParts() {
  const r = syncDoc(state.doc, state.parts);
  if (r.doc !== state.doc) {
    applyDoc(r.doc);
    draw();
  }
  if (r.changed.length) {
    const 첫 = r.changed[0];
    toast('부품 목록에 맞춰 ' + r.changed.length + '곳을 고쳤습니다'
      + ' (예: ' + 첫.from + ' → ' + 첫.to + ') — Ctrl+Z 로 되돌립니다');
  }
  if (r.broken.length) {
    // ⛔ 조용히 두면 개정번호를 고쳐도 그 칸만 안 바뀌는데 아무도 모른다(설계서 §7)
    toastErr(r.broken.length + '곳이 목록에 없는 부품을 가리킵니다 — 빨간 물결로 표시했습니다');
  }
  return r;
}

async function useDir(handle) {
  state.dir = handle;
  await rememberDir(handle);
  msg(dirLabel(handle));
  toast('문서 폴더를 열었습니다 — ' + handle.name);
  // 부품 목록(기둥 3)은 «폴더»에 산다 — 폴더를 열 때 함께 읽는다.
  // ⚠ 없으면 빈 목록이다. 목록이 없다고 서류를 못 여는 일은 없어야 한다.
  state.parts = readParts(await loadPartsFile(handle));
  resyncParts();                      // 이제 목록을 알았다 — 열려 있던 문서를 맞춘다
  await refreshList();
}

document.getElementById('btn-folder').addEventListener('click', async () => {
  try {
    // ① 기억해 둔 폴더가 있으면 먼저 그것으로 이어 본다 — 버튼 한 번이면 폴더 창이 안 뜬다.
    //    (버튼을 누른 «이 순간» 이 브라우저가 허락을 물어봐 주는 유일한 때다)
    if (!state.dir) {
      const saved = await recallDir();
      if (saved && await dirPermission(saved, true) === 'granted') { await useDir(saved); return; }
      if (saved) await forgetDir();                // 사람이 거절했거나 폴더가 없어졌다
    }
    state.dir = await pickFolder();
    await useDir(state.dir);
  } catch (e) {
    if (e && e.name === 'AbortError') return;      // 사람이 취소한 것 — 오류가 아니다
    msg('폴더를 열지 못했다: ' + e.message);
  }
});

// 열자마자 — 지난 폴더의 권한이 아직 살아 있으면 아무것도 안 눌러도 그대로 이어진다
(async () => {
  const saved = await recallDir();
  if (!saved) return;
  try {
    if (await dirPermission(saved, false) === 'granted') { await useDir(saved); return; }
    msg('지난 폴더 「' + saved.name + '」로 이어가려면 「📁 문서 폴더 열기」를 한 번 누르세요');
  } catch (e) { /* 폴더가 없어졌으면 그냥 새로 고르면 된다 */ }
})();

// ── 지금 쓰는 «판»과 새 판 알림 (2026-08-30 SKY) ──
// ⛔ PC 에 «설치한 앱»은 옛 파일을 캐시로 붙들고 있을 수 있다 — 그러면 새로 배포해도
//    화면이 안 바뀌어서 «고친 게 반영이 안 됐다»로 보인다(2026-08-30 실측).
//    그래서 ⓐ 지금 쓰는 판을 늘 보여 주고 ⓑ 새 판이 올라오면 눌러서 새로고침하게 한다.
// ⚠ 파일(file://)로 열면 version.json 을 못 읽는다 — 그때는 판만 보여 주고 조용히 만다.
const BUILD = typeof window.__BUILD === 'string' ? window.__BUILD : '';
const verEl = document.getElementById('ver');
if (verEl) verEl.textContent = BUILD ? '판 ' + BUILD : '';

async function checkNewBuild() {
  if (!verEl || !BUILD || location.protocol === 'file:') return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !j.build || j.build === BUILD) return;
    verEl.className = 'new';
    verEl.textContent = '새 버전이 있습니다 — 눌러서 받기';
    verEl.title = '지금 ' + BUILD + ' → 새 판 ' + j.build;
    verEl.onclick = () => location.reload(true);
  } catch (e) { /* 인터넷이 없으면 그냥 지금 것을 쓴다 */ }
}
checkNewBuild();
setInterval(checkNewBuild, 5 * 60 * 1000);   // 5분마다 조용히 살펴본다

// ── 탐색기에서 .sdoc 을 눌러 이 앱으로 열리는 길 (2026-08-30 SKY) ──
// 브라우저에 «설치»된 앱만 파일을 넘겨받을 수 있다(manifest 의 file_handlers).
// 넘어오는 것은 경로가 아니라 «파일 손잡이»라, 그대로 읽고 그 파일에 되저장할 수 있다.
// ⚠ 이 길로 연 문서는 폴더 목록과 무관하다 — 저장은 그 파일 자체에 한다.
state.fileHandle = null;

async function openFileHandle(fh) {
  try {
    const text = await (await fh.getFile()).text();
    state.doc = deserialize(text);
    state.fileHandle = fh;
    state.name = fh.name;
    state.view = null;                  // 다른 문서다 — 앞 문서의 판 보기는 버린다
    history.push(state.doc.blocks, null, state.doc.variants);
    draw();
    vbarApi.refresh();                // 다른 문서다 — 판 바를 이 문서의 판으로 갈아 끼운다
    msg('파일: ' + fh.name);
    toast('문서를 열었습니다 — ' + fh.name);
    resyncParts();                    // 부품 목록에 맞춘다(Task 4)
    refreshList();
  } catch (e) { msg('문서를 열지 못했다: ' + e.message); toastErr('문서를 열지 못했습니다 — ' + e.message); }
}

if ('launchQueue' in window && 'files' in LaunchParams.prototype) {
  window.launchQueue.setConsumer(async (params) => {
    if (!params || !params.files || !params.files.length) return;
    await openFileHandle(params.files[0]);
  });
}

// ⭐ 저장은 «한 곳»에만 적는다 — 사이드바 「저장」과 「머리글 및 바닥글」 창의 저장이
//    같은 일을 해야 한다(2026-09-01 SKY: "머리글 및 바닥글 내부에도 저장 버튼을 만들자").
//    둘로 베껴 두면 한쪽만 고쳐져서, 어느 단추로 저장했느냐에 따라 결과가 달라진다.
// ⛔ 최상위 이름 saveNow 는 이 파일만 쓴다 — 빌드가 모듈을 한 덩어리로 합치므로
//    같은 이름이 둘이면 화면이 통째로 안 뜬다.
async function saveNow() {
  // 탐색기에서 .sdoc 을 눌러 연 문서는 «그 파일»에 되저장한다 — 폴더가 없어도 된다
  if (state.fileHandle) {
    try {
      if (state.fileHandle.requestPermission
          && await state.fileHandle.requestPermission({ mode: 'readwrite' }) !== 'granted') {
        msg('저장 권한을 받지 못했다'); return;
      }
      const w = await state.fileHandle.createWritable();
      await w.write(serializeSwept());
      await w.close();
      msg('저장함: ' + state.fileHandle.name);
      toast('저장했습니다 — ' + state.fileHandle.name);
    } catch (e) { msg('저장하지 못했다: ' + e.message); toastErr('저장하지 못했습니다 — ' + e.message); }
    return;
  }
  if (!state.dir) { msg(NEED_DIR); return; }
  const name = state.name || ((state.doc.meta.title || '새 문서') + DOC_EXT);
  try {
    await writeDoc(state.dir, name, serializeSwept());
    state.name = name;
    msg('저장함: ' + name);
    toast('저장했습니다 — ' + name);
    await refreshList();
  } catch (e) { msg('저장하지 못했다: ' + e.message); toastErr('저장하지 못했습니다 — ' + e.message); }
}

document.getElementById('btn-save').addEventListener('click', saveNow);

// 새 문서 — 빈 문단 하나로 시작한다. 저장 전에는 파일이 없다(워드와 같다).
document.getElementById('btn-new').addEventListener('click', () => {
  // ⭐ 로고·회사·분류는 «거의 안 바뀌는 것»이라 이 기기의 기본값을 물려받는다
  //    (2026-09-01 SKY: "머리글이나 바닥글에 로고라던가 회사명 같은건 거이 고정으로 쓴단말야").
  //    「머리글 및 바닥글」 창의 「기본으로」 단추가 그 값을 기억시킨다.
  state.doc = createDocument(readHeaderDefaults());
  state.name = null;
  state.view = null;                    // 새 문서다 — 앞 문서의 판 보기는 버린다
  state.fileHandle = null;
  history.push(state.doc.blocks, null, state.doc.variants);
  draw({ caretId: state.doc.blocks[0].id });
  vbarApi.refresh();                  // 새 문서는 판이 없다 — 판 바가 사라진다
  refreshList();
  msg('새 문서 — 저장하면 파일이 생깁니다');
  toast('새 문서를 만들었습니다');
});

// 다른 이름으로 저장 — 지금 열린 폴더에 새 파일을 만든다(R15).
// 같은 이름이 이미 있으면 물어본다 — 다른 문서가 조용히 사라지면 안 된다(데이터 안전).
document.getElementById('btn-saveas').addEventListener('click', async () => {
  if (!state.dir) { msg(NEED_DIR); return; }
  const cur = (state.name || ((state.doc.meta.title || '새 문서') + DOC_EXT)).replace(DOC_EXT, '');
  const input = window.prompt('다른 이름으로 저장 — 새 파일 이름:', cur);
  if (input === null) return;                                    // 사람이 취소한 것
  const name = input.trim().replace(/[\\/:*?"<>|]/g, '').replace(DOC_EXT, '');
  if (!name) { msg('이름이 비었습니다'); toastErr('이름이 비었습니다'); return; }
  const full = name + DOC_EXT;
  try {
    // ⛔ 이미 있으면 «편집 중인 그 파일이라도» 물어본다(워드와 같다) — 다른 문서가 조용히
    //   사라지는 것을 막는 자리다. 한글 이름은 docExists 가 NFC 로 맞춰 비교한다.
    if (await docExists(state.dir, full)
        && !window.confirm('「' + name + '」 문서가 이미 있습니다. 덮어쓸까요?')) return;
    await writeDoc(state.dir, full, serializeSwept());
    state.name = full;
    state.fileHandle = null;          // 이제 폴더의 이 파일이 «지금 문서»다
    msg('저장함: ' + full);
    toast('저장했습니다 — ' + full);
    await refreshList();
  } catch (e) { msg('저장하지 못했다: ' + e.message); toastErr('저장하지 못했습니다 — ' + e.message); }
});

if (!isSupported()) msg('⚠ 이 브라우저는 폴더 열기를 지원하지 않는다. 크롬·엣지로 열어야 한다');

// 「PDF 저장」 — 파일 이름을 미리 제안하고, 판이 있는 문서는 무엇을 뽑을지 가른다(설계_판.md §5-2).
document.getElementById('btn-pdf').addEventListener('click', () => {
  const mainEl = document.getElementById('main');
  const name = state.name ? state.name.replace(DOC_EXT, '') : (state.doc.meta.title || '문서');
  const defs = state.doc.variants || [];
  if (!defs.length) { printDoc(mainEl, name); return; }
  if (state.view) {
    const v = defs.find(x => x.id === state.view);
    printDoc(mainEl, name + '_' + (v ? v.name : ''));
    return;
  }
  // 전체보기 + 판 있는 문서 — 전체보기 화면은 «판을 견주어 보는 화면»이지 인쇄물이 아니다
  // (판마다 다른 블록이 전부 겹쳐 나와 어느 판도 아닌 종이가 된다).
  // ⛔ 「판별 PDF」(전부 한 번에)는 2026-09-01 SKY 지시로 뺐다 — 한 판씩 골라 뽑는다.
  window.alert('전체보기는 판을 견주어 보는 화면이라 그대로 인쇄하면 판이 뒤섞입니다.\n'
    + '위 판 바에서 판을 하나 고른 뒤 「PDF 저장」을 누르세요 '
    + '— 파일 이름이 「문서명_판이름」으로 나옵니다.');
});

})();
</script>
</body></html>
