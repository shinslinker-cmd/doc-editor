    } else {                                        // 보통 블록 — 그 «아래»에 굵은 줄
      mark.className = '';
      mark.style.left = ((r.left - pr.left) / k) + 'px';
      mark.style.top = ((r.bottom - pr.top) / k - 1) + 'px';
      mark.style.width = (r.width / k) + 'px';
      mark.style.height = '';
    }
    if (!mark.parentNode) pagesEl.appendChild(mark);
  }

  pagesEl.addEventListener('dragover', (e) => {
    if (moving) {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      showMark(e.clientX, e.clientY);
      return;
    }
    const ts = e.dataTransfer ? Array.from(e.dataTransfer.types) : [];
    if (ts.indexOf('Files') >= 0) e.preventDefault();
  });
  pagesEl.addEventListener('drop', (e) => {
    hideMark();
    if (moving) {
      e.preventDefault();
      const mv = moving;
      moving = null;
      moveTo(mv, e.clientX, e.clientY);
      return;
    }
    const files = e.dataTransfer && e.dataTransfer.files;
    if (!files || !files.length) return;
    e.preventDefault();
    if (document.caretRangeFromPoint) {
      const r = document.caretRangeFromPoint(e.clientX, e.clientY);
      if (r) {
        const s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
      }
    }
    insertFiles(files);
  });

  // ── 그림 고르기 + 크기 손잡이 (Task 10) ──
  // ⭐ 2026-08-31: 한 장이 아니라 «목록»이다(설계_서식과우클릭.md S2).
  //   picks = 고른 순서, 맨 뒤가 «기준»(picked) — 손잡이·자르기·서식 창의 현재 값이 기준 것이다.
  let picks = [];
  let picked = null;   // = picks 의 마지막. 다시 그리면 DOM 이 없어지므로 isConnected 로 확인
  const pickCbs = [];
  const ui = document.createElement('div');
  ui.id = 'imgui';
  ui.setAttribute('contenteditable', 'false');
  for (const c of ['nw', 'ne', 'sw', 'se']) {
    const hd = document.createElement('div');
    hd.className = 'imgh';
    hd.dataset.c = c;
    ui.appendChild(hd);
  }

  // ⭐ 선택 네모·크기의 «기준»은 눈에 보이는 네모다. 자른 그림은 감싸개(.iclip)가 그것이고
  //   안쪽 img 는 원본 전체를 배율로 키운 것이라 훨씬 크다 — img 로 재면 손잡이가
  //   그림 밖 엉뚱한 데 붙는다(설계_서식과우클릭.md §4-3).
  function dispBoxOf(img) { return (img && img.closest && img.closest('.iclip')) || img; }
  function dispWOf(img) { return Number(img.dataset.dw) || img.width; }
  function dispHOf(img) { return Number(img.dataset.dh) || img.height; }
  function cropOf(img) {
    if (!img.dataset.crop) return null;
    const p = img.dataset.crop.split(',').map(Number);
    if (p.length !== 4 || !p.every(n => Number.isFinite(n))) return null;
    return { x: p[0], y: p[1], w: p[2], h: p[3] };
  }

  // 끄는 동안 «화면만» 표시 폭을 바꾼다 — 모델은 pointerup 에서 한 번만 기록한다.
  // 자른 그림은 감싸개와 안쪽 원본을 함께 다시 계산해야 잘린 자리가 안 어긋난다.
  function setDispW(img, w) {
    const a = getDoc().assets[img.dataset.img];
    if (!a) return;
    const crop = cropOf(img);
    const h = dispHeight(w, { crop }, a);
    img.dataset.dw = String(w);
    img.dataset.dh = String(h);
    const box = img.closest('.iclip');
    if (!box) { img.width = w; img.height = h; return; }
    const c = clipLayout(w, { crop }, a);
    box.style.width = w + 'px';
    box.style.height = h + 'px';
    img.width = c.iw;
    img.height = c.ih;
    img.style.marginLeft = c.ml + 'px';
    img.style.marginTop = c.mt + 'px';
  }

  // #main 이 확대(transform)돼 있어도 맞도록 화면 좌표를 입력판 눈금으로 바꾼다
  function place() {
    if (!picked || !picked.isConnected) return;
    const pr = pagesEl.getBoundingClientRect();
    const ir = dispBoxOf(picked).getBoundingClientRect();
    const k = pr.width / pagesEl.offsetWidth;   // 확대 배율
    ui.style.left = ((ir.left - pr.left) / k) + 'px';
    ui.style.top = ((ir.top - pr.top) / k) + 'px';
    ui.style.width = (ir.width / k) + 'px';
    ui.style.height = (ir.height / k) + 'px';
  }
  // 다시 그려져 DOM 이 사라진 그림을 목록에서 뺀다 — 기준도 함께 다시 잡는다
  function alive() {
    const live = picks.filter(el => el.isConnected);
    if (live.length !== picks.length) picks = live;
    picked = picks[picks.length - 1] || null;
    return picks;
  }
  function pickedImgs() { alive(); return picks.slice(); }
  function onPick(cb) { if (typeof cb === 'function') pickCbs.push(cb); }
  function firePick() {
    for (const cb of pickCbs) {
      try { cb(); } catch (err) { console.warn('선택 알림 처리기 오류:', err.message); }
    }
  }
  // 기준 그림만 진한 테두리 — 손잡이가 어디 붙는지 눈으로 알아야 한다
  function markBase() {
    for (const el of picks) {
      if (!el.isConnected) continue;
      el.classList.add('imgsel');
      if (el === picked) el.classList.add('imgbase');
      else el.classList.remove('imgbase');
    }
  }
  function deselect() {
    for (const el of picks) {
      if (!el.isConnected) continue;
      el.classList.remove('imgsel');
      el.classList.remove('imgbase');
    }
    picks = [];
    picked = null;
    if (ui.parentNode) ui.parentNode.removeChild(ui);
    firePick();
  }
  // add = Ctrl/⌘+클릭. 이미 고른 그림을 Ctrl+클릭하면 «뺀다»(워드·탐색기와 같다).
  function selectImg(img, add) {
    if (!img) return;
    if (!add) {
      for (const el of picks) {
        if (el.isConnected && el !== img) { el.classList.remove('imgsel'); el.classList.remove('imgbase'); }
      }
      picks = picks.includes(img) ? [img] : [];
    } else if (picks.includes(img)) {
      picks = picks.filter(el => el !== img);
      img.classList.remove('imgsel');
      img.classList.remove('imgbase');
      picked = picks[picks.length - 1] || null;
      if (!picked) { if (ui.parentNode) ui.parentNode.removeChild(ui); }
      else { markBase(); place(); }
      firePick();
      return;
    }
    if (!picks.includes(img)) picks.push(img);
    picked = img;
    markBase();
    pagesEl.appendChild(ui);
    place();
    firePick();
  }

  pagesEl.addEventListener('click', (e) => {
    const t = e.target;
    const add = e.ctrlKey || e.metaKey;
    if (t && t.matches && t.matches('img.ri, img.bimg')) { selectImg(t, add); return; }
    // 자른 그림은 감싸개가 위를 덮는 수가 있다 — 감싸개를 눌러도 안쪽 그림을 고른다
    const ic = t && t.closest && t.closest('.iclip');
    if (ic) { const im = ic.querySelector('img'); if (im) { selectImg(im, add); return; } }
    if (!(t && t.closest && t.closest('#imgui'))) deselect();
  });
  document.addEventListener('selectionchange', () => {
    if (!picks.length) return;
    const n = picks.length;
    alive();
    if (!picks.length) deselect();                          // 전부 다시 그려져 사라졌다
    else if (picks.length !== n) { markBase(); place(); firePick(); }
  });

  // 고른 그림의 모델 좌표를 찾는다 → { kind:'block', b } 또는 { kind:'run', b, cell|item|cap, pos }
  function targetOf(el) {
    if (!el || !el.isConnected) return null;
    const blkEl = el.closest('.blk[data-id]');
    if (!blkEl) return null;
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === blkEl.dataset.id);
    if (!b) return null;
    if (el.classList.contains('bimg')) return { kind: 'block', b };
    const td = el.closest('td[data-r]');
    const li = el.closest('.lst li[data-i]');
    const cap = el.closest('.blk-image .cap');
    const host = td || li || cap || blkEl;
    const parent = el.parentNode;
    const idx = Array.prototype.indexOf.call(parent.childNodes, el);
    const pos = offsetIn(host, parent, idx);
    return { kind: 'run', b, pos,
      cell: td ? [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)] : null,
      item: li ? Number(li.dataset.i) : null,
      cap: cap ? 1 : 0 };
  }
  function pickedTarget() { return targetOf(picked); }
  // 고른 그림 전부의 모델 좌표 — DOM 이 사라져도 안전하게 «먼저» 다 뜬다.
  // el·img(보관함 번호)를 함께 실어 두면 뒤 계산에서 화면을 다시 안 봐도 된다.
  function pickedTargets() {
    alive();
    return picks.map((el) => {
      const at = targetOf(el);
      return at ? Object.assign(at, { el, img: el.dataset.img }) : null;
    }).filter(Boolean);
  }
  // 다시 그린 화면에서 같은 자리의 그림을 찾아낸다 — 이어서 또 조절할 수 있게.
  // 토막 그림은 «글자 번호»로 찾는다(같은 칸에 그림이 여럿일 수 있다).
  function findImgAt(at) {
    if (at.kind === 'block') {
      return pagesEl.querySelector('.blk-image[data-id="' + at.b.id + '"] img.bimg');
    }
    const blkEl = pagesEl.querySelector('.blk[data-id="' + at.b.id + '"]');
    if (!blkEl) return null;
    const host = at.cell
      ? pagesEl.querySelector('.blk[data-id="' + at.b.id + '"] td[data-r="' + at.cell[0]
        + '"][data-c="' + at.cell[1] + '"]')
      : (at.cap ? blkEl.querySelector('.cap')
        : (at.item !== null && at.item !== undefined
          ? blkEl.querySelector('.lst li[data-i="' + at.item + '"]') : blkEl));
    if (!host) return null;
    for (const im of host.querySelectorAll('img')) {
      const parent = im.parentNode;
      const idx = Array.prototype.indexOf.call(parent.childNodes, im);
      if (offsetIn(host, parent, idx) === at.pos) return im;
    }
    return null;
  }
  function reselect(ats) {
    const found = (ats || []).map(findImgAt).filter(Boolean);
    deselect();
    for (const im of found) selectImg(im, true);
  }
  // 블록에 patch 를 얹는다. 값이 null 이면 그 칸을 «뗀다».
  // ⚠ replaceBlock 의 Object.assign 은 null 을 그대로 남겨 저장 파일에 "crop": null 이 낀다 —
  //   그래서 여기서 직접 만든다.
  function blockPatched(blocks, id, patch) {
    const i = blocks.findIndex(x => x.id === id);
    if (i < 0) return blocks;
    const next = Object.assign({}, blocks[i]);
    for (const k of Object.keys(patch || {})) {
      if (patch[k] === null || patch[k] === undefined) delete next[k];
      else next[k] = patch[k];
    }
    const out = blocks.slice();
    out[i] = next;
    return out;
  }
  // pos 자리의 그림 토막 자체 — crop 을 알아야 높이를 다시 잴 수 있다
  function runAtPos(runs, pos) {
    let p = 0;
    for (const r of runs || []) {
      if (r && r.img && p === pos) return r;
      p += (r && r.t ? r.t.length : 0);
    }
    return null;
  }
  // 그 그림이 놓일 수 있는 최대 표시 폭 — 표 칸이면 칸 안폭(패딩 몫 18px), 아니면 본문 폭
  function limitOf(at, b, doc) {
    if (at.kind === 'run' && at.cell) {
      return Math.max(24, ((b.cols[at.cell[1]] ? b.cols[at.cell[1]].w : 200) - 18));
    }
    return textWidth(doc);
  }
  function runsAtTarget(at) {
    if (at.cell) return cellRunsOf(at.b, at.cell);
    if (at.cap) return at.b.caption || [];
    if (at.item !== null && at.item !== undefined) return at.b.items[at.item];
    return at.b.runs;
  }
  function patchAtTarget(at, runs) {
    if (at.cell) return cellPatch(at.b, at.cell, runs);
    if (at.cap) return { caption: runs };
    if (at.item !== null && at.item !== undefined) {
      const items = at.b.items.slice();
      items[at.item] = runs;
      return { items };
    }
    return { runs };
  }

  // ── 손잡이 끌기 — 끄는 동안은 화면(img 속성)만, 놓으면 모델에 1회 기록 ──
  let rz = null;   // { startX, startW, ratio, max, dir }
  ui.addEventListener('pointerdown', (e) => {
    const hd = e.target.closest && e.target.closest('.imgh');
    if (!hd || !picked || !picked.isConnected) return;
    e.preventDefault();
    e.stopPropagation();
    const host = picked.closest('td[data-r], .lst li[data-i], .blk-image, .blk[data-id]');
    // ⚠ 시작 폭은 «보이는 폭»(data-dw)이다 — 자른 그림의 img.width 는 원본 확대 크기라
    //   그걸로 시작하면 손잡이를 잡는 순간 그림이 배율만큼 튄다.
    rz = { startX: e.clientX, startW: dispWOf(picked),
           max: Math.max(24, (host ? host.clientWidth : pagesEl.clientWidth) - 4),
           dir: (hd.dataset.c === 'nw' || hd.dataset.c === 'sw') ? -1 : 1 };
    try { hd.setPointerCapture(e.pointerId); } catch (err) { /* 합성 이벤트에는 없다 */ }
  });
  ui.addEventListener('pointermove', (e) => {
    if (!rz || !picked || !picked.isConnected) return;
    const w = Math.max(24, Math.min(rz.max, rz.startW + rz.dir * (e.clientX - rz.startX)));
    setDispW(picked, w);
    place();
  });
  ui.addEventListener('pointerup', () => {
    if (!rz || !picked || !picked.isConnected) { rz = null; return; }
    const w = dispWOf(picked);
    const h = dispHOf(picked);
    rz = null;
    // 여러 장을 골랐으면 «전부 같은 폭»으로 — 손잡이는 기준 그림에 붙어 있었을 뿐이다(설계 §3)
    if (picks.length > 1) { setPickedWidths(w); return; }
    const at = pickedTarget();
    if (!at) return;
    const doc = getDoc();
    if (at.kind === 'block') {
      setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, at.b.id, { w }) }));
    } else {
      const runs = setImgSize(runsAtTarget(at), at.pos, w, h);
      setDoc(Object.assign({}, doc, { blocks: replaceBlock(doc.blocks, at.b.id, patchAtTarget(at, runs)) }));
    }
    redraw({ keepCaret: true });
    // 다시 그린 화면에서 같은 그림을 다시 고른다 — 이어서 또 조절할 수 있게
    const again = at.kind === 'block'
      ? pagesEl.querySelector('.blk-image[data-id="' + at.b.id + '"] img.bimg')
      : null;
    if (again) selectImg(again);
  });

  // 고른 그림을 «전부» 모델에서 뺀다 — Delete·Backspace 와 잘라내기가 함께 쓴다.
  // ⭐ 한 번의 setDoc 이라 Ctrl+Z 한 번에 통째로 돌아온다(설계 §3).
  function removePicked() {
    const ats = pickedTargets();
    deselect();
    if (!ats.length) return;
    const doc = getDoc();
    let blocks = doc.blocks;
    // ① 토막 — 같은 자리(칸·항목·캡션·문단)끼리 묶어 «뒤 위치부터» 뺀다.
    //    앞에서부터 빼면 뒤 그림의 글자 번호가 밀려 엉뚱한 글자가 지워진다.
    const runTargets = ats.filter(a => a.kind === 'run');
    const keyOf = (a) => a.b.id + '|' + JSON.stringify(a.cell) + '|' + a.item + '|' + a.cap;
    const groups = new Map();
    for (const a of runTargets) {
      const k = keyOf(a);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(a);
    }
    for (const list of groups.values()) {
      list.sort((x, y) => y.pos - x.pos);
      const b = blocks.find(x => x.id === list[0].b.id);
      if (!b) continue;
      const here = Object.assign({}, list[0], { b });
      let src = runsAtTarget(here);
      if (!Array.isArray(src)) continue;
      for (const a of list) {
        src = sliceRuns(src, 0, a.pos).concat(sliceRuns(src, a.pos + 1, runsLength(src)));
      }
      // ⚠ normalizeRuns 로 감싼다 — 그냥 이으면 그림 양옆의 같은 서식이 안 합쳐져
      //   토막이 계속 늘어난다
      blocks = replaceBlock(blocks, b.id, patchAtTarget(here, normalizeRuns(src)));
    }
    // ② 블록 그림 — 문서가 통째로 비면 빈 문단 하나를 남긴다
    for (const a of ats.filter(x => x.kind === 'block')) {
      if (blocks.some(x => x.id === a.b.id)) blocks = removeBlock(blocks, a.b.id);
    }
    if (!blocks.length) blocks = [createBlock('para')];
    setDoc(Object.assign({}, doc, { blocks }));
    // 한 장만 지웠으면 그 자리에 커서를 놓는다(지금까지의 감각 그대로).
    // 여러 장이면 어디에 놓아도 엉뚱하므로 놓지 않는다.
    const one = ats.length === 1 && ats[0].kind === 'run' ? ats[0] : null;
    redraw(one ? { caret: { id: one.b.id, item: one.item, cell: one.cell, cap: one.cap, pos: one.pos } } : {});
  }

  // 고른 그림 전부를 «같은 표시 폭»으로 — 부품 사진 폭 통일이 핵심 용도(설계 §3).
  // 표 칸 안 그림은 칸 안폭이 한도다. 한 번의 setDoc = Ctrl+Z 한 번.
  function setPickedWidths(wPx) {
    const ats = pickedTargets();
    if (!ats.length) return;
    const doc = getDoc();
    let blocks = doc.blocks;
    for (const at of ats) {
      const b = blocks.find(x => x.id === at.b.id);
      const a = doc.assets[at.img];
      if (!b || !a) continue;
      const w = Math.max(24, Math.min(Math.round(wPx), limitOf(at, b, doc)));
      if (at.kind === 'block') { blocks = blockPatched(blocks, b.id, { w }); continue; }
      const here = Object.assign({}, at, { b });
      const src = runsAtTarget(here);
      if (!Array.isArray(src)) continue;
      const h = dispHeight(w, runAtPos(src, at.pos) || {}, a);
      blocks = replaceBlock(blocks, b.id, patchAtTarget(here, patchImgAt(src, at.pos, { w, h })));
    }
    setDoc(Object.assign({}, doc, { blocks }));
    redraw({});
    reselect(ats);
  }

  // 그림 서식 칸(crop·rad)을 얹는다. 값이 null 이면 그 칸을 뗀다.
  // ⚠ patch 에 w 가 있으면 토막의 h 도 함께 다시 계산해 싣는다 — 안 그러면 비율이 어긋난다.
  function patchTargets(ats, patch) {
    if (!ats.length) return;
    const doc = getDoc();
    let blocks = doc.blocks;
    for (const at of ats) {
      const b = blocks.find(x => x.id === at.b.id);
      const a = doc.assets[at.img];
      if (!b || !a) continue;
      const p = Object.assign({}, patch);
      if (p.w !== undefined && p.w !== null) {
        p.w = Math.max(24, Math.min(Math.round(p.w), limitOf(at, b, doc)));
      }
      if (at.kind === 'block') {
        delete p.h;                          // 블록은 높이를 저장하지 않는다 — 비율로 계산한다
        blocks = blockPatched(blocks, b.id, p);
        continue;
      }
      const here = Object.assign({}, at, { b });
      const src = runsAtTarget(here);
      if (!Array.isArray(src)) continue;
      const cur = runAtPos(src, at.pos) || {};
      // 자르기가 바뀌면 비율이 바뀐다 — 높이를 다시 잰다
      const next = Object.assign({}, cur);
      for (const k of Object.keys(p)) {
        if (p[k] === null || p[k] === undefined) delete next[k];
        else next[k] = p[k];
      }
      p.h = dispHeight(p.w !== undefined && p.w !== null ? p.w : (cur.w || a.w), next, a);
      blocks = replaceBlock(blocks, b.id, patchAtTarget(here, patchImgAt(src, at.pos, p)));
    }
    setDoc(Object.assign({}, doc, { blocks }));
    redraw({});
    reselect(ats);
  }
  function patchPicked(patch) { patchTargets(pickedTargets(), patch); }
  function patchBase(patch) {
    const ats = pickedTargets();
    if (ats.length) patchTargets([ats[ats.length - 1]], patch);
  }

  // ── 고른 그림 «블록»의 정렬 ──
  // ⛔ 그림 블록은 편집 불가 «통짜 섬»이라 그 안에 커서가 없다. 그래서 리본의 정렬 단추가
  //    쓰는 «커서가 있는 블록» 길로는 절대 닿지 않는다 — 그림을 골라 놓고 「가운데」를 눌러도
  //    아무 일도 안 일어났다(2026-08-31 실측). 리본이 이것을 «먼저» 물어보게 해서 잇는다.
  //    글줄 안 그림 토막은 정렬이 없다 — 그 자리는 문단 정렬이 정하므로 손대지 않는다.
  //    돌려주는 값 = «우리가 처리했다».
  function alignPicked(align) {
    const ats = pickedTargets().filter(a => a.kind === 'block');
    if (!ats.length) return false;
    patchTargets(ats, { align });
    return true;
  }

  // 서식 창이 보여 줄 «기준 그림»의 지금 값. 고른 게 없으면 null.
  function pickedInfo() {
    alive();
    if (!picked) return null;
    const at = targetOf(picked);
    const doc = getDoc();
    const a = at ? doc.assets[picked.dataset.img] : null;
    if (!at || !a) return null;
    const b = doc.blocks.find(x => x.id === at.b.id) || at.b;
    return { kind: at.kind, n: picks.length,
             w: dispWOf(picked), h: dispHOf(picked),
             rad: Number(picked.dataset.rad) || 0, crop: cropOf(picked),
             align: at.kind === 'block' ? (b.align || 'center') : null,
             maxW: limitOf(at, b, doc), asset: { w: a.w, h: a.h } };
  }

  // 자른 그림은 «잘린 모습 그대로» 구워서 담는다(설계_서식과우클릭.md §4-4) —
  // 워드·엑셀에 붙였을 때 잘리기 전 원본이 튀어나오면 안 된다.
  // ⚠ 둥근 모서리는 굽지 않는다(워드도 안 굽는다). crop 이 없으면 원본을 그대로 담는다.
  // ⚠ 그래서 밖에 나갔다 돌아온 그림은 «구워진 새 원본»이다 — 자르기 정보는 안 따라간다.
  function bakedHtml(img) {
    const a = getDoc().assets[img.dataset.img];
    if (!a) return '';
    const w = dispWOf(img) || a.w;
    const h = dispHOf(img) || a.h;
    const crop = cropOf(img);
    if (!crop) {
      return '<img src="' + a.data + '" width="' + w + '" height="' + h + '">';
    }
    try {
      const cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      cv.getContext('2d').drawImage(img, crop.x, crop.y, crop.w, crop.h, 0, 0, w, h);
      return '<img src="' + cv.toDataURL('image/png') + '" width="' + w + '" height="' + h + '">';
    } catch (err) {
      // 굽기가 막히면(그림이 아직 안 실렸다 등) 원본이라도 담는다 — 빈 클립보드보다 낫다
      console.warn('자른 그림을 굽지 못했다:', err.message);
      return '<img src="' + a.data + '" width="' + w + '" height="' + h + '">';
    }
  }

  // ⛔ 사람이 «칸에 글을 치고 있는» 중이면 그림 단축키가 끼어들면 안 된다.
  //    서식 창의 폭 칸에서 숫자를 지우려고 Backspace 를 누르면 그림이 통째로 지워지고,
  //    Ctrl+C 는 친 숫자 대신 그림을 클립보드에 담는다. 칸 안에서는 손을 뗀다.
  //    ⚠ #pages 는 그 자체가 입력판(contenteditable)이라 여기 걸리지 않는다 — 지금까지대로 돈다.
  function inField(el) {
    return !!(el && el.closest && el.closest('input, textarea, select'));
  }

  // 고른 그림을 클립보드에 담는다. 담을 게 없으면 거짓.
  // 여러 장이면 <img> 를 이어 담는다 — 워드·엑셀에 나란히 붙는다.
  function putPickedOnClipboard(e) {
    alive();
    if (!picks.length) return false;
    if (inField(e.target) || inField(document.activeElement)) return false;
    const s2 = window.getSelection();
    if (s2 && s2.rangeCount && !s2.getRangeAt(0).collapsed) return false;  // 글을 골랐으면 브라우저에
    if (!e.clipboardData) return false;
    const html = picks.map(bakedHtml).filter(Boolean).join('');
    if (!html) return false;
    e.clipboardData.setData('text/html', html);
    e.clipboardData.setData('text/plain', '');
    return true;
  }

  // ── 고른 그림 복사(Ctrl+C) ──
  // ⛔ 그림 블록은 편집 불가 «통짜 섬»이라 브라우저의 «문서 선택»에 안 잡힌다.
  //    그래서 Ctrl+C 를 눌러도 담을 게 없어 클립보드가 통째로 빈다
  //    (2026-08-31 실측: «빈 클립보드» — 엑셀·워드에 안 붙던 진짜 원인).
  //    고른 그림이 있으면 우리가 직접 담는다. 글줄 안 그림은 브라우저가 이미 잘 담으므로
  //    글을 고른 상태면 손대지 않는다.
  document.addEventListener('copy', (e) => {
    if (putPickedOnClipboard(e)) e.preventDefault();
  });

  // ── 고른 그림 잘라내기(Ctrl+X) — 워드·엑셀과 같다 (2026-08-31 SKY) ──
  document.addEventListener('cut', (e) => {
    if (!putPickedOnClipboard(e)) return;
    e.preventDefault();
    removePicked();
  });

  // ── 고른 그림 지우기 — Delete·Backspace. Esc 는 해제 ──
  document.addEventListener('keydown', (e) => {
    alive();
    if (!picks.length) return;
    if (inField(e.target)) return;          // 서식 창 칸에 숫자를 치는 중이면 손대지 않는다
    if (e.key === 'Escape') { deselect(); return; }
    if (e.key !== 'Delete' && e.key !== 'Backspace') return;
    e.preventDefault();
    removePicked();
  });

  // 검사·서식 창·메뉴가 쓰는 공개 창구. 화면 동작은 여기 안 기댄다(창구가 없어도 앱은 돈다).
  return { insertFiles, pasteData, pickedImgs, onPick, selectImg, deselect,
           patchPicked, patchBase, setPickedWidths, removePicked, pickedInfo, alignPicked };
}

/* format.js */
// 그림 서식 창 — 설계_서식과우클릭.md §4. UI 전용이고 모델 규칙은 core 에 있다.
// ⛔ 최상위 이름은 attachFormat 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로
//    파일이 달라도 최상위 이름이 겹치면 «Identifier has already been declared»로
//    화면이 통째로 안 뜬다(2026-08-30 실측).
// 단위 규칙(S1): 저장·모델은 px, 사람이 보고 치는 칸만 mm. 변환은 core/imgfmt.js 만 안다.


function attachFormat({ barEl, pagesEl, imageApi }) {
  const panel = document.createElement('div');
  panel.id = 'imgpanel';
  panel.setAttribute('contenteditable', 'false');
  panel.innerHTML = ''
    + '<div class="fp-ttl">그림 서식<button class="fp-x" type="button" title="닫기">✕</button></div>'
    + '<div class="fp-n"></div>'
    + '<label>폭 <input class="fp-w" type="number" step="0.1" min="1"><i>mm</i></label>'
    + '<label>높이 <input class="fp-h" type="number" step="0.1" min="1"><i>mm</i></label>'
    + '<label>둥근 모서리 <input class="fp-r" type="number" step="0.5" min="0"><i>mm</i></label>'
    + '<div class="fp-btns"><button class="fp-crop" type="button">자르기</button>'
    + '<button class="fp-reset" type="button">처음 상태로</button></div>'
    + '<div class="fp-btns fp-align"><button type="button" data-a="left">왼쪽</button>'
    + '<button type="button" data-a="center">가운데</button>'
    + '<button type="button" data-a="right">오른쪽</button></div>';

  const inW = panel.querySelector('.fp-w');
  const inH = panel.querySelector('.fp-h');
  const inR = panel.querySelector('.fp-r');
  const nEl = panel.querySelector('.fp-n');
  const alignRow = panel.querySelector('.fp-align');

  const isOpen = () => !!panel.parentNode;

  // 눈에 보이는 네모 — 자른 그림은 감싸개(.iclip)가 곧 보이는 네모다
  function baseBox() {
    const list = imageApi.pickedImgs();
    const img = list[list.length - 1];
    if (!img) return null;
    const box = (img.closest && img.closest('.iclip')) || img;
    return box.getBoundingClientRect();
  }

  // 기준 그림 오른쪽에 붙인다. 오른쪽에 자리가 없으면 왼쪽으로 넘긴다(설계 §4-1).
  function place() {
    const r = baseBox();
    if (!r) return;
    const w = panel.offsetWidth || 200;
    const h = panel.offsetHeight || 220;
    let x = r.right + 12;
    if (x + w > window.innerWidth - 8) x = r.left - 12 - w;
    if (x < 8) x = 8;
    let y = r.top;
    if (y + h > window.innerHeight - 8) y = window.innerHeight - 8 - h;
    if (y < 8) y = 8;
    panel.style.left = Math.round(x) + 'px';
    panel.style.top = Math.round(y) + 'px';
  }

  // ⛔ mm 를 px 로 바꿔 저장하므로 되돌려 보여 주면 «친 값»과 달라진다 —
  //    1 을 치면 4px 이 되고 그걸 다시 mm 로 재면 1.1 이다(2 → 2.1 · 3 → 2.9. 2026-08-31 SKY 지적).
  //    반올림이라 없앨 수 없는 어긋남이다. 그래서 «사람이 친 값이 지금 저장된 px 와 같은 뜻이면
  //    그대로 둔다» — 값은 정확히 그대로이고, 다른 데서 바뀌었을 때만 새로 채운다.
  function showMm(input, px) {
    const cur = Number(input.value);
    if (input.value !== '' && Number.isFinite(cur) && pxOf(cur) === px) return;
    input.value = String(mmOf(px));
  }

  // 지금 고른 그림의 값을 칸에 채운다. 고른 게 없으면 창을 닫는다.
  function fill() {
    const info = imageApi.pickedInfo();
    if (!info) { close(); return null; }
    showMm(inW, info.w);
    showMm(inH, info.h);
    if (info.rad) showMm(inR, info.rad);
    else inR.value = '0';
    // 여러 장을 골랐을 때 «무엇이 보이는 값인지» 헷갈리지 않게 한 줄로 알려 준다
    nEl.textContent = info.n > 1 ? (info.n + '장 골랐습니다 — 값은 진한 테두리 그림 것입니다') : '';
    nEl.style.display = info.n > 1 ? 'block' : 'none';
    // 정렬은 «한 줄짜리 그림 블록»에만 있다. 글줄 안 그림은 문단 정렬을 따라간다.
    alignRow.style.display = info.kind === 'block' ? 'flex' : 'none';
    for (const b of alignRow.querySelectorAll('button')) {
      b.classList.toggle('on', b.dataset.a === info.align);
    }
    return info;
  }

  function close() {
    if (panel.parentNode) panel.parentNode.removeChild(panel);
  }

  // 서식 창·자르기가 열릴 때 알린다 — 미니 패널이 같은 그림 옆에 겹쳐 뜨지 않게 한다.
  // ⛔ 둘 다 «고른 그림 옆»에 놓이는데 오른쪽에 자리가 없으면 둘 다 왼쪽으로 접혀 겹친다
  //    (2026-08-31 SKY 지적, 태블릿 사진). 서식 창이 더 자세하므로 그때는 미니가 물러난다.
  function tellOpened() {
    document.dispatchEvent(new CustomEvent('imgui:panel-open'));
  }

  function openPanel() {
    if (!imageApi.pickedInfo()) return;      // 고른 그림이 없으면 아무 일도 안 한다
    if (!panel.parentNode) document.body.appendChild(panel);
    if (!fill()) return;
    place();
    tellOpened();
  }

  // 둥근 모서리 켜기/끄기 — 기준값 2mm(8px). 리본 단추 하나로 쓰는 길이다(2026-08-31 SKY).
  // ⭐ mm 를 치는 칸은 그대로 두고, «늘 쓰는 값»만 단추 한 번으로 되게 한 것이다.
  const ROUND_MM = 2;
  function toggleRound() {
    const info = imageApi.pickedInfo();
    if (!info) return;
    imageApi.patchPicked({ rad: info.rad ? null : pxOf(ROUND_MM) });
  }
  // 지금 켜져 있는지를 리본 단추에 눌린 모양으로 보여 준다
  function syncRoundBtn() {
    const b = barEl.querySelector('.tb[data-imgfmt="round"]');
    if (!b) return;
    const info = imageApi.pickedInfo();
    b.classList.toggle('on', !!(info && info.rad));
  }
  imageApi.onPick(() => setTimeout(syncRoundBtn, 0));

  // ── 자르기 모드 (S7 — 원본은 그대로, «보이는 창»만 바뀐다) ──
  // ⭐ 자르기는 원본을 깎지 않는다. «원본의 어디를 보여 줄지»(crop)만 기록하므로
  //    나중에 언제든 처음 상태로 돌아온다. 보관함의 원본은 손대지 않는다.
  // 화면 구조: 유령(.cg)이 «원본 전체»를 지금 배율로 깔고, 창(.cw)이 보여 줄 자리다.
  // 창 밖이 어두운 것은 칸 4개가 아니라 창의 box-shadow 하나다 — 어긋날 데가 없다.
  const cropUi = document.createElement('div');
  cropUi.id = 'cropui';
  cropUi.setAttribute('contenteditable', 'false');
  const ghost = document.createElement('img');
  ghost.className = 'cg';
  const cwin = document.createElement('div');
  cwin.className = 'cw';
  for (const c of ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w']) {
    const hd = document.createElement('div');
    hd.className = 'ch';
    hd.dataset.c = c;
    cwin.appendChild(hd);
  }
  // ⛔ 안내 줄이 없으면 «어떻게 끝내는지» 알 길이 없다. 그리고 태블릿에는 Enter·Esc 키가
  //    아예 없어 단추가 없으면 «취소»를 못 한다 — 키만 믿으면 태블릿에서 갇힌다.
  const ctip = document.createElement('div');
  ctip.className = 'ctip';
  ctip.innerHTML = '<span>모서리를 끌어 보일 자리를 고르세요 · 원본은 그대로 남습니다</span>'
    + '<button class="ct-ok" type="button">적용</button>'
    + '<button class="ct-no" type="button">취소</button>';
  cropUi.appendChild(ghost);
  cropUi.appendChild(cwin);
  cropUi.appendChild(ctip);

  let cropState = null;    // { base, a, k, gx, gy, gw, gh, wasPanel }
  let cropDrag = null;     // 끄는 중
  const cropOpen = () => !!cropUi.parentNode;

  function setWin(x, y, w, h) {
    cwin.style.left = x + 'px';
    cwin.style.top = y + 'px';
    cwin.style.width = w + 'px';
    cwin.style.height = h + 'px';
  }

  function closeCrop() {
    if (cropUi.parentNode) cropUi.parentNode.removeChild(cropUi);
    cropState = null;
    cropDrag = null;
  }

  function openCrop() {
    if (cropOpen()) return;
    const info = imageApi.pickedInfo();
    const list = imageApi.pickedImgs();
    const base = list[list.length - 1];
    if (!info || !base) return;
    const box = ((base.closest && base.closest('.iclip')) || base).getBoundingClientRect();
    const a = info.asset;
    const c = info.crop || { x: 0, y: 0, w: a.w, h: a.h };
    // 배율 k = «보이는 폭 ÷ 지금 잘라 놓은 폭». 유령을 이 배율로 깔면 창이 지금 그림과 딱 겹친다.
    const k = box.width / Math.max(1, c.w);
    const s = { base, a, k, gx: box.left - c.x * k, gy: box.top - c.y * k,
                gw: a.w * k, gh: a.h * k, wasPanel: isOpen() };
    ghost.src = base.src;                    // 화면의 <img> src 가 곧 보관함 원본이다
    ghost.style.left = s.gx + 'px';
    ghost.style.top = s.gy + 'px';
    ghost.style.width = s.gw + 'px';
    ghost.style.height = s.gh + 'px';
    setWin(box.left, box.top, box.width, box.height);
    cropState = s;
    close();                                 // 서식 창은 덮개 밑에 깔리므로 잠시 닫는다
    document.body.appendChild(cropUi);
    tellOpened();                            // 미니 패널도 물러난다
  }

  // 적용 — 창 자리를 원본 좌표로 되돌려 crop 으로 적는다. patchBase 한 번(Ctrl+Z 한 번).
  function applyCrop() {
    const s = cropState;
    if (!s) { closeCrop(); return; }
    const r = cwin.getBoundingClientRect();
    // 창이 원본 전체와 같으면 «자르기 해제»로 적는다 — crop:null 이 남으면 안 된다
    const full = Math.abs(r.left - s.gx) < 1.5 && Math.abs(r.top - s.gy) < 1.5
      && Math.abs(r.width - s.gw) < 1.5 && Math.abs(r.height - s.gh) < 1.5;
    const w = Math.round(r.width);
    const crop = full ? null : clampCrop({ x: (r.left - s.gx) / s.k, y: (r.top - s.gy) / s.k,
                                           w: r.width / s.k, h: r.height / s.k }, s.a);
    const wasPanel = s.wasPanel;
    closeCrop();
    imageApi.patchBase({ crop, w });
    if (wasPanel) setTimeout(openPanel, 0);
  }

  // ⛔ 끌기의 «잡기»는 손잡이나 창 자신에 건다. 덮개에 걸면 끌기가 끝난 뒤 click 의
  //    과녁이 덮개가 되어 «바깥을 눌렀다»로 읽히고, 크기를 조절하자마자 그대로 적용돼 버린다.
  cropUi.addEventListener('pointerdown', (e) => {
    if (!cropState) return;
    const t = e.target;
    const hd = t && t.closest ? t.closest('.ch') : null;
    const cap = hd || (t && t.closest && t.closest('.cw'));
    if (!cap) return;                        // 어두운 바깥은 click 이 «적용»으로 받는다
    e.preventDefault();
    const r = cwin.getBoundingClientRect();
    cropDrag = { c: hd ? hd.dataset.c : null, cap, id: e.pointerId,
                 x0: e.clientX, y0: e.clientY, l: r.left, t: r.top, w: r.width, h: r.height };
    try { cap.setPointerCapture(e.pointerId); } catch (err) { /* 잡기 실패해도 끌기는 된다 */ }
  });
  cropUi.addEventListener('pointermove', (e) => {
    const s = cropState;
    const g = cropDrag;
    if (!g || !s) return;
    const MIN = 12;                          // 창이 0 이 되면 나누기가 깨진다
    const dx = e.clientX - g.x0;
    const dy = e.clientY - g.y0;
    let l = g.l, t = g.t, w = g.w, h = g.h;
    if (!g.c) {                              // 창을 통째로 옮긴다 — 유령 안으로만
      l = Math.max(s.gx, Math.min(g.l + dx, s.gx + s.gw - w));
      t = Math.max(s.gy, Math.min(g.t + dy, s.gy + s.gh - h));
    } else {
      if (g.c.indexOf('w') >= 0) {
        const nl = Math.max(s.gx, Math.min(g.l + dx, g.l + g.w - MIN));
        w = g.l + g.w - nl; l = nl;
      }
      if (g.c.indexOf('e') >= 0) w = Math.max(MIN, Math.min(g.w + dx, s.gx + s.gw - g.l));
      if (g.c.indexOf('n') >= 0) {
        const nt = Math.max(s.gy, Math.min(g.t + dy, g.t + g.h - MIN));
        h = g.t + g.h - nt; t = nt;
      }
      if (g.c.indexOf('s') >= 0) h = Math.max(MIN, Math.min(g.h + dy, s.gy + s.gh - g.t));
    }
    setWin(l, t, w, h);
  });
  const endCropDrag = (e) => {
    if (!cropDrag) return;
    try { cropDrag.cap.releasePointerCapture(cropDrag.id); } catch (err) { /* 이미 놓였다 */ }
    cropDrag = null;
    if (e) e.preventDefault();
  };
  cropUi.addEventListener('pointerup', endCropDrag);
  cropUi.addEventListener('pointercancel', endCropDrag);
  // 어두운 바깥을 누르면 적용(설계 §4-2). 안내 줄은 «바깥»이 아니다 — 제 단추가 있다.
  cropUi.addEventListener('click', (e) => {
    if (!cropState) return;
    const t = e.target;
    if (!(t && t.closest)) return;
    if (t.closest('.ct-ok')) { applyCrop(); return; }
    if (t.closest('.ct-no')) { closeCrop(); return; }
    if (t.closest('.cw') || t.closest('.ch') || t.closest('.ctip')) return;
    applyCrop();
  });
  // 덮개가 떠 있는 동안은 편집을 잠근다 — Enter 적용 · Esc 취소 말고는 아무것도 안 통한다.
  // ⛔ stopPropagation 까지 해야 한다. 안 그러면 Esc 가 «그림 고르기 해제»로도 함께 먹어
  //    적용할 그림이 사라진다(그림 단축키는 document 에 붙어 있다).
  document.addEventListener('keydown', (e) => {
    if (!cropOpen()) return;
    e.stopPropagation();
    e.preventDefault();
    if (e.key === 'Escape') closeCrop();
    else if (e.key === 'Enter') applyCrop();
  }, true);
  window.addEventListener('wheel', (e) => { if (cropOpen()) e.preventDefault(); },
                          { passive: false, capture: true });

  // 크기·모서리를 처음 상태로. 자르기·둥근 모서리를 떼고 폭을 원본으로 되돌린다.
  // ⭐ 한 번의 patchPicked = setDoc 한 번 → Ctrl+Z 한 번에 통째로 돌아온다.
  // ⚠ 여러 장을 골랐으면 폭은 «기준 그림의 원본 폭»으로 모인다(설계 §3 — 일괄은 기준을 따른다).
  function reset() {
    const info = imageApi.pickedInfo();
    if (!info) return;
    imageApi.patchPicked({ crop: null, rad: null, w: info.asset.w });
  }

  // ── 칸 입력 ──
  // 입력 한 번 = setDoc 한 번(각자 Ctrl+Z 한 단계). number 칸의 change 는
  // 「엔터」와 「칸 밖으로 나가기」 둘 다에서 온다 — 치는 도중에는 안 온다.
  inW.addEventListener('change', () => {
    const v = Number(inW.value);
    if (!(v > 0)) { fill(); return; }
    imageApi.setPickedWidths(pxOf(v));
  });
  inH.addEventListener('change', () => {
    const info = imageApi.pickedInfo();
    const v = Number(inH.value);
    if (!info || !(v > 0)) { fill(); return; }
    // 높이는 «비율을 거꾸로 풀어» 폭으로 바꾼다 — 저장하는 것은 언제나 폭이다.
    const ratio = ratioOf({ crop: info.crop }, info.asset);
    imageApi.setPickedWidths(Math.round(pxOf(v) / Math.max(0.01, ratio)));
  });
  inR.addEventListener('change', () => {
    const v = Number(inR.value);
    imageApi.patchPicked({ rad: v > 0 ? pxOf(v) : null });
  });

  // ── 단추 ──
  // ⛔ 단추의 mousedown 을 막아야 «편집 자리»가 안 풀린다. 칸(input)은 막지 않는다 —
  //    막으면 초점이 안 들어가 아무것도 못 친다.
  for (const b of panel.querySelectorAll('button')) {
    b.addEventListener('mousedown', (e) => e.preventDefault());
  }
  panel.querySelector('.fp-x').addEventListener('click', close);
  panel.querySelector('.fp-crop').addEventListener('click', () => openCrop());
  panel.querySelector('.fp-reset').addEventListener('click', reset);
  // 정렬은 리본 단추를 «대행»한다(M4) — 정렬 규칙은 리본에 한 벌만 있다.
  for (const b of alignRow.querySelectorAll('button')) {
    b.addEventListener('click', () => {
      const t = barEl.querySelector('.tb[data-align="' + b.dataset.a + '"]');
      if (t) t.click();
    });
  }

  // ── 닫는 길 ──
  document.addEventListener('mousedown', (e) => {
    if (!isOpen()) return;
    const t = e.target;
    if (t && t.closest && (t.closest('#imgpanel') || t.closest('#imgui') || t.closest('#bar'))) return;
    // 그림을 다시 누르는 것은 «다른 그림 고르기»다 — 창은 열어 둔 채 값만 갈아 끼운다
    if (t && t.closest && (t.matches('img.ri, img.bimg') || t.closest('.iclip'))) return;
    close();
  }, true);
  document.addEventListener('keydown', (e) => {
    if (isOpen() && e.key === 'Escape') close();
  });

  // 다시 그리면 <img> 가 새것이 되고 선택도 다시 잡힌다(reselect). 그 사이 한 번은
  // «아무것도 안 골라진» 순간이 지나가므로 곧바로 닫으면 창이 깜빡인다 —
  // 한 박자 뒤에 «최종 상태»를 보고 판단한다.
  let pending = 0;
  imageApi.onPick(() => {
    if (!isOpen() || pending) return;
    pending = setTimeout(() => {
      pending = 0;
      if (!isOpen()) return;
      if (fill()) place();
    }, 0);
  });
  window.addEventListener('resize', () => { if (isOpen()) place(); });
  window.addEventListener('scroll', () => { if (isOpen()) place(); }, true);

  // ── 여는 길 ──
  // ⓐ 그림 더블클릭(S8) — 워드와 같은 감각
  pagesEl.addEventListener('dblclick', (e) => {
    const t = e.target;
    if (!(t && t.closest)) return;
    if (!(t.matches('img.ri, img.bimg') || t.closest('.iclip'))) return;
    e.preventDefault();
    // 더블클릭의 첫 클릭이 그림을 고르므로 이 시점엔 이미 골라져 있다
    openPanel();
  });
  // ⓑ 리본의 그림 묶음 단추
  for (const b of barEl.querySelectorAll('.tb[data-imgfmt]')) {
    b.addEventListener('mousedown', (e) => e.preventDefault());
    b.addEventListener('click', () => {
      const k = b.dataset.imgfmt;
      if (k === 'crop') openCrop();
      else if (k === 'reset') reset();
      else if (k === 'round') toggleRound();
      else openPanel();
    });
  }

  return { openPanel, openCrop, reset, close, closeCrop, cropOpen,
           panelOpen: isOpen, toggleRound };
}

/* context.js */
// 문맥 판정 · 리본 대행 · 상황별 리본 — 설계_서식과우클릭.md §5-1·§5-4 (S3·M4).
// ⛔ 최상위 이름은 attachContext 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로
//    파일이 달라도 최상위 이름이 겹치면 화면이 통째로 안 뜬다.
//
// ⭐ 여기서 «기능»을 새로 만들지 않는다. 지금 무엇을 골랐는지 «읽기»만 하고,
//    실제 동작은 언제나 리본 단추를 눌러 대신한다(M4). 그래야 우클릭 메뉴·미니 패널·
//    리본이 서로 어긋나지 않는다 — 규칙이 리본 한 벌뿐이기 때문이다.


function attachContext({ pagesEl, barEl, imageApi }) {
  // 지금 «무엇을 고른 상태인가». 순서가 곧 우선순위다 — 그림이 가장 세다.
  function ctxOf() {
    const n = imageApi.pickedImgs().length;
    if (n) return { kind: 'image', label: '🖼 그림 · ' + n + '장' };
    const cells = wholeCellsIn(pagesEl);
    if (cells.length > 1) return { kind: 'table', label: '▦ 표 · ' + cells.length + '칸 고름' };
    const el = activeBlockEl(pagesEl);
    if (el && activeCellEl(el)) return { kind: 'table', label: '▦ 표' };
    // 글자를 «집어» 놓았나 — 걸침 선택이면 블록마다 조각이 온다
    const chars = targetsIn(pagesEl).reduce((s, t) => s + Math.abs((t.to || 0) - (t.from || 0)), 0);
    if (chars > 0) return { kind: 'text', label: '가 글자 · ' + chars + '자' };
    if (el && activeCapEl(el)) return { kind: 'caret', label: '그림 설명' };
    const cls = el ? (el.className || '') : '';
    const label = cls.indexOf('blk-list') >= 0 ? '• 목록'
      : cls.indexOf('blk-heading') >= 0 ? '제목'
      : cls.indexOf('blk-section') >= 0 ? '절 제목' : '¶ 문단';
    return { kind: 'caret', label };
  }

  // 리본 단추 대행 — 메뉴·미니 패널이 «자기 손»으로 문서를 고치지 않게 하는 창구다.
  // ⚠ 숨어 있는(hidden) 묶음의 단추도 click() 은 그대로 동작한다. 보임/숨김은 보기 문제일 뿐이다.
  function pressButton(sel) {
    const btn = barEl.querySelector(sel);
    if (btn) { btn.click(); return true; }
    console.warn('리본 단추를 못 찾았다:', sel);   // 조용히 삼키지 않되 죽지도 않는다
    return false;
  }

  // ⛔ 손가락·마우스를 «누르고 있는 동안»에는 리본을 절대 바꾸지 않는다.
  //    표 칸을 끌기 시작하면 곧바로 「표」 묶음이 나타나 리본이 한 줄 늘고,
  //    그만큼 문서가 아래로 밀린다 — 끄는 손 밑에서 표가 움직이니 엉뚱한 칸이 골라진다
  //    (2026-08-31 실측: 표 실입력 검사 12건이 이것 때문에 깨졌다).
  //    누르고 있는 동안 온 갱신은 «밀린 일»로 적어 두었다가 손을 뗀 뒤에 한 번만 한다.
  let holding = false;
  let missed = false;
  document.addEventListener('pointerdown', () => { holding = true; }, true);
  const release = () => {
    holding = false;
    if (!missed) return;
    missed = false;
    refreshCtxGroups();
  };
  document.addEventListener('pointerup', release, true);
  document.addEventListener('pointercancel', release, true);

  // 상황 묶음을 보이거나 숨긴다. 표와 그림을 동시에 만족할 수도 있다(표 칸 안 그림).
  // ⛔ 묶음이 나타나면 리본이 한 줄 늘고 그만큼 문서가 «아래로 밀린다». 태블릿에서는
  //    188px 이나 밀려서, 표 칸을 누른 자리에서 표가 손끝 아래로 도망가 버린다(실측).
  //    그래서 늘어난 만큼 화면을 같이 굴려 문서가 «가만히 있는 것처럼» 보이게 한다.
  //    ⚠ 높이는 «정말 바뀔 때만» 잰다 — 커서가 움직일 때마다 재면 화면이 느려진다.
  function refreshCtxGroups() {
    if (holding) { missed = true; return; }
    const el = activeBlockEl(pagesEl);
    const gt = barEl.querySelector('[data-ctx="table"]');
    const gi = barEl.querySelector('[data-ctx="image"]');
    const 표켤까 = !!(wholeCellsIn(pagesEl).length
      || (el && (activeCellEl(el) || (el.className || '').indexOf('blk-table') >= 0)));
    const 그림켤까 = !!imageApi.pickedImgs().length;
    if ((!gt || gt.hidden === !표켤까) && (!gi || gi.hidden === !그림켤까)) return;
    const 전 = barEl.offsetHeight;
    if (gt) gt.hidden = !표켤까;
    if (gi) gi.hidden = !그림켤까;
    const 후 = barEl.offsetHeight;
    if (후 === 전) return;
    // ⛔ 이 «보정 스크롤»은 사람이 화면을 굴린 것이 아니다. 그런데 브라우저는 똑같은
    //    scroll 사건으로 알려 주므로, 그것을 «굴렸으니 메뉴를 닫자»로 읽는 곳이 있으면
    //    방금 연 우클릭 메뉴가 곧바로 닫힌다(2026-08-31 실측: 그림 위 우클릭이 통째로 안 됐다).
    //    그래서 «지금은 내가 굴리는 중»이라고 잠깐 표시해 둔다.
    adjustUntil = Date.now() + 300;
    window.scrollBy(0, 후 - 전);
  }
  let adjustUntil = 0;
  const isAdjusting = () => Date.now() < adjustUntil;

  document.addEventListener('selectionchange', refreshCtxGroups);
  imageApi.onPick(refreshCtxGroups);
  refreshCtxGroups();

  return { ctxOf, pressButton, refreshCtxGroups, isAdjusting };
}

/* menu.js */
// 우클릭 문맥 메뉴 + 미니 패널 — 설계_서식과우클릭.md §5-2·§5-3 (S4·S5·S6·M4·M5).
// ⛔ 최상위 이름은 attachMenu 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로
//    파일이 달라도 최상위 이름이 겹치면 화면이 통째로 안 뜬다.
//
// ⭐ 이 파일은 문서를 «직접» 고치지 않는다. 무엇을 누르든 결국 리본 단추를 대신 누른다(M4).
//    그래야 규칙이 리본 한 벌뿐이어서 메뉴와 리본이 서로 어긋날 수가 없다.
//    예외는 리본에 단추가 없는 것들뿐이다 — 복사·잘라내기·붙여넣기·그림 서식 창.

// 빠른 줄 — 아이콘 가로줄. 리본 단추를 가리키는 셀렉터의 나열이다(S6·M4).
// 글자 대신 기호만 쓴다. 리본 단추의 속을 그대로 복제하면 「굵게」처럼 글자가 길어
// 줄이 넘친다.
const MENU_MARKS = [
  { sel: '[data-mark="b"]', txt: 'B', cls: 'q-b', tip: '굵게' },
  { sel: '[data-mark="i"]', txt: 'I', cls: 'q-i', tip: '기울임' },
  { sel: '[data-mark="u"]', txt: 'U', cls: 'q-u', tip: '밑줄' },
  { sel: '[data-szstep="1"]', txt: 'A＋', tip: '글자 크게' },
  { sel: '[data-szstep="-1"]', txt: 'A−', tip: '글자 작게' },
];
const MENU_COLORS = [
  { sel: '.tb-c[data-color="#1c1e24"]', txt: '■', color: '#1c1e24', tip: '본문색' },
  { sel: '.tb-c[data-color="#5a5e6a"]', txt: '■', color: '#5a5e6a', tip: '보조색' },
  { sel: '.tb-c[data-color="#e5231b"]', txt: '■', color: '#e5231b', tip: '포인트색' },
  { sel: '.tb-c[data-color=""]', txt: '✕', tip: '색 지우기' },
];
// 정렬·세로 맞춤·목록은 리본에 있는 SVG 를 그대로 복제해 쓴다 — 같은 그림이어야
// «리본의 그것»임을 눈이 알아본다.
const MENU_ALIGN = ['[data-align="left"]', '[data-align="center"]', '[data-align="right"]'];
const MENU_VALIGN = ['[data-valign="top"]', '[data-valign="middle"]', '[data-valign="bottom"]'];
// ⚠ 목록 단추는 리본에서 «• 목록» 이라는 글자다. 30px 짜리 작은 단추에 그대로 옮기면
//   글자가 세 줄로 접혀 읽을 수 없다(캡처 실측). 여기서는 기호만 쓴다.
const MENU_LIST = [
  { sel: '[data-list="0"]', txt: '•', tip: '글머리표 목록' },
  { sel: '[data-list="1"]', txt: '1.', tip: '번호 목록' },
];

// 목록(2열). press = 리본 단추 대행 · run = 리본에 없는 것
const MENU_ITEMS = {
  image: [
    { label: '그림 서식…', run: 'panel' }, { label: '자르기', run: 'crop' },
    { label: '둥근 모서리', press: '[data-imgfmt="round"]' },
    { label: '처음 상태로', run: 'reset' },
    { label: '삭제', run: 'remove' }, { label: '복사', run: 'copy' },
    { label: '잘라내기', run: 'cut' },
  ],
  table: [
    { label: '아래에 행', press: '[data-table="row+"]' },
    { label: '이 행 지우기', press: '[data-table="row-"]' },
    { label: '오른쪽에 열', press: '[data-table="col+"]' },
    { label: '이 열 지우기', press: '[data-table="col-"]' },
    { label: '병합', press: '[data-table="merge"]' },
    { label: '분할', press: '[data-table="split"]' },
    { label: '옆 나누기', press: '[data-table="splitx"]' },
    { label: '아래 나누기', press: '[data-table="splity"]' },
    { label: '머리글', press: '[data-table="head"]' },
    { label: '표 지우기', press: '[data-table="del"]' },
    { label: '복사', run: 'copy' }, { label: '잘라내기', run: 'cut' },
    { label: '붙여넣기', run: 'paste' },
  ],
  text: [
    { label: '복사', run: 'copy' }, { label: '잘라내기', run: 'cut' },
    { label: '붙여넣기', run: 'paste' },
  ],
  caret: [
    { label: '붙여넣기', run: 'paste' },
    { label: '표 넣기', press: '[data-table="insert"]' },
    { label: '그림 넣기', press: '[data-image="auto"]' },
  ],
};

function attachMenu({ pagesEl, barEl, ctxApi, imageApi, formatApi }) {
  const menu = document.createElement('div');
  menu.id = 'ctxmenu';
  menu.setAttribute('contenteditable', 'false');
  const mini = document.createElement('div');
  mini.id = 'minibar';
  mini.setAttribute('contenteditable', 'false');

  // ⛔ 마지막으로 무엇으로 눌렀는지 기억한다. 태블릿에서 «길게 누르기»는 브라우저가
  //    이미 글자 고르기·붙여넣기 메뉴로 쓴다 — 우리가 가로채면 그 익숙한 것이 사라진다(M5).
  let lastPtr = 'mouse';
  document.addEventListener('pointerdown', (e) => { lastPtr = e.pointerType || 'mouse'; }, true);

  // ── 부품 만들기 ──
  // 리본 단추의 속(SVG)을 그대로 복제한다 — 없으면 만들지 않는다(리본이 바뀌면 여기도 따라간다)
  function cloneBtn(sel, tip) {
    const src = barEl.querySelector(sel);
    if (!src) return null;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'q';
    b.dataset.press = sel;
    b.title = tip || src.title || '';
    const svg = src.querySelector('svg');
    if (svg) b.appendChild(svg.cloneNode(true));
    else b.textContent = src.textContent.trim();
    return b;
  }
  function markBtn(m) {
    if (!barEl.querySelector(m.sel)) return null;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'q' + (m.cls ? ' ' + m.cls : '');
    b.dataset.press = m.sel;
    b.title = m.tip;
    b.textContent = m.txt;
    if (m.color) b.style.color = m.color;
    return b;
  }

  // 문맥에 맞는 «빠른 줄» — 미니 패널(§5-3)도 이 함수를 그대로 쓴다.
  // ⚠ 한 줄로 죽 늘어놓으면 폭에 따라 아무 데서나 접혀 «5개, 1개»처럼 갈라진다(캡처 실측).
  //   뜻이 같은 것끼리 묶어(.qg) 줄을 나눈다 — 글자꼴 / 색 / 정렬·맞춤.
  function quickStrip(kind) {
    const wrap = document.createElement('div');
    wrap.className = 'qs';
    const group = (els) => {
      const live = els.filter(Boolean);
      if (!live.length) return;
      const g = document.createElement('div');
      g.className = 'qg';
      for (const el of live) g.appendChild(el);
      wrap.appendChild(g);
    };
    if (kind === 'image') {
      group(MENU_ALIGN.map(s => cloneBtn(s)));
      return wrap;
    }
    group(MENU_MARKS.map(markBtn));
    group(MENU_COLORS.map(markBtn));
    group(MENU_ALIGN.map(s => cloneBtn(s)).concat(
      kind === 'table' ? MENU_VALIGN.map(s => cloneBtn(s)) : MENU_LIST.map(markBtn)));
    return wrap;
  }

  // ── 실행 ──
  // 1.5초짜리 알림 — 메뉴 자리에 띄운다. 실패를 조용히 삼키지 않기 위한 것이다.
  function say(text, x, y) {
    const t = document.createElement('div');
    t.className = 'mtoast';
    t.textContent = text;
    t.style.left = Math.round(Math.min(x, window.innerWidth - 320)) + 'px';
    t.style.top = Math.round(Math.min(y, window.innerHeight - 60)) + 'px';
    document.body.appendChild(t);
    setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 1800);
  }

  let lastXY = { x: 40, y: 40 };

  // 메뉴의 붙여넣기 — 브라우저가 «클립보드를 읽어도 되겠냐»고 한 번 묻는다.
  // 막히면 안내로 물러난다(설계 §5-2 U1). ⛔ 조용히 아무 일도 안 하면 안 된다.
  async function runPaste() {
    try {
      if (!navigator.clipboard || !navigator.clipboard.read) {
        say('이 브라우저는 메뉴 붙여넣기를 막습니다 — Ctrl+V 를 눌러 주세요', lastXY.x, lastXY.y);
        return;
      }
      const items = await navigator.clipboard.read();
      let html = '';
      let text = '';
      const files = [];
      for (const it of items) {
        for (const ty of it.types) {
          if (ty === 'text/html') html = await (await it.getType(ty)).text();
          else if (ty === 'text/plain') text = await (await it.getType(ty)).text();
          else if (ty.indexOf('image/') === 0) {
            files.push(new File([await it.getType(ty)], 'paste', { type: ty }));
          }
        }
      }
      if (html.indexOf('<table') >= 0) {
        say('표 붙여넣기는 Ctrl+V 를 눌러 주세요', lastXY.x, lastXY.y);
        return;
      }
      if (imageApi.pasteData({ html, text, files, textOnly: true })) return;
      say('붙여넣을 내용을 읽지 못했습니다 — Ctrl+V 를 눌러 주세요', lastXY.x, lastXY.y);
    } catch (err) {
      say('브라우저가 클립보드 읽기를 막았습니다 — Ctrl+V 를 눌러 주세요', lastXY.x, lastXY.y);
    }
  }

  function run(kind) {
    if (kind === 'panel') { formatApi.openPanel(); return; }
    if (kind === 'crop') { formatApi.openCrop(); return; }
    if (kind === 'reset') { formatApi.reset(); return; }
    if (kind === 'remove') { imageApi.removePicked(); return; }
    // ⭐ copy·cut 은 «우리가 직접» 담지 않는다. execCommand 가 브라우저의 copy/cut 을
    //    일으키면 이미 있는 처리기가 그대로 돈다 — 자른 그림 굽기·표 모양 담기가 공짜다.
    if (kind === 'copy') { document.execCommand('copy'); return; }
    if (kind === 'cut') { document.execCommand('cut'); return; }
    if (kind === 'paste') { runPaste(); return; }
  }

  // ── 메뉴 ──
  const menuOpen = () => !!menu.parentNode;

  function closeMenu() {
    if (menu.parentNode) menu.parentNode.removeChild(menu);
  }

  function buildMenu(ctx) {
    menu.textContent = '';
    const badge = document.createElement('div');
    badge.className = 'mbadge';
    badge.textContent = ctx.label;
    menu.appendChild(badge);
    menu.appendChild(quickStrip(ctx.kind));
    const list = document.createElement('div');
    list.className = 'mlist';
    for (const it of (MENU_ITEMS[ctx.kind] || MENU_ITEMS.caret)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = it.label;
      if (it.press) b.dataset.press = it.press;
      else b.dataset.run = it.run;
      list.appendChild(b);
    }
    menu.appendChild(list);
  }

  function openMenuAt(x, y) {
    lastXY = { x, y };
    buildMenu(ctxApi.ctxOf());
    if (!menu.parentNode) document.body.appendChild(menu);
    menu.style.left = '0px';
    menu.style.top = '0px';
    // 화면 밖으로 나가면 안쪽으로 접는다 — 잘려 나가면 아래 항목을 아예 못 누른다
    const w = menu.offsetWidth;
    const h = menu.offsetHeight;
    menu.style.left = Math.round(Math.max(6, Math.min(x, window.innerWidth - w - 6))) + 'px';
    menu.style.top = Math.round(Math.max(6, Math.min(y, window.innerHeight - h - 6))) + 'px';
    hideMini();
  }

  pagesEl.addEventListener('contextmenu', (e) => {
    if (lastPtr === 'touch') return;      // 태블릿 길게 누르기는 브라우저 기본에 맡긴다(M5)
    const t = e.target;
    // 그림 위에서 우클릭하면 그 그림을 먼저 고른다 — 워드와 같다
    const box = t && t.closest ? t.closest('.iclip') : null;
    const img = t && t.matches && t.matches('img.ri, img.bimg') ? t
      : (box ? box.querySelector('img') : null);
    if (img && imageApi.pickedImgs().indexOf(img) < 0) imageApi.selectImg(img);
    e.preventDefault();
    openMenuAt(e.clientX, e.clientY);
  });

  // ⛔ mousedown 을 막아야 «고른 글»이 안 풀린다. 리본 단추가 쓰는 것과 같은 수법이다.
  const guard = (root) => root.addEventListener('mousedown', (e) => {
    if (e.target.closest && e.target.closest('button')) e.preventDefault();
  });
  guard(menu);
  guard(mini);

  const fire = (e, closeAfter) => {
    const b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.dataset.press) ctxApi.pressButton(b.dataset.press);
    else if (b.dataset.run) run(b.dataset.run);
    if (closeAfter) closeMenu();
  };
  menu.addEventListener('click', (e) => fire(e, true));
  mini.addEventListener('click', (e) => fire(e, false));

  document.addEventListener('mousedown', (e) => {
    if (!menuOpen()) return;
    if (e.target.closest && e.target.closest('#ctxmenu')) return;
    closeMenu();
  }, true);
  document.addEventListener('keydown', (e) => {
    if (menuOpen() && e.key === 'Escape') { closeMenu(); return; }
    // 타자를 치기 시작하면 미니 패널은 물러난다 — 글자를 가리면 안 된다
    if (miniOpen() && e.key.length === 1) hideMini();
    if (miniOpen() && e.key === 'Escape') hideMini();
  }, true);
  // 화면을 굴리면 메뉴는 따라가지 않으므로 닫는다.
  // ⛔ 단 «리본이 커진 만큼 맞춰 굴린 것»은 사람이 굴린 게 아니다 — 그것까지 닫으면
  //    그림 위 우클릭이 열리자마자 닫혀 통째로 안 되는 것처럼 보인다(2026-08-31 실측).
  window.addEventListener('scroll', () => {
    if (ctxApi.isAdjusting && ctxApi.isAdjusting()) return;
    closeMenu();
    hideMini();
  }, true);

  // ── 미니 패널 (S4) ──
  // 마우스로 «고른 그 순간»에만 뜬다. 태블릿에서는 안 띄운다 — 브라우저 제 메뉴와 겹친다(M5).
  const miniOpen = () => !!mini.parentNode;
  function hideMini() {
    if (mini.parentNode) mini.parentNode.removeChild(mini);
  }

  // 지금 고른 것을 감싸는 «화면 위 네모». 없으면 null(= 미니 패널을 안 띄운다).
  function targetRect(kind) {
    if (kind === 'image') {
      const list = imageApi.pickedImgs();
      const base = list[list.length - 1];
      if (!base) return null;
      return ((base.closest && base.closest('.iclip')) || base).getBoundingClientRect();
    }
    const s = window.getSelection();
    if (!s || !s.rangeCount || s.getRangeAt(0).collapsed) return null;
    const r = s.getRangeAt(0).getBoundingClientRect();
    return (r.width || r.height) ? r : null;
  }

  function showMini() {
    if (lastPtr === 'touch' || menuOpen()) { hideMini(); return; }
    // ⛔ 서식 창·자르기가 열려 있으면 미니 패널은 물러난다. 둘 다 «고른 그림 옆»에 놓이는데
    //    오른쪽에 자리가 없으면 둘 다 왼쪽으로 접혀 서로 겹쳐 보인다(2026-08-31 SKY 지적).
    //    서식 창이 더 자세하니 그쪽을 남긴다.
    if ((formatApi.panelOpen && formatApi.panelOpen())
      || (formatApi.cropOpen && formatApi.cropOpen())) { hideMini(); return; }
    const ctx = ctxApi.ctxOf();
    if (ctx.kind === 'caret') { hideMini(); return; }   // 커서만 있으면 띄울 까닭이 없다
    const r = targetRect(ctx.kind);
    if (!r) { hideMini(); return; }
    mini.textContent = '';
    const badge = document.createElement('div');
    badge.className = 'mbadge';
    badge.textContent = ctx.label;
    mini.appendChild(badge);
    mini.appendChild(quickStrip(ctx.kind));
    if (!mini.parentNode) document.body.appendChild(mini);
    // 고른 것의 «왼쪽 바깥»에 둔다 — 글자 위를 덮지 않는다(S4).
    const w = mini.offsetWidth;
    const h = mini.offsetHeight;
    let x = r.left - 8 - w;
    if (x < 4) x = 4;                    // 자리가 없으면 덮더라도 화면 안으로 접는다
    let y = r.top;
    if (y + h > window.innerHeight - 6) y = window.innerHeight - 6 - h;
    if (y < 6) y = 6;
    mini.style.left = Math.round(x) + 'px';
    mini.style.top = Math.round(y) + 'px';
  }

  // 선택은 mouseup «뒤»에 확정된다 — 한 박자 뒤에 잰다
  pagesEl.addEventListener('mouseup', () => {
    if (lastPtr === 'touch') return;
    setTimeout(showMini, 0);
  });
  imageApi.onPick(() => {
    if (lastPtr === 'touch') return;
    setTimeout(showMini, 0);
  });
  document.addEventListener('selectionchange', () => {
    if (!miniOpen()) return;
    const ctx = ctxApi.ctxOf();
    if (ctx.kind === 'caret') hideMini();
  });
  // 서식 창·자르기가 열리면 곧바로 비켜 준다(이미 떠 있던 경우)
  document.addEventListener('imgui:panel-open', hideMini);

  return { openMenuAt, closeMenu, quickStrip, showMini, hideMini, menuOpen, miniOpen };
}

    rows: [
      [cell('안전회로기판'), cell('UCMP-600'), cell('Rev1.0')],
      [cell('주 제어기판'), cell('UMCB-4000Zi-B'), cell('Rev5.0')],
      [cell('안전회로 경유기판'), cell('EMR-100R'), cell('Rev5.0')],
    ],
  }));
  for (let i = 1; i <= 60; i++) {
    doc.blocks.push(createBlock('para', {
      text: i + '. 안전회로의 전압은 AC 110V 를 사용하며, 브레이크 및 도어 모터 전압은 따로 분기한다.',
    }));
  }
  return doc;
}

function draw(opt = {}) {
  const pagesEl = document.getElementById('pages');

  // 다시 그리기 전에 지금 커서가 몇 번째 글자에 있는지 세어 둔다.
  // 목록이면 "블록 전체"가 아니라 "그 항목 안"에서 센다 — 블록 전체로 세면 항목 경계에서
  // 이전 항목 끝과 다음 항목 처음이 같은 번호가 되어, 커서가 이전 항목으로 붙는다(실기기 지적 1).
  let keepId = null;
  let keepItem = null;
  let keepCell = null;
  let keepCap = 0;
  let keepPos = 0;
  if (opt.keepCaret) {
    const blk = activeBlockEl(pagesEl);
    const sel = window.getSelection();
    if (blk && sel && sel.anchorNode) {
      keepId = blk.dataset.id;
      const cap = activeCapEl(blk);
      const td = cap ? null : activeCellEl(blk);
      const li = (cap || td) ? null : activeItemEl(blk);
      if (cap) {
        keepCap = 1;
        keepPos = offsetIn(cap, sel.anchorNode, sel.anchorOffset);
      } else if (td) {
        keepItem = null;
        keepCell = [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)];
        keepPos = offsetIn(td, sel.anchorNode, sel.anchorOffset);
      } else if (li) {
        keepItem = li.dataset.i;
        keepPos = offsetIn(li, sel.anchorNode, sel.anchorOffset);
      } else {
        keepPos = offsetIn(blk, sel.anchorNode, sel.anchorOffset);
      }
    }
  }

  const r = renderPages(state.doc, pagesEl, document.getElementById('gauge'));

  // p = { id, item?, cell? } — 커서·선택을 되돌릴 편집 칸(문단/목록 항목/표 칸)을 찾는다.
  // ⚠ 표 칸은 pagesEl 전체에서 찾는다 — 장을 넘은 표는 같은 id 의 .blk 조각이 여러 개라,
  //   첫 조각만 봐서는 뒷장의 칸을 못 찾는다.
  const hostOf = (p) => {
    if (p.cell) {
      return pagesEl.querySelector('.blk[data-id="' + p.id + '"] td[data-r="' + p.cell[0]
        + '"][data-c="' + p.cell[1] + '"]');
    }
    if (p.cap) return pagesEl.querySelector('.blk[data-id="' + p.id + '"] .cap');
    const el = pagesEl.querySelector('.blk[data-id="' + p.id + '"]');
    if (!el) return null;
    if (p.item === null || p.item === undefined) return el;
    return el.querySelector('.lst li[data-i="' + p.item + '"]');
  };

  if (opt.sel && opt.sel.multi) {
    // 여러 블록에 걸친 선택 복원 — 양 끝 좌표만 있으면 브라우저가 사이를 채운다
    const resolve = (p) => { const host = hostOf(p); return host ? nodeAt(host, p.pos) : null; };
    const na = resolve(opt.sel.a);
    const nb = resolve(opt.sel.b);
    if (na && nb) window.getSelection().setBaseAndExtent(na.node, na.offset, nb.node, nb.offset);
  } else if (opt.sel) {
    const host = hostOf(opt.sel);
    if (host) selectRange(host, opt.sel.from, opt.sel.to);
  } else if (opt.caret) {
    // 정확한 자리(블록·목록 항목·표 칸·글자 번호)로 커서를 놓는다 — 걸침 지우기가 쓴다
    const host = hostOf(opt.caret) || pagesEl.querySelector('.blk[data-id="' + opt.caret.id + '"]');
    if (host) caretTo(host, opt.caret.pos);
  } else if (opt.caretId) {
    const el = pagesEl.querySelector('.blk[data-id="' + opt.caretId + '"]');
    if (el) caretTo(el, opt.caretEnd ? Number.MAX_SAFE_INTEGER : 0);
  } else if (keepId) {
    const host = hostOf({ id: keepId, item: keepItem, cell: keepCell, cap: keepCap });
    if (host) caretTo(host, keepPos);
  }
  return r;
}

state.doc = demoDoc();

const history = createHistory(200);
history.push(state.doc.blocks);

// 편집을 멈추고 5초가 지나면 브라우저 내부 저장소에 스스로 보관한다(최근 20시점)
let snapTimer = null;
function markDirty() {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(async () => {
    try { await saveSnapshot(serializeSwept(), state.name || '(이름 없음)'); }
    catch (e) { console.warn('자동 보관 실패:', e.message); }
  }, 5000);
}

// 저장 직전에만 참조 없는 그림을 청소한다(설계 §2-3) — 되돌리기 기록이 가리키면 남긴다.
// ⛔ 화면 갱신마다 하지 않는다. 저장·읽기 때만이면 충분하고, 매번 하면 되돌리기가
//    아직 쓰는 그림을 지울 위험만 커진다.
function serializeSwept() {
  const assets = sweepAssets(state.doc.assets, [state.doc.blocks].concat(history.blocksLists()));
  if (assets !== state.doc.assets) state.doc = Object.assign({}, state.doc, { assets });
  return serialize(state.doc);
}

// 지금 화면의 선택(커서·드래그)을 모델 좌표로 뜬다 — 되돌리기가 이 자리를 되살린다.
// setDoc(=applyDoc) 은 항상 다시 그리기 «전»에 불리므로 이 순간의 선택이 곧 편집 자리다.
function selSnapshot() {
  const pagesEl = document.getElementById('pages');
  if (!pagesEl) return null;
  const parts = targetsIn(pagesEl);
  if (parts.length === 1) return parts[0];
  if (parts.length > 1) {
    const a = parts[0];
    const b = parts[parts.length - 1];
    return { multi: 1, a: { id: a.id, item: a.item, cell: a.cell, pos: a.from },
             b: { id: b.id, item: b.item, cell: b.cell, pos: b.to } };
  }
  const blk = activeBlockEl(pagesEl);
  const s = window.getSelection();
  if (!blk || !s || !s.anchorNode) return null;
  const cap = activeCapEl(blk);
  if (cap) {
    return { caret: 1, id: blk.dataset.id, item: null, cap: 1,
             pos: offsetIn(cap, s.anchorNode, s.anchorOffset) };
  }
  const td = activeCellEl(blk);
  if (td) {
    return { caret: 1, id: blk.dataset.id, item: null,
             cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)],
             pos: offsetIn(td, s.anchorNode, s.anchorOffset) };
  }
  const li = activeItemEl(blk);
  const host = li || blk;
  return { caret: 1, id: blk.dataset.id, item: li ? Number(li.dataset.i) : null,
           pos: offsetIn(host, s.anchorNode, s.anchorOffset) };
}

// 편집이 문서를 바꿀 때는 항상 이 문으로 들어와 기록이 쌓인다
const applyDoc = (d) => { state.doc = d; history.push(d.blocks, selSnapshot()); markDirty(); };

// 되돌린 편집의 선택을 되살린다. 그 블록이 이 상태에 없으면(문단 가르기 되돌림 등)
// 조용히 선택 없이 그린다 — 못 찾으면 커서를 안 놓을 뿐, 글은 정상이다.
function drawWithSel(sel) {
  if (!sel) { draw(); return; }
  if (sel.caret) { draw({ caret: { id: sel.id, item: sel.item, cell: sel.cell, cap: sel.cap, pos: sel.pos } }); return; }
  draw({ sel });
}

// ⛔ 단축키를 e.key 로만 보면 «한글 자판»에서 통째로 안 먹는다 — Ctrl+Z 가 key='ㅋ' 로
//    오기 때문이다(2026-08-30 실측). 잘라내기·복사는 브라우저가 알아서 해 주니 되는데
//    되돌리기만 안 돼서 «잘라내기 뒤 되돌리기가 안 된다»로 보였다.
//    e.code 는 «자판에 상관없는 키 자리»라 한글 상태에서도 KeyZ 로 온다. 둘 다 본다.
const isKey = (e, ch, code) => e.key === ch || e.key === ch.toUpperCase() || e.code === code;

document.addEventListener('keydown', (e) => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (!ctrl) return;
  const z = isKey(e, 'z', 'KeyZ');
  const y = isKey(e, 'y', 'KeyY');
  if (z && !e.shiftKey) {
    const r = history.undo();
    if (r) { e.preventDefault(); state.doc = Object.assign({}, state.doc, { blocks: r.blocks }); drawWithSel(r.sel); }
  } else if (y || (z && e.shiftKey)) {
    const r = history.redo();
    if (r) { e.preventDefault(); state.doc = Object.assign({}, state.doc, { blocks: r.blocks }); drawWithSel(r.sel); }
  }
});

// 검사 도구가 들여다보는 창구다(tools/*.js). 화면 동작에는 쓰지 않는다.
window.__app = { state, draw, DEFAULT_PAGE, history, saveSnapshot, listSnapshots,
                 rememberDir, recallDir, forgetDir, docExists, serializeSwept };
draw();

attachEditor({

attachToolbar({

  // 이 함수는 단추를 누르는 «그때» 불리므로 그때는 이미 있다.

const imageApi = attachImages({

const formatApi = attachFormat({

// ---- 문서 폴더 열기·저장 ----
state.dir = null;
state.name = null;

function msg(t) { document.getElementById('folder-msg').textContent = t; }

// 문서를 어디에 담을지는 «사람이 폴더를 골라야» 정해진다(브라우저 보안 — 프로그램이 마음대로 못 연다).
// 고른 폴더 «안»에 서류 폴더가 생기고 .sdoc 문서가 거기 쌓인다(io/folder.js SUB).
// 고른 폴더는 기억해 두고 다음에 열 때 되살린다 — 권한이 남아 있으면 그냥 이어지고,
// 브라우저가 권한을 내렸으면 「📁 문서 폴더 열기」를 «한 번 누르는 것»만으로 이어진다.
const NEED_DIR = '먼저 왼쪽 위 「📁 문서 폴더 열기」를 눌러 폴더를 고르세요 — 그 안에 「서류」 폴더가 생기고 문서가 거기 저장됩니다';
const dirLabel = (h) => '폴더: ' + h.name + (h.name === '서류' ? '' : ' ▸ 서류');

async function refreshList() {
  const box = document.getElementById('doclist');
  box.textContent = '';
  if (!state.dir) return;
  for (const name of await listDocs(state.dir)) {
    const a = document.createElement('a');
    a.textContent = name.replace(DOC_EXT, '');
    a.className = name === state.name ? 'on' : '';
    a.addEventListener('click', async () => {
      state.doc = deserialize(await readDoc(state.dir, name));
      state.name = name;
      state.fileHandle = null;          // 폴더의 문서를 열었다 — 파일 하나 연결은 푼다
      history.push(state.doc.blocks);
      draw();
      refreshList();
    });
    box.appendChild(a);
  }
}

async function useDir(handle) {
  state.dir = handle;
  await rememberDir(handle);
  msg(dirLabel(handle));
  await refreshList();
}

document.getElementById('btn-folder').addEventListener('click', async () => {
  try {
    // ① 기억해 둔 폴더가 있으면 먼저 그것으로 이어 본다 — 버튼 한 번이면 폴더 창이 안 뜬다.
    //    (버튼을 누른 «이 순간» 이 브라우저가 허락을 물어봐 주는 유일한 때다)
    if (!state.dir) {
      const saved = await recallDir();
      if (saved && await dirPermission(saved, true) === 'granted') { await useDir(saved); return; }
      if (saved) await forgetDir();                // 사람이 거절했거나 폴더가 없어졌다
    }
    state.dir = await pickFolder();
    await useDir(state.dir);
  } catch (e) {
    if (e && e.name === 'AbortError') return;      // 사람이 취소한 것 — 오류가 아니다
    msg('폴더를 열지 못했다: ' + e.message);
  }
});

// 열자마자 — 지난 폴더의 권한이 아직 살아 있으면 아무것도 안 눌러도 그대로 이어진다
(async () => {
  const saved = await recallDir();
  if (!saved) return;
  try {
    if (await dirPermission(saved, false) === 'granted') { await useDir(saved); return; }
    msg('지난 폴더 「' + saved.name + '」로 이어가려면 「📁 문서 폴더 열기」를 한 번 누르세요');
  } catch (e) { /* 폴더가 없어졌으면 그냥 새로 고르면 된다 */ }
})();

// ── 지금 쓰는 «판»과 새 판 알림 (2026-08-30 SKY) ──
// ⛔ PC 에 «설치한 앱»은 옛 파일을 캐시로 붙들고 있을 수 있다 — 그러면 새로 배포해도
//    화면이 안 바뀌어서 «고친 게 반영이 안 됐다»로 보인다(2026-08-30 실측).
//    그래서 ⓐ 지금 쓰는 판을 늘 보여 주고 ⓑ 새 판이 올라오면 눌러서 새로고침하게 한다.
// ⚠ 파일(file://)로 열면 version.json 을 못 읽는다 — 그때는 판만 보여 주고 조용히 만다.
const BUILD = typeof window.__BUILD === 'string' ? window.__BUILD : '';
const verEl = document.getElementById('ver');
if (verEl) verEl.textContent = BUILD ? '판 ' + BUILD : '';

async function checkNewBuild() {
  if (!verEl || !BUILD || location.protocol === 'file:') return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (!j || !j.build || j.build === BUILD) return;
    verEl.className = 'new';
    verEl.textContent = '새 버전이 있습니다 — 눌러서 받기';
    verEl.title = '지금 ' + BUILD + ' → 새 판 ' + j.build;
    verEl.onclick = () => location.reload(true);
  } catch (e) { /* 인터넷이 없으면 그냥 지금 것을 쓴다 */ }
}
checkNewBuild();
setInterval(checkNewBuild, 5 * 60 * 1000);   // 5분마다 조용히 살펴본다

// ── 탐색기에서 .sdoc 을 눌러 이 앱으로 열리는 길 (2026-08-30 SKY) ──
// 브라우저에 «설치»된 앱만 파일을 넘겨받을 수 있다(manifest 의 file_handlers).
// 넘어오는 것은 경로가 아니라 «파일 손잡이»라, 그대로 읽고 그 파일에 되저장할 수 있다.
// ⚠ 이 길로 연 문서는 폴더 목록과 무관하다 — 저장은 그 파일 자체에 한다.
state.fileHandle = null;

async function openFileHandle(fh) {
  try {
    const text = await (await fh.getFile()).text();
    state.doc = deserialize(text);
    state.fileHandle = fh;
    state.name = fh.name;
    history.push(state.doc.blocks);
    draw();
    msg('파일: ' + fh.name);
    refreshList();
  } catch (e) { msg('문서를 열지 못했다: ' + e.message); }
}

if ('launchQueue' in window && 'files' in LaunchParams.prototype) {
  window.launchQueue.setConsumer(async (params) => {
    if (!params || !params.files || !params.files.length) return;
    await openFileHandle(params.files[0]);
  });
}

document.getElementById('btn-save').addEventListener('click', async () => {
  // 탐색기에서 .sdoc 을 눌러 연 문서는 «그 파일»에 되저장한다 — 폴더가 없어도 된다
  if (state.fileHandle) {
    try {
      if (state.fileHandle.requestPermission
          && await state.fileHandle.requestPermission({ mode: 'readwrite' }) !== 'granted') {
        msg('저장 권한을 받지 못했다'); return;
      }
      const w = await state.fileHandle.createWritable();
      await w.write(serializeSwept());
      await w.close();
      msg('저장함: ' + state.fileHandle.name);
    } catch (e) { msg('저장하지 못했다: ' + e.message); }
    return;
  }
  if (!state.dir) { msg(NEED_DIR); return; }
  const name = state.name || ((state.doc.meta.title || '새 문서') + DOC_EXT);
  try {
    await writeDoc(state.dir, name, serializeSwept());
    state.name = name;
    msg('저장함: ' + name);
    await refreshList();
  } catch (e) { msg('저장하지 못했다: ' + e.message); }
});

// 새 문서 — 빈 문단 하나로 시작한다. 저장 전에는 파일이 없다(워드와 같다).
document.getElementById('btn-new').addEventListener('click', () => {
  state.doc = createDocument();
  state.name = null;
  state.fileHandle = null;
  history.push(state.doc.blocks);
  draw({ caretId: state.doc.blocks[0].id });
  refreshList();
  msg('새 문서 — 저장하면 파일이 생깁니다');
});

// 다른 이름으로 저장 — 지금 열린 폴더에 새 파일을 만든다(R15).
// 같은 이름이 이미 있으면 물어본다 — 다른 문서가 조용히 사라지면 안 된다(데이터 안전).
document.getElementById('btn-saveas').addEventListener('click', async () => {
  if (!state.dir) { msg(NEED_DIR); return; }
  const cur = (state.name || ((state.doc.meta.title || '새 문서') + DOC_EXT)).replace(DOC_EXT, '');
  const input = window.prompt('다른 이름으로 저장 — 새 파일 이름:', cur);
  if (input === null) return;                                    // 사람이 취소한 것
  const name = input.trim().replace(/[\\/:*?"<>|]/g, '').replace(DOC_EXT, '');
  if (!name) { msg('이름이 비었습니다'); return; }
  const full = name + DOC_EXT;
  try {
    // ⛔ 이미 있으면 «편집 중인 그 파일이라도» 물어본다(워드와 같다) — 다른 문서가 조용히
    //   사라지는 것을 막는 자리다. 한글 이름은 docExists 가 NFC 로 맞춰 비교한다.
    if (await docExists(state.dir, full)
        && !window.confirm('「' + name + '」 문서가 이미 있습니다. 덮어쓸까요?')) return;
    await writeDoc(state.dir, full, serializeSwept());
    state.name = full;
    state.fileHandle = null;          // 이제 폴더의 이 파일이 «지금 문서»다
    msg('저장함: ' + full);
    await refreshList();
  } catch (e) { msg('저장하지 못했다: ' + e.message); }
});

if (!isSupported()) msg('⚠ 이 브라우저는 폴더 열기를 지원하지 않는다. 크롬·엣지로 열어야 한다');

document.getElementById('btn-pdf').addEventListener('click', () => {
  printDoc(document.getElementById('main'));
});

})();
</script>
