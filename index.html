  return Object.assign({}, doc, { variants: dupDefs(doc).concat([{ id: 'v' + vseq, name: nm }]) });
}

function renameVariant(doc, id, name) {
  const nm = checkName(doc, name, id);
  // 이름이 그대로면 바뀐 것이 없다 — reorderVariant·makeCellVariant 처럼 «같은 문서 객체»를
  // 돌려준다. 새 객체를 만들면 화면의 next === doc 가드를 그냥 지나가서, 아무것도 안 바뀐
  // 되돌리기 걸음이 쌓이고 나중에 Ctrl+Z 가 헛걸음이 된다.
  const cur = (doc.variants || []).find(v => v.id === id);
  if (cur && cur.name.normalize('NFC') === nm) return doc;
  return Object.assign({}, doc, {
    variants: dupDefs(doc).map(v => (v.id === id ? { id: v.id, name: nm } : v)),
  });
}

// dir = -1(위로) / +1(아래로)
function reorderVariant(doc, id, dir) {
  const defs = dupDefs(doc);
  const i = defs.findIndex(v => v.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= defs.length) return doc;
  const t = defs[i]; defs[i] = defs[j]; defs[j] = t;
  return Object.assign({}, doc, { variants: defs });
}

// ── 보임 판정 — cur = null(전체보기)이면 모두 보인다. 지정 없음 = 전 판 공통(P2) ──
function blockVisible(b, cur) {
  if (!cur) return true;
  const v = b && b.variants;
  return !Array.isArray(v) || v.includes(cur);
}
function rowVisible(t, r, cur) {
  if (!cur) return true;
  const v = t && Array.isArray(t.rowv) ? t.rowv[r] : null;
  return !Array.isArray(v) || v.includes(cur);
}

// 판 보기에서 «이웃 블록»은 모델 순서가 아니라 보이는 순서다(P7) — 경계 병합이 쓴다
function visibleNeighbor(blocks, id, dir, cur) {
  const i = (blocks || []).findIndex(b => b.id === id);
  if (i < 0) return null;
  for (let j = i + dir; j >= 0 && j < blocks.length; j += dir) {
    if (blockVisible(blocks[j], cur)) return blocks[j];
  }
  return null;
}

// ── 칸 벌 — 이 두 함수가 P3(다른 판 불변)의 전부다. 칸 내용을 만지는 모든 길목이 거친다 ──
const hasVal = (cell, cur) => !!(cur && cell && cell.vals
  && Object.prototype.hasOwnProperty.call(cell.vals, cur));

function cellRuns(cell, cur) {
  if (!cell) return [];
  return hasVal(cell, cur) ? cell.vals[cur] : (cell.runs || []);
}

function cellPut(cell, runs, cur) {
  if (hasVal(cell, cur)) {
    const vals = Object.assign({}, cell.vals);
    vals[cur] = runs;
    return Object.assign({}, cell, { vals });
  }
  return Object.assign({}, cell, { runs });
}

// 「이 칸 판별로」 — 지금 판의 벌을 공통값 복사로 만든다(이후 타자는 이 판 벌만 고친다)
function makeCellVariant(cell, cur) {
  if (!cur || hasVal(cell, cur)) return cell;
  const vals = Object.assign({}, cell.vals || {});
  vals[cur] = cell.runs || [];
  return Object.assign({}, cell, { vals });
}

// 「판별 풀기」 — «지금 보이는 값»을 공통으로 남기고 벌 전부 삭제 (실행 전에 벌 수를 세어 확인)
function clearCellVariant(cell, cur) {
  if (!cell || !cell.vals) return cell;
  const next = Object.assign({}, cell, { runs: cellRuns(cell, cur) });
  delete next.vals;
  return next;
}

// ── 복제·삭제 — 블록·행·칸을 한 번에 걷는 공통 걸음 ──
function mapCells(b, fn) {
  if (b.type !== 'table') return b;
  const walk = (rows) => {
    if (!Array.isArray(rows)) return rows;
    let changed = false;
    const next = rows.map((row) => {
      const nr = (row || []).map((c) => { const o = fn(c); if (o !== c) changed = true; return o; });
      return nr;
    });
    return changed ? next : rows;
  };
  const head = walk(b.head);
  const rows = walk(b.rows);
  if (head === b.head && rows === b.rows) return b;
  return Object.assign({}, b, { head, rows });
}

function duplicateVariant(doc, srcId, name) {
  const base = addVariant(doc, name);
  const nid = base.variants[base.variants.length - 1].id;
  const addRef = (list) => (Array.isArray(list) && list.includes(srcId) ? list.concat([nid]) : list);
  const blocks = (doc.blocks || []).map((b0) => {
    let b = b0;
    const v2 = addRef(b.variants);
    if (v2 !== b.variants) b = Object.assign({}, b, { variants: v2 });
    if (b0.type === 'table' && Array.isArray(b0.rowv)) {
      const rowv = b0.rowv.map(addRef);
      if (rowv.some((v, i) => v !== b0.rowv[i])) b = Object.assign({}, b, { rowv });
    }
    b = mapCells(b, (c) => {
      if (!c || !c.vals || !Object.prototype.hasOwnProperty.call(c.vals, srcId)) return c;
      const vals = Object.assign({}, c.vals);
      vals[nid] = c.vals[srcId];
      return Object.assign({}, c, { vals });
    });
    return b;
  });
  return Object.assign({}, base, { blocks });
}

// 삭제 전에 몇 건이 사라지는지 센다(설계 §4-5 확인창용)
function deleteVariantCount(doc, id) {
  let blocks = 0, rows = 0, vals = 0;
  const only = (list) => Array.isArray(list) && list.length === 1 && list[0] === id;
  for (const b of doc.blocks || []) {
    // 블록이 통째로 죽으면 «블록 1건»으로만 센다 — 속의 행·벌을 따로 세면
    // deleteVariant 는 블록 하나만 지우는데 확인창은 3건이 사라진다고 말한다(설계 §4-5)
    if (only(b.variants)) { blocks += 1; continue; }
    if (b.type !== 'table') continue;
    if (Array.isArray(b.rowv)) for (const v of b.rowv) if (only(v)) rows += 1;
    for (const rowList of [b.head, b.rows]) {
      for (const row of rowList || []) for (const c of row || []) {
        if (c && c.vals && Object.prototype.hasOwnProperty.call(c.vals, id)) vals += 1;
      }
    }
  }
  return { blocks, rows, vals };
}

function deleteVariant(doc, id) {
  const defs = dupDefs(doc).filter(v => v.id !== id);
  const strip = (list) => {
    if (!Array.isArray(list)) return list;
    const next = list.filter(x => x !== id);
    return next.length === list.length ? list : next;
  };
  const blocks = [];
  for (const b0 of doc.blocks || []) {
    const v2 = strip(b0.variants);
    if (Array.isArray(v2) && !v2.length) continue;         // 이 판에만 보이던 블록 — 사라진다
    let b = v2 === b0.variants ? b0 : Object.assign({}, b0, { variants: v2 });
    if (b0.type === 'table' && Array.isArray(b0.rowv)) {
      // 이 판에만 보이던 행을 걷어낸다 — 행 보임은 병합 묶음 단위(P6)라 병합이 안 찢어진다
      const keep = b0.rowv.map(v => !(Array.isArray(v) && v.length === 1 && v[0] === id));
      const rows = b0.rows.filter((_, i) => keep[i] !== false);
      let rowv = b0.rowv.filter((_, i) => keep[i] !== false).map(strip);
      const next = Object.assign({}, b, { rows });
      if (rowv.some(v => Array.isArray(v) && v.length)) next.rowv = rowv;
      else delete next.rowv;
      b = next;
    }
    b = mapCells(b, (c) => {
      if (!c || !c.vals || !Object.prototype.hasOwnProperty.call(c.vals, id)) return c;
      const vals = Object.assign({}, c.vals);
      delete vals[id];
      const nc = Object.assign({}, c);
      if (Object.keys(vals).length) nc.vals = vals; else delete nc.vals;
      return nc;
    });
    blocks.push(b);
  }
  return Object.assign({}, doc, { variants: defs, blocks });
}

// 읽기 위생 — 정의에 없는 판 id 참조를 뗀다. 글은 절대 안 지운다(다 유령이면 공통으로 살린다).
function repairVariants(blocks, defs) {
  const ok = new Set((defs || []).map(v => v.id));
  const fixList = (list) => {
    if (!Array.isArray(list)) return null;
    const next = list.filter(x => ok.has(x));
    return next.length ? next : null;
  };
  return (blocks || []).map((b0) => {
    let b = b0;
    if (Array.isArray(b0.variants)) {
      const v = fixList(b0.variants);
      if (JSON.stringify(v) !== JSON.stringify(b0.variants)) b = Object.assign({}, b, { variants: v });
    }
    if (b0.type === 'table' && Array.isArray(b0.rowv)) {
      let rowv = b0.rowv.slice(0, (b0.rows || []).length).map(fixList);
      while (rowv.length < (b0.rows || []).length) rowv.push(null);
      const next = Object.assign({}, b);
      if (rowv.some(v => Array.isArray(v) && v.length)) next.rowv = rowv;
      else delete next.rowv;
      b = next;
    }
    b = mapCells(b, (c) => {
      if (!c || !c.vals) return c;
      const keys = Object.keys(c.vals).filter(k => ok.has(k));
      if (keys.length === Object.keys(c.vals).length) return c;
      const nc = Object.assign({}, c);
      if (keys.length) {
        nc.vals = {};
        for (const k of keys) nc.vals[k] = c.vals[k];
      } else delete nc.vals;
      return nc;
    });
    return b;
  });
}

/* table.js */
// 표 순수 계산 — DOM 을 모른다. 표를 제자리에서 고치지 않고 항상 새 객체를 만든다.
// 표 = { type:'table', cols:[{w,align?}], head:[[cell,…]](0~1행), rows:[[cell,…],…] }
// cell = { runs:Run[], align?, bg?, cs?, rs?, cov? }
// ⭐ 격자는 항상 직사각형이다(rows[r].length === cols.length). 병합은 칸을 지우는 게 아니라
//    기준 칸에 cs/rs 를 붙이고 덮인 칸을 cov:1 로 남긴다 — 너비 계산·장 나눔이 여기 기댄다.
// ⛔ 병합은 몸통 행끼리만. 머리글 행은 1행짜리 단순 행이다(계획 R10).



const MIN_COL_W = 30;

const cloneRows = (rows) => rows.map(row => row.slice());
const bare = (cell) => { const n = Object.assign({}, cell); delete n.cs; delete n.rs; delete n.cov; return n; };

// rowv(행 보임 — 설계_판.md ⓑ)를 rows 와 나란히 유지한다. 없으면 없이 산다(전 판 공통).
const rowvOf = (t) => (Array.isArray(t.rowv) ? t.rowv.slice() : null);
const withRowv = (t2, rowv) => {
  if (!rowv || !rowv.some(v => Array.isArray(v) && v.length)) { delete t2.rowv; return t2; }
  t2.rowv = rowv;
  return t2;
};

// (r,c) 를 덮는 병합의 기준 칸 좌표. 덮이지 않았으면 자기 자신.
function anchorOf(t, r, c) {
  if (!t.rows[r] || !t.rows[r][c] || !t.rows[r][c].cov) return [r, c];
  for (let ar = 0; ar <= r; ar++) for (let ac = 0; ac < t.cols.length; ac++) {
    const cell = t.rows[ar] && t.rows[ar][ac];
    if (!cell || cell.cov) continue;
    if (ar + (cell.rs || 1) > r && ac <= c && ac + (cell.cs || 1) > c) return [ar, ac];
  }
  return [r, c];
}

function addRow(t, at) {
  const n = t.cols.length;
  const rows = cloneRows(t.rows);
  const fresh = Array.from({ length: n }, () => ({ runs: [] }));
  if (at > 0 && at < rows.length) {
    for (let c = 0; c < n; c++) {
      const [ar, ac] = anchorOf(t, at, c);
      const cell = t.rows[ar][ac];
      if (ar < at && ar + (cell.rs || 1) > at) {        // 삽입 지점을 세로로 가로지르는 병합
        if (c === ac) rows[ar][ac] = Object.assign({}, cell, { rs: (cell.rs || 1) + 1 });
        fresh[c] = { runs: [], cov: 1 };
      }
    }
  }
  rows.splice(at, 0, fresh);
  const crossed = fresh.some(c => c.cov);      // 세로 병합을 가로지르는 자리인가
  const rowv = rowvOf(t);
  if (rowv) rowv.splice(at, 0, crossed ? (rowv[at] || null) : null);
  return withRowv(Object.assign({}, t, { rows }), rowv);
}

function delRow(t, at) {
  if (t.rows.length <= 1) return t;                     // 마지막 행은 «표 지우기»로만
  const rows = [];
  for (let r = 0; r < t.rows.length; r++) if (r !== at) rows.push(t.rows[r].slice());
  for (let c = 0; c < t.cols.length; c++) {
    const cell = t.rows[at][c];
    if (cell.cov) {
      const [ar, ac] = anchorOf(t, at, c);
      if (ar === at || c !== ac) continue;              // 기준이 지워지는 행이면 아래에서 처리
      const a = t.rows[ar][ac];
      const next = Object.assign({}, a, { rs: (a.rs || 1) - 1 });
      if (next.rs <= 1) delete next.rs;
      rows[ar][ac] = next;                              // ar < at 이라 새 배열에서도 같은 자리
    } else if ((cell.rs || 1) > 1) {
      const moved = Object.assign({}, cell, { rs: cell.rs - 1 });   // 글을 아래 칸에 물려준다
      if (moved.rs <= 1) delete moved.rs;
      rows[at][c] = moved;                              // 원래 at+1 행이 새 배열에서 at
    }
  }
  const rowv = rowvOf(t);
  if (rowv) rowv.splice(at, 1);
  return withRowv(Object.assign({}, t, { rows }), rowv);
}

function addCol(t, at, total) {
  const n = t.cols.length;
  const cols = t.cols.map(c => Object.assign({}, c));
  // ⛔ 새 열을 «최소폭(30)»으로 만들지 않는다 — 2026-09-01 SKY: "추가 되는 열의 너비가 너무
  //    좁게 되거나 하는 문제가 있어." 3열 [208,250,244] 에 하나 넣으면 [199,30,240,233] 이
  //    되어 글자 한 자도 안 들어갔다[실측]. 아래 normalizeWidths 가 합을 종이 폭에 맞추므로
  //    여기서는 «얼마나 넓게 시작할지»만 정하면 된다.
  // ⭐ 옆 열을 보고 따라 만든다 — 좁은 열 옆에 넣으면 좁게, 넓은 열 옆에 넣으면 넓게.
  //    사람이 「이 열 옆에 하나 더」 라고 생각하는 것과 같은 결과가 나온다.
  const 이웃 = cols[at - 1] || cols[at] || null;
  cols.splice(at, 0, { w: Math.max(MIN_COL_W, 이웃 ? 이웃.w : Math.round(total / (n + 1))) });
  const rows = t.rows.map((row, r) => {
    const next = row.slice();
    let fresh = { runs: [] };
    if (at > 0 && at < n) {
      const [ar, ac] = anchorOf(t, r, at);
      const cell = t.rows[ar][ac];
      if (ac < at && ac + (cell.cs || 1) > at) {        // 삽입 지점을 가로로 가로지르는 병합
        if (r === ar && next[ac] === row[ac]) next[ac] = Object.assign({}, cell, { cs: (cell.cs || 1) + 1 });
        fresh = { runs: [], cov: 1 };
      }
    }
    next.splice(at, 0, fresh);
    return next;
  });
  // ⚠ 머리글에도 가로 병합(cs·cov)이 있을 수 있다 — 임의 칸 나누기(R16)가 만든다
  let head = t.head;
  if (head && head.length) {
    const hrow = head[0].slice();
    let fresh = { runs: [] };
    if (at > 0 && at < n) {
      const oi = rowAnchor(hrow, at);
      if (oi < at && oi + (hrow[oi].cs || 1) > at) {
        hrow[oi] = Object.assign({}, hrow[oi], { cs: (hrow[oi].cs || 1) + 1 });
        fresh = { runs: [], cov: 1 };
      }
    }
    hrow.splice(at, 0, fresh);
    head = [hrow];
  }
  return normalizeWidths(Object.assign({}, t, { cols, rows, head }), total);
}

function delCol(t, at, total) {
  if (t.cols.length <= 1) return t;
  const cols = t.cols.filter((_, i) => i !== at).map(c => Object.assign({}, c));
  const rows = t.rows.map((row, r) => {
    const next = row.slice();
    const cell = row[at];
    if (cell.cov) {
      const [ar, ac] = anchorOf(t, r, at);
      if (r === ar && ac !== at) {                      // 기준이 왼쪽에 있는 가로 병합
        const a = t.rows[ar][ac];
        const n2 = Object.assign({}, a, { cs: (a.cs || 1) - 1 });
        if (n2.cs <= 1) delete n2.cs;
        next[ac] = n2;
      }
    } else if ((cell.cs || 1) > 1) {
      const moved = Object.assign({}, cell, { cs: cell.cs - 1 });   // 글을 오른쪽 칸에 물려준다
      if (moved.cs <= 1) delete moved.cs;
      next[at + 1] = moved;
    }
    next.splice(at, 1);
    return next;
  });
  let head = t.head;
  if (head && head.length) {
    const hrow = head[0].slice();
    const hc = hrow[at];
    if (hc.cov) {
      const oi = rowAnchor(hrow, at);
      if (oi !== at) {
        const a = Object.assign({}, hrow[oi], { cs: (hrow[oi].cs || 1) - 1 });
        if (a.cs <= 1) delete a.cs;
        hrow[oi] = a;
      }
    } else if ((hc.cs || 1) > 1) {
      const moved = Object.assign({}, hc, { cs: hc.cs - 1 });
      if (moved.cs <= 1) delete moved.cs;
      hrow[at + 1] = moved;
    }
    hrow.splice(at, 1);
    head = [hrow];
  }
  return normalizeWidths(Object.assign({}, t, { cols, rows, head }), total);
}

// ⛔ 글이 사라지지 않는다 — 덮일 칸들의 글을 기준 칸에 줄바꿈으로 모은다(계획 R8).
function mergeCells(t, r1, c1, r2, c2) {
  let a = Math.min(r1, r2), z = Math.max(r1, r2);
  let l = Math.min(c1, c2), x = Math.max(c1, c2);
  let grew = true;                                      // 겹치는 기존 병합을 다 품을 때까지
  while (grew) {
    grew = false;
    for (let r = 0; r < t.rows.length; r++) for (let c = 0; c < t.cols.length; c++) {
      const cell = t.rows[r][c];
      if (cell.cov) continue;
      const rs = cell.rs || 1, cs = cell.cs || 1;
      if (r > z || r + rs - 1 < a || c > x || c + cs - 1 < l) continue;
      if (r < a) { a = r; grew = true; }
      if (c < l) { l = c; grew = true; }
      if (r + rs - 1 > z) { z = r + rs - 1; grew = true; }
      if (c + cs - 1 > x) { x = c + cs - 1; grew = true; }
    }
  }
  if (a === z && l === x) return t;
  // 행 보임이 다른 행끼리 세로로 묶으면 묶음 단위 보임(P6)이 깨진다 — 거부한다
  if (z > a && Array.isArray(t.rowv)) {
    const key = (v) => JSON.stringify(Array.isArray(v) && v.length ? v : null);
    const k0 = key(t.rowv[a]);
    for (let r2 = a + 1; r2 <= z; r2++) if (key(t.rowv[r2]) !== k0) return t;
  }
  const rows = cloneRows(t.rows);
  // 벌이 있는 판을 모은다 — 그 판마다 «그 판으로 보이던 값»끼리 합쳐 벌로 남긴다(P3)
  const valKeys = new Set();
  for (let r = a; r <= z; r++) for (let c = l; c <= x; c++) {
    const cell = t.rows[r][c];
    if (!cell.cov && cell.vals) for (const k of Object.keys(cell.vals)) valKeys.add(k);
  }
  const joinFor = (cur) => {
    const joined = [];
    for (let r = a; r <= z; r++) for (let c = l; c <= x; c++) {
      const cell = t.rows[r][c];
      if (cell.cov) continue;
      const rs2 = cellRuns(cell, cur);
      if (!runsLength(rs2 || [])) continue;
      if (joined.length) joined.push({ t: '\n' });
      joined.push(...rs2);
    }
    return normalizeRuns(joined);
  };
  for (let r = a; r <= z; r++) for (let c = l; c <= x; c++) {
    if (r === a && c === l) {
      const base = bare(t.rows[a][l]);
      base.runs = joinFor(null);
      if (valKeys.size) {
        base.vals = {};
        for (const k of valKeys) base.vals[k] = joinFor(k);
      } else delete base.vals;
      if (z > a) base.rs = z - a + 1;
      if (x > l) base.cs = x - l + 1;
      // ⭐ 묶은 칸은 가운데 정렬로 시작한다 (2026-09-01 SKY: "문구 들도 지금 다 좌측 정렬
      //    되어 있어. 가운데 정렬 하고"). 두 칸을 묶으면 글이 넓어진 칸의 왼쪽에 붙어
      //    «치우쳐» 보인다. 묶은 칸은 대개 그 구역을 대표하는 이름이라 가운데가 맞다.
      // ⚠ 사람이 이미 그 칸의 정렬을 정해 뒀으면 그것을 지킨다 — 남의 결정을 덮지 않는다.
      //   (열 정렬은 «칸 정렬»보다 약하므로 여기서 칸에 붙이면 이긴다. 정렬 단추로 언제든 바꾼다.)
      if (!base.align) base.align = 'center';
      rows[r][c] = base;
    } else rows[r][c] = { runs: [], cov: 1 };
  }
  return Object.assign({}, t, { rows });
}

function splitCell(t, r, c) {
  const [ar, ac] = anchorOf(t, r, c);
  const cell = t.rows[ar][ac];
  const rs = cell.rs || 1, cs = cell.cs || 1;
  if (rs === 1 && cs === 1) return t;
  const rows = cloneRows(t.rows);
  for (let i = ar; i < ar + rs; i++) for (let j = ac; j < ac + cs; j++) {
    rows[i][j] = (i === ar && j === ac) ? bare(cell) : { runs: [] };
  }
  return Object.assign({}, t, { rows });
}

// 세로 병합으로 묶인 행 덩어리 — 장 나눔이 이 단위로만 일어난다(계획 R12).
// 칸 하나를 읽고·갈아 끼운다. cell = [r, c] 이고 r 이 'h' 면 머리글 줄이다.
// ⭐ 화면 쪽 여러 곳(판별 값 창·부품 값 넣기)이 같은 일을 하므로 «한 곳»에 둔다 —
//    베껴 두면 한쪽만 고쳐져서 머리글 칸에서만 안 되는 식의 결함이 생긴다.
function cellAt(t, cell) {
  if (!t || t.type !== 'table' || !cell) return null;
  const row = cell[0] === 'h' ? (t.head || [])[0] : (t.rows || [])[cell[0]];
  return (row && row[cell[1]]) || null;
}

// ⛔ 바꿀 것이 없으면 «같은 표 객체»를 그대로 돌려준다 — 새 객체를 만들면 화면의
//    next === doc 가드를 지나가서, 아무것도 안 바뀐 되돌리기 걸음이 쌓이고
//    나중에 Ctrl+Z 가 헛걸음이 된다(renameVariant·commitTable 과 같은 가드다).
function setCellAt(t, cell, next) {
  if (!t || t.type !== 'table' || !cell) return t;
  if (cellAt(t, cell) === next) return t;
  if (cell[0] === 'h') {
    if (!(t.head || [])[0]) return t;
    const head = [t.head[0].slice()];
    head[0][cell[1]] = next;
    return Object.assign({}, t, { head });
  }
  if (!(t.rows || [])[cell[0]]) return t;
  const rows = t.rows.slice();
  const row = rows[cell[0]].slice();
  row[cell[1]] = next;
  rows[cell[0]] = row;
  return Object.assign({}, t, { rows });
}

function rowGroups(t) {
  const groups = [];
  let r = 0;
  while (r < t.rows.length) {
    let to = r;
    for (let rr = r; rr <= to; rr++) for (let c = 0; c < t.cols.length; c++) {
      const [ar, ac] = anchorOf(t, rr, c);
      const cell = t.rows[ar][ac];
      const end = ar + (cell.rs || 1) - 1;
      if (end > to) to = end;
    }
    groups.push([r, to]);
    r = to + 1;
  }
  return groups;
}

// 행 보임 지정 — 세로 병합 묶음 단위로만(P6). list = null(공통) 또는 판 id 배열.
function setRowVariants(t, r, list) {
  const g = rowGroups(t).find(([a, z]) => r >= a && r <= z) || [r, r];
  const rowv = Array.isArray(t.rowv) ? t.rowv.slice() : new Array(t.rows.length).fill(null);
  while (rowv.length < t.rows.length) rowv.push(null);
  for (let i = g[0]; i <= g[1]; i++) rowv[i] = Array.isArray(list) && list.length ? list.slice() : null;
  return withRowv(Object.assign({}, t), rowv);
}

// 합을 «정확히» total 로 맞춘다.
// ⛔ 예전에는 남는 것을 마지막 열에 몰아줬는데, 그 열이 최소폭에 걸리면 합이 total 을
//    넘어 표가 종이 밖으로 삐져나갔다 — 맨 끝에 열을 하나 넣으면 674 가 677 이 됐다(실측
//    2026-08-30, SKY 지적으로 발견). 이제 남거나 모자란 만큼을 1px 씩 나눠 주고받는다.
// ⚠ 열이 아주 많아 최소폭(30)조차 못 채우면 그때는 최소폭을 낮춘다 — 종이 밖으로
//    나가느니 좁게라도 안에 들어오는 편이 낫다.
function normalizeWidths(t, total) {
  const n = t.cols.length;
  const cols = t.cols.map(c => Object.assign({}, c));
  if (!n) return Object.assign({}, t, { cols });
  const floor = Math.min(MIN_COL_W, Math.floor(total / n));
  let sum = 0;
  for (const c of cols) { c.w = Math.max(floor, Math.round(Number(c.w) || 0)); sum += c.w; }
  let acc = 0;
  for (let i = 0; i < n; i++) {
    cols[i].w = Math.max(floor, Math.round(cols[i].w * total / sum));
    acc += cols[i].w;
  }
  let diff = total - acc;                       // 남았으면 +, 모자라면 −
  while (diff !== 0) {
    let moved = false;
    for (let i = n - 1; i >= 0 && diff !== 0; i--) {
      if (diff > 0) { cols[i].w += 1; diff -= 1; moved = true; }
      else if (cols[i].w > floor) { cols[i].w -= 1; diff += 1; moved = true; }
    }
    if (!moved) break;                          // 더 줄일 곳이 없다 — 무한 반복은 막는다
  }
  return Object.assign({}, t, { cols });
}

// i번째 경계 끌기 — i열과 i+1열이 주고받아 합이 안 변한다(계획 R13).
function setColWidth(t, i, w) {
  if (i < 0 || i >= t.cols.length - 1) return t;
  const cols = t.cols.map(c => Object.assign({}, c));
  const pair = cols[i].w + cols[i + 1].w;
  const nw = Math.max(MIN_COL_W, Math.min(Math.round(w), pair - MIN_COL_W));
  cols[i].w = nw;
  cols[i + 1].w = pair - nw;
  return Object.assign({}, t, { cols });
}

// 칸 «속»의 고른 구간만 지운다. 구조는 그대로다(계획 R5).
// cur = 지금 보고 있는 판. 벌이 있는 칸이면 그 판의 벌만 비운다 — 다른 판은 불변(P3).
function clearCellRanges(t, targets, cur) {
  const rows = cloneRows(t.rows);
  const head = t.head && t.head.length ? [t.head[0].slice()] : t.head;
  for (const g of targets || []) {
    const row = g.r === 'h' ? (head && head[0]) : rows[g.r];
    const cell = row && row[g.c];
    if (!cell || cell.cov) continue;
    const src = cellRuns(cell, cur);
    const len = runsLength(src);
    const runs = normalizeRuns(sliceRuns(src, 0, g.from)
      .concat(sliceRuns(src, g.to, len)));
    row[g.c] = cellPut(cell, runs, cur);
  }
  return Object.assign({}, t, { rows, head });
}

function tableText(t) {
  const line = (row) => (row || []).filter(c => !c.cov).map(c => runsText(c.runs || [])).join('\t');
  return (t.head || []).map(line).concat((t.rows || []).map(line)).join('\n');
}

// ── 임의 칸 나누기(계획 R16 — 워드의 «셀 분할») ──
// 홑칸을 나누려면 그 자리에 격자 눈금이 하나 더 필요하다 → 격자 열(행)을 복제하되
// 같은 줄의 다른 칸들은 병합(cs/rs)을 1 키워 겉모습이 안 변하게 한다.
// ⚠ 그래서 «머리글 칸에도 cs·cov 가 생길 수 있다» — 그리기와 열 넣기/빼기가 이를 안다.

// 한 행 «안»에서 at 위치를 덮는(가로 병합) 칸의 번호. 세로 병합은 모른다 — 머리글용.
function rowAnchor(row, at) {
  for (let i = at; i >= 0; i--) {
    if (row[i] && row[i].cov) continue;
    if (row[i] && i + (row[i].cs || 1) > at) return i;
    break;
  }
  return at;
}

// 격자 열 at 를 둘로 복제한다 — at 의 너비를 반씩 나눠 갖고, 모든 줄에서 그 자리를
// 소유한 칸의 cs 가 1 커져 겉모습이 안 변한다. (임의 나누기의 밑작업)
function dupGridCol(t, at) {
  const cols = t.cols.map(c => Object.assign({}, c));
  const half = Math.max(MIN_COL_W, Math.round(cols[at].w / 2));
  const rest = Math.max(MIN_COL_W, (cols[at].w || half * 2) - half);
  cols[at] = Object.assign({}, cols[at], { w: half });
  cols.splice(at + 1, 0, { w: rest });
  const rows = t.rows.map((row, r) => {
    const next = row.slice();
    const [ar, ac] = anchorOf(t, r, at);
    if (r === ar) next[ac] = Object.assign({}, t.rows[ar][ac], { cs: (t.rows[ar][ac].cs || 1) + 1 });
    next.splice(at + 1, 0, { runs: [], cov: 1 });
    return next;
  });
  let head = t.head;
  if (head && head.length) {
    const hrow = head[0].slice();
    const oi = rowAnchor(hrow, at);
    hrow[oi] = Object.assign({}, hrow[oi], { cs: (hrow[oi].cs || 1) + 1 });
    hrow.splice(at + 1, 0, { runs: [], cov: 1 });
    head = [hrow];
  }
  return Object.assign({}, t, { cols, rows, head });
}

// 몸통 행 at 를 둘로 복제한다 — 모든 열에서 그 자리를 소유한 칸의 rs 가 1 커진다.
function dupGridRow(t, at) {
  const rows = cloneRows(t.rows);
  const fresh = [];
  for (let c = 0; c < t.cols.length; c++) {
    const [ar, ac] = anchorOf(t, at, c);
    if (c === ac) rows[ar][ac] = Object.assign({}, t.rows[ar][ac], { rs: (t.rows[ar][ac].rs || 1) + 1 });
    fresh.push({ runs: [], cov: 1 });
  }
  rows.splice(at + 1, 0, fresh);
  const rowv = rowvOf(t);
  if (rowv) rowv.splice(at + 1, 0, rowv[at] || null);   // 같은 묶음 — 보임을 물려받는다(P6)
  return withRowv(Object.assign({}, t, { rows }), rowv);
}

// 직사각형 구역을 «왼/위 조각(글 전부) + 오른/아래 조각(빈 칸) + 나머지 cov» 로 다시 깐다
function repave(rows, ar, ac, rs, cs, splitAtCol, splitAtRow, keep) {
  for (let i = ar; i < ar + rs; i++) for (let j = ac; j < ac + cs; j++) {
    if (i === ar && j === ac) {
      const a = Object.assign({}, keep);
      const w1 = (splitAtCol || ac + cs) - ac;
      const h1 = (splitAtRow || ar + rs) - ar;
      if (w1 > 1) a.cs = w1; else delete a.cs;
      if (h1 > 1) a.rs = h1; else delete a.rs;
      rows[i][j] = a;
    } else if (splitAtCol && i === ar && j === splitAtCol) {
      const b = { runs: [] };
      if (ac + cs - splitAtCol > 1) b.cs = ac + cs - splitAtCol;
      if (rs > 1) b.rs = rs;
      rows[i][j] = b;
    } else if (splitAtRow && i === splitAtRow && j === ac) {
      const b = { runs: [] };
      if (cs > 1) b.cs = cs;
      if (ar + rs - splitAtRow > 1) b.rs = ar + rs - splitAtRow;
      rows[i][j] = b;
    } else rows[i][j] = { runs: [], cov: 1 };
  }
}

// 칸을 옆으로 둘로 나눈다(R16). 홑칸이면 격자 열을 복제해 자리를 만든다.
function splitCellAcross(t, r, c, total) {
  const [ar, ac] = anchorOf(t, r, c);
  let base = t;
  if ((t.rows[ar][ac].cs || 1) === 1) base = dupGridCol(t, ac);
  const cell = base.rows[ar][ac];
  const cs = cell.cs || 1;
  const rs = cell.rs || 1;
  const rows = cloneRows(base.rows);
  repave(rows, ar, ac, rs, cs, ac + Math.ceil(cs / 2), null, bare(cell));
  return normalizeWidths(Object.assign({}, base, { rows }), total);
}

// 칸을 아래로 둘로 나눈다(R16). 홑칸이면 몸통 행을 복제해 자리를 만든다.
function splitCellDown(t, r, c) {
  const [ar, ac] = anchorOf(t, r, c);
  let base = t;
  if ((t.rows[ar][ac].rs || 1) === 1) base = dupGridRow(t, ar);
  const cell = base.rows[ar][ac];
  const cs = cell.cs || 1;
  const rs = cell.rs || 1;
  const rows = cloneRows(base.rows);
  repave(rows, ar, ac, rs, cs, null, ar + Math.ceil(rs / 2), bare(cell));
  return Object.assign({}, base, { rows });
}

// 머리글 행을 켜고 끈다 (2026-08-30 SKY: "표에서 머리글도 안쓰는 표도 있어").
// 켜기 = 첫 몸통 행을 머리글로 «올린다» · 끄기 = 머리글을 몸통 맨 앞으로 «내린다».
// 글은 어느 쪽으로도 사라지지 않는다 — 자리만 옮긴다.
// ⛔ 머리글은 세로 병합을 가질 수 없다 — 장을 넘을 때 머리글만 다시 그려야 하는데
//    세로로 묶인 칸은 그 아래 행까지 딸려 와야 해서 성립하지 않는다(계획 R10·R11).
//    그래서 올릴 행에 세로 병합이 걸려 있으면 그대로 둔다.
function toggleHead(t) {
  if (t.head && t.head.length) {
    const down = t.head[0].map(c => Object.assign({}, c));
    const rowv = rowvOf(t);
    if (rowv) rowv.unshift(null);                       // 내려온 행은 공통으로(P2)
    return withRowv(Object.assign({}, t, { head: [], rows: [down].concat(cloneRows(t.rows)) }), rowv);
  }
  if (!t.rows.length) return t;
  if (t.rows[0].some(c => (c.rs || 1) > 1)) return t;
  if (Array.isArray(t.rowv) && Array.isArray(t.rowv[0]) && t.rowv[0].length) return t;  // P6: 머리글은 늘 공통
  const rowv = rowvOf(t);
  if (rowv) rowv.shift();
  return withRowv(Object.assign({}, t, {
    head: [t.rows[0].map(c => Object.assign({}, c))],
    rows: cloneRows(t.rows.slice(1)),
  }), rowv);
}

/* blocks.js */



const BLOCK_TYPES = ['heading', 'section', 'para', 'list', 'table', 'image'];

let seq = 0;
function resetIds(n = 0) { seq = n; }
function newId() { seq += 1; return 'b' + seq; }
function adoptIds(blocks) {
  for (const b of blocks || []) {
    const m = /^b(\d+)$/.exec(b && b.id ? String(b.id) : '');
    if (m) seq = Math.max(seq, Number(m[1]));
  }
}

function createBlock(type, props = {}) {
  if (!BLOCK_TYPES.includes(type)) throw new Error('알 수 없는 블록 종류: ' + type);
  const base = { id: newId(), type, variants: null };
  if (type === 'section') return Object.assign(base, { no: props.no || '', title: props.title || '' });
  if (type === 'image') {
    return Object.assign(base, {
      src: props.src || '',
      w: props.w || 0,                       // 표시 폭 px. 높이는 원본 비율로 계산(설계 §2-4)
      align: props.align || 'center',
      caption: props.caption ? normalizeRuns(props.caption) : [],
    });
  }
  if (type === 'table') {
    const ncols = props.cols ? props.cols.length : (props.ncols || 3);
    const empty = () => ({ runs: [] });
    // 삽입하는 쪽이 normalizeWidths 로 실제 텍스트 폭에 맞춘다
    const cols = props.cols ? props.cols.map(c => Object.assign({}, c))
      : Array.from({ length: ncols }, () => ({ w: Math.floor(674 / ncols) }));
    const head = props.head !== undefined ? props.head : [Array.from({ length: ncols }, empty)];
    const rows = props.rows || Array.from({ length: props.nrows || 3 },
      () => Array.from({ length: ncols }, empty));
    return Object.assign(base, { cols, head, rows });
  }
  if (type === 'list') {
    const items = Array.isArray(props.items) && props.items.length
      ? props.items.map(normalizeRuns)
      : [[]];
    return Object.assign(base, { ordered: props.ordered ? 1 : 0, items, align: null });
  }
  const runs = props.runs ? normalizeRuns(props.runs) : runsFromText(props.text || '');
  const common = { runs, align: props.align || null };
  if (type === 'heading') return Object.assign(base, common, { level: props.level || 1 });
  return Object.assign(base, common);
}

function blockText(b) {
  if (!b) return '';
  if (b.type === 'section') return [b.no, b.title].filter(Boolean).join(' ');
  if (b.type === 'table') return tableText(b);
  if (b.type === 'image') return runsText(b.caption || []);
  if (b.type === 'list') return (b.items || []).map(runsText).join('\n');
  if (Array.isArray(b.runs)) return runsText(b.runs);
  return b.text || '';
}

/* assets.js */
// 그림 보관함 — 문서 안 assets 칸을 다스린다. DOM 을 모른다(core 규칙).
// 담기(중복 제거)·청소(참조 없는 그림 제거)·되읽기 입양·읽기 복구.
// ⛔ 최상위 이름 주의: 빌드가 모듈을 한 덩어리로 합친다 — aseq 는 이 파일만 쓴다.


let aseq = 0;
function resetAssetIds(n = 0) { aseq = n; }
function adoptAssetIds(assets) {
  for (const k of Object.keys(assets || {})) {
    const m = /^a(\d+)$/.exec(k);
    if (m) aseq = Math.max(aseq, Number(m[1]));
  }
}

// djb2 — 빠른 지문. 충돌 대비로 data 문자열도 비교한다(설계 §2-1)
function hashData(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36) + '-' + s.length;
}

function addAsset(assets, data, w, h) {
  const hash = hashData(data);
  for (const id of Object.keys(assets || {})) {
    const a = assets[id];
    if (a && a.hash === hash && a.data === data) return { assets, id };
  }
  aseq += 1;
  const id = 'a' + aseq;
  const one = {};
  one[id] = { data, w, h, hash };
  return { assets: Object.assign({}, assets, one), id };
}

// 블록 하나가 품은 모든 토막 배열에 fn 을 부른다 — 문단·목록·표(머리글+몸통)·캡션
function eachRuns(b, fn) {
  if (!b) return;
  if (Array.isArray(b.runs)) fn(b.runs);
  if (Array.isArray(b.items)) for (const it of b.items) fn(it);
  if (Array.isArray(b.caption)) fn(b.caption);
  for (const rows of [b.head, b.rows]) {
    if (!Array.isArray(rows)) continue;
    for (const row of rows) for (const c of row || []) {
      if (!c) continue;
      if (Array.isArray(c.runs)) fn(c.runs);
      // 판별 값(vals) 속 그림도 «쓰는 그림»이다 — 안 걷으면 저장 청소가 조용히 지운다(설계_판 §2-2)
      if (c.vals && typeof c.vals === 'object') {
        for (const k of Object.keys(c.vals)) if (Array.isArray(c.vals[k])) fn(c.vals[k]);
      }
    }
  }
}

function collectAssetIds(blocks) {
  const used = new Set();
  for (const b of blocks || []) {
    if (b && b.type === 'image' && b.src) used.add(b.src);
    eachRuns(b, (runs) => { for (const r of runs || []) if (r && r.img) used.add(r.img); });
  }
  return used;
}

// 저장·읽기 때만 부른다(설계 §2-3). blocksLists = [지금 blocks, …되돌리기 기록의 blocks들]
function sweepAssets(assets, blocksLists) {
  const used = new Set();
  for (const blocks of blocksLists || []) {
    for (const id of collectAssetIds(blocks)) used.add(id);
  }
  const next = {};
  let changed = false;
  for (const id of Object.keys(assets || {})) {
    if (used.has(id)) next[id] = assets[id];
    else changed = true;
  }
  return changed ? next : (assets || {});
}

// 되읽은 토막의 임시 그림(src$)을 보관함에 담아 img 번호로 바꾼다(중복이면 기존 번호).
// http 주소·모르는 번호는 버린다 — 조용한 네트워크 의존 금지(설계 §5).
function adoptImages(runs, assets) {
  let a = assets || {};
  let changed = false;
  const out = [];
  for (const r of runs || []) {
    if (!r || (!r.src$ && !r.img)) { out.push(r); continue; }
    if (r.img && !r.src$) {
      if (a[r.img]) out.push(r);
      else changed = true;                                   // 미아 — 버린다
      continue;
    }
    const src = r.src$;
    changed = true;
    if (typeof src !== 'string' || src.indexOf('data:image/') !== 0) continue;
    const got = addAsset(a, src, r.w || 0, r.h || 0);
    a = got.assets;
    out.push({ t: OBJ, img: got.id, w: r.w || a[got.id].w, h: r.h || a[got.id].h });
  }
  return { runs: out, assets: a, changed };
}

// 읽기 복구(R5): img 토막의 t 를 OBJ 1글자로 강제하고, 보관함에 없는 그림 토막은 뺀다.
function repairBlocks(blocks, assets) {
  const fix = (runs) => (runs || []).filter(r => !(r && r.img && !(assets || {})[r.img]))
    .map(r => (r && r.img && r.t !== OBJ ? Object.assign({}, r, { t: OBJ }) : r));
  // 칸 하나 — 공통값(runs)과 판별 값(vals)을 같이 고친다(설계_판 §2-2). 제자리 수정 안 한다.
  const fixCell = (c) => {
    if (!c) return c;
    let nc = c;
    if (Array.isArray(c.runs)) nc = Object.assign({}, nc, { runs: fix(c.runs) });
    if (c.vals && typeof c.vals === 'object') {
      const vals = {};
      for (const k of Object.keys(c.vals)) {
        vals[k] = Array.isArray(c.vals[k]) ? fix(c.vals[k]) : c.vals[k];
      }
      nc = Object.assign({}, nc, { vals });
    }
    return nc;
  };
  return (blocks || []).map((b) => {
    if (!b) return b;
    const next = Object.assign({}, b);
    if (Array.isArray(b.runs)) next.runs = fix(b.runs);
    if (Array.isArray(b.items)) next.items = b.items.map(fix);
    if (Array.isArray(b.caption)) next.caption = fix(b.caption);
    for (const key of ['head', 'rows']) {
      if (!Array.isArray(b[key])) continue;
      next[key] = b[key].map(row => (row || []).map(c => fixCell(c)));
    }
    return next;
  });
}

const DOC_VERSION = 5;   // 4→5: 판 — variants 정의·블록/행 보임·칸 판별 값 (설계_판.md)

// ⭐ 2026-09-01 SKY: "전체 여백을 좀더 좁게 써서, 더 많은 내용이 들어 갈 수 있게.
//    지금은 여백이 많아보여, 양옆 위아래." 옛 값은 46/60/34/60(텍스트 폭 674)이었다.
//    ⚠ 이 값은 «새 문서»에만 쓰인다 — 이미 저장한 문서는 제 여백을 그대로 갖고 있다
//      (deserialize 가 파일의 page 를 이깁니다). 그래야 만들어 둔 서류의 쪽 나눔이 안 바뀐다.
const DEFAULT_PAGE = {
  width: 794, height: 1123,
  margin: { top: 34, right: 46, bottom: 26, left: 46 },
};

function createDocument(meta = {}) {
  return {
    version: DOC_VERSION,
    meta: Object.assign({ title: '', subtitle: '', category: '', doc: '', rev: '', date: '' }, meta),
    variants: [],
    assets: {},
    page: JSON.parse(JSON.stringify(DEFAULT_PAGE)),
    blocks: [createBlock('para')],
  };
}

function serialize(doc) { return JSON.stringify(doc, null, 1); }

// 1단계 파일은 글자를 통짜(text)로 갖고 있다. 토막(runs)으로 바꿔 읽는다.
// ⛔ text 를 남겨 두지 않는다 — 둘이 남으면 어느 쪽이 참인지 알 수 없어진다.
function migrateBlock(b) {
  if (!b || typeof b !== 'object') return b;
  // 그림 블록은 runs 가 없다 — 가드가 없으면 빈 runs 가 붙어 «글 칸»으로 오해받는다
  if (b.type === 'section' || b.type === 'image' || Array.isArray(b.runs)) return b;
  const next = Object.assign({}, b, { runs: runsFromText(b.text || '') });
  delete next.text;
  return next;
}

function deserialize(text) {
  let o;
  try { o = JSON.parse(text); }
  catch (e) { throw new Error('문서 파일을 읽을 수 없다 — JSON 이 아니다: ' + e.message); }
  if (!o || typeof o !== 'object') throw new Error('문서 파일을 읽을 수 없다 — 내용이 비었다');
  if (typeof o.version !== 'number') throw new Error('문서 파일을 읽을 수 없다 — version 이 없다');
  if (o.version > DOC_VERSION) throw new Error('이 파일은 더 새로운 판(version ' + o.version + ')이다. 프로그램을 새로 받아야 한다');
  if (!Array.isArray(o.blocks)) throw new Error('문서 파일을 읽을 수 없다 — blocks 가 배열이 아니다');
  const blocks = o.blocks.map(migrateBlock);
  adoptIds(blocks);
  // 그림(버전 4): 보관함을 위생 처리하고, 미아 토막을 복구하고, 안 쓰는 그림을 청소한다
  const rawAssets = (o.assets && typeof o.assets === 'object') ? o.assets : {};
  const assets0 = {};
  for (const k of Object.keys(rawAssets)) {
    const a = rawAssets[k];
    if (a && typeof a.data === 'string' && a.data.indexOf('data:image/') === 0) assets0[k] = a;
  }
  adoptAssetIds(assets0);
  const blocks2 = repairBlocks(blocks, assets0);
  // 판(버전 5): 정의를 정규화하고, 정의에 없는 판을 가리키는 참조를 뗀다(설계_판.md §2-4)
  const defs = [];
  for (const v of Array.isArray(o.variants) ? o.variants : []) {
    if (v && typeof v.id === 'string' && typeof v.name === 'string' && v.name.trim()) {
      defs.push({ id: v.id, name: v.name });
    }
  }
  adoptVariantIds(defs);
  const blocks3 = repairVariants(blocks2, defs);
  const assets = sweepAssets(assets0, [blocks3]);
  return {
    version: DOC_VERSION,
    meta: Object.assign({ title: '', subtitle: '', category: '', doc: '', rev: '', date: '' }, o.meta || {}),
    variants: defs,
    assets,
    page: Object.assign(JSON.parse(JSON.stringify(DEFAULT_PAGE)), o.page || {}),
    blocks: blocks3,
  };
}

/* folder.js */
const SUB = '서류';
const DOC_EXT = '.sdoc';

function isSupported() {
  return typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';
}

async function pickFolder() {
  if (!isSupported()) {
    throw new Error('이 브라우저는 폴더 열기를 지원하지 않는다. 크롬이나 엣지로 열어야 한다');
  }
  return window.showDirectoryPicker({ id: 'doc-editor', mode: 'readwrite' });
}

// 문서는 고른 폴더 «안»의 서류 폴더에 담는다.
// ⚠ 사람이 이미 서류 폴더 자체를 골랐으면 그 안에 또 서류 를 만들지 않는다
//   (2026-08-30 SKY 가 기본 위치로 …\11. 문서 편집기\서류 를 지목 — 그대로 골라도 되게).
async function docsDir(dirHandle) {
  if (dirHandle.name === SUB) return dirHandle;
  return dirHandle.getDirectoryHandle(SUB, { create: true });
}

async function listDocs(dirHandle) {
  const dir = await docsDir(dirHandle);
  const names = [];
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'file' && name.endsWith(DOC_EXT)) names.push(name);
  }
  names.sort();
  return names;
}

// ⛔ 한글 이름은 «글자로» 비교하면 안 된다. 운영체제가 「한」을 ㅎ+ㅏ+ㄴ 으로 풀어(NFD)
//    돌려주는 일이 있어, 사람이 친 합쳐진 이름(NFC)과 다른 글자열이 된다 —
//    그러면 이미 있는 파일을 «없다» 고 보고 조용히 덮어쓴다(2026-08-30 실측).
const same = (a, b) => String(a).normalize('NFC') === String(b).normalize('NFC');

async function docExists(dirHandle, name) {
  const names = await listDocs(dirHandle);
  return names.some(n => same(n, name));
}

async function readDoc(dirHandle, name) {
  const dir = await docsDir(dirHandle);
  const fh = await dir.getFileHandle(name);
  return (await fh.getFile()).text();
}

async function writeDoc(dirHandle, name, text) {
  const dir = await docsDir(dirHandle);
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(text);
  await w.close();
}

// ── 부품 목록 (기둥 3) ────────────────────────────────────────
// 서류 폴더에 «한 개»의 목록 파일을 둔다(2026-09-01 SKY: "부품 목록을 서류 폴더에 파일 하나").
// 그래야 한 곳만 고치면 그 폴더의 모든 서류가 따라 바뀐다 — 기둥 3 의 뜻 그대로다.
// ⚠ 문서 파일 «하나만» 남에게 주면 이 파일은 안 따라간다. 그래도 서류의 글자는 그대로다
//   (참조는 값을 대신하는 것이 아니라 값에 붙은 꼬리표다 — core/parts.js).
// ⚠ 이름을 밑줄로 시작한다 — 목록에 안 뜨고(.sdoc 이 아니다) 문서들보다 위에 모인다.
// ⛔ 이름을 loadPartsFile·savePartsFile 로 짓는다 — core/parts.js 가 이미 readParts 를
//    내보낸다. 빌드가 모듈을 한 덩어리로 합치므로 같은 이름이 둘이면 화면이 통째로 안 뜬다.
// ⚠ 화면에 보이는 이름은 「안전관리 부품 목록」이지만 «파일 이름»은 그대로 둔다
//    (2026-09-01 SKY: "명칭만 … 변경") — 바꾸면 이미 만들어진 목록 파일이 미아가 된다.
const PARTS_FILE = '_부품목록.json';

// 없으면 «빈 목록»을 준다 — 없다고 터지면 부품 목록을 안 쓰는 폴더에서 문서를 못 연다.
// ⛔ 읽다 실패해도 터지지 않는다. 목록을 못 읽는 것은 서류를 못 여는 이유가 아니다
//   (글자는 서류 안에 이미 있다).
async function loadPartsFile(dirHandle) {
  try {
    const dir = await docsDir(dirHandle);
    const fh = await dir.getFileHandle(PARTS_FILE);
    return JSON.parse(await (await fh.getFile()).text());
  } catch (e) { return null; }
}

async function savePartsFile(dirHandle, list) {
  const dir = await docsDir(dirHandle);
  const fh = await dir.getFileHandle(PARTS_FILE, { create: true });
  const w = await fh.createWritable();
  await w.write(JSON.stringify(list, null, 1));
  await w.close();
}

// ── 고른 폴더를 기억한다 (2026-08-30 SKY: "문서 폴더를 기억하게 하자") ──
// 폴더 손잡이(handle)는 브라우저 내부 저장소(IndexedDB)에 그대로 담을 수 있다.
// ⚠ 담아 둬도 «권한»은 따로다. 브라우저를 껐다 켜면 권한이 «물어봄» 으로 내려갈 수 있고,
//   그때는 사람이 버튼을 누르는 순간에만 다시 허락을 받을 수 있다(브라우저 보안).
// ⛔ 이름은 저장소 전체에서 겹치면 안 된다 — 빌드가 모듈을 한 덩어리로 합치기 때문에
//   autosave.js 의 DB·STORE·tx 와 같은 이름을 쓰면 화면이 통째로 안 뜬다(2026-08-30 실측).
// ⛔ 저장소 이름도 따로 쓴다 — autosave 와 같은 이름·같은 판번호로 열면 새 칸(handles)이
//   만들어지지 않아 조용히 실패한다(판 올리기가 안 일어난다).
const DIR_DB = 'doc-editor-dir';
const DIR_STORE = 'handles';
const DIR_KEY = 'docdir';

function openDirDB() {
  return new Promise((res, rej) => {
    const q = indexedDB.open(DIR_DB, 1);
    q.onupgradeneeded = () => {
      const db = q.result;
      if (!db.objectStoreNames.contains(DIR_STORE)) db.createObjectStore(DIR_STORE);
    };
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}

function dirTx(db, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(DIR_STORE, mode);
    const r = fn(t.objectStore(DIR_STORE));
    t.oncomplete = () => res(r && r.result);
    t.onerror = () => rej(t.error);
  });
}

async function rememberDir(handle) {
  try {
    const db = await openDirDB();
    await dirTx(db, 'readwrite', (s) => s.put(handle, DIR_KEY));
    db.close();
    return true;
  } catch (e) { return false; }
}

async function recallDir() {
  try {
    const db = await openDirDB();
    const h = await dirTx(db, 'readonly', (s) => s.get(DIR_KEY));
    db.close();
    return h || null;
  } catch (e) { return null; }
}

async function forgetDir() {
  try {
    const db = await openDirDB();
    await dirTx(db, 'readwrite', (s) => s.delete(DIR_KEY));
    db.close();
  } catch (e) { /* 지울 게 없으면 그만이다 */ }
}

// 'granted' 면 바로 쓸 수 있고, 'prompt' 면 사람이 버튼을 누를 때만 허락을 받을 수 있다.
async function dirPermission(handle, ask) {
  if (!handle || !handle.queryPermission) return 'granted';   // 옛 브라우저 — 그냥 써 본다
  const opt = { mode: 'readwrite' };
  let st = await handle.queryPermission(opt);
  if (st !== 'granted' && ask && handle.requestPermission) st = await handle.requestPermission(opt);
  return st;
}

/* parts.js */
// 부품 목록(기둥 3) 논리 — DOM 도 파일도 모른다. 항상 새 객체를 만든다.
// 설계: docs/설계_부품목록.md
//
// ⭐ 이 파일이 지키는 단 하나의 약속: **글자는 절대 사라지지 않는다.**
//    참조(ref)는 «값을 대신하는 것»이 아니라 «값에 붙은 꼬리표»다.
//
//      토막(run) = { t: 'Rev5.0', ref: 'p3.rev' }
//                    ↑ 지금 글자(늘 있다)  ↑ 어느 부품의 어느 칸에서 왔나
//
//    목록 파일을 못 읽어도·부품이 지워져도 서류는 «지금 글자» 그대로 보인다.
//    이 순서가 뒤집히면(참조만 두고 그릴 때 값을 찾으면) 목록을 못 읽는 순간 서류가
//    통째로 빈칸이 된다 — 이 프로젝트가 존재하는 이유에 정면으로 어긋난다.
//
// ⛔ 이 파일은 아무것도 import 하지 않는다 — 빌드가 모듈을 한 덩어리로 합치므로 역방향
//    의존이 생기면 정의 순서가 꼬여 화면이 통째로 안 뜰 수 있다(variants.js 와 같은 이유).
// ⛔ 최상위 이름 주의: pseq·PART_FIELDS·partId 는 이 파일만 쓴다.

// 부품 하나가 갖는 «가져다 쓸 수 있는 칸»(설계서 §7). 필요하면 늘린다 —
// 늘려도 옛 문서는 안 깨진다(모르는 칸을 가리키면 «깨진 참조»로 보일 뿐이다).
const PART_FIELDS = [
  ['name', '이름'],
  ['drawing', '도면번호'],
  ['rev', '개정'],
  ['revDate', '개정일자'],
];

const FIELD_KEYS = PART_FIELDS.map(f => f[0]);

// 판(版)과 같은 방식으로 id 를 짓는다 — 'p' + 순번.
// ⭐ 이름이 아니라 id 로 가리키므로 **부품 이름을 바꿔도 서류가 안 깨진다.**
let pseq = 0;
function resetPartIds(n = 0) { pseq = n; }
function adoptPartIds(list) {
  for (const p of list || []) {
    const m = /^p(\d+)$/.exec(p && p.id ? String(p.id) : '');
    if (m) pseq = Math.max(pseq, Number(m[1]));
  }
}
function partId() { pseq += 1; return 'p' + pseq; }

// ── 목록 자체 ────────────────────────────────────────────────
// 목록 = { parts: [ {id,name,drawing,rev,revDate,note} … ] }

function createParts() { return { parts: [] }; }

function dupPart(p) {
  const o = { id: p.id };
  for (const k of FIELD_KEYS) o[k] = typeof p[k] === 'string' ? p[k] : '';
  o.note = typeof p.note === 'string' ? p.note : '';
  return o;
}

const dupList = (lst) => ((lst && lst.parts) || []).map(dupPart);

// ⭐ 새 부품은 «그 갈래의 맨 아래»에 들어간다 (2026-09-01 SKY: "+ 부품을 눌러서 추가
//    하니까, 같은 구분의 맨 아래 행에 추가 되는게 아니고, 진짜 맨 끝에 행에 추가 되고 있어.")
// ⛔ 갈래(구분)는 «이어진 줄»로 묶어 보여 준다. 그래서 맨 끝에 붙이면 같은 이름의 갈래가
//    둘로 갈라져 보인다 — 캡처에서 「1245」 갈래가 두 번 나왔다.
// ⚠ 그 갈래가 아직 없으면 종전대로 맨 끝에 붙는다(새 갈래가 하나 생기는 것이다).
function addPart(lst, props = {}) {
  const p = dupPart(Object.assign({ id: partId() }, props));
  const parts = dupList(lst);
  const 갈래 = p.note || '';
  // 그 갈래의 «마지막 줄»을 찾는다
  let 자리 = -1;
  for (let i = 0; i < parts.length; i++) if ((parts[i].note || '') === 갈래) 자리 = i;
  if (자리 < 0) return { parts: parts.concat([p]) };
  parts.splice(자리 + 1, 0, p);
  return { parts };
}

function updatePart(lst, id, props = {}) {
  return { parts: dupList(lst).map(p => (p.id === id ? dupPart(Object.assign({}, p, props, { id })) : p)) };
}

function removePart(lst, id) {
  return { parts: dupList(lst).filter(p => p.id !== id) };
}

function findPart(lst, id) {
  return ((lst && lst.parts) || []).find(p => p.id === id) || null;
}

// ⛔ 읽기 위생 — 목록 파일은 사람이 손댈 수 있는 자리(드라이브)에 산다.
//    깨진 줄 하나가 프로그램을 멈추면 안 되므로, 알아볼 수 있는 것만 받고 나머지는 버린다.
function readParts(raw) {
  const src = (raw && typeof raw === 'object' && Array.isArray(raw.parts)) ? raw.parts : [];
  const seen = new Set();
  const parts = [];
  for (const p of src) {
    if (!p || typeof p !== 'object') continue;
    const id = typeof p.id === 'string' && /^p\d+$/.test(p.id) ? p.id : '';
    if (!id || seen.has(id)) continue;      // id 가 없거나 겹치면 버린다 — 겹치면 어느 쪽이 참인지 알 수 없다
    seen.add(id);
    parts.push(dupPart(Object.assign({}, p, { id })));
  }
  adoptPartIds(parts);
  return { parts };
}

// ── 참조 ────────────────────────────────────────────────────
// 참조 글자꼴은 '<부품id>.<칸>' — 예: 'p3.rev'

function makeRef(id, field) { return String(id) + '.' + String(field); }

function parseRef(ref) {
  const m = /^(p\d+)\.([a-zA-Z]+)$/.exec(String(ref || ''));
  if (!m) return null;
  if (FIELD_KEYS.indexOf(m[2]) < 0) return null;
  return { id: m[1], field: m[2] };
}

// 그 참조가 «지금» 가리키는 값. 부품이나 칸이 없으면 null 을 준다 —
// ⛔ 빈 문자열이 아니다. 빈 문자열이면 «값이 빈 부품»과 «사라진 부품»을 구별할 수 없다.
function refValue(lst, ref) {
  const r = parseRef(ref);
  if (!r) return null;
  const p = findPart(lst, r.id);
  if (!p) return null;
  const v = p[r.field];
  return typeof v === 'string' ? v : null;
}

function refBroken(lst, ref) { return refValue(lst, ref) === null; }

// ── 다시 맞추기 ──────────────────────────────────────────────
// ⛔ 이 프로젝트에서 가장 위험한 자리다 — 여러 칸의 글자를 한꺼번에 갈아 끼운다.
//    그래서 ①고치기 전에 «몇 칸이 어떻게 바뀌는지» 세어서 돌려주고 ②깨진 참조는
//    글자를 건드리지 않는다(빈칸으로 만들지 않는다).

// 토막 하나를 맞춘다. 바뀌면 새 토막, 아니면 «같은 객체»를 그대로 돌려준다 —
// 같은 객체를 돌려줘야 위에서 「바뀐 것이 없다」를 값싸게 알 수 있다.
function syncRun(lst, run, log) {
  if (!run || !run.ref) return run;
  const now = refValue(lst, run.ref);
  if (now === null) { if (log) log.broken.push({ ref: run.ref, t: run.t }); return run; }
  if (now === run.t) return run;
  if (log) log.changed.push({ ref: run.ref, from: run.t, to: now });
  return Object.assign({}, run, { t: now });
}

function syncRuns(lst, runs, log) {
  if (!Array.isArray(runs)) return runs;
  let hit = false;
  const out = runs.map(r => { const n = syncRun(lst, r, log); if (n !== r) hit = true; return n; });
  return hit ? out : runs;
}

// 칸 하나 — 공통 값(runs)과 판별 값(vals) 양쪽을 맞춘다.
// ⭐ 여기가 기둥 2(판)와 기둥 3(부품 목록)이 만나는 자리다. 판별 값 안의 토막도
//    똑같이 ref 를 달 수 있어서, 새 장치를 하나도 안 만들고 둘이 함께 산다.
function syncCell(lst, cell, log) {
  if (!cell || typeof cell !== 'object') return cell;
  let hit = false;
  let next = cell;
  const runs = syncRuns(lst, cell.runs, log);
  if (runs !== cell.runs) { next = Object.assign({}, next, { runs }); hit = true; }
  if (cell.vals && typeof cell.vals === 'object') {
    let vhit = false;
    const vals = {};
    for (const k of Object.keys(cell.vals)) {
      const v = syncRuns(lst, cell.vals[k], log);
      if (v !== cell.vals[k]) vhit = true;
      vals[k] = v;
    }
    if (vhit) { next = Object.assign({}, next, { vals }); hit = true; }
  }
  return hit ? next : cell;
}

function syncGrid(lst, grid, log) {
  if (!Array.isArray(grid)) return grid;
  let hit = false;
  const out = grid.map(row => {
    if (!Array.isArray(row)) return row;
    let rhit = false;
    const r = row.map(c => { const n = syncCell(lst, c, log); if (n !== c) rhit = true; return n; });
    if (rhit) { hit = true; return r; }
    return row;
  });
  return hit ? out : grid;
}

function syncBlock(lst, b, log) {
  if (!b || typeof b !== 'object') return b;
  if (b.type === 'table') {
    const head = syncGrid(lst, b.head, log);
    const rows = syncGrid(lst, b.rows, log);
    if (head === b.head && rows === b.rows) return b;
    return Object.assign({}, b, { head, rows });
  }
  if (Array.isArray(b.runs)) {
    const runs = syncRuns(lst, b.runs, log);
    return runs === b.runs ? b : Object.assign({}, b, { runs });
  }
  if (Array.isArray(b.items)) {
    let hit = false;
    const items = b.items.map(it => { const n = syncRuns(lst, it, log); if (n !== it) hit = true; return n; });
    return hit ? Object.assign({}, b, { items }) : b;
  }
  if (Array.isArray(b.caption)) {
    const caption = syncRuns(lst, b.caption, log);
    return caption === b.caption ? b : Object.assign({}, b, { caption });
  }
  return b;
}

// 문서 전체를 목록에 맞춘다.
// 돌려주는 것: { doc, changed: [{ref,from,to}…], broken: [{ref,t}…] }
// ⚠ 바뀐 것이 없으면 **같은 문서 객체**를 그대로 돌려준다 — 새 객체를 만들면 화면의
//   next === doc 가드를 지나가서, 아무것도 안 바뀐 되돌리기 걸음이 쌓인다
//   (renameVariant 에서 겪은 그 함정).
function syncDoc(doc, lst) {
  const log = { changed: [], broken: [] };
  if (!doc || !Array.isArray(doc.blocks)) return { doc, changed: [], broken: [] };
  let hit = false;
  const blocks = doc.blocks.map(b => { const n = syncBlock(lst, b, log); if (n !== b) hit = true; return n; });
  return {
    doc: hit ? Object.assign({}, doc, { blocks }) : doc,
    changed: log.changed,
    broken: log.broken,
  };
}

// ⭐ 사람이 «직접 고친» 값에서는 꼬리표를 뗀다 — 이제 손으로 쓴 값이다(설계 §8-0).
//
//    규칙 하나로 정리된다: **꼬리표가 붙은 글자는 늘 그 부품의 값과 같다.**
//    다르면 사람이 그 위에 쳤다는 뜻이므로 꼬리표를 뗀다. 안 그러면 다음 «다시 맞추기»가
//    사람이 친 글자를 조용히 되돌려 버린다 — 고쳤는데 안 고쳐지는 것처럼 보인다.
//
// ⛔ 부품이 «없어진» 경우(refValue === null)에는 안 뗀다. 그건 깨진 참조로 빨갛게
//    보여 줘야 하는 것이지 조용히 지울 것이 아니다. 목록 파일을 아직 못 읽었을 때
//    (폴더를 안 열었을 때)도 이 경우라, 이 가드가 없으면 문서를 열자마자 꼬리표가 전멸한다.
function unrefRuns(lst, runs, log) {
  if (!Array.isArray(runs)) return runs;
  let hit = false;
  const out = runs.map(r => {
    if (!r || !r.ref) return r;
    const now = refValue(lst, r.ref);
    if (now === null || now === r.t) return r;
    if (log) log.unref.push({ ref: r.ref, was: now, now: r.t });
    const n = Object.assign({}, r);
    delete n.ref;
    hit = true;
    return n;
  });
  return hit ? out : runs;
}

function dropStaleRefs(doc, lst) {
  const log = { unref: [] };
  if (!doc || !Array.isArray(doc.blocks)) return { doc, unref: [] };
  const cell = (c) => {
    if (!c || typeof c !== 'object') return c;
    let next = c;
    const runs = unrefRuns(lst, c.runs, log);
    if (runs !== c.runs) next = Object.assign({}, next, { runs });
    if (c.vals && typeof c.vals === 'object') {
      let vhit = false;
      const vals = {};
      for (const k of Object.keys(c.vals)) {
        const v = unrefRuns(lst, c.vals[k], log);
        if (v !== c.vals[k]) vhit = true;
        vals[k] = v;
      }
      if (vhit) next = Object.assign({}, next, { vals });
    }
    return next;
  };
  const grid = (g) => {
    if (!Array.isArray(g)) return g;
    let hit = false;
    const out = g.map(row => {
      if (!Array.isArray(row)) return row;
      let rhit = false;
      const rr = row.map(c => { const n = cell(c); if (n !== c) rhit = true; return n; });
      if (rhit) { hit = true; return rr; }
      return row;
    });
    return hit ? out : g;
  };
  let hit = false;
  const blocks = doc.blocks.map(b => {
    if (!b || typeof b !== 'object') return b;
    if (b.type === 'table') {
      const head = grid(b.head);
      const rows = grid(b.rows);
      if (head === b.head && rows === b.rows) return b;
      hit = true;
      return Object.assign({}, b, { head, rows });
    }
    if (Array.isArray(b.runs)) {
      const runs = unrefRuns(lst, b.runs, log);
      if (runs === b.runs) return b;
      hit = true;
      return Object.assign({}, b, { runs });
    }
    if (Array.isArray(b.items)) {
      let ihit = false;
      const items = b.items.map(it => { const n = unrefRuns(lst, it, log); if (n !== it) ihit = true; return n; });
      if (!ihit) return b;
      hit = true;
      return Object.assign({}, b, { items });
    }
    if (Array.isArray(b.caption)) {
      const caption = unrefRuns(lst, b.caption, log);
      if (caption === b.caption) return b;
      hit = true;
      return Object.assign({}, b, { caption });
    }
    return b;
  });
  return { doc: hit ? Object.assign({}, doc, { blocks }) : doc, unref: log.unref };
}

// 이 문서가 쓰는 참조 가운데 «깨진 것»과 «무엇을 가리키는지»를 화면 쪽에 넘길 꼴로 만든다.
function refState(doc, lst) {
  const broken = {};
  const label = {};
  const 이름 = {};
  for (const [k, l] of PART_FIELDS) 이름[k] = l;
  for (const ref of countRefs(doc).keys()) {
    const r = parseRef(ref);
    const p = r ? findPart(lst, r.id) : null;
    if (!p) { broken[ref] = 1; label[ref] = '목록에서 사라진 부품입니다 — 「안전관리 부품 목록」에서 확인하세요'; continue; }
    label[ref] = (p.name || '(이름 없음)') + ' · ' + (이름[r.field] || r.field) + ' — 안전관리 부품 목록에서 옵니다';
  }
  return { broken, label };
}

// 문서가 쓰고 있는 참조를 모아 센다 — 「이 서류는 3번 부품을 4곳에서 쓴다」를 보여 줄 때.
function countRefs(doc) {
  const out = new Map();
  const bump = (ref) => { if (ref) out.set(ref, (out.get(ref) || 0) + 1); };
  const runs = (rs) => { for (const r of rs || []) if (r && r.ref) bump(r.ref); };
  const cell = (c) => {
    if (!c || typeof c !== 'object') return;
    runs(c.runs);
    if (c.vals) for (const k of Object.keys(c.vals)) runs(c.vals[k]);
  };
  for (const b of (doc && doc.blocks) || []) {
    if (!b || typeof b !== 'object') continue;
    if (b.type === 'table') {
      for (const g of [b.head, b.rows]) for (const row of g || []) for (const c of row || []) cell(c);
    } else {
      runs(b.runs);
      runs(b.caption);
      for (const it of b.items || []) runs(it);
    }
  }
  return out;
}

/* partslist.js */
// 「부품 목록」 창 — 부품을 줄 단위로 더하고 고치고 지운다(기둥 3, Task 2).
// 설계: docs/설계_부품목록.md · 목록은 서류 폴더의 _부품목록.json 한 개다(2026-09-01 SKY 결정).
//
// ⛔ 최상위 이름은 attachPartsList 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로
//    같은 이름이 둘이면 화면이 통째로 안 뜬다.
// ⚠ 이 창은 «목록»만 다룬다. 문서의 칸에 부품을 거는 일(Task 3)과 값을 다시 맞추는
//   일(Task 4)은 아직 없다 — 여기서 고친 값은 목록 파일에만 들어간다.
// ⛔ 지우기는 되돌릴 수 없다. 그래서 «이 부품을 쓰는 칸이 몇 곳인지» 세어서 보여 주고
//   묻는다(데이터 안전). 세는 것은 «지금 열린 문서» 안에서다 — 다른 서류까지는 못 센다.



function attachPartsList({ getList, setList, getDoc, warn, onSaved, onErr }) {
  const btn = document.getElementById('btn-parts');
  let el = null;

  const close = () => { if (el) { el.remove(); el = null; } };

  // 목록을 고친 뒤 곧바로 파일에 굳힌다 — 창을 닫았는데 안 저장돼 있으면 아무도 모른다.
  //
  // ⛔ 다시그림 = false 일 때 창을 «다시 만들지 않는다».
  //    2026-09-01 SKY: "이름 하나 작성하고 TAP이나 다른 항목 넘어 가면 토스트 뜨면서 저장
  //    되었습니다 하고 있어. 그래서 … 다시 다음 도면번호 부분 마우스 클릭 … 반복 해야돼."
  //    창을 통째로 다시 만들면 방금 손이 가 있던 칸이 «없어진 칸»이 되어 초점이 종이(BODY)로
  //    날아간다[실측]. 그러면 Tab 으로 다음 칸에 못 간다. 줄이 늘거나 줄 때만 다시 만든다.
  async function commit(next, said, 다시그림) {
    try {
      const 맞춘수 = await setList(next);
      // ⚠ 「부품을 고쳤습니다」로 덮지 않는다 — «서류 몇 곳이 함께 바뀌었다»가 더 중요한 소식이다.
      //   (전에는 이 줄이 그 알림을 곧바로 지워서 SKY 가 볼 수 없었다.)
      if (said && onSaved && !맞춘수) onSaved(said);
    } catch (e) {
      if (onErr) onErr('안전관리 부품 목록을 저장하지 못했습니다 — ' + e.message);
    }
    if (다시그림 !== false) open();
  }

  function open() {
    const scroll = el ? (el.querySelector('.pl-body') || {}).scrollTop || 0 : 0;
    close();
    const list = getList() || { parts: [] };
    el = document.createElement('div');
    el.id = 'partslist';
    el.setAttribute('contenteditable', 'false');

    const ttl = document.createElement('div');
    ttl.className = 'pl-ttl';
    ttl.append(document.createTextNode('안전관리 부품 목록'));
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'pl-x';
    x.title = '닫기';
    x.textContent = '✕';
    x.addEventListener('click', close);
    ttl.appendChild(x);
    el.appendChild(ttl);

    const note = document.createElement('div');
    note.className = 'pl-note';
    note.textContent = '여기 적은 값을 서류의 칸에서 불러다 씁니다. '
      + '한 곳만 고치면 그 부품을 쓰는 서류가 함께 바뀝니다.';
    el.appendChild(note);

    // ⚠ 목록은 «서류 폴더»에 사는 파일이다 — 폴더가 없으면 어디에 적을지가 없다.
    //   그때는 조용히 빈 목록을 보여 주지 않고 «왜 못 쓰는지»를 말한다.
    const 못쓰는이유 = warn ? warn() : null;
    if (못쓰는이유) {
      const w = document.createElement('div');
      w.className = 'pl-empty';
      w.textContent = 못쓰는이유;
      el.appendChild(w);
      const f0 = document.createElement('div');
      f0.className = 'pl-foot';
      const c0 = document.createElement('button');
      c0.type = 'button';
      c0.textContent = '닫기';
      c0.addEventListener('click', close);
      f0.appendChild(c0);
      el.appendChild(f0);
      document.body.appendChild(el);
      방금열림();
      return;
    }

    // ⭐ 머리줄은 스크롤 상자 «밖»에 둔다 — 2026-09-01 SKY: "구분 이름 도면번호 같은
    //    헤더도 고정 되서 스크롤 되게 해줘." 상자 «안»에 두고 sticky 를 걸면 갈래 제목
    //    (그것도 sticky)과 같은 자리를 다투어 겹친다. 밖으로 내면 다툴 일이 없다.
    // ⚠ 「구분」 은 부품에서 «가져다 쓰는 값»이 아니라 갈래 이름이라 따로 둔다.
    const head = document.createElement('div');
    head.className = 'pl-row pl-head';
    for (const label of ['구분'].concat(PART_FIELDS.map(f => f[1]))) {
      const c = document.createElement('span');
      c.textContent = label;
      head.appendChild(c);
    }
    const sp = document.createElement('span');
    sp.textContent = '';
    head.appendChild(sp);
    el.appendChild(head);

    const body = document.createElement('div');
    body.className = 'pl-body';

    // 갈래 제목 줄 — 이름을 그 자리에서 고치고, 그 갈래에 부품을 바로 더한다
    // (2026-09-01 SKY: "+부품 추가 버튼도 각 구분 항목에 추가 할수 있고, 그리고 구분 갈래도
    //  명칭같은걸 수정 할 수 있고, 구분 갈래도 추가 할 수 있게 해줘.")
    // ⛔ 갈래는 «따로 저장하는 것»이 아니다 — 부품의 구분 칸에 적힌 글이 곧 갈래다.
    //    그래서 갈래 이름을 고치면 «그 갈래에 든 부품 전부»의 구분 칸을 함께 고친다.
    function 갈래줄(구분, 지금목록) {
      const 든것 = 지금목록.parts.filter(x => (x.note || '(구분 없음)') === 구분);
      const g = document.createElement('div');
      g.className = 'pl-group';
      const nm = document.createElement('input');
      nm.type = 'text';
      nm.className = 'pl-gname';
      nm.value = 구분 === '(구분 없음)' ? '' : 구분;
      nm.placeholder = '구분 없음';
      nm.title = '갈래 이름 — 고치면 이 갈래의 부품 ' + 든것.length + '개가 함께 바뀐다';
      nm.addEventListener('change', () => {
        const 새이름 = nm.value.trim();
        if ((구분 === '(구분 없음)' ? '' : 구분) === 새이름) return;
        let next = getList();
        for (const p of 든것) next = updatePart(next, p.id, { note: 새이름 });
        commit(next, '갈래 이름을 「' + (새이름 || '(구분 없음)') + '」 로 바꿨습니다', true);
      });
      const cnt = document.createElement('span');
      cnt.className = 'pl-gcnt';
      cnt.textContent = '(' + 든것.length + ')';
      const add = document.createElement('button');
      add.type = 'button';
      add.className = 'pl-gadd';
      add.textContent = '＋ 부품';
      add.title = '이 갈래에 부품을 하나 더한다';
      add.addEventListener('click', () => {
        // ⚠ 새 부품은 목록 «끝»에 붙는다. 그런데 갈래로 묶어 보여 주므로 화면에서는
        //   이 갈래 아래에 나타난다 — 사람 눈에는 「여기에 생겼다」로 보인다.
        commit(addPart(getList(), { note: 구분 === '(구분 없음)' ? '' : 구분 }),
               '「' + 구분 + '」 에 부품을 더했습니다', true);
      });
      g.append(nm, cnt, add);
      return g;
    }

    // 지금 열린 문서가 어느 부품을 몇 곳에서 쓰는지 — 지우기 전에 보여 준다
    const used = countRefs(getDoc ? getDoc() : null);
    const usedBy = (id) => {
      let n = 0;
      for (const [key] of PART_FIELDS) n += used.get(makeRef(id, key)) || 0;
      return n;
    };

    // ⭐ 갈래(구분)마다 제목을 끼운다 — 2026-09-01 SKY: "어떤 항목은 안전회로기판 항목이고,
    //    어떤건 명판이고 등등 다 안전관리부품 목록 중 일부 들이고, 구분은 필요해."
    //    56개가 한 덩어리로 늘어서면 무엇이 무엇인지 갈리지 않는다.
    let 앞구분 = null;
    for (const p of list.parts) {
      const 구분 = p.note || '(구분 없음)';
      if (구분 !== 앞구분) {
        앞구분 = 구분;
        body.appendChild(갈래줄(구분, list));
      }
      const row = document.createElement('div');
      row.className = 'pl-row';
      // 구분 칸 — 여기 적은 글로 갈래가 나뉜다. 비우면 「(구분 없음)」 으로 모인다.
      {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.value = p.note || '';
        inp.placeholder = '구분';
        inp.title = '갈래 이름 — 같은 글을 적은 부품끼리 한 덩어리로 모인다';
        inp.className = 'pl-note';
        inp.addEventListener('change', () => {
          const 지금 = (findPart(getList(), p.id) || {}).note || '';
          if (지금 === inp.value) return;
          // ⚠ 구분이 바뀌면 갈래가 달라지므로 이때는 창을 «다시 그린다»
          commit(updatePart(getList(), p.id, { note: inp.value }), '구분을 고쳤습니다', true);
        });
        row.appendChild(inp);
      }
      for (const [key, label] of PART_FIELDS) {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.value = p[key] || '';
        inp.placeholder = label;
        inp.title = label;
        // ⚠ 치는 «동안»은 저장하지 않는다 — 한 글자마다 파일을 쓰면 느리고, 지우다 만
        //   중간 값이 다른 서류로 퍼진다. 칸을 벗어날 때 한 번 굳힌다.
        // ⛔ 견줄 값을 «지금 목록»에서 읽는다 — 그릴 때 잡아 둔 p 로 견주면, 같은 칸을 두 번
        //    고쳐 처음 값으로 되돌릴 때 «안 바뀌었다»로 보고 그냥 지나친다.
        // ⛔ 다시그림 false — 창을 다시 만들면 Tab 이 갈 칸이 사라진다(위 commit 머리말).
        inp.addEventListener('change', () => {
          const 지금 = (findPart(getList(), p.id) || {})[key] || '';
          if (지금 === inp.value) return;
          commit(updatePart(getList(), p.id, { [key]: inp.value }), '부품을 고쳤습니다', false);
        });
        row.appendChild(inp);
      }
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'pl-del';
      del.textContent = '지움';
      const n = usedBy(p.id);
      del.title = n ? '이 문서에서 ' + n + '곳이 이 부품을 씁니다' : '이 문서에서는 안 씁니다';
      del.addEventListener('click', () => {
        // ⛔ 되돌릴 수 없다 — 몇 곳이 이 부품을 쓰는지 세어서 보여 주고 묻는다.
        const 이름 = p.name || '(이름 없음)';
        const 말 = n
          ? '「' + 이름 + '」 을 목록에서 지웁니다.\n\n'
            + '지금 문서의 ' + n + '곳이 이 부품을 가리키고 있습니다.\n'
            + '⚠ 글자는 그대로 남습니다 — 다만 앞으로 함께 안 바뀝니다.\n\n지울까요?'
          : '「' + 이름 + '」 을 목록에서 지웁니다. 지울까요?';
        if (!window.confirm(말)) return;
        commit(removePart(getList(), p.id), '「' + 이름 + '」 을 지웠습니다');
      });
      row.appendChild(del);
      body.appendChild(row);
    }

    if (!list.parts.length) {
      const empty = document.createElement('div');
      empty.className = 'pl-empty';
      empty.textContent = '아직 부품이 없습니다. 아래 「부품 추가」를 누르세요.';
      body.appendChild(empty);
    }

    el.appendChild(body);

    const foot = document.createElement('div');
    foot.className = 'pl-foot';
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'pl-add';
    add.textContent = '＋ 부품 추가';
    add.title = '구분 없이 부품 하나를 더한다 — 구분 칸에 글을 적으면 그 갈래로 옮겨간다';
    add.addEventListener('click', () => commit(addPart(getList(), {}), '부품을 더했습니다'));
    // 「＋ 갈래 추가」 — 새 갈래는 «그 갈래의 첫 부품»으로 시작한다.
    // ⛔ 빈 갈래를 따로 저장하지 않는다 — 갈래는 부품의 구분 칸이 만드는 것이라,
    //    부품이 없는 갈래는 담을 자리가 없다. 그래서 새 부품 하나와 함께 만든다.
    const gadd = document.createElement('button');
    gadd.type = 'button';
    gadd.className = 'pl-add';
    gadd.textContent = '＋ 갈래 추가';
    gadd.title = '새 갈래를 만든다 — 그 갈래의 첫 부품 한 줄이 함께 생긴다';
    gadd.addEventListener('click', () => {
      const 이름 = window.prompt('새 갈래 이름 (예: 인쇄회로기판)', '');
      if (이름 === null) return;
      const nm2 = 이름.trim();
      if (!nm2) return;
      const 있나 = (getList().parts || []).some(p => (p.note || '') === nm2);
      if (있나) { if (onErr) onErr('「' + nm2 + '」 갈래는 이미 있습니다'); return; }
      commit(addPart(getList(), { note: nm2 }), '「' + nm2 + '」 갈래를 만들었습니다', true);
    });
    const ok = document.createElement('button');
    ok.type = 'button';
    ok.textContent = '닫기';
    ok.addEventListener('click', close);
    foot.append(add, gadd, ok);
    el.appendChild(foot);

    document.body.appendChild(el);
    const b = el.querySelector('.pl-body');
    if (b) b.scrollTop = scroll;
    방금열림();
  }

  // ⛔ 창을 여는 그 클릭이 열고 나서도 계속 퍼져 나가 아래 «바깥 클릭»까지 온다 —
  //    그러면 열리자마자 닫혀 아무 일도 안 일어난 것처럼 보인다(판 창에서 겪은 그 함정).
  let 방금 = false;
  const 방금열림 = () => { 방금 = true; setTimeout(() => { 방금 = false; }, 0); };

  if (btn) btn.addEventListener('click', open);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  document.addEventListener('click', (e) => {
    if (방금 || !el) return;
    const t = e.target;
    if (t && t.closest && t.closest('#partslist, #btn-parts')) return;
    close();
  });

  return { open, close, isOpen: () => !!el, rect: () => (el ? [el.getBoundingClientRect()] : []) };
}

/* editor-ops.js */
// ⛔ 블록을 제자리에서 고치지 않는다. 항상 새 배열·새 객체를 만든다(되돌리기가 여기 기댄다).
function indexOf(blocks, id) {
  const i = blocks.findIndex(b => b.id === id);
  if (i < 0) throw new Error('블록을 찾을 수 없다: ' + id);
  return i;
}

function replaceBlock(blocks, id, patch) {
  const i = indexOf(blocks, id);
  const next = blocks.slice();
  next[i] = Object.assign({}, blocks[i], patch);
  return next;
}

function insertAfter(blocks, id, block) {
  const i = indexOf(blocks, id);
  const next = blocks.slice();
  next.splice(i + 1, 0, block);
  return next;
}

function removeBlock(blocks, id) {
  const i = indexOf(blocks, id);
  if (blocks.length <= 1) return blocks.slice();
  const next = blocks.slice();
  next.splice(i, 1);
  return next;
}

/* selection.js */
// 커서 자리를 "블록 처음부터 센 글자 번호"로 다룬다.
// 서식이 들어가면 DOM 자식이 여러 개로 갈리므로, 몇 번째 자식인지로 세면 깨진다.
function textLen(node) {
  if (!node) return 0;
  if (node.nodeType === 3) return (node.nodeValue || '').length;
  // 그림(IMG)도 BR 처럼 «글자 1개»다 — 그래야 그림 토막(U+FFFC 1글자)과 셈이 맞는다
  if (node.nodeType === 1 && (node.tagName === 'BR' || node.tagName === 'IMG')) return 1;
  let n = 0;
  for (const c of node.childNodes || []) n += textLen(c);
  return n;
}

function offsetIn(el, node, offset) {
  if (!el || !node) return 0;
  if (el.contains && !el.contains(node)) return 0;
  let count = 0;
  let done = false;
  const scan = (cur) => {
    if (done || !cur) return;
    if (cur === node) {
      if (cur.nodeType === 3) count += Math.min(offset, (cur.nodeValue || '').length);
      else for (let i = 0; i < offset && i < (cur.childNodes || []).length; i++) count += textLen(cur.childNodes[i]);
      done = true;
      return;
    }
    if (cur.nodeType === 3) { count += (cur.nodeValue || '').length; return; }
    if (cur.nodeType !== 1) return;
    if (cur.tagName === 'BR' || cur.tagName === 'IMG') { count += 1; return; }
    for (const c of cur.childNodes || []) { scan(c); if (done) return; }
  };
  scan(el);
  return count;
}

function nodeAt(el, pos) {
  let left = Math.max(0, pos);
  let last = { node: el, offset: 0 };
  let done = false;
  const scan = (cur) => {
    if (done || !cur) return;
    if (cur.nodeType === 3) {
      const len = (cur.nodeValue || '').length;
      if (left <= len) { last = { node: cur, offset: left }; done = true; return; }
      left -= len;
      last = { node: cur, offset: len };
      return;
    }
    if (cur.nodeType !== 1) return;
    if (cur.tagName === 'BR' || cur.tagName === 'IMG') { left = Math.max(0, left - 1); return; }
    for (const c of cur.childNodes || []) { scan(c); if (done) return; }
  };
  scan(el);
  return last;
}

// 초점은 입력판(#pages — 문서 전체가 하나의 contenteditable, D16)에 준다.
// 커서 자리는 그 안의 아무 마디에나 놓을 수 있다.
function focusRootOf(node, fallbackEl) {
  const e = node && (node.nodeType === 1 ? node : node.parentElement);
  const root = e && e.closest ? e.closest('[contenteditable="true"]') : null;
  return root || fallbackEl;
}

function caretTo(el, pos) {
  let at = nodeAt(el, pos);
  // 글자가 하나도 없는 목록 항목은 글자 세기로 못 들어간다 — 항목 안에 직접 놓는다
  if (at.node.nodeType === 1 && at.node.querySelectorAll && !at.node.matches('.lst li')) {
    const lis = at.node.querySelectorAll('.lst li');
    if (lis.length) at = { node: pos <= 0 ? lis[0] : lis[lis.length - 1], offset: 0 };
  }
  const r = document.createRange();
  r.setStart(at.node, at.offset);
  r.collapse(true);
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
  focusRootOf(at.node, el).focus();
}

function selectRange(el, from, to) {
  const a = nodeAt(el, from);
  const b = nodeAt(el, to);
  const r = document.createRange();
  r.setStart(a.node, a.offset);
  r.setEnd(b.node, b.offset);
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
  focusRootOf(a.node, el).focus();
}

function rangeIn(el) {
  const s = window.getSelection();
  if (!el || !s || s.rangeCount === 0) return null;
  const r = s.getRangeAt(0);
  if (!el.contains(r.startContainer) || !el.contains(r.endContainer)) return null;
  const a = offsetIn(el, r.startContainer, r.startOffset);
  const b = offsetIn(el, r.endContainer, r.endOffset);
  return { from: Math.min(a, b), to: Math.max(a, b) };
}

function activeBlockEl(pagesEl) {
  const s = window.getSelection();
  const n = s && s.anchorNode;
  if (!n || !pagesEl) return null;
  const e = n.nodeType === 1 ? n : n.parentElement;
  if (!e || !e.closest) return null;
  const blk = e.closest('.blk[data-id]');
  return blk && pagesEl.contains(blk) ? blk : null;
}

// 화면의 글 칸(문단·제목 블록, 목록 항목)을 문서 순서대로.
// 입력판이 하나가 된 뒤(D16)에는 속성이 아니라 블록 종류로 찾는다 — 섹션 줄은 글이 아니다.
// ⚠ .blk-table 래퍼가 문단 선택자에 걸리면 표 전체가 «한 칸»으로 잡힌다 — 반드시 뺀다.
// ⚠ 그림 블록(.blk-image)도 같은 이유로 뺀다 — 몸통은 글 칸이 아니다.
//    대신 그 «캡션»(.cap)만 글 칸으로 넣는다(목록 항목·표 칸과 같은 정신).
function editableEls(pagesEl) {
  return Array.from(pagesEl.querySelectorAll(
    '.blk[data-id]:not(.blk-section):not(.blk-list):not(.blk-table):not(.blk-image), '
    + '.blk-list .lst li[data-i], .blk-table td[data-r], .blk-image .cap'));
}

// 지금 선택이 걸쳐 있는 편집 칸들을 문서 순서대로 [{el, from, to}] 로 준다.
// 한 칸 안의 선택이면 1개, 여러 블록에 걸친 선택이면 여러 개가 나온다.
// 지금 선택이 «한 표 안»의 칸 여럿에 걸치면, 시작 칸과 끝 칸이 만드는 «네모»를 준다.
// ⭐ 워드·엑셀과 같은 방식이다(2026-08-30 SKY). 글자 순서로 훑으면 두 칸만 끌어도 그
//    사이에 낀 엉뚱한 칸이 딸려 오고, 아래→위로 끌면 잡히는 칸이 달라진다.
//    시작(anchor)·끝(focus)을 쓰므로 끄는 방향이 어느 쪽이든 같은 네모가 나온다.
// ⚠ 병합 칸이 네모에 걸치면 그 칸을 다 품도록 네모를 넓힌다 — 반쪽 칸이 남으면 안 된다.
function cellRectIn(pagesEl) {
  const s = window.getSelection();
  if (!s || s.rangeCount === 0 || s.getRangeAt(0).collapsed) return null;
  const tdOf = (node) => {
    const e = node && (node.nodeType === 1 ? node : node.parentElement);
    const td = e && e.closest ? e.closest('.blk-table td[data-r]') : null;
    return td && pagesEl.contains(td) ? td : null;
  };
  const a = tdOf(s.anchorNode);
  const b = tdOf(s.focusNode);
  if (!a || !b) return null;
  const id = a.closest('.blk[data-id]').dataset.id;
  if (b.closest('.blk[data-id]').dataset.id !== id) return null;   // 다른 표면 네모가 없다
  // 장을 넘은 표는 조각이 여러 개다 — 같은 id 의 칸을 전부 모은다
  const all = Array.from(pagesEl.querySelectorAll('.blk-table[data-id="' + id + '"] td[data-r]'));
  const box = (td) => {                       // 머리글은 몸통 0행 «위»라 -1 로 둔다
    const r = td.dataset.r === 'h' ? -1 : Number(td.dataset.r);
    const c = Number(td.dataset.c);
    return [r, r + (td.rowSpan || 1) - 1, c, c + (td.colSpan || 1) - 1];
  };
  const A = box(a);
  const B = box(b);
  let r1 = Math.min(A[0], B[0]), r2 = Math.max(A[1], B[1]);
  let c1 = Math.min(A[2], B[2]), c2 = Math.max(A[3], B[3]);
  let grew = true;
  while (grew) {
    grew = false;
    for (const td of all) {
      const [x1, x2, y1, y2] = box(td);
      if (x1 > r2 || x2 < r1 || y1 > c2 || y2 < c1) continue;      // 안 겹친다
      if (x1 < r1) { r1 = x1; grew = true; }
      if (x2 > r2) { r2 = x2; grew = true; }
      if (y1 < c1) { c1 = y1; grew = true; }
      if (y2 > c2) { c2 = y2; grew = true; }
    }
  }
  const cells = all.filter(td => {
    const [x1, x2, y1, y2] = box(td);
    return x1 >= r1 && x2 <= r2 && y1 >= c1 && y2 <= c2;
  });
  return cells.length > 1 ? cells : null;     // 한 칸 «안» 선택은 글자 단위 그대로
}

function rangesIn(pagesEl) {
  const s = window.getSelection();
  if (!s || s.rangeCount === 0) return [];
  const r = s.getRangeAt(0);
  if (r.collapsed) return [];
  const rect = cellRectIn(pagesEl);
  if (rect) {                                 // 표 «안»의 네모 선택 — 그 칸들만, 통째로
    return rect.map(el => ({ el, from: 0, to: textLen(el), whole: 1 })).filter(x => x.to > x.from);
  }
  const hit = editableEls(pagesEl).filter(el => r.intersectsNode(el));
  // ⭐ 표 칸이 다른 칸·문단과 «함께» 걸리면 그 칸은 통째로 고른 것으로 본다(워드와 같다).
  //    반쪽만 문 칸이 남으면 화면(칸이 통째로 파랗다)과 실제 지워지는 범위가 어긋난다.
  //    한 칸 «안»에서만 끈 것은 그대로 글자 단위다.
  const wholeCells = hit.length > 1;
  return hit
    .map(el => {
      if (wholeCells && el.matches('td[data-r]')) return { el, from: 0, to: textLen(el), whole: 1 };
      return {
        el,
        from: el.contains(r.startContainer) ? offsetIn(el, r.startContainer, r.startOffset) : 0,
        to: el.contains(r.endContainer) ? offsetIn(el, r.endContainer, r.endOffset) : textLen(el),
      };
    })
    .filter(x => x.to > x.from);
}

// 지금 선택이 «칸 통째»로 무는 표 칸들 — 화면을 칠하는 쪽이 쓴다.
// rangesIn 과 달리 빈 칸(글자 0)도 준다: 비어 있어도 «골라졌다»는 보여야 한다.
function wholeCellsIn(pagesEl) {
  const rect = cellRectIn(pagesEl);
  if (rect) return rect;                      // 표 «안»의 네모 선택
  const s = window.getSelection();
  if (!s || s.rangeCount === 0) return [];
  const r = s.getRangeAt(0);
  if (r.collapsed) return [];
  const hit = editableEls(pagesEl).filter(el => r.intersectsNode(el));
  if (hit.length < 2) return [];
  return hit.filter(el => el.matches('td[data-r]'));   // 표 «밖»과 섞인 선택
}

// rangesIn 의 화면 요소를 모델 좌표 [{id, item|null, from, to}] 로 바꾼다.
// 도구모음(걸침 서식)과 편집기(걸침 지우기)가 같은 좌표를 쓴다.
function targetsIn(pagesEl) {
  return rangesIn(pagesEl).map(p => {
    const td = p.el.matches('td[data-r]') ? p.el : null;
    if (td) {
      const blk = td.closest('.blk[data-id]');
      const r = td.dataset.r === 'h' ? 'h' : Number(td.dataset.r);
      return { id: blk.dataset.id, item: null, cell: [r, Number(td.dataset.c)], from: p.from, to: p.to };
    }
    // 그림 캡션 — 블록 안의 저만의 글 칸이라 cap:1 로 표시한다(toolbar·editor 가 본다)
    const cap = p.el.matches('.blk-image .cap') ? p.el : null;
    if (cap) {
      const blk2 = cap.closest('.blk[data-id]');
      return { id: blk2.dataset.id, item: null, cap: 1, from: p.from, to: p.to };
    }
    const li = p.el.matches('.lst li[data-i]') ? p.el : null;
    const blk = li ? li.closest('.blk[data-id]') : p.el;
    return { id: blk.dataset.id, item: li ? Number(li.dataset.i) : null, from: p.from, to: p.to };
  });
}

// 선택이 목록 항목(li) 안이면 그 li 를 준다. 목록은 항목마다 편집 칸이 따로라,
// 글자 번호를 블록이 아니라 "그 항목 안"에서 세야 어긋나지 않는다.
function activeItemEl(blkEl) {
  const s = window.getSelection();
  const n = s && s.anchorNode;
  if (!n || !blkEl) return null;
  const e = n.nodeType === 1 ? n : n.parentElement;
  if (!e || !e.closest) return null;
  const li = e.closest('.lst li[data-i]');
  return li && blkEl.contains(li) ? li : null;
}

// 선택이 표 칸(td) 안이면 그 td 를 준다. 칸마다 편집 칸이 따로라
// 글자 번호를 "그 칸 안"에서 세야 어긋나지 않는다(목록 항목과 같은 이유).
function activeCellEl(blkEl) {
  const s = window.getSelection();
  const n = s && s.anchorNode;
  if (!n || !blkEl) return null;
  const e = n.nodeType === 1 ? n : n.parentElement;
  if (!e || !e.closest) return null;
  const td = e.closest('td[data-r]');
  return td && blkEl.contains(td) ? td : null;
}

// 선택이 그림 캡션 안이면 그 .cap 을 준다. 캡션은 저만의 편집 칸이라(중첩 편집 호스트)
// 글자 번호를 «캡션 안»에서 세야 어긋나지 않는다(표 칸·목록 항목과 같은 이유).
function activeCapEl(blkEl) {
  const s = window.getSelection();
  const n = s && s.anchorNode;
  if (!n || !blkEl) return null;
  const e = n.nodeType === 1 ? n : n.parentElement;
  if (!e || !e.closest) return null;
  const cap = e.closest('.blk-image .cap');
  return cap && blkEl.contains(cap) ? cap : null;
}

// 화면 배율 — «눈에 보이는 폭 ÷ 자리 폭». 좁은 화면에서 종이를 줄여 보여 줄 때
// (main.js 의 자동 축소) 1 보다 작아진다.
// ⭐ 마우스·손가락 좌표(clientX)는 «눈에 보이는» 눈금이고, 모델에 적는 크기는 «자리» 눈금이다.
//    둘을 섞으면 축소된 화면에서 손잡이를 끌 때 그림이 끈 것보다 덜(또는 더) 커진다.
//    그래서 화면 좌표의 «차이»를 모델 크기로 옮길 때는 이 값으로 나눈다.
function scaleOf(pagesEl) {
  if (!pagesEl) return 1;
  const w = pagesEl.offsetWidth;
  if (!w) return 1;
  const k = pagesEl.getBoundingClientRect().width / w;
  return (Number.isFinite(k) && k > 0.05) ? k : 1;
}

// 종이 «왼쪽 빈 자리»의 x 좌표 — 떠 있는 작은 창(서식바·판별 값 창)이 앉는 자리다.
// 2026-09-01 SKY: "드래그를 했을 떄 뜨는 서식바는 현재 드래그한 위치의 종이 좌측에 표시
// 되도록 했었는데, 어느 순간 변해 있어 … 이건 예전 html 과 위치가 동일해."
// 옛 4.4MB 프로그램의 규칙과 같은 뜻이다: left = max(사이드바 오른쪽, 종이 왼쪽 − 창 폭 − 틈).
// ⛔ «고른 것 바로 왼쪽»에 두면 안 된다 — 그러면 창이 글자 위를 덮는다(그게 지금 문제였다).
//    가로는 늘 종이 왼쪽에 고정하고, 세로만 고른 자리를 따라간다.
// ⚠ 자리가 모자라면(태블릿은 종이 왼쪽에 5px 밖에 없다) 사이드바 바로 옆에 붙인다 —
//    종이를 조금 덮더라도 «늘 같은 자리»여야 손이 찾아간다.
function leftGutterX(pagesEl, width) {
  const side = document.getElementById('side');
  const minX = (side ? side.getBoundingClientRect().right : 0) + 8;
  const page = pagesEl && pagesEl.querySelector('.page');
  if (!page) return minX;
  return Math.max(minX, Math.round(page.getBoundingClientRect().left - width - 12));
}

// 떠 있는 창의 세로 자리 — 고른 것 높이에 맞추되 화면 밖으로 나가지 않게 접는다
function clampTop(y, h) {
  const max = window.innerHeight - 6 - h;
  return Math.round(Math.max(6, Math.min(y, Math.max(6, max))));
}

// 종이 왼쪽 자리에 떠 있는 상자들을 «겹치지 않게» 쌓는다.
// 2026-09-01 SKY: "물러나고 판별 값 창만 남는게 아니고, 둘다 표시 되는 조건이니까 둘다
// 표시 되어야지. 겹치지만 않게." — 옛 4.4MB 프로그램의 positionBars() 도 두 바를 이렇게
// 위아래로 붙여 놓았다(objH + gap + txtH).
// wantY = 원래 놓고 싶은 자리 · h = 이 상자 높이 · taken = 이미 그 자리를 쓰는 상자들의 사각형
function packInGutter(wantY, h, taken) {
  const GAP = 8;
  const hit = (y) => (taken || []).find(r => y < r.bottom + GAP && y + h > r.top - GAP);
  let y = wantY;
  for (let i = 0; i < 8; i++) { const r = hit(y); if (!r) break; y = r.bottom + GAP; }
  // 아래로 밀다 화면 밖으로 나가면 위쪽으로 쌓아 본다
  if (y + h > window.innerHeight - 6) {
    y = wantY;
    for (let i = 0; i < 8; i++) { const r = hit(y); if (!r) break; y = r.top - GAP - h; }
  }
  return clampTop(y, h);
}

/* partsref.js */
// 표 칸에 «부품 값»을 걸어 둔다 (기둥 3, Task 3).
// 설계: docs/설계_부품목록.md §4·§6
//
// ⭐ 무엇을 하나: 고른 칸의 글자를 「안전관리 부품 목록」의 어느 값으로 바꾸고, 그 글자에
//    «어디서 왔는지» 꼬리표(ref)를 붙인다. 그 뒤로 목록에서 그 값을 고치면 이 칸도 바뀐다.
//
// ⛔ 꼬리표는 «값을 대신하는 것»이 아니라 «값에 붙은 꼬리표»다 — 글자는 늘 칸 안에 있다.
//    목록 파일이 없어져도 서류는 그대로 보인다(core/parts.js 머리말).
// ⛔ 최상위 이름은 attachPartsRef 하나뿐이다 — 빌드가 모듈을 한 덩어리로 합치므로
//    같은 이름이 둘이면 화면이 통째로 안 뜬다.
// ⚠ 판(版)과 만나는 자리다: 판을 보고 있고 그 칸이 판별 값을 갖고 있으면 «그 판의 값»에만
//   건다. 아니면 공통값에 건다. 새 장치를 만들지 않고 cell.vals 를 그대로 쓴다.






function attachPartsRef({ pagesEl, barEl, getDoc, setDoc, redraw, getView, getList, onSaved }) {
  let el = null;
  const close = () => { if (el) { el.remove(); el = null; } };

  // 지금 커서가 있는 표 칸 — 없으면 null
  function 칸찾기() {
    const blk = activeBlockEl(pagesEl);
    if (!blk) return null;
    const td = activeCellEl(blk);
    if (!td) return null;
    return { id: blk.dataset.id,
             cell: [td.dataset.r === 'h' ? 'h' : Number(td.dataset.r), Number(td.dataset.c)],
             el: td };
  }

  // 첫 토막의 서식을 그대로 나르고 글자와 꼬리표만 갈아 끼운다 — 굵게·모노가 안 풀린다.
  // ⛔ 그림은 안 나른다(그림 칸에는 애초에 걸지 않는다).
  function 값토막(runs, text, ref) {
    const m = Object.assign({}, (runs && runs[0]) || {});
    delete m.t; delete m.img; delete m.src$; delete m.crop; delete m.rad; delete m.ref;
    return [Object.assign({ t: text }, m, { ref })];
  }
  const 그림있나 = (runs) => (runs || []).some(r => r && (r.img || r.src$));

  function 걸기(t, part, field) {
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === t.id);
    const cell = cellAt(b, t.cell);
    if (!cell) return;
    const view = getView ? getView() : null;
    const ref = makeRef(part.id, field);
    const text = part[field] || '';
    // ⚠ 판을 보고 있고 그 칸이 «그 판만의 값»을 갖고 있으면 그 값에만 건다 — 아니면 공통값에.
    //   판별이 아닌 칸을 판별로 만들지는 않는다(그건 「이 칸 판별로」가 하는 일이다).
    const 판별 = view && cell.vals && Object.prototype.hasOwnProperty.call(cell.vals, view);
    let next;
    if (판별) {
      if (그림있나(cell.vals[view])) { window.alert('그림이 든 칸에는 걸 수 없습니다'); return; }
      const vals = Object.assign({}, cell.vals);
      vals[view] = 값토막(cell.vals[view], text, ref);
      next = Object.assign({}, cell, { vals });
    } else {
      if (그림있나(cell.runs)) { window.alert('그림이 든 칸에는 걸 수 없습니다'); return; }
      next = Object.assign({}, cell, { runs: 값토막(cell.runs, text, ref) });
    }
    const nb = setCellAt(b, t.cell, next);
    if (nb === b) return;                       // 바뀐 것이 없다 — 헛 되돌리기 걸음을 안 쌓는다
    setDoc(Object.assign({}, doc, {
      blocks: replaceBlock(doc.blocks, t.id, { head: nb.head, rows: nb.rows }),
    }));
    redraw();
    if (onSaved) {
      onSaved('「' + (part.name || '이름 없음') + '」 의 ' + 칸이름(field) + ' 을 넣었습니다'
        + (판별 ? ' — 지금 보는 판만' : ''));
    }
  }

  const 칸이름 = (k) => { const f = PART_FIELDS.find(x => x[0] === k); return f ? f[1] : k; };

  // 꼬리표를 뗀다 — 글자는 그대로 두고 «이제 손으로 쓴 값»으로 만든다.
  function 떼기(t) {
    const doc = getDoc();
    const b = doc.blocks.find(x => x.id === t.id);
    const cell = cellAt(b, t.cell);
    if (!cell) return;
    const 벗기기 = (runs) => {
      if (!Array.isArray(runs) || !runs.some(r => r && r.ref)) return runs;
      return runs.map(r => { if (!r || !r.ref) return r; const n = Object.assign({}, r); delete n.ref; return n; });
    };
    let next = cell;
    const runs = 벗기기(cell.runs);
    if (runs !== cell.runs) next = Object.assign({}, next, { runs });
