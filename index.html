<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<!-- 태블릿 전용 화면은 없다 — PC 화면(1100px)을 그대로 축소해 보인다 (2026-08-30 SKY) -->
<meta name="viewport" content="width=1100">
<title>문서 편집기</title>
<!-- 앱 정보(D17 주소 배포용) — 홈 화면·설치 아이콘이 여기서 나온다. file:// 로 열면 조용히 무시된다 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1c1e24">
<style>
:root {
  --point:#e5231b; --ink:#1c1e24; --sub:#5a5e6a; --dim:#8a8e98;
  --line:#e4e5e9; --line-soft:#eef0f4; --paper:#fff; --desk:#e8e9ec;
  --page-w:794px; --page-h:1123px;
}
* { box-sizing:border-box; }
/* ⛔ 가로로 쓸어도 «뒤로 가기»가 되지 않게 한다 — 태블릿에서 표를 손가락으로 끌면
   브라우저가 그걸 뒤로 가기로 받아 «편집 중인 화면이 통째로 날아간다»(실측 2026-08-30). */
html, body { overscroll-behavior-x:contain; }
body { margin:0; background:var(--desk); color:var(--ink);
       font-family:'Noto Sans KR','맑은 고딕','Malgun Gothic',sans-serif; }
#app { display:flex; min-height:100vh; }
/* 사이드바 — B안 「목록이 주인공」 (2026-08-30 SKY 확정): 종이처럼 흰 바탕에
   표처럼 헤어라인 구획. 머리는 문서 머리글 모티프(굵은 아래 경계 + 왼쪽 끝 64px만 빨강).
   화면을 내려도 왼쪽에 붙어 있는다 — 높이는 화면만큼, 넘치면 저 혼자 스크롤 */
/* 세로로 쌓되 맨 아래 «판» 표시를 바닥에 붙인다(margin-top:auto 가 먹으려면 flex 여야 한다) */
#side { width:250px; flex:none; background:#fff; color:var(--ink);
        border-right:1px solid var(--line); padding:0;
        display:flex; flex-direction:column;
        position:sticky; top:0; height:100vh; overflow-y:auto; }
#side .side-ttl, #side .side-btns, #folder-msg { flex:none; }
#side .side-ttl { padding:24px 18px 16px; border-bottom:1.5px solid var(--ink); position:relative; }
#side .side-ttl::after { content:''; position:absolute; left:0; bottom:-1.5px;
                         width:64px; height:3px; background:var(--point); }
.s-name { font-size:19px; font-weight:900; letter-spacing:-.3px; }
.s-eyebrow { font:600 9px 'IBM Plex Mono',Consolas,monospace; color:#aeb0b8;
             letter-spacing:1.4px; margin-top:6px; }
/* ⛔ min-width:0 이 없으면 이 칸이 «안의 내용만큼» 커져 화면 밖으로 나간다(flex 기본값이
   min-width:auto 라서다). 리본의 표 묶음이 좁은 화면에서 잘려 보이던 진짜 원인이었다
   (실측 2026-08-30: 화면 800px 인데 main 이 884px). 이게 있어야 안쪽 max-width 가 통한다. */
#main { flex:1; min-width:0; padding:0 0 60px; }
/* 입력판(D16) — 문서 전체가 하나의 contenteditable 이라 초점 테두리를 끈다 */
/* position:relative 는 그림 크기 손잡이(#imgui)의 좌표 기준이다 — 없으면 손잡이가
   엉뚱한 곳(화면 왼쪽 위)에 뜬다 */
/* ⛔ align-items 에 «safe» 가 꼭 있어야 한다. 그냥 center 로 두면 자리가 모자랄 때 종이가
   «양쪽»으로 넘쳐 왼쪽 사이드바 위로 올라탄다 — 저장·PDF 저장 단추가 종이에 가려 못 누른다
   (2026-08-31 SKY 지적, 태블릿 화면 나눠 쓰기. 실측: 화면 900px 이면 72px, 600px 이면 222px 덮음).
   safe 를 붙이면 자리가 모자란 순간 «가운데»를 포기하고 왼쪽 끝에 붙는다 — 넘치는 것은
   오른쪽뿐이라 사이드바를 절대 안 덮는다. */
#pages { display:flex; flex-direction:column; align-items:safe center; gap:28px; padding-top:28px;
         outline:none; caret-color:var(--ink); position:relative; }

/* 위쪽 도구모음 — 화면에 붙어 있고 문서와 함께 스크롤되지 않는다 */
/* 줄 사이는 조금 넓게 — 표 묶음의 「표」 이름표가 윗줄에 붙어 답답해 보였다(캡처 실측) */
#bar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:12px 6px;
       align-items:center; padding:8px 16px; background:#fff;
       border-bottom:1px solid var(--line); box-shadow:0 1px 6px rgba(20,22,30,.06); }
/* ⛔ 버튼 글자는 꺾지 않는다(white-space) · 버튼도 줄이지 않는다(flex:none) —
   자리가 모자라면 글자가 두 줄이 되는 게 아니라 버튼 줄이 다음 줄로 내려간다 */
.tb { min-width:56px; height:42px; padding:0 12px; border:1px solid var(--line);
      border-radius:6px; background:#fff; color:var(--ink); cursor:pointer;
      white-space:nowrap; flex:none;
      font:600 12.5px 'Noto Sans KR','맑은 고딕',sans-serif;
      transition:transform .12s, box-shadow .12s, background .12s; }
.tb:hover { transform:translateY(-2px); box-shadow:0 3px 10px rgba(20,22,30,.12); }
/* 눌린 상태 — 검은 배경은 너무 튀어서(SKY 2026-08-28) 살짝 눌린 회색으로 */
.tb.on { background:var(--line-soft); border-color:#9aa0ae;
         box-shadow:inset 0 1px 3px rgba(20,22,30,.18); }
.tb:disabled { opacity:.4; cursor:default; transform:none; box-shadow:none; }
.blk-list { margin:0 0 6px; }
.lst { margin:0; padding-left:22px; font-size:12.5px; line-height:1.85; color:#2b2f3a; }
.lst li { outline:none; margin:0 0 2px; }
/* 빈 항목: 속 빈 상자(inline-block)는 기준선 위에 얹혀 줄이 6px 커지고 커서가 떠 보였다(실측).
   폭 0짜리 보이지 않는 글자를 놓으면 기준선이 정상이라 커서가 번호와 나란히 선다. */
.lst li:empty::before { content:'\200B'; }

/* 같은 기능 묶음 — 줄바꿈될 때 묶음째 다음 줄로 내려간다 (2026-08-30 SKY) */
/* 사이드바 맨 아래 «판» 표시 — 평소엔 아주 작은 회색 글씨,
   새 판이 올라오면 눌러서 새로고침하는 단추가 된다 (2026-08-30 SKY) */
#ver { margin-top:auto; padding:10px 18px 14px; font-size:10px; color:var(--dim);
       letter-spacing:.2px; }
#ver.new { margin:12px 12px 14px; padding:9px 10px; border-radius:8px; cursor:pointer;
           background:var(--point); color:#fff; font-size:11.5px; font-weight:700;
           text-align:center; letter-spacing:0; }
@media print { #ver { display:none !important; } }
.tbg { display:flex; gap:6px; align-items:center; flex:none; }
/* ⛔ 이 한 줄이 없으면 상황 묶음의 hidden 이 «아무 일도 안 한다» — 위의 display:flex 가
   브라우저 기본 [hidden]{display:none} 을 이기기 때문이다. 코드는 hidden 을 제대로 켜고
   끄는데 화면은 그대로여서 «안 되는 것처럼» 보인다(2026-08-31 실측: 리본 높이가
   글만 칠 때도 그림 고를 때도 317px 로 똑같았다). */
.tbg[hidden] { display:none !important; }
/* 표 묶음 — 「표」 이름표가 붙은 한 덩어리로 보이게 (2026-08-30 SKY).
   ⚠ 버튼이 13개라 태블릿 폭에서는 묶음 자체가 화면보다 넓어져 «가로 스크롤»이 생겼다(실측).
      묶음은 하나로 두되 «묶음 안에서» 접히게 한다 — 상자는 하나로 보이고 줄만 늘어난다. */
.tbg-table { position:relative; padding:9px 8px 5px; border:1px solid var(--line); border-radius:8px;
             flex:0 1 auto; min-width:0; max-width:100%; flex-wrap:wrap; row-gap:6px; }
.tbg-table::before { content:attr(data-label); position:absolute; top:-1px; left:9px;
                     transform:translateY(-50%); padding:0 5px; background:#fff;
                     font-size:9.5px; font-weight:700; letter-spacing:.4px; color:var(--dim); }
.tb-sep { width:1px; height:26px; background:var(--line); margin:0 4px; }
.tb-sel { min-width:96px; padding:0 8px; }
.tb-c { min-width:42px; font-size:15px; line-height:1; }
.tb-ic { min-width:42px; }
.tb-ic svg { display:block; margin:0 auto; }
@media print { #bar { display:none !important; } }
/* 높이를 재는 숨은 상자 — 화면 밖에 두되 크기는 진짜 페이지와 같아야 한다 */
#gauge { position:absolute; left:-10000px; top:0; width:674px; visibility:hidden; }

.page { width:var(--page-w); height:var(--page-h); background:var(--paper);
        box-shadow:0 2px 14px rgba(20,22,30,.12); padding:46px 60px 34px;
        position:relative; overflow:hidden; }
.page-body { display:flex; flex-direction:column; gap:0; }
.pgno { position:absolute; right:60px; bottom:14px;
        font:600 10px 'IBM Plex Mono',Consolas,monospace; color:var(--ink); }

/* 고른 범위 표시 — 브라우저 기본(진한 파랑)은 글자 색을 덮어, 색을 바꿔도 바뀌었는지
   안 보였다(실기기 지적 3). 연한 파랑이면 선택된 채로도 빨강·회색이 그대로 읽힌다.
   글자 색은 건드리지 않는다(background 만 지정하면 글자는 제 색을 지킨다). */
.page ::selection { background:rgba(84,144,255,.25); }

/* 연속 공백과 Shift+Enter 줄바꿈을 그대로 살린다 */
.blk { outline:none; white-space:pre-wrap; }
.blk .mono { font-family:'IBM Plex Mono',Consolas,monospace; }
/* 표 — §8 확정값. 열 너비는 colgroup 픽셀(합 674)이 정하고 table-layout:fixed 가 지킨다 */
/* touch-action: pan-y — 표 위에서 «세로»로 끄는 것만 브라우저에 맡긴다(화면 넘기기).
   가로로 끄는 것은 우리가 «칸 고르기»로 쓴다. 이 한 줄이 없으면 손가락 가로 끌기가
   브라우저 손에 먼저 넘어가 칸이 안 골라진다(실측 2026-08-30). */
.blk-table { margin:4px 0 12px; position:relative; touch-action:pan-y; }
.blk-table table { width:100%; border-collapse:collapse; table-layout:fixed; }
.blk-table td { outline:none; word-break:break-word; }
.blk-table thead td { background:#f6f7fa; border-bottom:1.5px solid var(--ink);
                      padding:7px 8px; font-size:10.5px; font-weight:700; color:#454a58;
                      text-align:center; line-height:1.35; letter-spacing:-.1px; }
/* ⭐ 세로 맞춤 기본은 «가운데»다 (2026-08-30 SKY) — 한 칸만 아래로 나누면 같은 행의 안 나뉜
   칸이 위쪽에 붙어 어긋나 보였다. 칸마다 위/가운데/아래를 따로 고를 수 있다(엑셀과 같다). */
.blk-table tbody td { padding:6.5px 8px; font-size:11.5px; border-bottom:1px solid var(--line-soft);
                      color:#2b2f3a; font-variant-numeric:tabular-nums; line-height:1.4;
                      vertical-align:middle; }
.blk-table thead td { vertical-align:middle; }
.blk-table tbody tr:last-child td { border-bottom:1px solid #d8dbe3; }
/* 빈 칸에도 커서가 서게 — 목록 빈 항목과 같은 수법(폭 0 보이지 않는 글자) */
.blk-table td:empty::before { content:'\200B'; }
/* 열 경계 손잡이 — 평소엔 투명, 올리면 §8 헤어라인보다 살짝 진하게 */
.colgrip { position:absolute; top:0; bottom:0; width:7px; cursor:col-resize; z-index:3; }
.colgrip-fixed { cursor:default; pointer-events:none; }   /* 이어진 장의 것은 보기 전용 */
.colgrip:hover, .colgrip.on { background:rgba(84,144,255,.35); }
/* ⛔ 칸을 끄는 동안 손잡이는 «없는 것»으로 둔다(2026-08-30 SKY 실측).
   손잡이가 마우스를 가로채면 브라우저가 선택의 끝점을 «칸»이 아니라 «표 전체»로 잡아,
   네모 규칙이 무너지고 아래 행까지 전부 골라졌다. pointer-events 를 끄면
   그 자리 아래의 칸이 정상으로 잡히고, 파란 강조도 함께 사라진다.
   ⚠ 손잡이에서 «시작»한 열 끌기에는 picking 이 안 붙으므로 그대로 잘 끌린다. */
#pages.picking .colgrip { pointer-events:none; }
/* 표에 마우스를 올리면 칸 경계가 세로 눈금으로 보인다 — 세로선이 없어 열 구분이 안 되던 것.
   ⭐ 눈금은 «격자 열»이 아니라 «실제 칸»의 오른쪽에 그린다(2026-08-30 SKY 지적) —
      한 칸만 옆으로 나눴을 때, 안 나뉜 다른 행까지 선이 가로지르면 안 된다.
      td 에 그리므로 병합(cs)·나누기가 저절로 반영된다.
   ⚠ var(--line)(#e4e5e9)로는 흰 종이에서도 칸 선택(연파랑) 위에서도 안 보였다(캡처 실측) —
      반투명 먹으로 둬야 두 바탕 모두에서 읽힌다. 인쇄에는 안 나온다. */
.blk-table:hover td:not(:last-child) { border-right:1px solid rgba(28,30,36,.22); }
/* 여러 칸에 걸쳐 고르면 «칸 통째»로 칠한다 — 워드처럼 칸이 선택된 것이 보인다.
   반쪽만 파랗다가 칸 통째로 지워지면 놀라므로, 칠하는 범위와 지워지는 범위를 같게 뒀다. */
.blk-table td.cellsel { background:rgba(84,144,255,.25); }
/* 칸을 고르는 동안에는 그 표의 «글자 파란색»을 끈다 — 골라진 네모 밖 칸까지 파랗게
   보이면 어디가 골라진 것인지 알 수 없다(2026-08-30 SKY 지적) */
.blk-table.cells-picking td::selection, .blk-table.cells-picking td *::selection { background:transparent; }
@media print { .colgrip { display:none !important; }
               .blk-table td { border-right:0 !important; }
               .blk-table td.cellsel { background:transparent; } }
.blk-heading { font-size:27px; font-weight:900; line-height:1.2; margin:0 0 5px; letter-spacing:-.4px; }
.blk-section { display:flex; align-items:center; gap:9px; margin:22px 0 9px; }
.blk-section .n { font:600 11.5px 'IBM Plex Mono',Consolas,monospace;
                  color:var(--point); letter-spacing:1px; }
.blk-section .t { font-size:13px; font-weight:700; letter-spacing:-.2px; white-space:nowrap; }
.blk-section .rule { flex:1; height:1px; background:#e8eaef; }
.blk-para { font-size:12.5px; line-height:1.85; color:#2b2f3a; margin:0 0 6px; min-height:1.85em; }
.blk.sel { box-shadow:0 0 0 2px rgba(229,35,27,.25); border-radius:3px; }
#gauge .blk { margin-left:0; margin-right:0; }

.side-btns { display:flex; flex-direction:column; gap:6px; margin:14px 12px; }
.side-btns button { border:1px solid var(--line); border-radius:6px; padding:11px 14px;
                    cursor:pointer; font:600 13px 'Noto Sans KR',sans-serif;
                    background:#fff; color:#454a58; }
.side-btns button:hover { background:#f6f7fa; }
.side-btns button.pri { border:1.5px solid var(--point); color:var(--point); font-weight:800; }
.side-btns button.pri:hover { background:var(--point); color:#fff; }
#folder-msg { padding:2px 18px 6px; color:var(--dim); line-height:1.7; word-break:break-all;
              font:500 10px 'IBM Plex Mono',Consolas,monospace; letter-spacing:.4px; }
/* 문서 목록 — §8 표의 행과 같은 문법: 아래선 헤어라인 · 모노 번호 · 고른 것은 기준 행(옅은 빨강) */
#doclist { counter-reset:doc; }
#doclist a { display:flex; gap:10px; align-items:baseline; counter-increment:doc;
             color:#454a58; text-decoration:none; font-size:12.5px;
             padding:11px 18px; border-bottom:1px solid var(--line-soft); cursor:pointer; }
#doclist a:first-child { border-top:1px solid var(--line-soft); }
#doclist a::before { content:counter(doc, decimal-leading-zero);
                     font:600 10.5px 'IBM Plex Mono',Consolas,monospace; color:#aeb0b8; }
#doclist a:hover { background:#f6f7fa; color:var(--ink); }
#doclist a.on { background:#fdf5f4; color:var(--ink); font-weight:700; }
#doclist a.on::before { color:var(--point); font-weight:700; }

/* 스크립트가 막힌 곳(구글드라이브 미리보기 등)에서만 보이는 안내 */
.nojs { background:var(--point); color:#fff; font-size:14px; font-weight:700;
        line-height:1.7; padding:14px 18px; }

@page { size: A4 portrait; margin: 0; }
/* ── 그림 (설계_그림.md) ── */
/* position:relative 는 아래 캡션 안내글(::before)의 좌표 기준이다 — 없으면 안내글이
   종이 왼쪽 위 구석에 뜬다 */
.blk-image { margin:6px 0; position:relative; }
.blk-image img.bimg { display:inline-block; }
.blk-image .cap { font-size:10.5px; color:#5a5e6a; text-align:center; }
/* 캡션이 비면 높이 0 — 화면과 인쇄의 장 나눔이 같아야 한다.
   ⚠ min-height:0 으로는 안 된다(실측 2026-08-31: 그래도 15px). 크롬이 «글자를 칠 수 있는
   빈 칸»에는 커서 놓을 자리를 한 줄 강제로 만들어 주기 때문이다 — CSS 여백이 아니라
   편집 기능이 만드는 높이다. 그래서 접어 둔다(height:0). 커서가 들어오면 편다. */
.blk-image .cap:empty:not(:focus) { height:0; overflow:hidden; }
.blk-image .cap:focus { min-height:1.4em; overflow:visible; }
.blk-image .cap:focus:empty::before {
  content:'그림 설명 (비우면 안 보임)'; color:#aeb0b8; position:absolute; left:0; right:0; }
/* 그림을 고르면 빈 캡션이 펴진다 — 안 그러면 새로 넣은 그림에 설명을 달 길이 없다
   (접혀 있어 누를 수가 없다). 인쇄에서는 고른 상태가 의미 없으므로 다시 접는다. */
.blk-image img.imgsel ~ .cap:empty { height:auto; overflow:visible; min-height:1.4em; }
.blk-image img.imgsel ~ .cap:empty::before {
  content:'그림 설명 (비우면 안 보임)'; color:#aeb0b8; }
#pages img.ri, #gauge img.ri { vertical-align:middle; max-width:100%; height:auto; }
/* 여러 장 고르기(Ctrl+클릭) — ⛔ 예전에는 함께 고른 것을 «연한 하늘색»으로만 그렸더니
   무엇을 골랐는지 알아보기 어려웠다(2026-08-31 SKY 지적: «마지막 항목만 파란색으로
   표시되니까 어떤 걸 선택했는지 헷갈려»). 이제 고른 것은 «전부» 같은 파란 테두리에
   퍼지는 파란 테를 둘러 한눈에 보이게 하고, «기준»(손잡이가 붙고 서식 창이 값을 보여 주는
   그 한 장)은 테두리를 더 굵고 진하게 해서 가른다. 손잡이도 기준에만 붙는다. */
#pages img.imgsel { outline:2px solid #5490ff; outline-offset:1px;
  box-shadow:0 0 0 4px rgba(84,144,255,.30); }
#pages img.imgsel.imgbase { outline:3px solid #2f6fe0; outline-offset:1px;
  box-shadow:0 0 0 5px rgba(47,111,224,.38); }
/* ── 자르기 감싸개(.iclip) — 표시 크기를 박아 두는 «창» (설계_서식과우클릭.md §4-3) ──
   안쪽 img 는 «원본 전체»를 배율로 키운 것이라 감싸개보다 크고 음수 마진으로 밀려 있다.
   ⛔ max-width 를 풀지 않으면 그 img 가 감싸개 폭으로 눌려 자르기가 통째로 무너진다
      (#pages img.ri 의 max-width:100% 가 감싸개 안에서는 «감싸개 폭»을 뜻하기 때문). */
#pages .iclip, #gauge .iclip { display:inline-block; overflow:hidden;
  vertical-align:middle; line-height:0; }
#pages .iclip img, #gauge .iclip img { max-width:none; }
/* 자른 그림은 «감싸개»가 곧 눈에 보이는 네모다 — 선택 테두리도 거기 그린다.
   안쪽 img 에 그리면 overflow:hidden 에 잘려 안 보인다. */
#pages .iclip:has(img.imgsel) { outline:2px solid #5490ff; outline-offset:1px;
  box-shadow:0 0 0 4px rgba(84,144,255,.30); touch-action:none; }
#pages .iclip:has(img.imgbase) { outline:3px solid #2f6fe0;
  box-shadow:0 0 0 5px rgba(47,111,224,.38); }
#pages .iclip img.imgsel { outline:none; box-shadow:none; }
/* 빈 캡션 펴기도 감싸개를 건너 이어져야 한다 — img 가 span 안으로 들어가면서
   기존 «img.imgsel ~ .cap» 형제 규칙이 안 닿는다 */
.blk-image .iclip:has(img.imgsel) ~ .cap:empty {
  height:auto; overflow:visible; min-height:1.4em; }
.blk-image .iclip:has(img.imgsel) ~ .cap:empty::before {
  content:'그림 설명 (비우면 안 보임)'; color:#aeb0b8; }
/* 크기 손잡이 — 편집 화면 전용, 인쇄에 안 찍힌다.
   ⚠ #imgui 자체는 pointer-events:none 이라 밑에 있는 글자를 가리지 않는다(2B 함정 재발 방지) */
#imgui { position:absolute; z-index:30; pointer-events:none; }
/* ⛔ touch-action:none 이 없으면 태블릿·폰에서 크기 조절이 통째로 죽는다 —
   손가락이 두어 번 움직이는 순간 크롬이 «이건 화면 넘기기구나» 하고 판단해
   pointercancel 로 끊어 버린다(2026-08-31 실측: pointerdown → move 2번 → cancel).
   ⭐ 잡히는 영역은 26px(손가락용), 눈에 보이는 네모는 그 안의 11px 이다.
   보이는 것만 크게 하면 화면이 지저분해지고, 잡히는 것만 작으면 못 쓴다. */
#imgui .imgh { position:absolute; width:26px; height:26px; pointer-events:auto;
  touch-action:none; display:flex; align-items:center; justify-content:center; }
#imgui .imgh::before { content:''; width:11px; height:11px; background:#fff;
  border:1.5px solid #5490ff; border-radius:2px; }
#imgui .imgh[data-c="nw"] { left:-13px; top:-13px; cursor:nwse-resize; }
#imgui .imgh[data-c="ne"] { right:-13px; top:-13px; cursor:nesw-resize; }
#imgui .imgh[data-c="sw"] { left:-13px; bottom:-13px; cursor:nesw-resize; }
#imgui .imgh[data-c="se"] { right:-13px; bottom:-13px; cursor:nwse-resize; }
/* 고른 그림 자체도 손가락 끌기가 스크롤로 새지 않게 */
#pages img.imgsel { touch-action:none; }
/* 끌 때 «어디로 가는지» 미리보기 — 보통 블록은 그 아래 굵은 줄, 표 칸은 테두리 */
#imgdrop { position:absolute; z-index:29; pointer-events:none; height:3px;
  background:#5490ff; border-radius:2px; box-shadow:0 0 0 1px rgba(84,144,255,.3); }
#imgdrop.cell { height:auto; background:transparent; border:2px solid #5490ff;
  border-radius:3px; box-shadow:none; }
@media print { #imgdrop { display:none !important; } }

/* ── 그림 서식 창 (설계_서식과우클릭.md §4-1) ──
   body 에 살면서 기준 그림 옆에 fixed 로 떠 있는 작은 카드다. 종이 위가 아니라
   «화면 위»에 있어야 페이지가 넘어가거나 다시 그려져도 자리가 안 흔들린다(M6). */
#imgpanel { position:fixed; z-index:100; width:206px; background:#fff;
  border:1px solid var(--line); border-radius:10px; padding:10px 12px 12px;
  box-shadow:0 6px 24px rgba(20,22,30,.16); font-size:12px; color:var(--ink); }
#imgpanel .fp-ttl { display:flex; align-items:center; justify-content:space-between;
  font-weight:800; font-size:12.5px; padding-bottom:8px; margin-bottom:8px;
  border-bottom:1px solid var(--line-soft); }
#imgpanel .fp-x { border:0; background:none; cursor:pointer; color:var(--dim);
  font-size:13px; line-height:1; padding:2px 4px; }
#imgpanel .fp-x:hover { color:var(--ink); }
#imgpanel .fp-n { display:none; color:var(--sub); font-size:11px; line-height:1.45;
  margin-bottom:8px; }
/* ⚠ 라벨 글자 길이가 제각각(「폭」·「둥근 모서리」)이라 flex 로 두면 입력칸 폭이 줄마다
   달라져 들쭉날쭉해 보인다(캡처 실측). 격자로 칸을 «세로로 맞춰» 놓는다. */
#imgpanel label { display:grid; grid-template-columns:62px 1fr auto; align-items:center;
  gap:6px; margin-bottom:7px; color:var(--sub); }
#imgpanel label input { min-width:0; width:100%; height:28px; padding:0 6px;
  border:1px solid var(--line); border-radius:6px; font:inherit; color:var(--ink); }
#imgpanel label i { font-style:normal; color:var(--dim); }
#imgpanel .fp-btns { display:flex; gap:6px; margin-top:9px; }
#imgpanel .fp-btns button { flex:1; min-width:0; height:30px; padding:0 6px;
  border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
  font:inherit; cursor:pointer; white-space:nowrap; }
#imgpanel .fp-btns button:hover { background:#f5f6f8; }
#imgpanel .fp-align { display:flex; }
#imgpanel .fp-align button.on { border-color:var(--ink); font-weight:700; }
@media print { #imgpanel { display:none !important; } }

/* ── 자르기 덮개 (설계_서식과우클릭.md §4-2) ──
   유령(.cg)이 «원본 전체»를 지금 배율로 깔고, 창(.cw)이 보여 줄 자리다.
   ⭐ 창 밖을 어둡게 하는 것은 칸 4개가 아니라 창의 box-shadow 하나다 — 창을 옮기면
      어두운 부분이 저절로 따라오므로 어긋날 데가 없다. */
#cropui { position:fixed; inset:0; z-index:110; overflow:hidden; }
#cropui .cg { position:fixed; max-width:none; user-select:none; -webkit-user-drag:none; }
#cropui .cw { position:fixed; box-shadow:0 0 0 9999px rgba(20,22,28,.45);
  outline:1.5px solid #5490ff; cursor:move; touch-action:none; }
/* ⛔ 잡히는 영역은 26px(손가락용), 눈에 보이는 네모는 그 안의 11px 이다 —
   #imgui 손잡이와 같은 방식이다. touch-action:none 이 없으면 태블릿에서
   크롬이 «화면 넘기기»로 채 가서 조절이 통째로 죽는다(2026-08-31 실측). */
#cropui .ch { position:absolute; width:26px; height:26px; touch-action:none;
  display:flex; align-items:center; justify-content:center; }
#cropui .ch::before { content:''; width:11px; height:11px; background:#fff;
  border:1.5px solid #5490ff; border-radius:2px; }
#cropui .ch[data-c="nw"] { left:-13px; top:-13px; cursor:nwse-resize; }
#cropui .ch[data-c="n"]  { left:50%; margin-left:-13px; top:-13px; cursor:ns-resize; }
#cropui .ch[data-c="ne"] { right:-13px; top:-13px; cursor:nesw-resize; }
#cropui .ch[data-c="e"]  { right:-13px; top:50%; margin-top:-13px; cursor:ew-resize; }
#cropui .ch[data-c="se"] { right:-13px; bottom:-13px; cursor:nwse-resize; }
#cropui .ch[data-c="s"]  { left:50%; margin-left:-13px; bottom:-13px; cursor:ns-resize; }
#cropui .ch[data-c="sw"] { left:-13px; bottom:-13px; cursor:nesw-resize; }
#cropui .ch[data-c="w"]  { left:-13px; top:50%; margin-top:-13px; cursor:ew-resize; }
/* 안내 줄 — 화면 위 가운데. 태블릿에는 Enter·Esc 키가 없어 단추가 유일한 «취소» 길이다. */
#cropui .ctip { position:fixed; left:50%; top:14px; transform:translateX(-50%);
  display:flex; align-items:center; gap:10px; max-width:calc(100vw - 24px);
  padding:8px 10px 8px 14px; background:#fff; border-radius:10px;
  box-shadow:0 6px 24px rgba(20,22,30,.28); font-size:12.5px; color:var(--ink); }
#cropui .ctip span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#cropui .ctip button { flex:none; height:32px; padding:0 14px; border-radius:7px;
  border:1px solid var(--line); background:#fff; color:var(--ink); font:inherit; cursor:pointer; }
#cropui .ctip .ct-ok { border-color:var(--ink); background:var(--ink); color:#fff; font-weight:700; }
@media print { #cropui { display:none !important; } }

/* ── 우클릭 문맥 메뉴 · 미니 패널 (설계_서식과우클릭.md §5-2·§5-3) ──
   ⭐ 맨 위 «뱃지»가 지금 무엇을 고른 상태인지 말해 준다 — 「▦ 표 · 3칸 고름」처럼.
      메뉴가 왜 이 모습인지 알려 주는 한 줄이라 이것부터 읽게 크기를 잡았다. */
#ctxmenu, #minibar { position:fixed; z-index:120; background:#fff; color:var(--ink);
  border:1px solid var(--line); border-radius:10px; padding:8px;
  box-shadow:0 8px 28px rgba(20,22,30,.20); font-size:12px; }
#minibar { z-index:115; }
#ctxmenu { width:264px; }
#ctxmenu .mbadge, #minibar .mbadge { font-size:10.5px; color:var(--dim); letter-spacing:.2px;
  padding:0 2px 6px; }
/* 빠른 줄 — 기호만 쓴 작은 단추. 뜻이 같은 것끼리(.qg) 줄을 나눈다:
   글자꼴(B I U A＋ A−) / 색(■■■ ✕) / 정렬·맞춤. 한 줄로 죽 늘어놓으면 폭에 따라
   아무 데서나 접혀 «7개, 7개, 1개»처럼 갈라진다(캡처 실측). */
.qs { display:flex; flex-direction:column; gap:3px; padding-bottom:6px; }
.qs .qg { display:flex; flex-wrap:wrap; gap:3px; }
.qs .q { width:30px; height:30px; padding:0; flex:none; display:flex; align-items:center;
  justify-content:center; border:1px solid transparent; border-radius:6px;
  background:#fff; color:var(--ink); font:inherit; cursor:pointer; }
.qs .q:hover { background:#f2f3f6; border-color:var(--line); }
.qs .q-b { font-weight:900; }
.qs .q-i { font-style:italic; }
.qs .q-u { text-decoration:underline; }
/* 목록은 2열이다 — 세로로 길면 손이 아래까지 내려가야 해서 태블릿에서 특히 나빴다 */
#ctxmenu .mlist { display:grid; grid-template-columns:1fr 1fr; gap:3px;
  border-top:1px solid var(--line-soft); padding-top:6px; }
#ctxmenu .mlist button { height:31px; padding:0 8px; text-align:left; border:1px solid transparent;
  border-radius:6px; background:#fff; color:var(--ink); font:inherit; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#ctxmenu .mlist button:hover { background:#f2f3f6; border-color:var(--line); }
#minibar { padding:6px; }
#minibar .qs { padding-bottom:0; max-width:200px; }
/* 알림 — 붙여넣기가 브라우저에 막혔을 때 «막혔다»고 말해 준다. 조용히 삼키지 않는다. */
.mtoast { position:fixed; z-index:130; max-width:300px; padding:9px 12px; border-radius:8px;
  background:var(--ink); color:#fff; font-size:12px; line-height:1.5;
  box-shadow:0 6px 20px rgba(20,22,30,.28); }
@media print { #ctxmenu, #minibar, .mtoast { display:none !important; } }

@media print {
  #side, #gauge, #folder-msg { display:none !important; }
  #imgui { display:none !important; }
  /* ⛔ box-shadow 도 함께 꺼야 한다 — outline 만 끄면 파란 테가 종이에 그대로 찍힌다 */
  #pages img.imgsel { outline:none !important; box-shadow:none !important; }
  #pages .iclip:has(img.imgsel) { outline:none !important; box-shadow:none !important; }
  /* 인쇄에서는 «고른 그림»이 의미가 없다 — 펴 뒀던 빈 캡션을 도로 접는다 */
  .blk-image .cap:empty { height:0 !important; overflow:hidden !important;
                          min-height:0 !important; }
  .blk-image .cap:empty::before { content:none !important; }
  body { background:#fff; }
  /* ⛔ 확대/축소가 인쇄에 남으면 A4 밖으로 잘린다 (설계서 §12-10) */
  #main { padding:0 !important; transform:none !important; zoom:1 !important; }
  #pages { gap:0 !important; }
  .nojs { display:none !important; }
  .page { box-shadow:none !important; margin:0 !important;
          page-break-after:always; break-after:page; }
  .page:last-child { page-break-after:auto; break-after:auto; }
  .blk { outline:none !important; box-shadow:none !important; }
}

</style>
</head>

<noscript><div class="nojs">⚠ 여기서는 이 프로그램이 동작하지 않습니다 (구글드라이브 미리보기는 스크립트를 막습니다).
파일을 기기에 내려받은 뒤 Chrome 이나 삼성인터넷으로 열어 주세요.</div></noscript>
<div id="app">
  <aside id="side"><div class="side-ttl"><div class="s-name">문서 편집기</div>
    <div class="s-eyebrow">SAMIL ELTEC CO., LTD.</div></div>
  <div class="side-btns">
    <button id="btn-folder">📁 문서 폴더 열기</button>
    <button id="btn-new">새 문서</button>
    <button id="btn-save">저장</button>
    <button id="btn-saveas">다른 이름으로 저장</button>
    <button id="btn-pdf" class="pri">PDF 저장</button>
  </div>
  <div id="folder-msg"></div>
<div id="doclist"></div>
  <!-- 지금 쓰고 있는 판. 새 판이 올라오면 여기가 «새 버전 있음» 단추로 바뀐다 -->
  <div id="ver" title="지금 쓰는 판"></div></aside>
  <main id="main">
    <div id="bar">
      <!-- 같은 기능은 한 묶음(tbg) — 좁은 화면에서 줄바꿈될 때 묶음째 내려간다 (2026-08-30 SKY) -->
      <span class="tbg">
      <button class="tb" data-mark="b" title="굵게 (Ctrl+B)"><b>굵게</b></button>
      <button class="tb" data-mark="i" title="기울임 (Ctrl+I)"><i>기울임</i></button>
      <button class="tb" data-mark="u" title="밑줄 (Ctrl+U)"><u>밑줄</u></button>
      </span>
      <span class="tb-sep"></span>
      <span class="tbg">
      <select id="tb-size" class="tb tb-sel" title="글자 크기">
        <option value="">크기</option>
        <option value="8.5">8.5 단위</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="10.5">10.5 작게</option>
        <option value="11">11</option>
        <option value="11.5">11.5 표</option>
        <option value="12">12</option>
        <option value="12.5">12.5 본문</option>
        <option value="13">13 소제목</option>
        <option value="14">14</option>
        <option value="15">15</option>
        <option value="16">16</option>
        <option value="18">18</option>
        <option value="20">20</option>
        <option value="24">24</option>
        <option value="27">27 제목</option>
        <option value="30">30</option>
        <option value="36">36</option>
      </select>
      <button class="tb" data-szstep="1" title="글자 크게">A＋</button>
      <button class="tb" data-szstep="-1" title="글자 작게">A−</button>
      </span>
      <span class="tbg">
      <button class="tb tb-c" data-color="#1c1e24" title="본문색" style="color:#1c1e24">■</button>
      <button class="tb tb-c" data-color="#5a5e6a" title="보조색" style="color:#5a5e6a">■</button>
      <button class="tb tb-c" data-color="#e5231b" title="포인트색" style="color:#e5231b">■</button>
      <button class="tb tb-c" data-color="" title="색 지우기">✕</button>
      </span>
      <span class="tb-sep"></span>
      <!-- 정렬은 «언제나» 쓰는 것이라 항상 묶음에 둔다 — 문단·표 칸·고른 그림에 모두 붙는다.
           ⚠ data-align 셀렉터는 그대로다(toolbar.js·format.js 코드 무변). -->

        next[ac] = n2;
      }
    } else if ((cell.cs || 1) > 1) {
      const moved = Object.assign({}, cell, { cs: cell.cs - 1 });   // 글을 오른쪽 칸에 물려준다
      if (moved.cs <= 1) delete moved.cs;
      next[at + 1] = moved;
    }
    next.splice(at, 1);
    return next;
  });
  let head = t.head;
  if (head && head.length) {
    const hrow = head[0].slice();
    const hc = hrow[at];
    if (hc.cov) {
      const oi = rowAnchor(hrow, at);
      if (oi !== at) {
        const a = Object.assign({}, hrow[oi], { cs: (hrow[oi].cs || 1) - 1 });
        if (a.cs <= 1) delete a.cs;
        hrow[oi] = a;
      }
    } else if ((hc.cs || 1) > 1) {
      const moved = Object.assign({}, hc, { cs: hc.cs - 1 });
      if (moved.cs <= 1) delete moved.cs;
      hrow[at + 1] = moved;
    }
    hrow.splice(at, 1);
    head = [hrow];
  }
  return normalizeWidths(Object.assign({}, t, { cols, rows, head }), total);
}

// ⛔ 글이 사라지지 않는다 — 덮일 칸들의 글을 기준 칸에 줄바꿈으로 모은다(계획 R8).
function mergeCells(t, r1, c1, r2, c2) {
  let a = Math.min(r1, r2), z = Math.max(r1, r2);
  let l = Math.min(c1, c2), x = Math.max(c1, c2);
  let grew = true;                                      // 겹치는 기존 병합을 다 품을 때까지
  while (grew) {
    grew = false;
    for (let r = 0; r < t.rows.length; r++) for (let c = 0; c < t.cols.length; c++) {
      const cell = t.rows[r][c];
      if (cell.cov) continue;
      const rs = cell.rs || 1, cs = cell.cs || 1;
      if (r > z || r + rs - 1 < a || c > x || c + cs - 1 < l) continue;
      if (r < a) { a = r; grew = true; }
      if (c < l) { l = c; grew = true; }
      if (r + rs - 1 > z) { z = r + rs - 1; grew = true; }
      if (c + cs - 1 > x) { x = c + cs - 1; grew = true; }
    }
  }
  if (a === z && l === x) return t;
  const rows = cloneRows(t.rows);
  const joined = [];
  for (let r = a; r <= z; r++) for (let c = l; c <= x; c++) {
    const cell = t.rows[r][c];
    if (cell.cov || !runsLength(cell.runs || [])) continue;
    if (joined.length) joined.push({ t: '\n' });
    joined.push(...cell.runs);
  }
  for (let r = a; r <= z; r++) for (let c = l; c <= x; c++) {
    if (r === a && c === l) {
      const base = bare(t.rows[a][l]);
      base.runs = normalizeRuns(joined);
      if (z > a) base.rs = z - a + 1;
      if (x > l) base.cs = x - l + 1;
      rows[r][c] = base;
    } else rows[r][c] = { runs: [], cov: 1 };
  }
  return Object.assign({}, t, { rows });
}

function splitCell(t, r, c) {
  const [ar, ac] = anchorOf(t, r, c);
  const cell = t.rows[ar][ac];
  const rs = cell.rs || 1, cs = cell.cs || 1;
  if (rs === 1 && cs === 1) return t;
  const rows = cloneRows(t.rows);
  for (let i = ar; i < ar + rs; i++) for (let j = ac; j < ac + cs; j++) {
    rows[i][j] = (i === ar && j === ac) ? bare(cell) : { runs: [] };
  }
  return Object.assign({}, t, { rows });
}

// 세로 병합으로 묶인 행 덩어리 — 장 나눔이 이 단위로만 일어난다(계획 R12).
function rowGroups(t) {
  const groups = [];
  let r = 0;
  while (r < t.rows.length) {
    let to = r;
    for (let rr = r; rr <= to; rr++) for (let c = 0; c < t.cols.length; c++) {
      const [ar, ac] = anchorOf(t, rr, c);
      const cell = t.rows[ar][ac];
      const end = ar + (cell.rs || 1) - 1;
      if (end > to) to = end;
    }
    groups.push([r, to]);
    r = to + 1;
  }
  return groups;
}

// 합을 «정확히» total 로 맞춘다.
// ⛔ 예전에는 남는 것을 마지막 열에 몰아줬는데, 그 열이 최소폭에 걸리면 합이 total 을
//    넘어 표가 종이 밖으로 삐져나갔다 — 맨 끝에 열을 하나 넣으면 674 가 677 이 됐다(실측
//    2026-08-30, SKY 지적으로 발견). 이제 남거나 모자란 만큼을 1px 씩 나눠 주고받는다.
// ⚠ 열이 아주 많아 최소폭(30)조차 못 채우면 그때는 최소폭을 낮춘다 — 종이 밖으로
//    나가느니 좁게라도 안에 들어오는 편이 낫다.
function normalizeWidths(t, total) {
  const n = t.cols.length;
  const cols = t.cols.map(c => Object.assign({}, c));
  if (!n) return Object.assign({}, t, { cols });
  const floor = Math.min(MIN_COL_W, Math.floor(total / n));
  let sum = 0;
  for (const c of cols) { c.w = Math.max(floor, Math.round(Number(c.w) || 0)); sum += c.w; }
  let acc = 0;
  for (let i = 0; i < n; i++) {
    cols[i].w = Math.max(floor, Math.round(cols[i].w * total / sum));
    acc += cols[i].w;
  }
  let diff = total - acc;                       // 남았으면 +, 모자라면 −
  while (diff !== 0) {
    let moved = false;
    for (let i = n - 1; i >= 0 && diff !== 0; i--) {
      if (diff > 0) { cols[i].w += 1; diff -= 1; moved = true; }
      else if (cols[i].w > floor) { cols[i].w -= 1; diff += 1; moved = true; }
    }
    if (!moved) break;                          // 더 줄일 곳이 없다 — 무한 반복은 막는다
  }
  return Object.assign({}, t, { cols });
}

// i번째 경계 끌기 — i열과 i+1열이 주고받아 합이 안 변한다(계획 R13).
function setColWidth(t, i, w) {
  if (i < 0 || i >= t.cols.length - 1) return t;
  const cols = t.cols.map(c => Object.assign({}, c));
  const pair = cols[i].w + cols[i + 1].w;
  const nw = Math.max(MIN_COL_W, Math.min(Math.round(w), pair - MIN_COL_W));
  cols[i].w = nw;
  cols[i + 1].w = pair - nw;
  return Object.assign({}, t, { cols });
}

// 칸 «속»의 고른 구간만 지운다. 구조는 그대로다(계획 R5).
function clearCellRanges(t, targets) {
  const rows = cloneRows(t.rows);
  const head = t.head && t.head.length ? [t.head[0].slice()] : t.head;
  for (const g of targets || []) {
    const row = g.r === 'h' ? (head && head[0]) : rows[g.r];
    const cell = row && row[g.c];
    if (!cell || cell.cov) continue;
    const len = runsLength(cell.runs || []);
    const runs = normalizeRuns(sliceRuns(cell.runs || [], 0, g.from)
      .concat(sliceRuns(cell.runs || [], g.to, len)));
    row[g.c] = Object.assign({}, cell, { runs });
  }
  return Object.assign({}, t, { rows, head });
}

function tableText(t) {
  const line = (row) => (row || []).filter(c => !c.cov).map(c => runsText(c.runs || [])).join('\t');
  return (t.head || []).map(line).concat((t.rows || []).map(line)).join('\n');
}

// ── 임의 칸 나누기(계획 R16 — 워드의 «셀 분할») ──
// 홑칸을 나누려면 그 자리에 격자 눈금이 하나 더 필요하다 → 격자 열(행)을 복제하되
// 같은 줄의 다른 칸들은 병합(cs/rs)을 1 키워 겉모습이 안 변하게 한다.
// ⚠ 그래서 «머리글 칸에도 cs·cov 가 생길 수 있다» — 그리기와 열 넣기/빼기가 이를 안다.

// 한 행 «안»에서 at 위치를 덮는(가로 병합) 칸의 번호. 세로 병합은 모른다 — 머리글용.
function rowAnchor(row, at) {
  for (let i = at; i >= 0; i--) {
    if (row[i] && row[i].cov) continue;
    if (row[i] && i + (row[i].cs || 1) > at) return i;
    break;
  }
  return at;
}

// 격자 열 at 를 둘로 복제한다 — at 의 너비를 반씩 나눠 갖고, 모든 줄에서 그 자리를
// 소유한 칸의 cs 가 1 커져 겉모습이 안 변한다. (임의 나누기의 밑작업)
function dupGridCol(t, at) {
  const cols = t.cols.map(c => Object.assign({}, c));
  const half = Math.max(MIN_COL_W, Math.round(cols[at].w / 2));
  const rest = Math.max(MIN_COL_W, (cols[at].w || half * 2) - half);
  cols[at] = Object.assign({}, cols[at], { w: half });
  cols.splice(at + 1, 0, { w: rest });
  const rows = t.rows.map((row, r) => {
    const next = row.slice();
    const [ar, ac] = anchorOf(t, r, at);
    if (r === ar) next[ac] = Object.assign({}, t.rows[ar][ac], { cs: (t.rows[ar][ac].cs || 1) + 1 });
    next.splice(at + 1, 0, { runs: [], cov: 1 });
    return next;
  });
  let head = t.head;
  if (head && head.length) {
    const hrow = head[0].slice();
    const oi = rowAnchor(hrow, at);
    hrow[oi] = Object.assign({}, hrow[oi], { cs: (hrow[oi].cs || 1) + 1 });
    hrow.splice(at + 1, 0, { runs: [], cov: 1 });
    head = [hrow];
  }
  return Object.assign({}, t, { cols, rows, head });
}

// 몸통 행 at 를 둘로 복제한다 — 모든 열에서 그 자리를 소유한 칸의 rs 가 1 커진다.
function dupGridRow(t, at) {
  const rows = cloneRows(t.rows);
  const fresh = [];
  for (let c = 0; c < t.cols.length; c++) {
    const [ar, ac] = anchorOf(t, at, c);
    if (c === ac) rows[ar][ac] = Object.assign({}, t.rows[ar][ac], { rs: (t.rows[ar][ac].rs || 1) + 1 });
    fresh.push({ runs: [], cov: 1 });
  }
  rows.splice(at + 1, 0, fresh);
  return Object.assign({}, t, { rows });
}

// 직사각형 구역을 «왼/위 조각(글 전부) + 오른/아래 조각(빈 칸) + 나머지 cov» 로 다시 깐다
function repave(rows, ar, ac, rs, cs, splitAtCol, splitAtRow, keep) {
  for (let i = ar; i < ar + rs; i++) for (let j = ac; j < ac + cs; j++) {
    if (i === ar && j === ac) {
      const a = Object.assign({}, keep);
      const w1 = (splitAtCol || ac + cs) - ac;
      const h1 = (splitAtRow || ar + rs) - ar;
      if (w1 > 1) a.cs = w1; else delete a.cs;
      if (h1 > 1) a.rs = h1; else delete a.rs;
      rows[i][j] = a;
    } else if (splitAtCol && i === ar && j === splitAtCol) {
      const b = { runs: [] };
      if (ac + cs - splitAtCol > 1) b.cs = ac + cs - splitAtCol;
      if (rs > 1) b.rs = rs;
      rows[i][j] = b;
    } else if (splitAtRow && i === splitAtRow && j === ac) {
      const b = { runs: [] };
      if (cs > 1) b.cs = cs;
      if (ar + rs - splitAtRow > 1) b.rs = ar + rs - splitAtRow;
      rows[i][j] = b;
    } else rows[i][j] = { runs: [], cov: 1 };
  }
}

// 칸을 옆으로 둘로 나눈다(R16). 홑칸이면 격자 열을 복제해 자리를 만든다.
function splitCellAcross(t, r, c, total) {
  const [ar, ac] = anchorOf(t, r, c);
  let base = t;
  if ((t.rows[ar][ac].cs || 1) === 1) base = dupGridCol(t, ac);
  const cell = base.rows[ar][ac];
  const cs = cell.cs || 1;
  const rs = cell.rs || 1;
  const rows = cloneRows(base.rows);
  repave(rows, ar, ac, rs, cs, ac + Math.ceil(cs / 2), null, bare(cell));
  return normalizeWidths(Object.assign({}, base, { rows }), total);
}

// 칸을 아래로 둘로 나눈다(R16). 홑칸이면 몸통 행을 복제해 자리를 만든다.
function splitCellDown(t, r, c) {
  const [ar, ac] = anchorOf(t, r, c);
  let base = t;
  if ((t.rows[ar][ac].rs || 1) === 1) base = dupGridRow(t, ar);
  const cell = base.rows[ar][ac];
  const cs = cell.cs || 1;
  const rs = cell.rs || 1;
  const rows = cloneRows(base.rows);
  repave(rows, ar, ac, rs, cs, null, ar + Math.ceil(rs / 2), bare(cell));
  return Object.assign({}, base, { rows });
}

// 머리글 행을 켜고 끈다 (2026-08-30 SKY: "표에서 머리글도 안쓰는 표도 있어").
// 켜기 = 첫 몸통 행을 머리글로 «올린다» · 끄기 = 머리글을 몸통 맨 앞으로 «내린다».
// 글은 어느 쪽으로도 사라지지 않는다 — 자리만 옮긴다.
// ⛔ 머리글은 세로 병합을 가질 수 없다 — 장을 넘을 때 머리글만 다시 그려야 하는데
//    세로로 묶인 칸은 그 아래 행까지 딸려 와야 해서 성립하지 않는다(계획 R10·R11).
//    그래서 올릴 행에 세로 병합이 걸려 있으면 그대로 둔다.
function toggleHead(t) {
  if (t.head && t.head.length) {
    const down = t.head[0].map(c => Object.assign({}, c));
    return Object.assign({}, t, { head: [], rows: [down].concat(cloneRows(t.rows)) });
  }
  if (!t.rows.length) return t;
  if (t.rows[0].some(c => (c.rs || 1) > 1)) return t;
  return Object.assign({}, t, {
    head: [t.rows[0].map(c => Object.assign({}, c))],
    rows: cloneRows(t.rows.slice(1)),
  });
}

/* blocks.js */



const BLOCK_TYPES = ['heading', 'section', 'para', 'list', 'table', 'image'];

let seq = 0;
function resetIds(n = 0) { seq = n; }
function newId() { seq += 1; return 'b' + seq; }
function adoptIds(blocks) {
  for (const b of blocks || []) {
    const m = /^b(\d+)$/.exec(b && b.id ? String(b.id) : '');
    if (m) seq = Math.max(seq, Number(m[1]));
  }
}

function createBlock(type, props = {}) {
  if (!BLOCK_TYPES.includes(type)) throw new Error('알 수 없는 블록 종류: ' + type);
  const base = { id: newId(), type, variants: null };
  if (type === 'section') return Object.assign(base, { no: props.no || '', title: props.title || '' });
  if (type === 'image') {
    return Object.assign(base, {
      src: props.src || '',
      w: props.w || 0,                       // 표시 폭 px. 높이는 원본 비율로 계산(설계 §2-4)
      align: props.align || 'center',
      caption: props.caption ? normalizeRuns(props.caption) : [],
    });
  }
  if (type === 'table') {
    const ncols = props.cols ? props.cols.length : (props.ncols || 3);
    const empty = () => ({ runs: [] });
    // 삽입하는 쪽이 normalizeWidths 로 실제 텍스트 폭에 맞춘다
    const cols = props.cols ? props.cols.map(c => Object.assign({}, c))
      : Array.from({ length: ncols }, () => ({ w: Math.floor(674 / ncols) }));
    const head = props.head !== undefined ? props.head : [Array.from({ length: ncols }, empty)];
    const rows = props.rows || Array.from({ length: props.nrows || 3 },
      () => Array.from({ length: ncols }, empty));
    return Object.assign(base, { cols, head, rows });
  }
  if (type === 'list') {
    const items = Array.isArray(props.items) && props.items.length
      ? props.items.map(normalizeRuns)
      : [[]];
    return Object.assign(base, { ordered: props.ordered ? 1 : 0, items, align: null });
  }
  const runs = props.runs ? normalizeRuns(props.runs) : runsFromText(props.text || '');
  const common = { runs, align: props.align || null };
  if (type === 'heading') return Object.assign(base, common, { level: props.level || 1 });
  return Object.assign(base, common);
}

function blockText(b) {
  if (!b) return '';
  if (b.type === 'section') return [b.no, b.title].filter(Boolean).join(' ');
  if (b.type === 'table') return tableText(b);
  if (b.type === 'image') return runsText(b.caption || []);
  if (b.type === 'list') return (b.items || []).map(runsText).join('\n');
  if (Array.isArray(b.runs)) return runsText(b.runs);
  return b.text || '';
}

/* assets.js */
// 그림 보관함 — 문서 안 assets 칸을 다스린다. DOM 을 모른다(core 규칙).
// 담기(중복 제거)·청소(참조 없는 그림 제거)·되읽기 입양·읽기 복구.
// ⛔ 최상위 이름 주의: 빌드가 모듈을 한 덩어리로 합친다 — aseq 는 이 파일만 쓴다.


let aseq = 0;
function resetAssetIds(n = 0) { aseq = n; }
function adoptAssetIds(assets) {
  for (const k of Object.keys(assets || {})) {
    const m = /^a(\d+)$/.exec(k);
    if (m) aseq = Math.max(aseq, Number(m[1]));
  }
}

// djb2 — 빠른 지문. 충돌 대비로 data 문자열도 비교한다(설계 §2-1)
function hashData(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36) + '-' + s.length;
}

function addAsset(assets, data, w, h) {
  const hash = hashData(data);
  for (const id of Object.keys(assets || {})) {
    const a = assets[id];
    if (a && a.hash === hash && a.data === data) return { assets, id };
  }
  aseq += 1;
  const id = 'a' + aseq;
  const one = {};
  one[id] = { data, w, h, hash };
  return { assets: Object.assign({}, assets, one), id };
}

// 블록 하나가 품은 모든 토막 배열에 fn 을 부른다 — 문단·목록·표(머리글+몸통)·캡션
function eachRuns(b, fn) {
  if (!b) return;
  if (Array.isArray(b.runs)) fn(b.runs);
  if (Array.isArray(b.items)) for (const it of b.items) fn(it);
  if (Array.isArray(b.caption)) fn(b.caption);
  for (const rows of [b.head, b.rows]) {
    if (!Array.isArray(rows)) continue;
    for (const row of rows) for (const c of row || []) if (c && Array.isArray(c.runs)) fn(c.runs);
  }
}

function collectAssetIds(blocks) {
  const used = new Set();
  for (const b of blocks || []) {
    if (b && b.type === 'image' && b.src) used.add(b.src);
    eachRuns(b, (runs) => { for (const r of runs || []) if (r && r.img) used.add(r.img); });
  }
  return used;
}

// 저장·읽기 때만 부른다(설계 §2-3). blocksLists = [지금 blocks, …되돌리기 기록의 blocks들]
function sweepAssets(assets, blocksLists) {
  const used = new Set();
  for (const blocks of blocksLists || []) {
    for (const id of collectAssetIds(blocks)) used.add(id);
  }
  const next = {};
  let changed = false;
  for (const id of Object.keys(assets || {})) {
    if (used.has(id)) next[id] = assets[id];
    else changed = true;
  }
  return changed ? next : (assets || {});
}

// 되읽은 토막의 임시 그림(src$)을 보관함에 담아 img 번호로 바꾼다(중복이면 기존 번호).
// http 주소·모르는 번호는 버린다 — 조용한 네트워크 의존 금지(설계 §5).
function adoptImages(runs, assets) {
  let a = assets || {};
  let changed = false;
  const out = [];
  for (const r of runs || []) {
    if (!r || (!r.src$ && !r.img)) { out.push(r); continue; }
    if (r.img && !r.src$) {
      if (a[r.img]) out.push(r);
      else changed = true;                                   // 미아 — 버린다
      continue;
    }
    const src = r.src$;
    changed = true;
    if (typeof src !== 'string' || src.indexOf('data:image/') !== 0) continue;
    const got = addAsset(a, src, r.w || 0, r.h || 0);
    a = got.assets;
    out.push({ t: OBJ, img: got.id, w: r.w || a[got.id].w, h: r.h || a[got.id].h });
  }
  return { runs: out, assets: a, changed };
}

// 읽기 복구(R5): img 토막의 t 를 OBJ 1글자로 강제하고, 보관함에 없는 그림 토막은 뺀다.
function repairBlocks(blocks, assets) {
  const fix = (runs) => (runs || []).filter(r => !(r && r.img && !(assets || {})[r.img]))
    .map(r => (r && r.img && r.t !== OBJ ? Object.assign({}, r, { t: OBJ }) : r));
  return (blocks || []).map((b) => {
    if (!b) return b;
    const next = Object.assign({}, b);
    if (Array.isArray(b.runs)) next.runs = fix(b.runs);
    if (Array.isArray(b.items)) next.items = b.items.map(fix);
    if (Array.isArray(b.caption)) next.caption = fix(b.caption);
    for (const key of ['head', 'rows']) {
      if (!Array.isArray(b[key])) continue;
      next[key] = b[key].map(row => (row || []).map(c =>
        (c && Array.isArray(c.runs) ? Object.assign({}, c, { runs: fix(c.runs) }) : c)));
    }
    return next;
  });
}

/* document.js */




const DOC_VERSION = 4;   // 3→4: 그림 보관함(assets)·그림 블록·그림 토막 (설계_그림.md)

const DEFAULT_PAGE = {
  width: 794, height: 1123,
  margin: { top: 46, right: 60, bottom: 34, left: 60 },
};

function createDocument(meta = {}) {
  return {
    version: DOC_VERSION,
    meta: Object.assign({ title: '', subtitle: '', category: '', doc: '', rev: '', date: '' }, meta),
    variants: [],
    assets: {},
    page: JSON.parse(JSON.stringify(DEFAULT_PAGE)),
    blocks: [createBlock('para')],
  };
}

function serialize(doc) { return JSON.stringify(doc, null, 1); }

// 1단계 파일은 글자를 통짜(text)로 갖고 있다. 토막(runs)으로 바꿔 읽는다.
// ⛔ text 를 남겨 두지 않는다 — 둘이 남으면 어느 쪽이 참인지 알 수 없어진다.
function migrateBlock(b) {
  if (!b || typeof b !== 'object') return b;
  // 그림 블록은 runs 가 없다 — 가드가 없으면 빈 runs 가 붙어 «글 칸»으로 오해받는다
  if (b.type === 'section' || b.type === 'image' || Array.isArray(b.runs)) return b;
  const next = Object.assign({}, b, { runs: runsFromText(b.text || '') });
  delete next.text;
  return next;
}

function deserialize(text) {
  let o;
  try { o = JSON.parse(text); }
  catch (e) { throw new Error('문서 파일을 읽을 수 없다 — JSON 이 아니다: ' + e.message); }
  if (!o || typeof o !== 'object') throw new Error('문서 파일을 읽을 수 없다 — 내용이 비었다');
  if (typeof o.version !== 'number') throw new Error('문서 파일을 읽을 수 없다 — version 이 없다');
  if (o.version > DOC_VERSION) throw new Error('이 파일은 더 새로운 판(version ' + o.version + ')이다. 프로그램을 새로 받아야 한다');
  if (!Array.isArray(o.blocks)) throw new Error('문서 파일을 읽을 수 없다 — blocks 가 배열이 아니다');
  const blocks = o.blocks.map(migrateBlock);
  adoptIds(blocks);
  // 그림(버전 4): 보관함을 위생 처리하고, 미아 토막을 복구하고, 안 쓰는 그림을 청소한다
  const rawAssets = (o.assets && typeof o.assets === 'object') ? o.assets : {};
  const assets0 = {};
  for (const k of Object.keys(rawAssets)) {
    const a = rawAssets[k];
    if (a && typeof a.data === 'string' && a.data.indexOf('data:image/') === 0) assets0[k] = a;
  }
  adoptAssetIds(assets0);
  const blocks2 = repairBlocks(blocks, assets0);
  const assets = sweepAssets(assets0, [blocks2]);
  return {
    version: DOC_VERSION,
    meta: Object.assign({ title: '', subtitle: '', category: '', doc: '', rev: '', date: '' }, o.meta || {}),
    variants: Array.isArray(o.variants) ? o.variants : [],
    assets,
    page: Object.assign(JSON.parse(JSON.stringify(DEFAULT_PAGE)), o.page || {}),
    blocks: blocks2,
  };
}

/* folder.js */
const SUB = '서류';
const DOC_EXT = '.sdoc';

function isSupported() {
  return typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';
}

async function pickFolder() {
  if (!isSupported()) {
    throw new Error('이 브라우저는 폴더 열기를 지원하지 않는다. 크롬이나 엣지로 열어야 한다');
  }
  return window.showDirectoryPicker({ id: 'doc-editor', mode: 'readwrite' });
}

// 문서는 고른 폴더 «안»의 서류 폴더에 담는다.
// ⚠ 사람이 이미 서류 폴더 자체를 골랐으면 그 안에 또 서류 를 만들지 않는다
//   (2026-08-30 SKY 가 기본 위치로 …\11. 문서 편집기\서류 를 지목 — 그대로 골라도 되게).
async function docsDir(dirHandle) {
  if (dirHandle.name === SUB) return dirHandle;
  return dirHandle.getDirectoryHandle(SUB, { create: true });
}

async function listDocs(dirHandle) {
  const dir = await docsDir(dirHandle);
  const names = [];
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'file' && name.endsWith(DOC_EXT)) names.push(name);
  }
  names.sort();
  return names;
}

// ⛔ 한글 이름은 «글자로» 비교하면 안 된다. 운영체제가 「한」을 ㅎ+ㅏ+ㄴ 으로 풀어(NFD)
//    돌려주는 일이 있어, 사람이 친 합쳐진 이름(NFC)과 다른 글자열이 된다 —
//    그러면 이미 있는 파일을 «없다» 고 보고 조용히 덮어쓴다(2026-08-30 실측).
const same = (a, b) => String(a).normalize('NFC') === String(b).normalize('NFC');

async function docExists(dirHandle, name) {
  const names = await listDocs(dirHandle);
  return names.some(n => same(n, name));
}

async function readDoc(dirHandle, name) {
  const dir = await docsDir(dirHandle);
  const fh = await dir.getFileHandle(name);
  return (await fh.getFile()).text();
}

async function writeDoc(dirHandle, name, text) {
  const dir = await docsDir(dirHandle);
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(text);
  await w.close();
}

// ── 고른 폴더를 기억한다 (2026-08-30 SKY: "문서 폴더를 기억하게 하자") ──
// 폴더 손잡이(handle)는 브라우저 내부 저장소(IndexedDB)에 그대로 담을 수 있다.
// ⚠ 담아 둬도 «권한»은 따로다. 브라우저를 껐다 켜면 권한이 «물어봄» 으로 내려갈 수 있고,
//   그때는 사람이 버튼을 누르는 순간에만 다시 허락을 받을 수 있다(브라우저 보안).
// ⛔ 이름은 저장소 전체에서 겹치면 안 된다 — 빌드가 모듈을 한 덩어리로 합치기 때문에
//   autosave.js 의 DB·STORE·tx 와 같은 이름을 쓰면 화면이 통째로 안 뜬다(2026-08-30 실측).
// ⛔ 저장소 이름도 따로 쓴다 — autosave 와 같은 이름·같은 판번호로 열면 새 칸(handles)이
//   만들어지지 않아 조용히 실패한다(판 올리기가 안 일어난다).
const DIR_DB = 'doc-editor-dir';
const DIR_STORE = 'handles';
const DIR_KEY = 'docdir';

function openDirDB() {
  return new Promise((res, rej) => {
    const q = indexedDB.open(DIR_DB, 1);
    q.onupgradeneeded = () => {
      const db = q.result;
      if (!db.objectStoreNames.contains(DIR_STORE)) db.createObjectStore(DIR_STORE);
    };
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}

function dirTx(db, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(DIR_STORE, mode);
    const r = fn(t.objectStore(DIR_STORE));
    t.oncomplete = () => res(r && r.result);
    t.onerror = () => rej(t.error);
  });
}

async function rememberDir(handle) {
  try {
    const db = await openDirDB();
    await dirTx(db, 'readwrite', (s) => s.put(handle, DIR_KEY));
    db.close();
    return true;
  } catch (e) { return false; }
}

async function recallDir() {
  try {
    const db = await openDirDB();
    const h = await dirTx(db, 'readonly', (s) => s.get(DIR_KEY));
    db.close();
    return h || null;
  } catch (e) { return null; }
}

async function forgetDir() {
  try {
    const db = await openDirDB();
    await dirTx(db, 'readwrite', (s) => s.delete(DIR_KEY));
    db.close();
  } catch (e) { /* 지울 게 없으면 그만이다 */ }
}

// 'granted' 면 바로 쓸 수 있고, 'prompt' 면 사람이 버튼을 누를 때만 허락을 받을 수 있다.
async function dirPermission(handle, ask) {
  if (!handle || !handle.queryPermission) return 'granted';   // 옛 브라우저 — 그냥 써 본다
  const opt = { mode: 'readwrite' };
  let st = await handle.queryPermission(opt);
  if (st !== 'granted' && ask && handle.requestPermission) st = await handle.requestPermission(opt);
  return st;
}

/* autosave.js */
const DB = 'doc-editor';
const STORE = 'snapshots';
const KEEP = 20;

function openStore() {
  return new Promise((resolve, reject) => {
    const rq = indexedDB.open(DB, 1);
    rq.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 't' });
    };
    rq.onsuccess = (e) => resolve(e.target.result);
    rq.onerror = () => reject(new Error('자동 보관 저장소를 열지 못했다'));
  });
}

function tx(db, mode) { return db.transaction(STORE, mode).objectStore(STORE); }

async function saveSnapshot(text, label) {
  const db = await openStore();
  const t = Date.now();
  await new Promise((res, rej) => {
    const r = tx(db, 'readwrite').put({ t, label: label || '', size: text.length, text });
    r.onsuccess = res; r.onerror = () => rej(new Error('자동 보관에 실패했다'));
  });
  const all = await listSnapshots();
  const extra = all.slice(0, Math.max(0, all.length - KEEP));
  for (const s of extra) {
    await new Promise((res) => { tx(db, 'readwrite').delete(s.t).onsuccess = res; });
  }
}

async function listSnapshots() {
  const db = await openStore();
  return new Promise((res, rej) => {
    const r = tx(db, 'readonly').getAll();
    r.onsuccess = () => res(r.result
      .map(x => ({ t: x.t, label: x.label, size: x.size }))
      .sort((a, b) => a.t - b.t));
    r.onerror = () => rej(new Error('자동 보관 목록을 읽지 못했다'));
  });
}

async function readSnapshot(t) {
  const db = await openStore();
  return new Promise((res, rej) => {
    const r = tx(db, 'readonly').get(t);
    r.onsuccess = () => res(r.result ? r.result.text : null);
    r.onerror = () => rej(new Error('자동 보관본을 읽지 못했다'));
  });
}

/* print.js */
// ⛔ 확대 상태를 반드시 되돌린 뒤 인쇄한다 (옛 프로그램은 130%면 PDF 도 1.3배가 됐다).
// ⛔ 인쇄 대상은 지금 열려 있는 문서 하나뿐이다 (옛 프로그램은 안 고른 것이 딸려 나왔다).
function printDoc(mainEl) {
  const saved = mainEl.style.transform;
  mainEl.style.transform = 'none';
  const restore = () => { mainEl.style.transform = saved; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  window.print();
  setTimeout(restore, 3000);   // afterprint 가 안 오는 브라우저 대비
}

/* paginate.js */
// ⛔ 이 함수는 blocks·heights 를 읽기만 한다. 절대 고치지 않는다.
// ⛔ 블록(행)을 버리거나 쪼개지 않는다. 한 장보다 큰 블록·행 묶음은 그 장에 혼자 둔다.
// 반환: 장마다 entry 목록. 보통 블록 { id } · 표 조각 { id, rowFrom, rowTo, cont }
//   (cont:1 = 이어진 조각 — 그리는 쪽이 머리글 행을 다시 그린다)
// heights[id]: 숫자(보통 블록) 또는 { head, rows:[px,…], groups:[[from,to],…] }(표)
function paginate(blocks, heights, opts) {
  const limit = opts && opts.contentHeight;
  if (!(typeof limit === 'number' && limit > 0)) {
    throw new Error('paginate: contentHeight 는 0보다 큰 숫자여야 한다 (받은 값: ' + limit + ')');
  }
  const gap = (opts && opts.gap) || 0;
  const pages = [];
  let cur = [];
  let used = 0;
  const flush = () => { pages.push(cur); cur = []; used = 0; };

  for (const b of blocks || []) {
    const h = heights && heights[b.id];

    if (h && typeof h === 'object' && Array.isArray(h.rows)) {
      // ── 표: 행 묶음(세로 병합 덩어리) 단위로 채운다 ──
      const head = Number(h.head) || 0;
      const rowsH = h.rows.map(Number);
      const groups = (Array.isArray(h.groups) && h.groups.length)
        ? h.groups : rowsH.map((_, i) => [i, i]);

      if (!rowsH.length) {                       // 머리글만 있는 표 — 조각 하나로 그대로
        if (cur.length > 0 && used + gap + head > limit) flush();
        const lead = cur.length === 0 ? 0 : gap;
        cur.push({ id: b.id, rowFrom: 0, rowTo: -1, cont: 0 });
        used += lead + head;
        continue;
      }

      let gi = 0;
      let from = 0;
      let firstChunk = true;
      while (gi < groups.length) {
        const lead = cur.length === 0 ? 0 : gap;
        const budget = limit - used - lead - head;
        let to = from - 1;
        let sum = 0;
        while (gi < groups.length) {
          const [a, z] = groups[gi];
          let gh = 0;
          for (let r = a; r <= z; r++) gh += rowsH[r] || 0;
          if (sum === 0 && gh > budget && cur.length > 0) break;   // 이 장엔 시작도 못 한다
          if (sum > 0 && sum + gh > budget) break;                 // 이 장은 여기까지
          sum += gh;
          to = z;
          gi += 1;
          if (sum > budget) break;   // 홀로 큰 묶음 — 이 장에 혼자 둔다(쪼개지 않는다)
        }
        if (to < from) { flush(); continue; }    // 빈손 — 새 장에서 다시
        cur.push({ id: b.id, rowFrom: from, rowTo: to, cont: firstChunk ? 0 : 1 });
        used += lead + head + sum;
        firstChunk = false;
        from = to + 1;
        if (gi < groups.length) flush();         // 아직 행이 남았다 — 다음 조각은 새 장
      }
      continue;
    }

    // ── 보통 블록: 1단계 규칙 그대로 ──
    const hh = Number(h) || 0;
    const need = cur.length === 0 ? hh : gap + hh;
    if (cur.length > 0 && used + need > limit) {
      flush();
      cur.push({ id: b.id });
      used = hh;
      continue;
    }
    cur.push({ id: b.id });
    used += need;
  }
  pages.push(cur);
  return pages;
}

/* measure.js */



function contentHeightOf(page) {
  const p = page || DEFAULT_PAGE;
  const m = p.margin || DEFAULT_PAGE.margin;
  return p.height - m.top - m.bottom;
}

// 숨은 상자(#gauge)에 블록을 그려 실제 높이를 잰다. 화면에 보이는 것은 건드리지 않는다.
function measureAll(blocks, gaugeEl, makeEl) {
  gaugeEl.textContent = '';
  const els = [];
  for (const b of blocks) {
    const el = makeEl(b);
    gaugeEl.appendChild(el);
    els.push([b.id, el]);
  }
  const out = {};
  const byId = new Map(blocks.map(b => [b.id, b]));
  for (const [id, el] of els) {
    const b = byId.get(id);
    const cs = getComputedStyle(el);
    const mt = parseFloat(cs.marginTop || 0);
    const mb = parseFloat(cs.marginBottom || 0);
    if (b && b.type === 'table') {
      const thead = el.querySelector('thead');
      const rows = Array.from(el.querySelectorAll('tbody tr'))
        .map(tr => tr.getBoundingClientRect().height);
      // 블록 위/아래 여백은 머리글/마지막 행에 얹는다 — 장 셈이 실제와 같아진다
      const head = (thead ? thead.getBoundingClientRect().height : 0) + mt;
      if (rows.length) rows[rows.length - 1] += mb;
      out[id] = { head: rows.length ? head : head + mb, rows, groups: rowGroups(b) };
      continue;
    }
    const r = el.getBoundingClientRect();
    out[id] = r.height + mt + mb;
  }
  gaugeEl.textContent = '';
  return out;
}

/* imgfmt.js */
// 그림 서식의 «계산 한 곳»(설계_서식과우클릭.md M3). DOM 을 모른다.
// 단위 규칙(S1): 저장·모델은 px, 입력·표시만 mm. 변환은 이 파일만 안다.
// ⛔ 최상위 이름 주의: 빌드가 모듈을 한 덩어리로 합친다 — 여기 이름은 이 파일만 쓴다.
const PX_PER_MM = 96 / 25.4;

function mmOf(px) { return Math.round((px / PX_PER_MM) * 10) / 10; }
function pxOf(mm) { return Math.max(1, Math.round(mm * PX_PER_MM)); }

// 표시 비율의 근원 — crop 이 있으면 crop, 없으면 저장 원본(M2·M3)
function ratioOf(obj, asset) {
  const c = obj && obj.crop;
  const w = c ? c.w : (asset ? asset.w : 1);
  const h = c ? c.h : (asset ? asset.h : 1);
  return h / Math.max(1, w);
}

function dispHeight(w, obj, asset) {
  return Math.max(1, Math.round(w * ratioOf(obj, asset)));
}

// 감싸개(.iclip) 안에 «원본 전체»를 넣고 자르기 창만 보이게 미는 배치.
// 표시폭 w 기준 배율 k = w / crop.w — 원본 img 크기와 음수 마진을 돌려준다.
function clipLayout(w, obj, asset) {
  const c = obj.crop;
  const k = w / Math.max(1, c.w);
  return {
    iw: Math.max(1, Math.round(asset.w * k)),
    ih: Math.max(1, Math.round(asset.h * k)),
    ml: -Math.round(c.x * k),
    mt: -Math.round(c.y * k),
  };
}

// 자르기 창을 원본 안으로 바로잡는다. 최소 8px — 0 이 되면 나누기가 깨진다.
function clampCrop(crop, asset) {
  const w = Math.max(8, Math.min(Math.round(crop.w), asset.w));
  const h = Math.max(8, Math.min(Math.round(crop.h), asset.h));
  const x = Math.max(0, Math.min(Math.round(crop.x), asset.w - w));
  const y = Math.max(0, Math.min(Math.round(crop.y), asset.h - h));
  return { x, y, w, h };
}

/* runs-dom.js */



// ⛔ 여기 적힌 태그·속성만 인정한다. 나머지는 껍데기를 버리고 글자만 가져온다.
//    웹에서 복사해 붙여넣은 이상한 서식이 문서에 들어오지 못하게 하는 문이다.
const WRAP = [['s', 'S'], ['u', 'U'], ['i', 'I'], ['b', 'B']];

// 그리기 전에 문서의 그림 보관함을 등록한다 — renderPages 와 editor 의 되그리기가 부른다.
// (인자로 다 나르면 호출부 6곳의 서명이 늘어난다 — UI 층 한정의 등록 방식을 쓴다)
let ASSETS = {};
function useAssets(a) { ASSETS = a || {}; }
function assetOf(id) { return ASSETS[id] || null; }

// 그림 하나를 DOM 으로 — crop·rad 대응(설계_서식과우클릭.md §4-3).
// cls = 'ri'(토막) 또는 'bimg'(블록). obj = { w, crop?, rad? } (w = 표시 폭 px).
// ⭐ 크기를 박아 두어야 높이 재기가 그림 로딩을 안 기다린다(설계 §4-1) — 감싸개가 생겨도
//   감싸개에 폭·높이를 박으므로 그 원칙이 유지된다.
// ⚠ 되읽기(domToRuns)용 «진실»은 data-* 에 적는다: crop 이 있으면 img 의 width 속성은
//   «원본을 배율로 키운 크기»라서 표시 폭이 아니다. 그걸로 되읽으면 그림이 폭발한다.
function imgNode(assetId, a, obj, cls) {
  const w = obj.w || a.w;
  const h = dispHeight(w, obj, a);
  const img = document.createElement('img');
  img.className = cls;
  img.src = a.data;
  if (assetId) img.dataset.img = assetId;
  img.dataset.dw = String(w);
  img.dataset.dh = String(h);
  if (obj.rad) img.dataset.rad = String(obj.rad);
  if (!obj.crop) {
    img.width = w;
    img.height = h;
    if (obj.rad) img.style.borderRadius = obj.rad + 'px';
    return img;
  }
  img.dataset.crop = [obj.crop.x, obj.crop.y, obj.crop.w, obj.crop.h].join(',');
  const c = clipLayout(w, obj, a);
  img.width = c.iw;
  img.height = c.ih;
  img.style.marginLeft = c.ml + 'px';
  img.style.marginTop = c.mt + 'px';
  img.style.display = 'block';
  const box = document.createElement('span');
  box.className = 'iclip';
  box.setAttribute('contenteditable', 'false');
  box.style.width = w + 'px';
  box.style.height = h + 'px';
  if (obj.rad) box.style.borderRadius = obj.rad + 'px';
  box.appendChild(img);
  return box;
}

function runsToNodes(runs) {
  const out = [];
  for (const r of runs || []) {
    if (!r || !r.t) continue;
    if (r.img) {
      const a = ASSETS[r.img];
      if (!a) continue;                        // 미아는 안 그린다(읽기 복구가 이미 막지만 방어)
      out.push(imgNode(r.img, a, r, 'ri'));
      continue;
    }
    let node = document.createTextNode(r.t);
    for (const pair of WRAP) {
      if (r[pair[0]]) { const e = document.createElement(pair[1]); e.appendChild(node); node = e; }
    }
    if (r.sz || r.c || r.mono) {
      const sp = document.createElement('span');
      if (r.sz) sp.style.fontSize = r.sz + 'px';
      if (r.c) sp.style.color = r.c;
      if (r.mono) sp.className = 'mono';
      sp.appendChild(node);
      node = sp;
    }
    out.push(node);
  }
  return out;
}

function rgbToHex(v) {
  const m = /^rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(v || '');
  if (!m) return v || null;
  const h = (n) => Number(n).toString(16).padStart(2, '0');
  return '#' + h(m[1]) + h(m[2]) + h(m[3]);
}

function walk(node, mark, out) {
  for (const child of node.childNodes) {
    if (child.nodeType === 3) {
      if (child.nodeValue) out.push(Object.assign({ t: child.nodeValue }, mark));
      continue;
    }
    if (child.nodeType !== 1) continue;          // 주석 따위는 버린다
    const tag = child.tagName;
    if (tag === 'IMG') {
      // 살아 있는 DOM 의 우리 그림은 data-img 를 갖고 있다. 밖에서 붙여 들어온 그림은
      // src$ 로 임시 표기해 두면 flush 의 adoptImages 가 보관함에 담는다.
      // ⛔ 크기는 data-dw/dh 가 먼저다 — 자른 그림은 width 속성이 «원본 확대 크기»라
      //    그걸로 되읽으면 표시 폭이 배율만큼 뻥튀기된다(설계_서식과우클릭.md §4-3).
      const ds = child.dataset || {};
      const run = { t: OBJ,
                    w: Number(ds.dw) || Number(child.getAttribute('width')) || 0,
                    h: Number(ds.dh) || Number(child.getAttribute('height')) || 0 };
      if (ds.crop) {
        const p = ds.crop.split(',').map(Number);
        if (p.length === 4 && p.every(n => Number.isFinite(n))) {
          run.crop = { x: p[0], y: p[1], w: p[2], h: p[3] };
        }
      }
      if (ds.rad) {
        const rad = Number(ds.rad) || 0;
        if (rad > 0) run.rad = rad;
      }
      if (ds.img) run.img = ds.img;
      else run.src$ = child.getAttribute('src') || '';
      out.push(run);
      continue;
    }
    if (tag === 'BR') { out.push(Object.assign({ t: '\n' }, mark)); continue; }
    const next = Object.assign({}, mark);
    if (tag === 'B' || tag === 'STRONG') next.b = 1;
    else if (tag === 'I' || tag === 'EM') next.i = 1;
    else if (tag === 'U') next.u = 1;
    else if (tag === 'S' || tag === 'STRIKE' || tag === 'DEL') next.s = 1;
    else if (tag === 'SPAN') {
      const st = child.style;
      if (st && st.fontSize) next.sz = parseFloat(st.fontSize);
      if (st && st.color) next.c = rgbToHex(st.color);
      if (child.classList && child.classList.contains('mono')) next.mono = 1;
    }
    walk(child, next, out);                      // 그 밖의 태그는 껍데기만 버리고 안으로 들어간다
  }
}

function domToRuns(el) {
  const out = [];
  if (el) walk(el, {}, out);
  return normalizeRuns(out);
}

/* render.js */







// ⭐ 입력판은 #pages 하나다(D16 — 한 장의 입력판). 블록은 그냥 그림이고,
//    섹션 줄·쪽 번호처럼 글이 아닌 것만 편집 불가 섬(contenteditable=false)으로 막는다.
function blockEl(block, page) {
  const el = document.createElement('div');
  el.className = 'blk blk-' + block.type;
  el.dataset.id = block.id;
  if (block.type === 'table') return tableEl(block, null);
  if (block.type === 'image') return imageEl(block, page);
  if (block.type === 'section') {
    el.setAttribute('contenteditable', 'false');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = block.no || '';
    const t = document.createElement('span'); t.className = 't'; t.textContent = block.title || '';
    const r = document.createElement('span'); r.className = 'rule';
    el.append(n, t, r);
  } else if (block.type === 'list') {
    const box = document.createElement(block.ordered ? 'ol' : 'ul');
    box.className = 'lst';
    (block.items || [[]]).forEach((item, i) => {
      const li = document.createElement('li');
      li.dataset.i = String(i);
      // 표식(•·번호)은 li 에서 상속된다 — 항목 전체가 같은 서식이면 li 에 입혀 따라가게 한다
      const m = uniformMark(item);
      if (m.sz) li.style.fontSize = m.sz + 'px';
      if (m.c) li.style.color = m.c;
      if (m.b) li.style.fontWeight = '700';
      for (const n of runsToNodes(item)) li.appendChild(n);
      box.appendChild(li);
    });
    el.appendChild(box);
  } else {
    if (block.align) el.style.textAlign = block.align;
    for (const n of runsToNodes(block.runs || [])) el.appendChild(n);
  }
  return el;
}

// 그림 블록 — 몸통은 편집 불가 섬, 캡션만 안쪽 입력 칸이다(설계 §4-1).
// ⭐ 표시 크기는 모델(w)과 종이 크기에서 «계산으로» 정해진다 — 숨은 상자(gauge)와
//   실제 장이 같은 값을 쓰므로 장 나눔이 어긋날 수 없다. 그림 로딩도 안 기다린다.
function imageEl(block, page) {
  const el = document.createElement('div');
  el.className = 'blk blk-image';
  el.dataset.id = block.id;
  el.setAttribute('contenteditable', 'false');
  if (block.align) el.style.textAlign = block.align;
  const a = assetOf(block.src);
  if (a) {
    const pg = page || DEFAULT_PAGE;
    const maxW = pg.width - pg.margin.left - pg.margin.right;
    const maxH = (pg.height - pg.margin.top - pg.margin.bottom) - 60;  // 캡션·여백 몫(설계 §6)
    // ⭐ 비율의 근원은 crop 이 있으면 crop 이다(M3) — 자동 축소도 그 비율을 따라야
    //   화면과 장 나눔(숨은 상자)이 안 어긋난다.
    let w = Math.min(block.w || a.w, maxW);
    let h = dispHeight(w, block, a);
    if (h > maxH) { h = maxH; w = Math.max(1, Math.round(h / Math.max(0.0001, ratioOf(block, a)))); }
    el.appendChild(imgNode(block.src, a, { w, crop: block.crop, rad: block.rad }, 'bimg'));
  }
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.setAttribute('contenteditable', 'true');
  for (const n of runsToNodes(block.caption || [])) cap.appendChild(n);
  el.appendChild(cap);
  return el;
}

function renderPages(doc, pagesEl, gaugeEl) {
  useAssets(doc.assets);
  const heights = measureAll(doc.blocks, gaugeEl, (b) => blockEl(b, doc.page));
  const pages = paginate(doc.blocks, heights, { contentHeight: contentHeightOf(doc.page) });
  const byId = new Map(doc.blocks.map(b => [b.id, b]));

  pagesEl.textContent = '';
  pages.forEach((ids, i) => {
    const pg = document.createElement('div');
    pg.className = 'page';
    const body = document.createElement('div');
    body.className = 'page-body';
    for (const ent of ids) {
      const b = byId.get(ent.id);
      if (!b) continue;
      if (b.type === 'table') body.appendChild(tableEl(b, ent));
      else body.appendChild(blockEl(b, doc.page));
    }
    const no = document.createElement('div');
    no.className = 'pgno';
    no.setAttribute('contenteditable', 'false');
    no.textContent = (i + 1) + ' / ' + pages.length;
    pg.append(body, no);
    pagesEl.appendChild(pg);
  });
  return { pages };
}

// 표 한 조각을 그린다. part = { rowFrom, rowTo, cont } · null 이면 전체(높이 재기용).
// ⭐ 이어진 장의 머리글(cont)은 «그림»이다(편집 불가) — 진짜 머리글 DOM 은 첫 조각 하나여야
//    타자가 어긋나지 않는다(계획 R11). 덮인 칸(cov)은 그리지 않는다.
function tableEl(block, part) {
  const el = document.createElement('div');
  el.className = 'blk blk-table';
  el.dataset.id = block.id;
  if (part && part.cont) el.dataset.cont = '1';
  const tbl = document.createElement('table');
  const cg = document.createElement('colgroup');
  for (const c of block.cols || []) {
    const col = document.createElement('col');
    col.style.width = (c.w || 0) + 'px';
    cg.appendChild(col);
  }
  tbl.appendChild(cg);
  const fill = (td, cell) => { for (const n of runsToNodes(cell.runs || [])) td.appendChild(n); };
  if (block.head && block.head.length) {
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');
    block.head[0].forEach((cell, c) => {
      if (cell.cov) return;                 // 임의 칸 나누기(R16)가 머리글에도 가로 병합을 만든다
      const td = document.createElement('td');
      if (cell.cs) td.colSpan = cell.cs;
      if (cell.align) td.style.textAlign = cell.align;
      if (cell.va) td.style.verticalAlign = cell.va;
      if (part && part.cont) td.setAttribute('contenteditable', 'false');
      else { td.dataset.r = 'h'; td.dataset.c = String(c); }
      fill(td, cell);
      tr.appendChild(td);
    });
    thead.appendChild(tr);
    tbl.appendChild(thead);
  }
  const tbody = document.createElement('tbody');
  const from = part ? part.rowFrom : 0;
  const to = part ? part.rowTo : (block.rows || []).length - 1;
  for (let r = from; r <= to; r++) {
    const tr = document.createElement('tr');
    (block.rows[r] || []).forEach((cell, c) => {
      if (cell.cov) return;
      const td = document.createElement('td');
      td.dataset.r = String(r);
      td.dataset.c = String(c);
      if (cell.cs) td.colSpan = cell.cs;
      if (cell.rs) td.rowSpan = cell.rs;
      const align = cell.align || (block.cols[c] && block.cols[c].align) || null;
      if (align) td.style.textAlign = align;
      if (cell.va) td.style.verticalAlign = cell.va;      // 위/가운데/아래 맞춤(엑셀과 같다)
      if (cell.bg) td.style.background = cell.bg;
      fill(td, cell);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  el.appendChild(tbl);
  // 열 경계 표시 — 표에 마우스를 올리면 세로 눈금이 보인다(세로선이 없어 열이 안 보이던 것).
  // 첫 조각의 것만 «끌 수 있는 손잡이»고, 이어진 조각의 것은 보기 전용이다
  // (이어진 조각에서 끌면 헷갈린다 — R13). 둘 다 편집 불가 섬이라 타자에 안 잡힌다.
  {
    const fixed = !!(part && part.cont);
    let x = 0;
    (block.cols || []).forEach((c, i) => {
      if (i === block.cols.length - 1) return;            // 마지막 경계는 없다(합 고정 — R13)
      x += c.w || 0;
      const grip = document.createElement('div');
      grip.className = fixed ? 'colgrip colgrip-fixed' : 'colgrip';
      grip.setAttribute('contenteditable', 'false');
      grip.dataset.col = String(i);
      grip.style.left = (x - 3) + 'px';
      el.appendChild(grip);
    });
  }
  return el;
}

/* edit.js */
// 여러 편집 칸(문단·목록 항목)에 걸친 선택을 지우는 순수 로직. DOM 을 모른다.
// targets: 문서 순서의 [{ id, item|null, from, to }] — 화면의 crossTargets() 가 만든 좌표.
//
// 워드의 실제 규칙(2026-08-30 이 PC 워드 실측 — 4가지 변형):
// · 양쪽 끝이 모두 «글자 중간»이면: 지우고 머리와 꼬리를 **딴 문단으로 남긴다** (안 합친다)
// · 한쪽이라도 경계(머리를 하나도 안 물었거나, 꼬리를 하나도 안 문 경우)면: **합친다**
// · 엔터는 항상 가른다 → opt.break 로 강제 가르기
// 반환: { blocks, caret(머리 끝 — 지우기의 커서), caretTail(꼬리 시작 — 엔터의 커서), split }
// ⛔ 선택 밖 글자는 하나도 사라지지 않는다 — 시험(test/edit.test.js)이 이것을 못 박는다.



function runsAt(b, t) {
  if (t.item === null || t.item === undefined) return Array.isArray(b.runs) ? b.runs : null;
  return Array.isArray(b.items) && Array.isArray(b.items[t.item]) ? b.items[t.item] : null;
}

function deleteAcross(blocks, targets, opt) {
  if (!Array.isArray(targets) || targets.length < 2) return null;
  const first = targets[0];
  const last = targets[targets.length - 1];
  const fi = first.item === null || first.item === undefined ? null : first.item;
  const li = last.item === null || last.item === undefined ? null : last.item;
  const firstB = blocks.find(b => b.id === first.id);
  const lastB = blocks.find(b => b.id === last.id);
  const srcA = firstB ? runsAt(firstB, first) : null;
  const srcZ = lastB ? runsAt(lastB, last) : null;
  if (!srcA || !srcZ) return null;

  const headLen = runsLength(srcA);
  const tailLen = runsLength(srcZ);
  const head = sliceRuns(srcA, 0, first.from);
  const tail = sliceRuns(srcZ, last.to, tailLen);
  const split = !!(opt && opt.break)
    || (first.from > 0 && first.from < headLen && last.to > 0 && last.to < tailLen);
  const merged = normalizeRuns(head.concat(tail));

  // 첫 대상을 뺀 나머지는 통째로 없어진다. 갈라 두기(split)면 끝 대상도 남긴다.
  const gone = new Map();   // 블록 id -> 'block'(문단 통째) 또는 Set(목록 항목 번호들)
  for (let i = 1; i < targets.length; i++) {
    if (split && i === targets.length - 1) continue;
    const t = targets[i];
    if (t.item === null || t.item === undefined) gone.set(t.id, 'block');
    else {
      const set = gone.get(t.id) instanceof Set ? gone.get(t.id) : new Set();
      set.add(t.item);
      gone.set(t.id, set);
    }
  }

  const out = [];
  let caretTail = null;
  for (const b of blocks) {
    if (b.id === first.id) {
      if (fi === null) {
        out.push(Object.assign({}, b, { runs: split ? head : merged }));
      } else {
        // 첫 칸이 목록 항목 — 같은 블록에 끝 항목·지워질 항목이 함께 있을 수 있다
        const doomed = gone.get(b.id);
        const items = [];
        b.items.forEach((it, i) => {
          if (i === fi) items.push(split ? head : merged);
          else if (split && b.id === last.id && i === li) {
            caretTail = { id: b.id, item: items.length, pos: 0 };
            items.push(tail);
          } else if (doomed instanceof Set && doomed.has(i)) return;
          else items.push(it);
        });
        out.push(Object.assign({}, b, { items }));
      }
      continue;
    }
    if (split && b.id === last.id) {
      // 끝 칸을 꼬리만 남겨 딴 블록으로 둔다
      if (li === null) {
        caretTail = { id: b.id, item: null, pos: 0 };
        out.push(Object.assign({}, b, { runs: tail }));
      } else {
        const doomed = gone.get(b.id);
        const items = [];
        b.items.forEach((it, i) => {
          if (doomed instanceof Set && doomed.has(i)) return;
          if (i === li) {
            caretTail = { id: b.id, item: items.length, pos: 0 };
            items.push(tail);
          } else items.push(it);
        });
        out.push(Object.assign({}, b, { items }));
      }
      continue;
    }
    const g = gone.get(b.id);
    if (g === 'block') continue;
    if (g instanceof Set) {
      const items = b.items.filter((x, i) => !g.has(i));
      if (!items.length) continue;   // 항목이 다 없어진 목록은 블록째 없앤다
      out.push(Object.assign({}, b, { items }));
      continue;
    }
    out.push(b);
  }
  const caret = { id: first.id, item: fi, pos: first.from };
  if (!caretTail) caretTail = caret;   // 합쳐졌으면 이음매가 곧 꼬리 시작이다
  return { blocks: out, caret, caretTail, split };
}

// 표 칸이 낀 걸침 지우기(계획 R5·R6) — 표는 구조가 남고 칸 «속»만 비워진다.
// 표 밖 문단·항목은 각자 제 구간만 잃는다(통째로 물린 문단·항목·섹션 줄은 없어진다).
// ⛔ 표 경계를 넘는 병합은 하지 않는다 — deleteAcross 의 머리+꼬리 잇기를 여기서는 안 쓴다.
function deleteMixed(blocks, targets) {
  if (!Array.isArray(targets) || !targets.length) return null;
  const byId = new Map();
  for (const t of targets) {
    if (!byId.has(t.id)) byId.set(t.id, []);
    byId.get(t.id).push(t);
  }
  const out = [];
  const survived = new Set();
  for (const b of blocks) {
    const ts = byId.get(b.id);
    if (!ts) { out.push(b); continue; }
    if (b.type === 'table') {
      const cellTs = ts.filter(t => t.cell).map(t => ({ r: t.cell[0], c: t.cell[1], from: t.from, to: t.to }));
      out.push(Object.assign({}, b, clearCellRanges(b, cellTs)));
      survived.add(b.id);
      continue;
    }
    if (b.type === 'section') continue;                    // 물린 섹션 줄은 없어진다
    if (b.type === 'image') continue;                      // 물린 그림 블록도 없어진다(캡션째)
    if (Array.isArray(b.items)) {
      const hit = new Map(ts.filter(t => t.item !== null && t.item !== undefined).map(t => [t.item, t]));
      const items = [];
      b.items.forEach((it, i) => {
        const t = hit.get(i);
        if (!t) { items.push(it); return; }
        const len = runsLength(it);
        if (t.from <= 0 && t.to >= len) return;            // 통째로 물린 항목은 없어진다
        items.push(normalizeRuns(sliceRuns(it, 0, t.from).concat(sliceRuns(it, t.to, len))));
      });
      if (!items.length) continue;
      out.push(Object.assign({}, b, { items }));
      survived.add(b.id);
      continue;
    }
    const t = ts[0];
    const len = runsLength(b.runs || []);
    if (t.from <= 0 && t.to >= len) continue;              // 통째로 물린 문단은 없어진다
    out.push(Object.assign({}, b, {
      runs: normalizeRuns(sliceRuns(b.runs, 0, t.from).concat(sliceRuns(b.runs, t.to, len))),
    }));
    survived.add(b.id);
  }
  // 커서 — 살아남은 첫 대상. 다 없어졌으면 남은 첫 블록 처음.
  let caret = null;
  for (const t of targets) {
    if (!survived.has(t.id)) continue;
    caret = { id: t.id, item: t.item === undefined ? null : t.item, pos: t.from };
    if (t.cell) caret.cell = t.cell;
    break;
  }
  if (!caret && out.length) caret = { id: out[0].id, item: null, pos: 0 };
  if (!caret) return null;
  return { blocks: out, caret };
}

/* editor-ops.js */
// ⛔ 블록을 제자리에서 고치지 않는다. 항상 새 배열·새 객체를 만든다(되돌리기가 여기 기댄다).
function indexOf(blocks, id) {
  const i = blocks.findIndex(b => b.id === id);
  if (i < 0) throw new Error('블록을 찾을 수 없다: ' + id);
  return i;
}

function replaceBlock(blocks, id, patch) {
  const i = indexOf(blocks, id);
  const next = blocks.slice();
  next[i] = Object.assign({}, blocks[i], patch);
  return next;
}

function insertAfter(blocks, id, block) {
  const i = indexOf(blocks, id);
  const next = blocks.slice();
  next.splice(i + 1, 0, block);
  return next;
}

function removeBlock(blocks, id) {
  const i = indexOf(blocks, id);
  if (blocks.length <= 1) return blocks.slice();
  const next = blocks.slice();
  next.splice(i, 1);
  return next;
}

/* selection.js */
// 커서 자리를 "블록 처음부터 센 글자 번호"로 다룬다.
// 서식이 들어가면 DOM 자식이 여러 개로 갈리므로, 몇 번째 자식인지로 세면 깨진다.
function textLen(node) {
  if (!node) return 0;
  if (node.nodeType === 3) return (node.nodeValue || '').length;
  // 그림(IMG)도 BR 처럼 «글자 1개»다 — 그래야 그림 토막(U+FFFC 1글자)과 셈이 맞는다
  if (node.nodeType === 1 && (node.tagName === 'BR' || node.tagName === 'IMG')) return 1;
  let n = 0;
  for (const c of node.childNodes || []) n += textLen(c);
  return n;
}

function offsetIn(el, node, offset) {
  if (!el || !node) return 0;
  if (el.contains && !el.contains(node)) return 0;
  let count = 0;
  let done = false;
  const scan = (cur) => {
    if (done || !cur) return;
    if (cur === node) {
      if (cur.nodeType === 3) count += Math.min(offset, (cur.nodeValue || '').length);
      else for (let i = 0; i < offset && i < (cur.childNodes || []).length; i++) count += textLen(cur.childNodes[i]);
      done = true;
      return;
    }
    if (cur.nodeType === 3) { count += (cur.nodeValue || '').length; return; }
    if (cur.nodeType !== 1) return;
    if (cur.tagName === 'BR' || cur.tagName === 'IMG') { count += 1; return; }
    for (const c of cur.childNodes || []) { scan(c); if (done) return; }
  };
  scan(el);
  return count;
}

function nodeAt(el, pos) {
  let left = Math.max(0, pos);
  let last = { node: el, offset: 0 };
  let done = false;
  const scan = (cur) => {
    if (done || !cur) return;
    if (cur.nodeType === 3) {
      const len = (cur.nodeValue || '').length;
      if (left <= len) { last = { node: cur, offset: left }; done = true; return; }
      left -= len;
      last = { node: cur, offset: len };
      return;
    }
    if (cur.nodeType !== 1) return;
    if (cur.tagName === 'BR' || cur.tagName === 'IMG') { left = Math.max(0, left - 1); return; }
    for (const c of cur.childNodes || []) { scan(c); if (done) return; }
  };
  scan(el);
  return last;
}

// 초점은 입력판(#pages — 문서 전체가 하나의 contenteditable, D16)에 준다.
// 커서 자리는 그 안의 아무 마디에나 놓을 수 있다.
function focusRootOf(node, fallbackEl) {
  const e = node && (node.nodeType === 1 ? node : node.parentElement);
  const root = e && e.closest ? e.closest('[contenteditable="true"]') : null;
  return root || fallbackEl;
}

function caretTo(el, pos) {
  let at = nodeAt(el, pos);
  // 글자가 하나도 없는 목록 항목은 글자 세기로 못 들어간다 — 항목 안에 직접 놓는다
  if (at.node.nodeType === 1 && at.node.querySelectorAll && !at.node.matches('.lst li')) {
    const lis = at.node.querySelectorAll('.lst li');
    if (lis.length) at = { node: pos <= 0 ? lis[0] : lis[lis.length - 1], offset: 0 };
  }
  const r = document.createRange();
  r.setStart(at.node, at.offset);
  r.collapse(true);
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
  focusRootOf(at.node, el).focus();
}

function selectRange(el, from, to) {
  const a = nodeAt(el, from);
  const b = nodeAt(el, to);
  const r = document.createRange();
  r.setStart(a.node, a.offset);
  r.setEnd(b.node, b.offset);
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
  focusRootOf(a.node, el).focus();
}

function rangeIn(el) {
  const s = window.getSelection();
  if (!el || !s || s.rangeCount === 0) return null;
  const r = s.getRangeAt(0);
  if (!el.contains(r.startContainer) || !el.contains(r.endContainer)) return null;
  const a = offsetIn(el, r.startContainer, r.startOffset);
  const b = offsetIn(el, r.endContainer, r.endOffset);
  return { from: Math.min(a, b), to: Math.max(a, b) };
}

function activeBlockEl(pagesEl) {
  const s = window.getSelection();
  const n = s && s.anchorNode;
  if (!n || !pagesEl) return null;
  const e = n.nodeType === 1 ? n : n.parentElement;
  if (!e || !e.closest) return null;
  const blk = e.closest('.blk[data-id]');
  return blk && pagesEl.contains(blk) ? blk : null;
}

// 화면의 글 칸(문단·제목 블록, 목록 항목)을 문서 순서대로.
// 입력판이 하나가 된 뒤(D16)에는 속성이 아니라 블록 종류로 찾는다 — 섹션 줄은 글이 아니다.
// ⚠ .blk-table 래퍼가 문단 선택자에 걸리면 표 전체가 «한 칸»으로 잡힌다 — 반드시 뺀다.
// ⚠ 그림 블록(.blk-image)도 같은 이유로 뺀다 — 몸통은 글 칸이 아니다.
//    대신 그 «캡션»(.cap)만 글 칸으로 넣는다(목록 항목·표 칸과 같은 정신).
function editableEls(pagesEl) {
  return Array.from(pagesEl.querySelectorAll(
    '.blk[data-id]:not(.blk-section):not(.blk-list):not(.blk-table):not(.blk-image), '
    + '.blk-list .lst li[data-i], .blk-table td[data-r], .blk-image .cap'));
}

// 지금 선택이 걸쳐 있는 편집 칸들을 문서 순서대로 [{el, from, to}] 로 준다.
// 한 칸 안의 선택이면 1개, 여러 블록에 걸친 선택이면 여러 개가 나온다.
// 지금 선택이 «한 표 안»의 칸 여럿에 걸치면, 시작 칸과 끝 칸이 만드는 «네모»를 준다.
// ⭐ 워드·엑셀과 같은 방식이다(2026-08-30 SKY). 글자 순서로 훑으면 두 칸만 끌어도 그
//    사이에 낀 엉뚱한 칸이 딸려 오고, 아래→위로 끌면 잡히는 칸이 달라진다.
//    시작(anchor)·끝(focus)을 쓰므로 끄는 방향이 어느 쪽이든 같은 네모가 나온다.
// ⚠ 병합 칸이 네모에 걸치면 그 칸을 다 품도록 네모를 넓힌다 — 반쪽 칸이 남으면 안 된다.
function cellRectIn(pagesEl) {
  const s = window.getSelection();
